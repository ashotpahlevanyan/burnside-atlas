this."],"precheck":null,"rules":[],"says":"Rebelo-Silva: any finitely generated periodic subgroup of C^2 symplectomorphisms of a compact 4-dimensional symplectic manifold is finite, provided the fundamental class in H^4(M,Z) is a product of classes in H^1(M,Z).","source":{"authors":["J. Rebelo","A. Silva"],"locator":"unknown","ref":"rebelo_silva2007","title":"On the Burnside problem in Diff(M)","venue":"Discrete Contin. Dyn. Syst. 17, no. 2, 423-439","year":"2007"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[],"id":"def_cross_variety","kind":"definition","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 Def 4.2. Quote: \"A variety of groups V is Cross if: V has a finite basis of its identities. Finitely generated groups in V are finite. V contains a finite number of critical groups.\""],"precheck":null,"rules":[],"says":"A variety of groups is Cross if it has a finite basis of identities, its finitely generated groups are finite, and it contains only finitely many critical groups (a finite group is critical if it is not in the variety generated by its proper subgroups and factor groups).","source":{"authors":["V. Drensky"],"locator":"def(4.2)","ref":"drensky2026","title":"Finite basis problem for varieties of algebraic systems","venue":"arXiv:2602.18805 (survey; venue unknown)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"oates_powell","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 Thm 4.1 ('Sheila Oates and Powell [136] for groups'). Quote: \"Let V be a variety generated by a finite group ... Then V is finitely based.\" Second: https://arxiv.org/abs/1408.1521: \"every variety generated by a single finite group [OP] can be defined by a finite set of identities.\" The stronger 'Cross' statement was seen only in a search summary of arXiv:1911.05817 -- see LEADS."],"precheck":null,"rules":[],"says":"Oates-Powell (1964): the variety generated by a finite group is finitely based (indeed Cross).","source":{"authors":["S. Oates","M. B. Powell"],"locator":"unknown","ref":"oates_powell1964","title":"Identical relations in finite groups","venue":"J. Algebra 1, 11-39","year":"1964"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[],"id":"lyndon_cohen_finite_basis","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1408.1521 intro. Quote: \"all nilpotent varieties [L], all metabelian and nilpotent-by-abelian varieties [C, Kr], and every variety generated by a single finite group [OP] can be defined by a finite set of identities.\" Refs: lyndon1952, cohen1967, Krasilnikov Izv. 54 (1990)."],"precheck":null,"rules":[],"says":"All nilpotent varieties of groups are finitely based (Lyndon 1952); all metabelian and nilpotent-by-abelian varieties are finitely based (Cohen 1967; Krasilnikov 1990).","source":{"authors":["R. C. Lyndon"],"locator":"unknown","ref":"lyndon1952","title":"Two notes on nilpotent groups","venue":"Proc. Amer. Math. Soc. 3, 579-583","year":"1952"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"b4a2_not_finitely_based","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1408.1521 intro. Quote: \"A simplest example of an infinite system of group identities which is not equivalent to a finite one was presented in [B] and [K73]: x1^8 = 1, (x1^2 x2^2)^4 = 1, ..., (x1^2 x2^2 ... xm^2)^4 = 1, ...\" Second: https://arxiv.org/abs/2602.18805: \"Theorem 7.8. The variety B4 A2 is not finitely based.\" Kleiman 1973 page numbers differ between the two sources (BO: 475-483; Drensky: 95-97)."],"precheck":null,"rules":[],"says":"Kleiman and Bryant: the product variety B_4 A_2 (equivalently B_4 B_2), defined by x^8 = 1, (x_1^2 x_2^2 ... x_m^2)^4 = 1 (m >= 1), is not finitely based -- the simplest known infinitely based group variety. Kleiman (1974): B_n C is not finitely based if p^2 | n and C (not the variety of all groups) contains a cyclic group of order p.","source":{"authors":["R. M. Bryant"],"locator":"unknown","ref":"bryant1973","title":"Some infinitely based varieties of groups","venue":"J. Austral. Math. Soc. 16, 29-32","year":"1973"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[{"quantity":"basis_rank(product(b_variety(p),b_variety(p)))","value":"2"},{"quantity":"prime_bound_example","value":"gt(p,10^10)"}],"id":"bpbp_not_finitely_based","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1408.1521 abstract and Thm 1.2. Quote: \"It is proved that for every sufficiently large prime p, say p > 10^10, the product BpBp cannot be defined by a finite set of identities.\" and \"the variety Bp Bp is finitely based for p = 2, 3\" (noticed by Gupta-Krasilnikov)."],"precheck":null,"rules":[],"says":"Boatman-Ol'shanskii: for every sufficiently large prime p (say p > 10^10) the product B_p B_p of Burnside varieties is not finitely based; it has infinite axiomatic rank and basis rank 2 (answers Gupta-Krasilnikov 2003). B_p B_p is finitely based for p = 2, 3; B_m B_n is finitely based when gcd(m,n) = 1.","source":{"authors":["N. S. Boatman","A. Yu. Ol'shanskii"],"locator":"thm(1.1)","ref":"boatman_olshanskii2014","title":"On identities in the products of group varieties","venue":"arXiv:1408.1521 (venue unknown)","year":"2014"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[{"quantity":"exponent_example_bound","value":"gt(n,10^10)"}],"id":"kozhevnikov_independent","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 Thm 7.7. Quote: \"Kozhevnikov [86] found an independent system which is simpler than the system of Adyan\" ... \"The group identities (x^p, y^p)^n = 1 form an independent system of identities for sufficiently large odd n (for example, n > 10^10) equal to the power of a prime number.\""],"precheck":null,"rules":[],"says":"Kozhevnikov: for sufficiently large odd n (e.g. n > 10^10) that is a prime power, the identities [x^p, y^p]^n = 1, p ranging over the primes, form an independent system (a simpler system than Adian's).","source":{"authors":["P. A. Kozhevnikov"],"locator":"unknown","ref":"kozhevnikov1997","title":"On an independent infinite system of group identities","venue":"Vestn. Mosk. Univ., Ser. I 1997 (4), 13-16","year":"1997"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kozhevnikov_limit_varieties","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 sec. 12.1. Quote: \"Theorem 12.1 was improved by Kozhevnikov [87], [88], who established that there are uncountably many limit varieties of groups. No explicit examples are known for limit varieties of groups.\" Ref [88]: Commun. Algebra 40 (2012) 'On nonfinitely based varieties of groups of large prime exponent'. 'Limit variety' gloss = minimal non-finitely-based variety (our gloss; not quoted)."],"precheck":null,"rules":[],"says":"There are uncountably many limit varieties of groups (minimal non-finitely-based varieties) (Kozhevnikov, improving Newman's result that for every prime p there is a limit variety of p-groups); no explicit limit variety of groups is known.","source":{"authors":["P. A. Kozhevnikov"],"locator":"unknown","ref":"kozhevnikov2012","title":"On nonfinitely based varieties of groups of large prime exponent","venue":"Commun. Algebra 40 (7), 2628-2644","year":"2012"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kleiman_hedgehog","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 Thm 7.9. Quote: \"There exist continually many pairwise different varieties of groups V_alpha, alpha in R, with the same intersection V_alpha cap V_beta in A for all pairs (alpha, beta), alpha != beta, where A is the abelian variety of groups.\""],"precheck":null,"rules":[],"says":"Kleiman's 'continual hedgehog': there are continuum many pairwise different group varieties V_alpha (alpha in R) whose pairwise intersections all lie in the abelian variety A.","source":{"authors":["Yu. G. Kleiman"],"locator":"unknown","ref":"kleiman1983","title":"Some questions in the theory of varieties of groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 47 (1), 37-74","year":"1983"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"shmelkin_basis_rank","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1408.1521 sec. 1. Quote: \"by Shmelkin's theorem [S], their product U V has finite basis rank if and only if all groups from U are nilpotent, all groups from V are abelian, and the exponents of U and V are relatively prime.\" Shmelkin's paper not identified (see LEADS)."],"precheck":null,"rules":[],"says":"Shmelkin: if nontrivial varieties U and V consist of locally finite groups, then UV has finite basis rank iff all groups of U are nilpotent, all groups of V are abelian, and the exponents of U and V are coprime.","source":{"authors":["N. S. Boatman","A. Yu. Ol'shanskii"],"locator":"unknown","ref":"boatman_olshanskii2014","title":"On identities in the products of group varieties","venue":"arXiv:1408.1521 (venue unknown)","year":"2014"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"corr_adian_identities_range","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 Thm 7.3. Quote: \"(Adyan [1]) For every odd n >= 4381 the group identities u_p = (x^(pn), y^(pn))^n = 1, p prime, are independent\". [1] = Adyan, Izv. 34 (1970) 715-734. Not a confirmed error in adian_identities; it flags a source discrepancy."],"precheck":null,"rules":[],"says":"Exponent range in Adian's 1970 irreducible system [x^(pn), y^(pn)]^n = 1: Drensky's survey states the theorem for odd n >= 4381, while kb/adian.pl (adian_identities) says n >= 1003. Possibly 4381 is the 1970 paper's bound and 1003 a later improvement (Adian's 1975 book); resolve against the original.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1970","title":"Infinite irreducible systems of group identities","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 34; Engl. Math. USSR-Izv. 4:4 (1970) 721-739","year":"1970"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"corr_olshanskii_continuum_detail","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 sec. 7. Quote: \"These varieties can be chosen to be solvable of class 5 (i.e. are subvarieties of the variety A^5 ...) and of exponent 8pq, where p and q are any coprime odd integers.\" and \"The first explicit examples of varieties of groups which were not finitely based were given in the same 1970 by Adyan [1] and Vaughan-Lee [167].\""],"precheck":null,"rules":[],"says":"Refines uncountably_many_varieties: Ol'shanskii (1970) gave the first non-finitely-based group varieties (continuum many varieties); they can be taken solvable (in A^5) of exponent 8pq with p, q coprime odd. Adian and Vaughan-Lee gave the first explicit examples the same year.","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"unknown","ref":"olshanskii1970","title":"On the problem of a finite basis of identities in groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 34; Engl. Math. USSR-Izv. 4:2 (1970) 381-389","year":"1970"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_1_40","kind":"open_problem","kourovka":{"mark":"open","num":"1.40"},"notes":["Kourovka 21, problem 1.40, by Sh. S. Kemkhadze. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is a group a nilgroup if it is the product of two normal nilsubgroups? By definition, a nilgroup is a group consisting of nilelements, in other words, of (not necessarily boundedly) Engel elements.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('1.40')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_2_5","kind":"open_problem","kourovka":{"mark":"open","num":"2.5"},"notes":["Kourovka 21, problem 2.5, by V. G. Vilyatser. No comment printed. KB triage: borderline (nil-elements = Engel-type elements; radical theory rather than periodicity)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"According to Plotkin, a group is called an NR-group if the set of its nil-elements coincides with the locally nilpotent radical, or, which is equivalent, if every inner automorphism of it is locally stable. Can an NR-group have a nil-automorphism that is not locally stable?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('2.5')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_2_6","kind":"open_problem","kourovka":{"mark":"open","num":"2.6"},"notes":["Kourovka 21, problem 2.6, by V. G. Vilyatser. No comment printed. KB triage: borderline (companion of 2.5; NR-groups defined via nil-elements, i.e. Engel-type elements)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"In an NR-group, the set of generalized central elements coincides with the nil-kernel. Is the converse true, that is, must a group be an NR-group if the set of generalized central elements coincides with the nil-kernel?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('2.6')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_2_24","kind":"open_problem","kourovka":{"mark":"open","num":"2.24"},"notes":["Kourovka 21, problem 2.24, by A. I. Kokorin. No comment printed. KB triage: borderline (orderability question, but hypothesis is the Engel condition)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Are Engel torsion-free groups orderable?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('2.24')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_2_48","kind":"open_problem","kourovka":{"mark":"solved","num":"2.48"},"notes":["Kourovka 21, problem 2.48, by V. P. Platonov. Solved (marked *): No, not necessarily: for any odd integer n >= 10^10 there is a connected topological group such that the identity x^n = 1 holds in some neighborhood of unity, but not in the entire group (E. Reznichenko, I. Zyabrev, Preprint, 2024, https://arxiv.org/abs/2406.05203). KB triage: borderline (topological groups; included because the counterexample uses the power identity x^n = 1; '10^10' read from PDF glyph positions, pdftotext printed '1010')."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): answered No (Reznichenko-Zyabrev, arXiv:2406.05203)."},"rules":[],"says":"(N. Aronszajn). Let G be a connected topological group locally satisfying some identical relation f|U = 1, where U is a neighborhood of the identity element of G. Is it then true that f|G = 1?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('2.48')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_2_82","kind":" enue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_4_24","kind":"open_problem","kourovka":{"mark":"open","num":"4.24"},"notes":["Kourovka 21, problem 4.24, by D. M. Goldschmidt. No comment printed. KB triage: borderline (finite simple group theory; part a) asks for an exponent bound; part d) not relevant). Exponents 2^(n-1), 2^(n(n-1)) reconstructed from pdftotext '2n-1', '2n(n-1)' (lost superscripts)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose T is a non-abelian Sylow 2-subgroup of a finite simple group G. a) Suppose T has nilpotency class n. The best possible bound for the exponent of the center of T is 2^(n-1). This easily implies the bound 2^(n(n-1)) for the exponent of T, however, this is almost certainly too crude. What is the best possible bound? d) Find a \"small number\" of subgroups T1, ..., Tn of T which depend only on the isomorphism class of T such that {N_G(T1), ..., N_G(Tn)} together control fusion in T with respect to G (in the sense of Alperin).","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('4.24')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_4_75","kind":"open_problem","kourovka":{"mark":"solved","num":"4.75"},"notes":["Kourovka 21, problem 4.75, by V. P. Shunkov. Solved (marked *): No, not always (AI solution confirmed by M. Amelio: M. Kinyon, J. Urban, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/09/kourovka-mathematics.pdf)."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): AI solution confirmed (No, not always). Also in kour1 ledger; Claude review notes it depends on an unrefereed 2025 preprint via 10.62."},"rules":[],"says":"Let G be a periodic group containing an involution i and suppose that the Sylow 2-subgroups of G are either locally cyclic or generalized quaternion. Does the element i O_{2'}(G) of the factor-group G/O_{2'}(G) always lie in its centre?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('4.75')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_5_56","kind":"open_problem","kourovka":{"mark":"open","num":"5.56"},"notes":["Kourovka 21, problem 5.56, by J. Wiegold. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"a) Let p be a prime greater than 3. Is it true that every finite group of exponent p can be embedded in the commutator subgroup of a finite group of exponent p?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('5.56')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_5_67","kind":"open_problem","kourovka":{"mark":"open","num":"5.67"},"notes":["Kourovka 21, problem 5.67, by V. P. Shunkov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is a periodic residually finite group finite if it satisfies the weak minimum condition for subgroups?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('5.67')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_6_3","kind":"open_problem","kourovka":{"mark":"open","num":"6.3"},"notes":["Kourovka 21, problem 6.3, by R. Bieri. Comment of 2026: there exist infinite periodic groups with a finite presentation (unverified AI solution: OpenAI, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/10/8-52.pdf). Problem itself is printed unmarked (open)."],"precheck":{"class":"ai_unverified","summary":"Kourovka 21 (arXiv:1401.0300v50): printed open, but a 2026 comment says infinite finitely presented periodic groups exist, citing the same unverified OpenAI preprint as 8.52."},"rules":[],"says":"A group G is called of type (FP)_infinity if the trivial G-module Z has a resolution by finitely generated projective G-modules. The class of all groups of type (FP)_infinity has a couple of excellent closure properties with respect to extensions and amalgamated products (R. Bieri, Homological dimension of discrete groups, Queen Mary College Math. Notes, London, 1976). Is every periodic group of type (FP)_infinity finite? This is related to the question whether there is an infinite periodic group with a finite presentation.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('6.3')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_6_21","kind":"open_problem","kourovka":{"mark":"open","num":"6.21"},"notes":["Kourovka 21, problem 6.21, by V. D. Mazurov. No comment printed. KB triage: borderline (not about exponent or Engel, but a Lie ring method question of the Higman/Kostrikin type)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"G. Higman proved that, for any prime number p, there exists a natural number chi(p) such that the nilpotency class of any finite group G having an automorphism of order p without non-trivial fixed points does not exceed chi(p). At the same time he showed that chi(p) >= (p^2 - 1)/4 for any such Higman's function chi. Find the best possible Higman's function. Is it the function defined by equalities chi(p) = (p^2 - 1)/4 for p > 2 and chi(2) = 1? This is known to be true for p <= 7.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('6.21')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_6_56","kind":"open_problem","kourovka":{"mark":"open","num":"6.56"},"notes":["Kourovka 21, problem 6.56, by V. P. Shunkov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G = F . <a> be a Frobenius group with the complement <a> of prime order. a) Is G locally finite if it is binary finite? b) Is the kernel F locally finite if the groups <a, a^g> are finite for all g in G?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('6.56')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_6_59","kind":"open_problem","kourovka":{"mark":"open","num":"6.59"},"notes":["Kourovka 21, problem 6.59, by V. P. Shunkov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"A group G is said to be (conjugacy, p-conjugacy) biprimitively finite if, for any finite subgroup H, any two elements of prime order (any two conjugate elements of prime order, of prime order p) in N_G(H)/H generate a finite subgroup. Prove that an arbitrary periodic (conjugacy) biprimitively finite group (in particular, having no involutions) of finite rank is locally finite.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('6.59')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_6_60","kind":"open_problem","kourovka":{"mark":"open","num":"6.60"},"notes":["Kourovka 21, problem 6.60, by V. P. Shunkov. No comment printed. Definition of biprimitively finite: see 6.59."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Do there exist infinite finitely generated simple periodic (conjugacy) biprimitively finite groups which contain both involutions and non-trivial elements of odd order?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('6.60')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_6_61","kind":"open_problem","kourovka":{"mark":"open","num":"6.61"},"notes":["Kourovka 21, problem 6.61, by V. P. Shunkov. No comment printed. Definition of biprimitively finite: see 6.59."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is every infinite periodic (conjugacy) biprimitively finite group without involutions non-simple?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('6.61')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_6_62","kind":"open_problem","kourovka":{"mark":"open","num":"6.62"},"notes":["Kourovka 21, problem 6.62, by V. P. Shunkov. There are affirmative answers for conjugacy biprimitively finite p-groups and for 2-conjugacy biprimitively finite groups (V. P. Shunkov, Algebra and Logic, 9, no. 4 (1970), 291-297; 11, no. 4 (1972), 260-272; 12, no. 5 (1973), 347-353), while the statement does not hold for arbitrary periodic groups, see Archive, 3.9. Definition of biprimitively finite: see 6.59."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is a (conjugacy, p-conjugacy) biprimitively finite group finite if it has a finite maximal subgroup (p-subgroup)?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('6.62')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"kourovka_7_3","kind":"open_problem","kourovka":{"mark":"open","num":"7.3"},"notes":["Kourovka 21, problem 7.3, by S. I. Adian. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Prove that the periodic product of odd exponent n >= 665 of non-trivial groups F1, ..., Fk which do not contain involutions cannot be generated by less than k elements. This would imply, on the basis of (S. I. Adian, Sov. Math. Doklady, 19, (1978), 910-913), the existence of k-generated simple groups which cannot be generated by less than k elements, for any k > 0.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('7.3')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_7_5","kind":"open_problem","kourovka":{"mark":"open","num":"7.5"},"notes":["Kourovka 21, problem 7.5, by V. V. Belyaev. No comment printed. KB triage: borderline (periodicity is a hypothesis, but the question is structural rather than about finiteness or exponent)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"We say that a group is indecomposable if any two of its proper subgroups generate a proper subgroup. Describe the indecomposable periodic metabelian groups.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('7.5')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_8_21","kind":"open_problem","kourovka":{"mark":"open","num":"8.21"},"notes":["Kourovka 21, problem 8.21, by L. G. Kovács. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"If the commutator subgroup G' of a relatively free group G is periodic, must G' have finite exponent?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('8.21')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_8_52","kind":"open_problem","kourovka":{"mark":"ai_unverified","num":"8.52"},"notes":["Kourovka 21, problem 8.52, by A. Yu. Olshanskii. AI-proposed solution, unverified: Yes, such groups do exist (unverified AI solution: OpenAI, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/10/8-52.pdf). The editors regard the problem as unsolved."],"precheck":{"class":"ai_unverified","summary":"Kourovka 21 (arXiv:1401.0300v50): marked # (unverified AI solution, OpenAI preprint 2026: Yes, such groups exist)."},"rules":[],"says":"(Well-known problem). Do there exist infinite finitely presented periodic groups? Compare with 6.3.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('8.52')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"kourovka_8_53","kind":"open_problem","kourovka":{"mark":"open","num":"8.53"},"notes":["Kourovka 21, problem 8.53, by A. Yu. Olshanskii. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"a) Let n be a sufficiently large odd number. Describe the automorphisms of the free Burnside group B(m, n) of exponent n on m generators.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('8.53')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_8_67","kind":"open_problem","kourovka":{"mark":"open","num":"8.67"},"notes":["Kourovka 21, problem 8.67, by A. I. Sozutov. The answer is negative for the whole adjoint group of a nil-ring (Ya. P. Sysak, Abstracts of the 17th All-Union Algebraic Conf., part 1, Minsk, 1983, p. 180 (Russian))."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Do there exist Golod groups all of whose abelian subgroups have finite ranks? Here a Golod group means a finitely generated non-nilpotent subgroup of the adjoint group of a nil-ring.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('8.67')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"kourovka_9_7","kind":"open_problem","kourovka":{"mark":"open","num":"9.7"},"notes":["Kourovka 21, problem 9.7, by R. I. Grigorchuk. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"(A. M. Stëpin). Does there exist an infinite finitely generated amenable group of bounded exponent?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('9.7')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_9_14","kind":"open_problem","kourovka":{"mark":"open","num":"9.14"},"notes":["Kourovka 21, problem 9.14, by D. I. Zaitsev. The answer is affirmative in the case of two subgroups."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is a group locally finite if it decomposes into a product of periodic abelian subgroups which commute pairwise?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('9.14')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_9_65","kind":"open_problem","kourovka":{"mark":"open","num":"9.65"},"notes":["Kourovka 21, problem 9.65, by Ya. P. Sysak. No comment printed.","Borderline relevance: periodicity of factorized groups, not bounded exponent."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is a locally soluble group periodic if it is a product of two periodic subgroups?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locat 2, ..., x_r over a field of characteristic p > 0, and I is an ideal of F such that F/I is a non-nilpotent nil-algebra (see E. S. Golod, Amer. Math. Soc. Transl. (2), 48 (1965), 103-106). Prove that in Golod groups the centralizer of every element is infinite.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('9.76')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_9_78","kind":"open_problem","kourovka":{"mark":"open","num":"9.78"},"notes":["Kourovka 21, problem 9.78, by V. P. Shunkov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Does there exist a periodic residually finite F*-group (see Archive, 7.42) all of whose Sylow subgroups are finite and which is not binary finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('9.78')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_9_83","kind":"open_problem","kourovka":{"mark":"open","num":"9.83"},"notes":["Kourovka 21, problem 9.83, by V. P. Shunkov. No comment printed.","Borderline relevance: Sylow theory in periodic groups with Shunkov-type finiteness conditions."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that G is a (periodic) p-conjugacy biprimitively finite group (see 6.59) which has a finite Sylow p-subgroup. Is it then true that all Sylow p-subgroups of G are conjugate?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('9.83')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_9_84","kind":"open_problem","kourovka":{"mark":"open","num":"9.84"},"notes":["Kourovka 21, problem 9.84, by V. P. Shunkov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"a) Is every binary finite 2-group of finite exponent locally finite? b) The same question for p-groups for p > 2.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('9.84')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_10_59","kind":"open_problem","kourovka":{"mark":"open","num":"10.59"},"notes":["Kourovka 21, problem 10.59, by A. I. Sozutov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is a p'-group G locally nilpotent if it admits a splitting automorphism phi of prime order p such that all subgroups of the form <g, g^phi, ..., g^(phi^(p-1))> are nilpotent? An automorphism phi of order p is called splitting if g g^phi g^(phi^2) ... g^(phi^(p-1)) = 1 for all g in G.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.59')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_10_60","kind":"open_problem","kourovka":{"mark":"open","num":"10.60"},"notes":["Kourovka 21, problem 10.60, by A. I. Sozutov. Editors' comment (2001): The answer is affirmative if A contains an element of order 2 or 3 (A. Kh. Zhurtov, Siberian Math. J., 41, no. 2 (2000), 268-275)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Does every periodic group (p-group) A of regular automorphisms of an abelian group have non-trivial centre?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.60')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_10_62","kind":"open_problem","kourovka":{"mark":"solved","num":"10.62"},"notes":["Kourovka 21, problem 10.62, by A. I. Sozutov. Solved: Example constructed (AI solution confirmed by M. Amelio: M. Kinyon, J. Urban, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/09/kourovka-mathematics.pdf).","Borderline relevance: periodicity appears only parenthetically in the statement."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): AI solution confirmed (example constructed). kour1 review: relies on internals of an unrefereed 2025 preprint."},"rules":[],"says":"Construct an example of a (periodic) group without subgroups of index 2 which is generated by a conjugacy class of involutions X such that the order of the product of any two involutions from X is odd.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.62')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_10_64","kind":"open_problem","kourovka":{"mark":"solved","num":"10.64"},"notes":["Kourovka 21, problem 10.64, by Ya. P. Sysak. Solved: Yes, it does exist (M. Amelio, Preprint, 2025, https://arxiv.org/abs/2509.11958).","Borderline relevance: periodicity in permutation groups, not bounded exponent."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): Yes (Amelio, arXiv:2509.11958)."},"rules":[],"says":"Does there exist a non-periodic doubly transitive permutation group with a periodic stabilizer of a point?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.64')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_10_67","kind":"open_problem","kourovka":{"mark":"open","num":"10.67"},"notes":["Kourovka 21, problem 10.67, by E. I. Khukhro. No comment printed. Transcription: the printed symbols for intersection and join of varieties are rendered as 'meet' and 'join'."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"The class LNM_p of locally nilpotent groups admitting a splitting automorphism of prime order p (for definition see 10.59) is a variety of groups with operators (E. I. Khukhro, Math. USSR Sbornik, 58 (1987), 119-126). Is it true that LNM_p = (N_c(p) meet LNM_p) join (B_p meet LNM_p) where N_c(p) is the variety of nilpotent groups of some p-bounded class c(p) and B_p is the variety of groups of exponent p?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.67')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_10_74","kind":"open_problem","kourovka":{"mark":"open","num":"10.74"},"notes":["Kourovka 21, problem 10.74, by V. P. Shunkov. The question was solved in the positive for a number of very important partial cases by the author (Abstracts on Group Theory of the Mal'cev Int. Conf. on Algebra, Novosibirsk, 1989, p. 145 (Russian))."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that a group G contains an element a of prime order such that its centralizer C_G(a) is finite and all subgroups <a, a^g>, g in G, are finite and almost all of them are soluble. Is G locally finite? This problem is closely connected with 6.56.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.74')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_10_75","kind":"open_problem","kourovka":{"mark":"open","num":"10.75"},"notes":["Kourovka 21, problem 10.75, by V. P. Shunkov. It was proved in (V. P. Shunkov, Groups with involutions, Preprints no. 4, 5, 12 of the Comput. centre of SO AN SSSR, Krasnoyarsk, 1986 (Russian)) that if a is a point, then the answer is affirmative; on the other hand, a group with a point a of order 2 satisfying the given hypothesis, which has no periodic part, was exhibited in the same works. For the definition of a point see (V. I. Senashov, V. P. Shunkov, Algebra and Logic, 22, no. 1 (1983), 66-81)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that a group G contains an element a of prime order p such that the normalizer of every finite subgroup containing a has finite periodic part and all subgroups <a, a^g>, g in G, are finite and almost all of them are soluble. Does G possess a periodic part if p > 2?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.75')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_10_77","kind":"open_problem","kourovka":{"mark":"open","num":"10.77"},"notes":["Kourovka 21, problem 10.77, by V. P. Shunkov. Remark of 1999: P. V. Shumyatsky (Quart. J. Math. Oxford (2), 49, no. 196 (1998), 491-499) gave a positive answer to the question a) in the case where G is residually finite."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that G is a periodic group containing an elementary abelian subgroup R of order 4. Must G be locally finite a) if C_G(R) is finite? b) if the centralizer of every involution of R in G is a Chernikov group?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('10.77')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_11_16","kind":"open_problem","kourovka":{"mark":"open","num":"11.16"},"notes":["Kourovka 21, problem 11.16, by R. Brandl. No comment printed beyond the partial results in the statement. Notation [x,_r y] = [x,y,...,y] with r copies of y."],"precheck":{"class":"new_claim","summary":"Not in the notebook. Zenodo 23552921 (A. Ferudun, 2026-10-22, AI mentioned): partial answer to (b), all but finitely many simple groups in V_r are Suzuki groups; (a) not treated. Unrefereed."},"rules":[],"says":"Let V_r be the class of all finite groups G satisfying a law [x,_r y] = [x,_s y] for some s = s(G) > r. Here [x,_1 y] = [x,y] and [x,_(i+1) y] = [[x,_i y], y]. a) Is there a function f such that every soluble group in V_r has Fitting length < f(r)? For r < 3 see (R. Brandl, Bull. Austral. Math. Soc., 28 (1983), 101-110). b) Is it true that V_r contains only finitely many nonabelian simple groups? This is true for r < 4.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.16')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_11_17","kind":"open_problem","kourovka":{"mark":"open","num":"11.17"},"notes":["Kourovka 21, problem 11.17, by R. Brandl. Part a) is true for soluble groups (N. D. Gupta, H. Heineken, Math. Z., 95 (1967), 276-287). I have checked part b) for A_n, PSL(2, q), and a number of sporadic groups."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G be a finite group and let d = d(G) be the least positive integer such that G satisfies a law [x,_r y] = [x,_(r+d) y] for some nonnegative integer r = r(G). a) Let e = 1 if d(G) is even and e = 2 otherwise. Is it true that the exponent of G/F(G) divides e*d(G)? b) If G is a nonabelian simple group, does the exponent of G divide d(G)?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.17')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_11_23","kind":"open_problem","kourovka":{"mark":"solved","num":"11.23"},"notes":["Kourovka 21, problem 11.23, by V. G. Vilyatser. Solved: No, not every (K. Muliarchyk, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/09/kourovka_11_23_solution.pdf).","Borderline relevance: Engel-type condition on an automorphism, not on the group."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): answered (Muliarchyk, preprint 2026); solution PDF on kourovkanotebookorg.wordpress.com."},"rules":[],"says":"An automorphism phi of a group G is called a nil-automorphism if, for every a in G, there exists n such that [a,_n phi] = 1. Here [x,_1 y] = [x,y] and [x,_(i+1) y] = [[x,_i y], y]. An automorphism phi is called an e-automorphism if, for any two phi-invariant subgroups A and B such that A is not contained in B, there exists a in A \\ B such that [a, phi] in B. Is every e-automorphism of a group a nil-automorphism?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.23')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"kourovka_11_36","kind":"open_problem","kourovka":{"mark":"open","num":"11.36"},"notes":["Kourovka 21, problem 11.36, by S. V. Ivanov. Editors' comment (on part b): for large prime n this follows from (E. A. Cherepanov, Int. J. Algebra Comput., 16 (2006), 839-847), for prime n >= 1009 from (V. S. Atabekyan, Izv. Math., 75, no. 2 (2011), 223-237); this is also true for odd n >= 1003 if in addition the order of phi is a prime power (V. S. Atabekyan, Math. Notes, 95, no. 5 (2014), 586-589)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G = B(m,n) be the free Burnside group of rank m and of odd exponent n >> 1. Are the following statements true? a) Every 2-generated subgroup of G is isomorphic to the Burnside n-product of two cyclic groups. b) Every automorphism phi of G such that phi^n = 1 and b^phi * b^(phi^2) * ... * b^(phi^n) = 1 for all b in G is an inner automorphism (here m > 1). c) The group G is Hopfian if m < infinity. d) All retracts of G are free.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.36')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"kourovka_11_37","kind":"open_problem","kourovka":{"mark":"open","num":"11.37"},"notes":["Kourovka 21, problem 11.37, by S. V. Ivanov. No further comment printed; only part a) appears in this issue. Transcription: pdftotext printed 'n >= 248 divisible by 29'; these are probably powers of 2 whose superscripts were lost in extraction (the trailing space in '29 .' suggests a superscript), but the exact values must be checked against the PDF."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"a) Can the free Burnside group B(m,n), for any m and n, be given by defining relations of the form v^n = 1 such that for any natural divisor d of n distinct from n the element v^d is not trivial in B(m,n)? This is true for odd n >= 665, and for all n >= [garbled formula: printed '248'] divisible by [garbled formula: printed '29'].","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.37')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_11_48","kind":"open_problem","kourovka":{"mark":"open","num":"11.48"},"notes":["Kourovka 21, problem 11.48, by A. I. Kostrikin. No comment printed. The commutator has six copies of y."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is the commutator [x, y, y, y, y, y, y] a product of fifth powers in the free group <x, y>? If not, then the Burnside group B(2,5) is infinite.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.48')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_11_56","kind":"open_problem","kourovka":{"mark":"open","num":"11.56"},"notes":["Kourovka 21, problem 11.56, by A. Mann. No comment printed.","Borderline relevance: the essential case is residually finite torsion groups (centralizer conditions, Shunkov theorem)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"a) Does every infinite residually finite group contain an infinite abelian subgroup? This is equivalent to the following: does every infinite residually finite group contain a non-identity element with an infinite centralizer? By a famous theorem of Shunkov a torsion group with an involution having a finite centralizer is a virtually soluble group. Therefore we may assume that in our group all elements have odd order. One should start, perhaps, with the following: b) Does every infinite residually p-group contain an infinite abelian subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.56')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_11_90","kind":"open_problem","kourovka":{"mark":"open","num":"11.90"},"notes":["Kourovka 21, problem 11.90, by S. V. Rychkov. No comment printed.","Borderline relevance: the final sentence says 'free in B' and the batch text does not define B; it is included only in case B denotes a Burnside variety. Check the PDF."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let V be a variety of groups and let k be an infinite cardinal number. A group G in V of rank k is called almost free in V if each of its subgroups of rank less than k is contained in a subgroup of G which is free in V. For what k do there exist almost free but not free in B groups of rank k?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.90')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_11_100","kind":"open_problem","kourovka":{"mark":"open","num":"11.100"},"notes":["Kourovka 21, problem 11.100, by S. P. Strunkov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is it true that every periodic conjugacy biprimitively finite group (see 6.59) can be obtained from 2-groups and binary finite groups by taking extensions? This question is of independent interest for p-groups, p an odd prime.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.100')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_11_105","kind":"open_problem","kourovka":{"mark":"open","num":"11.105"},"notes":["Kourovka 21, problem 11.105, by G. E. Wall. No comment printed; only part b) appears in this issue."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"b) Let V be a variety of groups. Its relatively free group of given rank has a presentation F/N, where F is absolutely free of the same rank and N fully invariant in F. The associated Lie ring L(F/N) has a presentation L/J, where L is the free Lie ring of the same rank and J an ideal of L. Is J fully invariant in L if V is the Burnside variety of all groups of given exponent q, where q is a prime-power, q >= 4?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.105')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats
