rules":[],"says":"Is every group of exponent 12 locally finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('11.127')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_12_4","kind":"open_problem","kourovka":{"mark":"open","num":"12.4"},"notes":["Kourovka 21, problem 12.4, by R. Brandl. By a result of N. D. Gupta and N. S. Mendelssohn, 1967, we know that G' is a 3-group."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G be a group and assume that we have [x,y]^3 = 1 for all x, y in G. Is G' of finite exponent? Is G soluble?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('12.4')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_12_64","kind":"open_problem","kourovka":{"mark":"open","num":"12.64"},"notes":["Kourovka 21, problem 12.64, by A. Yu. Olshanskii. For given k and n, a negative answer implies, for example, the infiniteness of the free Burnside group B(k,n), and a positive answer, in the case of sufficiently large n, gives, for example, an opportunity to find a hyperbolic group which is not residually finite (and in this group a hyperbolic subgroup of finite index which has no proper subgroups of finite index). Comment of 2026: there exist hyperbolic groups that are not residually finite (unverified AI solution: OpenAI, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/10/partial-12-64_18-88.pdf). Mark is open: the AI-proposed result concerns the consequence, not the question itself."],"precheck":{"class":"ai_unverified","summary":"Kourovka 21 (arXiv:1401.0300v50): printed open; 2026 comment cites an unverified OpenAI partial result (non-residually-finite hyperbolic groups exist; partial-12-64_18-88.pdf on the notebook site)."},"rules":[],"says":"Is it true that for a given number k >= 2 and for any (prime) number n, there exists a number N = N(k,n) such that every finite group with generators A = {a_1, ..., a_k} has exponent <= n if (x_1 ... x_N)^n = 1 for any x_1, ..., x_N in A union {1}?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('12.64')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_12_81","kind":"open_problem","kourovka":{"mark":"open","num":"12.81"},"notes":["Kourovka 21, problem 12.81, by V. I. Sushchanskiı̆. No comment printed. Transcription: pdftotext printed 'A3p'; read as A_p^3 (product variety, A_p cubed).","Borderline relevance: varieties built from exponent-p abelian groups; not a Burnside question proper."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"What is the cardinality of the set of subvarieties of the group variety A_p^3 (where A_p is the variety of abelian groups of prime exponent p)?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('12.81')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_12_88","kind":"open_problem","kourovka":{"mark":"open","num":"12.88"},"notes":["Kourovka 21, problem 12.88, by V. I. Trofimov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"An undirected graph is called a locally finite Cayley graph of a group G if its vertex set can be identified with the set of elements of G in such a way that, for some finite generating set X = X^(-1) of G not containing 1, two vertices g and h are adjacent if and only if g^(-1) h in X. Do there exist two finitely generated groups with the same locally finite Cayley graph, one of which is periodic and the other is not periodic?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('12.88')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_12_100","kind":"open_problem","kourovka":{"mark":"open","num":"12.100"},"notes":["Kourovka 21, problem 12.100, by P. V. Shumyatsky. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is every periodic group with a regular automorphism of order 4 locally finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('12.100')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_12_101","kind":"open_problem","kourovka":{"mark":"open","num":"12.101"},"notes":["Kourovka 21, problem 12.101, by V. P. Shunkov. No comment printed. Borderline: Shunkov-type question about groups with finiteness conditions on involutions and periodic parts."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"We call a group G containing an involution i a T0-group if 1) the order of the product of any two involutions conjugate to i is finite; 2) all 2-subgroups of G are either cyclic or generalized quaternion; 3) the centralizer C of the involution i in G is infinite, distinct from G, and has finite periodic part; 4) the normalizer of any non-trivial i-invariant finite subgroup in G either is contained in C or has periodic part which is a Frobenius group (see 6.55) with abelian kernel and finite complement of even order; 5) for every element c not contained in C for which ci is an involution there is an element s of C such that <c, c^s> is an infinite subgroup. Does there exist a simple T0-group?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('12.101')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_5","kind":"open_problem","kourovka":{"mark":"open","num":"13.5"},"notes":["Kourovka 21, problem 13.5, by V. V. Belyaev. No comment printed. Borderline: periodic locally soluble groups, Chernikov condition."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Groups A and B are said to be locally equivalent if for every finitely generated subgroup X <= A there is a subgroup Y <= B isomorphic to X, and conversely, for every finitely generated subgroup Y <= B there is a subgroup X <= A, isomorphic to Y. We call a group G categorical if G is isomorphic to any group that is locally equivalent to G. Is it true that a periodic locally soluble group G is categorical if and only if G is hyperfinite with Chernikov Sylow subgroups? (A group is hyperfinite if it has a well ordered ascending normal series with finite factors.)","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.5')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_6","kind":"open_problem","kourovka":{"mark":"open","num":"13.6"},"notes":["Kourovka 21, problem 13.6, by V. V. Belyaev. No comment printed. Borderline: locally finite groups with a Chernikov-type centralizer condition."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"(B. Hartley). Is it true that a locally finite group containing an element with Chernikov centralizer is almost soluble?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.6')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_7","kind":"open_problem","kourovka":{"mark":"open","num":"13.7"},"notes":["Kourovka 21, problem 13.7, by V. V. Belyaev. No comment printed. Borderline: locally finite groups with a centralizer condition; no periodicity hypothesis beyond local finiteness."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"(B. Hartley). Is it true that a simple locally finite group containing a finite subgroup with finite centralizer is linear?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.7')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_8","kind":"open_problem","kourovka":{"mark":"open","num":"13.8"},"notes":["Kourovka 21, problem 13.8, by V. V. Belyaev. Part a) is marked solved (*): a) Yes, it is true (E. Khukhro, Bull. London Math. Soc., 58, no. 1 (2026), Article ID e70206). Part b) remains open."],"precheck":{"class":"partial","summary":"Kourovka 21 (arXiv:1401.0300v50): part a) answered Yes (Khukhro, Bull. LMS 58, 2026)."},"rules":[],"says":"(B. Hartley). Is it true that a locally soluble periodic group has a finite normal series with locally nilpotent factors if it contains an element a) with finite centralizer? b) with Chernikov centralizer?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.8')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_9","kind":"open_problem","kourovka":{"mark":"open","num":"13.9"},"notes":["Kourovka 21, problem 13.9, by V. V. Belyaev, B. Hartley. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is it true that a locally soluble periodic group containing a finite nilpotent subgroup with Chernikov centralizer has a finite normal series with locally nilpotent factors?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.9')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_13_17","kind":"open_problem","kourovka":{"mark":"open","num":"13.17"},"notes":["Kourovka 21, problem 13.17, by S. Vovsi. No comment printed. Borderline: a nil (unipotence) condition on group elements, of Engel/Kurosh type, not an exponent question."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"A representation of a group G on a vector space V is called a nil-representation if for every v in V and g in G there exists n = n(v, g) such that v(g - 1)^n = 0. Is it true that in zero characteristic every irreducible nil-representation is trivial? (In prime characteristic it is not true.)","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.17')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_55","kind":"open_problem","kourovka":{"mark":"open","num":"13.55"},"notes":["Kourovka 21, problem 13.55, by A. V. Timofeenko. No comment printed."],"precheck":{"class":"untouched","summary":"Mentioned in Zenodo 23624706, which states it claims no answer."},"rules":[],"says":"Does there exist a Golod group (see 9.76), which is isomorphic to an AT-group? For a definition of an AT-group see (A. V. Rozhkov, Math. Notes, 40, no. 5 (1986), 827-836).","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.55')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_64","kind":"open_problem","kourovka":{"mark":"open","num":"13.64"},"notes":["Kourovka 21, problem 13.64, by W. J. Shi. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let pi_e(G) denote the set of orders of elements of a group G. A group G is said to be an OC_n-group if pi_e(G) = {1, 2, ..., n}. Is every OC_n-group locally finite? Do there exist infinite OC_n-groups for n >= 7?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.64')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_13_67","kind":"open_problem","kourovka":{"mark":"open","num":"13.67"},"notes":["Kourovka 21, problem 13.67, by V. P. Shunkov. No comment printed. Borderline: Shunkov-type question; periodicity enters via residual periodicity."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G be a T0-group (see 12.101), i an involution in G and G = <i^g | g in G>. Is the centralizer C_G(i) residually periodic?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('13.67')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_14_35","kind":"open_problem","kourovka":{"mark":"open","num":"14.35"},"notes":["Kourovka 21, problem 14.35, by N. D. Gupta. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is every finitely presented group of prime exponent finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.35')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_14_39","kind":"open_problem","kourovka":{"mark":"open","num":"14.39"},"notes":["Kourovka 21, problem 14.39, by A. N. Zubkov. Printed comment: This is true if the variety V is metabelian (A. N. Zubkov, Dr. Sci. Diss., Omsk, 1997 (Russian)). Borderline: pro-p varieties, bounded orders of torsion elements."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let F(V) be a free group of some variety of pro-p-groups V. Is there a uniform bound for the exponents of periodic elements in F(V)?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.39')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_14_53","kind":"open_problem","kourovka":{"mark":"open","num":"14.53"},"notes":["Kourovka 21, problem 14.53, by L. Levai, L. Pyber. Printed comment: This is true in the case n = 2. It would be interesting to see whether similar results hold for profinite groups in which the set of solutions of some equation has positive measure. Comment of 2021: This is also proved for n = 3 (A. Abdollahi, M. S. Malekan, Adv. Group Theory Appl., 13 (2022), 71-81). Comment of 2025: Significant progress was obtained in (S. Kionke, N. Otmen, T. Toti, M. Vannacci, T. Weigel, Preprint, 2025, https://arxiv.org/pdf/2507.19086). Borderline: profinite, but about the power law x^n = 1 holding on a coset."],"precheck":{"class":"partial","summary":"Kourovka 21 (arXiv:1401.0300v50): 2025 comment reports significant progress (Kionke et al., arXiv:2507.19086); case n = 3 by Abdollahi-Malekan 2022."},"rules":[],"says":"Conjecture: Let G be a profinite group such that the set of solutions of the equation x^n = 1 has positive Haar measure. Then G has an open subgroup H and an element t such that all elements of the coset tH have order dividing n.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.53')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_14_58","kind":"open_problem","kourovka":{"mark":"open","num":"14.58"},"notes":["Kourovka 21, problem 14.58, by V. D. Mazurov. No comment printed. Only part a) is printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"a) Suppose that A is a periodic group of regular automorphisms of an abelian group. Is A cyclic if A has prime exponent?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.58')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_14_70","kind":"open_problem","kourovka":{"mark":"open","num":"14.70"},"notes":["Kourovka 21, problem 14.70, by B. I. Plotkin. Comment of 2017: For n = 2, 3, 4, finitely generated n-Engel groups are nilpotent. A course of lectures devoted to constructing non-nilpotent finitely generated n-Engel groups for sufficiently large n is given by E. Rips and is available on the Internet."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"A group G is called n-Engel if it satisfies the identity [x, y, ..., y] = 1, where y is taken n times. Are there non-nilpotent finitely generated n-Engel groups?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.70')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_14_97","kind":"open_problem","kourovka":{"mark":"open","num":"14.97"},"notes":["Kourovka 21, problem 14.97, by N. S. Chernikov. No comment printed. Borderline: periodic locally soluble groups, factorization question."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is it true that for any two different prime numbers p and q there exists a non-primary periodic locally soluble {p, q}-group that can be represented as the product of two of its p-subgroups?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.97')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_14_100","kind":"open_problem","kourovka":{"mark":"open","num":"14.100"},"notes":["Kourovka 21, problem 14.100, by A. K. Shlëpkin. Printed comment: This is true under the additional condition that any two conjugates of this element generate a soluble subgroup (V. P. Shunkov, M_p-groups, Moscow, Nauka, 1990 (Russian))."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is it true that in a Shunkov group (i. e. conjugately biprimitively finite group, see 6.59) having infinitely many elements of finite order every element of prime order is contained in some infinite locally finite subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.100')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_14_101","kind":"open_problem","kourovka":{"mark":"open","num":"14.101"},"notes":["Kourovka 21, problem 14.101, by A. K. Shlëpkin. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"A group G is saturated with groups from a class X if every finite subgroup K <= G is contained in a subgroup L <= G isomorphic to some group from X. Is it true that a periodic group saturated with finite simple groups of Lie type of uniformly bounded ranks is itself a simple group of Lie type of finite rank?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('14.101')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_15_1","kind":"open_problem","kourovka":{"mark":"open","num":"15.1"},"notes":["Kourovka 21, problem 15.1, by A. Abdollahi. Printed comment: The answer to both of these questions is likely to be \"yes\". It is known that in a) w cannot be any of several words such as x_1^n, [x_1, ..., x_n], [x_1, x_2]^2, (x_1 x_2)^3 x_2^-3 x_1^-3, and x_1^a1 ... x_n^an for any non-zero integers a_1, ..., a_n. Borderline: general laws; the power law x^n is among the known cases. Formula (x_1 x_2)^3 x_2^-3 x_1^-3 reconstructed from garbled pdftotext layout."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"(P. Longobardi, M. Maj, A. H. Rhemtulla). Let w = w(x_1, ..., x_n) be a group word in n variables x_1, ..., x_n, and V(w) the variety of groups defined by the law w = 1. Let V(w*) (respectively, V(w#)) be the class of all groups G in which for every n infinite subsets S_1, ..., S_n there exist s_i in S_i such that w(s_1, ..., s_n) = 1 (respectively, <s_1, ..., s_n> in V(w)). a) Is there some word w and an infinite group G such that G in V(w#) but G not in V(w)? b) Is there some word w and an infinite group G such that G in V(w*) but G not in V(w#)?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.1')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"kourovka_15_14","kind":"open_problem","kourovka":{"mark":"solved","num":"15.14"},"notes":["Kourovka 21, problem 15.14, by L. Bartholdi, R. I. Grigorchuk, Z. Šuniḱ. Solved (*): b) Yes, there exist finitely generated non-amenable torsion branch groups (S. Kionke, E. Schesler, Bull. London Math. Soc., 56, no. 2 (2024), 536-550). Only part b) is printed. Borderline: the question is about amenability, but the answer is given by torsion groups."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): b) Yes, finitely generated non-amenable torsion branch groups exist (Kionke-Schesler, Bull. LMS 56, 2024)."},"rules":[],"says":"b) Do there exist finitely generated branch groups that are non-amenable and do not contain the free group F_2 on two generators?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.14')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"kourovka_15_19","kind":"open_problem","kourovka":{"mark":"open","num":"15.19"},"notes":["Kourovka 21, problem 15.19, by L. Bartholdi, S. Sidki. Printed references: See (A. M. Brunner, S. Sidki, J. Algebra, 257 (2002), 51-64) and (R. I. Grigorchuk, V. V. Nekrashevich, V. I. Sushchanskiĭ, in: Dynamical systems, automata, and infinite groups. Proc. Steklov Inst. Math., 231 (2000), 128-203). Part b) solved (*): b) Yes, it does (A. C. Dantas, J. R. Oliveira, T. M. G. Santos, Preprint, 2024, https://arxiv.org/pdf/2405.16678). Part a) open. In b) the class is printed as F without subscript. Borderline: part a) concerns the Grigorchuk groups G_omega; not directly about periodicity."],"precheck":{"class":"partial","summary":"Kourovka 21 (arXiv:1401.0300v50): part b) answered Yes (Dantas-Oliveira-Santos, arXiv:2405.16678)."},"rules":[],"says":"Let p be a prime, and F_p the class of finitely generated groups acting faithfully on a p-regular rooted tree by finite automata. Any group in F_p is residually-p (residually in the class of finite p-groups) and has word problem that is solvable in (at worst) exponential time. There exist therefore groups that are residually-p, have a solvable word problem, and do not belong to F_p; though no concrete example is known. For instance: a) Is it true that some (or even all) the groups given in (R. I. Grigorchuk, Math. USSR-Sb., 54 (1986), 185-205) do not belong to F_p when the sequence omega is computable, but not periodic? b) Does Z wr (Z wr Z) belong to F? (Here the wreath products are restricted.)","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.19')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_15_20","kind":"open_problem","kourovka":{"mark":"open","num":"15.20"},"notes":["Kourovka 21, problem 15.20, by V. V. Belyaev, M. Kuzucuoǧlu. Printed comment: Note that there are no simple locally finite barely transitive groups (B. Hartley, M. Kuzucuoǧlu, Proc. Edinburgh Math. Soc., 40 (1997), 483-490), any locally finite barely transitive group is a p-group for some prime p, and if the stabilizer of a point in a locally finite barely transitive group G is soluble of derived length d, then G is soluble of derived length bounded by a function of d (V. V. Belyaev, M. Kuzucuoǧlu, Algebra and Logic, 42 (2003), 147-152). Borderline: locally finite p-groups with conditions on subgroups."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"(B. Hartley). An infinite transitive permutation group is said to be barely transitive if each of its proper subgroups has only finite orbits. Can a locally finite barely transitive group coincide with its derived subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.20')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_15_28","kind":"open_problem","kourovka":{"mark":"open","num":"15.28"},"notes":["Kourovka 21, problem 15.28, by Ya. G. Berkovich. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that a finite p-group G is the product of two subgroups: G = AB. a) Is the exponent of G bounded in terms of the exponents of A and B? b) Is the exponent of G bounded if A and B are groups of exponent p?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.28')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_15_37","kind":"open_problem","kourovka":{"mark":"open","num":"15.37"},"notes":["Kourovka 21, problem 15.37, by F. O. Wagner. Printed comment: If the numbers f(x, y) can be bounded, the answer is affirmative (F. O. Wagner, J. Algebra, 217, no. 2 (1999), 448-460)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G be a group satisfying the minimum condition for centralizers. Suppose that X is a normal subset of G such that [x, y, ..., y] = 1 for any x, y in X with y repeated f(x, y) times. Does X generate a locally nilpotent (whence hypercentral) subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.37')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_15_41","kind":"open_problem","kourovka":{"mark":"open","num":"15.41"},"notes":["Kourovka 21, problem 15.41, by M. R. Vaughan-Lee. Printed comment: My guess is \"no\" to the first two questions for general p, but \"yes\" to the third. By contrast, a beautiful and simple argument of Mike Newman shows that if m >= 2 and k >= 2 (k >= 3 for p = 2), then the order of R(m, p^k) is at least p^(p^(...^(p^m))), with p appearing k times in the tower; see (M. Vaughan-Lee, E. I. Zelmanov, J. Austral. Math. Soc. (A), 67, no. 2 (1999), 261-271). The tower formula is reconstructed from a garbled pdftotext layout."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let R(m, p) denote the largest finite m-generator group of prime exponent p. a) Can the nilpotency class of R(m, p) be bounded by a polynomial in m? (This is true for p = 2, 3, 5, 7.) b) Can the nilpotency class of R(m, p) be bounded by a linear function in m? (This is true for p = 2, 3, 5.) c) In particular, can the nilpotency class of R(m, 7) be bounded by a linear function in m?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.41')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_15_50","kind":"open_problem","kourovka":{"mark":"solved","num":"15.50"},"notes":["Kourovka 21, problem 15.50, by V. D. Mazurov. Solved (*): No, not always (AI solution confirmed by V. D. Mazurov: B. G. Di Siena, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/10/15-50.pdf)."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): AI solution confirmed (No, not always); solution PDF on the notebook site."},"rules":[],"says":"Let G be a group of automorphisms of an abelian group of prime exponent. Suppose that there exists x in G such that x is regular of order 3 and the order of [x, g] is finite for every g in G. Is it true that <x^G> is locally finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.50')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_15_51","kind":"open_problem","kourovka":{"mark":"open","num":"15.51"},"notes":["Kourovka 21, problem 15.51, by V. D. Mazurov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that G is a periodic group satisfying the identity [x, y]^5 = 1. Is then the derived subgroup [G, G] a 5-group?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.51')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_15_54","kind":"open_problem","kourovka":{"mark":"open","num":"15.54"},"notes":["Kourovka 21, problem 15.54, by V. D. Mazurov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that G is a periodic group containing an involution i such that the centralizer C_G(i) is a locally cyclic 2-group. Does the set of all elements of odd order in G that are inverted by i form a subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.54')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_15_66","kind":"open_problem","kourovka":{"mark":"open","num":"15.66"},"notes":["Kourovka 21, problem 15.66, by P. M. Neumann. Printed text: Some progress has been made by G. Venkataraman (Quart. J. Math. Oxford (2), 48, no. 189 (1997), 107-125) when V is a variety generated by finite groups all of whose Sylow subgroups are abelian. Moreover, this seems a possible way to attack the Sims Conjecture that when we write the number of groups of order p^m as p^((2/27) m^3 + epsilon(m)) the error term epsilon(m) is O(m^2). Exponents reconstructed from garbled pdftotext layout. Borderline: counting groups in locally finite varieties of p-groups (such varieties have finite exponent)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"For a class X of groups let g_X(n) be the number of groups of order n in the class X (up to isomorphism). Many years ago I formulated the following problem: find good upper bounds for the quotient g_V(n)/g_U(n), where V is a variety that is defined by its finite groups and U is a subvariety of V. (This quotient is not defined for all n but only for those for which there are groups of order n in U.) Conjecture: if V is a locally finite variety of p-groups and U is a non-abelian subvariety of V, then g_V(p^m)/g_U(p^m) < p^(O(m^2)).","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.66')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_15_68","kind":"open_problem","kourovka":{"mark":"open","num":"15.68"},"notes":["Kourovka 21, problem 15.68, by A. Yu. Olshanskii. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Does there exist an infinite finitely generated 2-group (of finite exponent) all of whose proper subgroups are locally finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('15.68')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 ( enerated by a subset of bounded exponent a) if all of its proper subgroups are hypercentral? b) if all of its proper subgroups are solvable?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.6')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_16_15","kind":"open_problem","kourovka":{"mark":"open","num":"16.15"},"notes":["Kourovka 21, problem 16.15, by V. V. Bludov. No comment printed. Parts b)-d) are printed (no part a))."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"An element g of a group G is an Engel element if for every h in G there exists k such that [h, g, ..., g] = 1, where g occurs k times; if there is such k independent of h, then g is said to be boundedly Engel. b) Does the set of boundedly Engel elements form a subgroup in a torsion-free group? c) The same question for right-ordered groups. d) The same question for linearly ordered groups.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.15')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_16_16","kind":"open_problem","kourovka":{"mark":"open","num":"16.16"},"notes":["Kourovka 21, problem 16.16, by V. V. Bludov. Printed comment: There are examples of 2-groups where a product of two (unboundedly) Engel elements is not an Engel element."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"a) Does the set of (not necessarily boundedly) Engel elements of a group without elements of order 2 form a subgroup? b) The same question for torsion-free groups. c) The same question for right-ordered groups. d) The same question for linearly ordered groups.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.16')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_16_38","kind":"open_problem","kourovka":{"mark":"solved","num":"16.38"},"notes":["Kourovka 21, problem 16.38, by F. de Giovanni. Solved: Yes, it is true (AI solution confirmed by B. Amberg: M. Kinyon, J. Urban, Preprint, 2026, https://kourovkanotebookorg.wordpress.com/wp-content/uploads/2026/09/kourovka-mathematics.pdf). Borderline: periodicity in soluble groups, not exponent."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): AI solution confirmed (Yes). kour1 review checked it, including the counterexample."},"rules":[],"says":"Let G be a soluble group, and let A and B be periodic subgroups of G. Is it true that any subgroup of G contained in the set AB = {ab | a in A, b in B} is periodic? This is known to be true if AB is a subgroup of G.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.38')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_16_56","kind":"open_problem","kourovka":{"mark":"open","num":"16.56"},"notes":["Kourovka 21, problem 16.56, by V. D. Mazurov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"The spectrum omega(G) of a group G is the set of orders of elements of G. Suppose that omega(G) = {1, 2, 3, 4, 5, 6}. Is G locally finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.56')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_16_64","kind":"open_problem","kourovka":{"mark":"open","num":"16.64"},"notes":["Kourovka 21, problem 16.64, by O. Macedońska. No comment printed. Borderline: variety question; exponent/Burnside varieties not mentioned explicitly in the problem text."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"A non-abelian variety in which all finite groups are abelian is called pseudo-abelian. A group variety is called a t-variety if for all groups in this variety the relation of being a normal subgroup is transitive. By (O. Macedońska, A. Storozhev, Commun. Algebra, 25, no. 5 (1997), 1589–1593) each non-abelian t-variety is pseudo-abelian, and the pseudo-abelian varieties constructed in (A. Yu. Olshanskii, Math. USSR–Sb., 54 (1986), 57–80) are t-varieties. Is every pseudo-abelian variety a t-variety?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.64')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_16_77","kind":"open_problem","kourovka":{"mark":"open","num":"16.77"},"notes":["Kourovka 21, problem 16.77, by B. I. Plotkin. No comment printed. Refers to problem 15.75 for the conditions on the word sequence."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"It is known that in every Noetherian group the nilpotent radical coincides with the collection of all Engel elements (R. Baer, Math. Ann., 133 (1957), 256–270; B. I. Plotkin, Izv. Vysš. Učebn. Zaved. Mat., 1958, no. 1(2), 130–135 (Russian)). It would be nice to find a similar characterization of the solvable radical of a finite group. More precisely, let u = u(x, y) be a sequence of words satisfying 15.75. We say that an element g in G is u-Engel if there exists n = n(g) such that u_n(x, g) = 1 for every element x in G. Does there exist a sequence u = u(x, y) such that the solvable radical of a finite group coincides with the set of all u-Engel elements?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.77')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_16_83","kind":"open_problem","kourovka":{"mark":"open","num":"16.83"},"notes":["Kourovka 21, problem 16.83 b), by Yu. V. Sosnovskiı̆. No comment printed. Only part b) is printed in the 21st issue."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"b) Let E_n be a free locally nilpotent n-Engel group on countably many generators, and let pi(E_n) be the set of prime divisors of the orders of elements of the periodic part of E_n. It is known that 2, 3, 5 in pi(E_4). Is it true that pi(E_n) = pi(E_{n+1}) for all sufficiently large n?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('16.83')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_16_96","kind":"open_problem","kourovka":{"mark":"open","num":"16.96"},"notes":["Kourovka 21, problem 16.96, by G. Traustason. No comment printed beyond the parenthetical remark in the statement."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G b 12] = e (1 <= i <= n/2), tau_12^(1+a+...+a^(n-1)) = e, tau_{i,i+1} a tau_{i,i+1} = a^(-1) (2 <= i <= m-1)>, and it is known that, for example, y(3,5) ≅ SL(2,16) ≅ Omega^-(4,4), y(4,5) ≅ Sp(2,16) ≅ Omega(5,4), y(5,5) ≅ SU(4,16) ≅ Omega^-(6,4), y(6,5) ≅ 4^6 Omega^-(6,4), y(3,7) ≅ SL(2,8)^2 ≅ Omega^+(4,8), y(4,7) ≅ Sp(4,8) ≅ Omega(5,8). Extensive computations by Felsch, Neubüser and O'Brien confirm this trend. Different types reveal Bott periodicity and a connection with Clifford algebras. Formulas reconstructed from the typeset PDF page (pdftotext garbled the superscripts); the superscript in tau_12^(a^i) denotes conjugation as typeset. Borderline: finiteness of a presentation with generators of order n, not an exponent law."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Prove that the group Y(m, n) = <a_1, a_2, ..., a_m | a_k^n = 1 (1 <= k <= m), (a_k^i a_l^i)^2 = e (1 <= k < l <= m, 1 <= i <= n/2)> is finite for every pair (m, n).","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('18.90')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_18_96","kind":"open_problem","kourovka":{"mark":"open","num":"18.96"},"notes":["Kourovka 21, problem 18.96, by N. M. Suchkov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that a periodic group G contains involutions and the centralizer of each involution is locally finite. Is it true that G has a nontrivial locally finite normal subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('18.96')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_18_97","kind":"open_problem","kourovka":{"mark":"open","num":"18.97"},"notes":["Kourovka 21, problem 18.97, by N. M. Suchkov. No comment printed beyond the remark in the statement."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G be a periodic Zassenhaus group, that is, a two-transitive permutation group with trivial stabilizer of every three points. Suppose that the stabilizer of a point is a Frobenius group with locally finite kernel U containing an involution. Is it true that U is a 2-group? This was proved for finite groups by Feit.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('18.97')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_18_100","kind":"open_problem","kourovka":{"mark":"open","num":"18.100"},"notes":["Kourovka 21, problem 18.100, by N. Trabelsi. No comment printed. Borderline: exponent classes E, E_m appear in parts a), b). pdftotext prints '<x, xy>'; read as <x, x^y> (conjugate)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"For a given class of groups X, let (X, infinity)* denote the class of groups in which every infinite subset contains two distinct elements x and y that satisfy <x, x^y> in X. Let G be a finitely generated soluble-by-finite group in the class (X, infinity)*, let m be a positive integer, and let F, E_m, E, N, and P denote the classes of finite groups, groups of exponent dividing m, groups of finite exponent, nilpotent groups, and polycyclic groups, respectively. a) If X = EN, then is G in EN? b) If X = E_m N, then is G in E_m(FN)? c) If X = N(PF), then is G in N(PF)?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('18.100')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_18_113","kind":"open_problem","kourovka":{"mark":"open","num":"18.113"},"notes":["Kourovka 21, problem 18.113, by A. K. Shlëpkin. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let M be a finite set of finite simple nonabelian groups. Is it true that a periodic group saturated with groups from M (see 14.101) is isomorphic to one of groups in M? The case where M is one-element is of special interest.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('18.113')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_18_118","kind":"open_problem","kourovka":{"mark":"open","num":"18.118"},"notes":["Kourovka 21, problem 18.118, by P. Shumyatsky. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G be a profinite group such that G/Z(G) is periodic. Is [G, G] necessarily periodic?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('18.118')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_19_13","kind":"open_problem","kourovka":{"mark":"open","num":"19.13"},"notes":["Kourovka 21, problem 19.13, by A. V. Borovik. No comment printed beyond the remark in the statement."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"The well-known Baer–Suzuki theorem states that if every two conjugates of an element a of a finite group G generate a finite p-subgroup, then a is contained in a normal p-subgroup. Does such a theorem hold in the class of periodic groups for p > 2? A counterexample is known for p = 2; see Archive 11.11a).","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.13')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"kourovka_19_32","kind":"open_problem","kourovka":{"mark":"open","num":"19.32"},"notes":["Kourovka 21, problem 19.32, by A. Gaglione. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let p >= 673 be a prime and r >= 2 be an integer. Let B be the free group in the Burnside variety of exponent p on a1, ..., ar. Must every non-identical one-variable equation w(a1, ..., ar, x) = 1 over B have at most finitely many solutions in B?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.32')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_19_44","kind":"open_problem","kourovka":{"mark":"open","num":"19.44"},"notes":["Kourovka 21, problem 19.44, by E. I. Khukhro. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"By definition a profinite group has finite rank at most r if every subgroup of it can be (topologically) generated by r elements. Suppose that for every element g of a profinite group G there is a closed subgroup E_g of finite rank such that for every x in G all sufficiently long Engel commutators [x, g, ..., g] belong to E_g, that is, for every x in G there is a positive integer n(x, g) such that [x, g, ..., g] in E_g whenever g is repeated >= n(x, g) times. Is it true that G has a normal subgroup N of finite rank with locally nilpotent quotient G/N?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.44')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_19_46","kind":"open_problem","kourovka":{"mark":"open","num":"19.46"},"notes":["Kourovka 21, problem 19.46, by S. Kohl. No comment printed. Borderline: about a specific group (defined in 17.57, not in this batch), but asks for infinite finitely generated periodic subgroups."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Does the group CT(Z) have finitely generated infinite periodic subgroups? (See the definition of CT(Z) in 17.57).","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.46')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_19_66","kind":"open_problem","kourovka":{"mark":"open","num":"19.66"},"notes":["Kourovka 21, problem 19.66, by B. I. Plotkin, E. B. Plotkin. No comment printed. Underbrace in part c) (garbled by pdftotext as '| {z }' over n) rendered as 'with n copies of y'."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"We say that a variety Theta is of Tarski type if any two non-abelian Theta-free groups of finite rank are elementarily equivalent. a) Find examples of Tarski type varieties distinct from the variety of all groups. b) Is it true that the Burnside variety B_n of all groups of exponent n, where n is big enough, is of Tarski type? c) Is it true that the n-Engel variety E_n of all groups satisfying the identity [[[x, y], y], ..., y] = 1 (with n copies of y), where n is big enough, is of Tarski type?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.66')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_19_83","kind":"open_problem","kourovka":{"mark":"open","num":"19.83"},"notes":["Kourovka 21, problem 19.83, by P. Shumyatsky. No comment printed. Essentially the same question as 20.89 (also by P. Shumyatsky)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"An element g of a group G is almost Engel if there is a finite set E(g) such that for every x in G all sufficiently long commutators [x, _n g] belong to E(g), that is, for every x in G there is a positive integer n(x, g) such that [x, _n g] in E(g) whenever n >= n(x, g). By a linear group we understand a subgroup of GL(m, F) for some field F and a positive integer m. Is the set of almost Engel elements in a linear group always a subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.83')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_19_106","kind":"open_problem","kourovka":{"mark":"open","num":"19.106"},"notes":["Kourovka 21, problem 19.106, by F. Wagner. No comment printed. Borderline: model-theoretic question; included because uniform local finiteness is a restricted-Burnside-type condition (it forces bounded exponent, since cyclic subgroups have order at most f(1))."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let G be a uniformly locally finite group (which means that there is a function f on the natural numbers such that any subgroup generated by n elements has size at most f(n)). Suppose that for any two definable subgroups H and K, the intersection H cap K has finite index either in H or in K. Is G necessarily nilpotent-by-finite? Or even finite-by-abelian-by-finite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.106')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_19_110","kind":"open_problem","kourovka":{"mark":"open","num":"19.110"},"notes":["Kourovka 21, problem 19.110, by P. Zusmanovich. No comment printed. Relevant as a Burnside-type finiteness question for relatively free groups."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"(G. M. Bergman and A. Magidin). Do there exist varieties of groups in which the relatively free group of rank 2 is finite, and the relatively free group of rank 3 is infinite?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.110')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_19_111","kind":"open_problem","kourovka":{"mark":"open","num":"19.111"},"notes":["Kourovka 21, problem 19.111, by P. Zusmanovich. Printed comment: Note that there exist infinite groups all of whose proper subgroups are infinite cyclic that do not satisfy any nontrivial group identity (due to A. Olshanskii; see P. Zusmanovich, J. Algebra, 388 (2013), 268-286, Remark after Theorem 6.1)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Do there exist infinite groups all of whose proper subgroups are cyclic of order p that do not satisfy any nontrivial group identity except x^p = 1 and its consequences?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('19.111')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kourovka_20_18","kind":"open_problem","kourovka":{"mark":"open","num":"20.18"},"notes":["Kourovka 21, problem 20.18, by A. I. Budkin. No comment printed. Borderline: quasivariety question inside a variety of bounded exponent. pdftotext prints 'Rpk' / 'pk'; read as R_{p^k} and p^k (k >= 2)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Let R_{p^k} be the variety of class 2 nilpotent groups of exponent p^k, where p is a prime number and k >= 2. It is true that for every p and k there are infinitely many subquasivarieties of R_{p^k} each of which is generated by a finite group with derived subgroup of exponent p^k and does not have an independent basis of quasi-identities?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('20.18')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_20_36","kind":"open_problem","kourovka":{"mark":"open","num":"20.36"},"notes":["Kourovka 21, problem 20.36, by G. Havas, M. F. Newman. No comment printed. Exponents 2^69 and 2^32 confirmed as superscripts from PDF word positions (pdftotext -bbox); '105' is printed at normal size, i.e. the number 105."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"The free Burnside group of exponent four on three generators, B(3, 4), has order 2^69 as shown by Bayes, Kautsky, and Wamsley (1974). Their proof is based on a theorem of Sanov (1940) which shows that B(n, 4) is finite. Sanov's proof for B(3, 4) uses more than 2^32 fourth powers, because the subgroup of B(3, 4) generated by two of its generators and the square of the third has order 2^32. It is also known that B(3, 4) needs at least 105 relations to define it, as shown by Havas and Newman (1980). a) Can B(3, 4) be defined with fewer than a million fourth powers? b) Can B(3, 4) be defined with fewer than a thousand fourth powers? c) What is the smallest number of fourth powers which define B(3, 4)?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('20.36')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"kourovka_20_42","kind":"open_problem","kourovka":{"mark":"open","num":"20.42"},"notes":["Kourovka 21, problem 20.42, by S. Kionke. No comment printed. Borderline: groups satisfying a law; Burnside groups of large exponent are the standard non-amenable examples with a law, but those are not residually finite."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"(Y. Cornulier, A. Mann, A. Thom). Does there exist a finitely generated residually finite group that is not (elementary) amenable and satisfies a nontrivial group law?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('20.42')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"kourovka_20_43","kind":"open_problem","kourovka":{"mark":"open","num":"20.43"},"notes":["Kourovka 21, problem 20.43, by S. Kionke, E. Schesler. No comment printed. Borderline: groups satisfying a law (e.g. x^n = 1) and amenability."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Is every family of finite groups satisfying a common group law uniformly amenable?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('20.43')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_20_48","kind":"open_problem","kourovka":{"mark":"open","num":"20.48"},"notes":["Kourovka 21, problem 20.48, by M. Lewis. No comment printed. Borderline: finite p-group question whose conclusion is exponent p."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"Suppose that P is a finite p-group with a non-trivial partition (which is equivalent to having proper Hughes subgroup H_p(P) := <g in P | g^p != 1> != P). If P admits a fixed-point-free automorphism of prime order, must P be of exponent p?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('20.48')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_20_49","kind":"open_problem","kourovka":{"mark":"open","num":"20.49"},"notes":["Kourovka 21, problem 20.49, by A. Lucch a 21, problem 20.89, by P. Shumyatsky. Printed comment: A linear group in which all elements are almost Engel is finite-by-hypercentral (P. Shumyatsky, Monatsh. Math., 186 (2018), 711-719). Cf. 19.83 (same question)."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"An element g of a group G is said to be almost Engel if there is a finite subset E(g) of G such that for every x in G all sufficiently long commutators [...[[x, g], g], ..., g] belong to E(g), that is, there is a positive integer n(x, g) such that [...[[x, g], g], ..., g] in E(g) if g is repeated >= n(x, g) times. An element g is Engel if we can take E(g) = {1}. The set of Engel elements of a linear group is a subgroup by a well-known result of Gruenberg (J. Algebra, 3 (1966), 291-303). Is the set of almost Engel elements of a linear group a subgroup?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('20.89')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kourovka_20_93","kind":"open_problem","kourovka":{"mark":"open","num":"20.93"},"notes":["Kourovka 21, problem 20.93, by A. I. Sozutov. No comment printed."],"precheck":{"class":"untouched","summary":"No claimed solution found in the four sweeps."},"rules":[],"says":"A group G is called a Shunkov group if for any finite subgroup H <= G any two conjugate elements of prime order in N_G(H)/H generate a finite subgroup. Are the following well-known results of the theory of finite groups true in the class of (periodic) Shunkov groups? a) The Baer-Suzuki theorem (see 11.11 in Archive). b) The Burnside-Brauer-Suzuki theorem on the existence of a normal section of order 2 in a group with a non-trivial Sylow 2-subgroup containing only one involution (see 4.75). c) Glauberman's Z*-theorem (se orsion group was such a homomorphic image for every U, and so would give positive answers to both parts of 21.11. Solved: No, it need not (S. M. Corson, J. Algebra, 681 (2025), 306-317). Borderline: torsion groups enter only as a consequence. Formulas Z^omega/U and the ultraproduct were garbled by pdftotext and reconstructed."],"precheck":{"class":"solved","summary":"Kourovka 21 (arXiv:1401.0300v50): No (Corson, J. Algebra 681, 2025)."},"rules":[],"says":"Suppose that U is a nonprincipal ultrafilter on omega, and B is a group such that every element b in B belongs to a subgroup of B that is a homomorphic image of Z^omega/U. Must B then be a homomorphic image of an ultraproduct group prod_{i in omega} G_i/U for some groups G_i?","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('21.12')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kourovka_21_54","kind":"open_problem","kourovka":{"mark":"open","num":"21.54"},"notes":["Kourovka 21, problem 21.54, by A. N. Grishkov, A. V. Zavarnitsine. Printed comment: An affirmative answer would provide a reduction of the analogue of the Restricted Burnside Problem for Moufang loops to the nilpotent case. pdftotext prints 'm · mrho · mrho' with the superscript 2 on the last rho dropped; PDF word positions (pdftotext -bbox) confirm it, so the condition is m * m^rho * m^(rho^2) = 1."],"precheck":{"class":"candidate_only","summary":"Only a 'vibemathing' GitHub repo describing itself as candidate research; no solution claim seen."},"rules":[],"says":"Let G be a finite soluble group with triality, which means that G admits a group of automorphisms S isomorphic to the symmetric group of degree 3 given by the presentation S = <sigma, rho | sigma^2 = rho^3 = 1; sigma rho sigma = rho^2> such that m * m^rho * m^(rho^2) = 1 for all m in
