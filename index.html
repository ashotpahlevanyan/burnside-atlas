<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive map of theorems, lemmas and open problems around the Burnside problem in group theory, with proofs drawn as paths.">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
</style>
<title>Burnside Theorem Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one-screen app. Header bar; graph canvas left, reading panel right (stacked on phones). */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --ink: #161a2e;
  --muted: #5b6283;
  --line: #dde1ee;
  --edge: #b9bfd6;
  --accent: #3446d4;
  --accent-soft: #e3e6fb;
  --halo: #f6f7fb;
  --k-definition: #7a8199;
  --k-theorem: #3446d4;
  --k-lemma: #0f8a83;
  --k-corollary: #2b8fd6;
  --k-computation: #c27a12;
  --k-open: #d2405f;
  --k-claim: #9a54c9;
  --k-conjecture: #b15ab8;
  --k-example: #4b9a3c;
  --t-strong: #1f7a4c;
  --t-mid: #0f8a83;
  --t-weak: #b7791f;
  --t-memory: #c25a1c;
  --t-bad: #c7353f;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-math: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --panel-w: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --surface: #171b2e; --ink: #e7e9f5; --muted: #9aa1c2; --line: #2a3050;
    --edge: #3a4166; --accent: #8c9bff; --accent-soft: #252c55; --halo: #0f1220;
    --k-definition: #9aa1bd; --k-theorem: #8c9bff; --k-lemma: #3cc4b8; --k-corollary: #5fb6f2;
    --k-computation: #e8a43a; --k-open: #f2718c; --k-claim: #c18ae8; --k-conjecture: #d58ad8; --k-example: #7cc46a;
    --t-strong: #5fd39a; --t-mid: #3cc4b8; --t-weak: #e8b04a; --t-memory: #f08a4d; --t-bad: #f26b73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #171b2e; --ink: #e7e9f5; --muted: #9aa1c2; --line: #2a3050;
  --edge: #3a4166; --accent: #8c9bff; --accent-soft: #252c55; --halo: #0f1220;
  --k-definition: #9aa1bd; --k-theorem: #8c9bff; --k-lemma: #3cc4b8; --k-corollary: #5fb6f2;
  --k-computation: #e8a43a; --k-open: #f2718c; --k-claim: #c18ae8; --k-conjecture: #d58ad8; --k-example: #7cc46a;
  --t-strong: #5fd39a; --t-mid: #3cc4b8; --t-weak: #e8b04a; --t-memory: #f08a4d; --t-bad: #f26b73;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden;
}
header, main, #stage, aside, .toggles, .search { min-width: 0; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.search { position: relative; flex: 1 1 240px; max-width: 360px; }
.search input {
  width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit;
}
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.results {
  position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.16);
  max-height: 320px; overflow-y: auto;
}
.results button { display: block; width: 100%; text-align: left; padding: 6px 8px; border: 0; border-radius: 5px; background: none; color: var(--ink); font: inherit; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--accent-soft); outline: none; }
.results .rid { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.results .rtx { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer;
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#graph { display: block; width: 100%; height: 100%; cursor: grab; }
#graph:active { cursor: grabbing; }
.legend {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: grid; gap: 6px;
  padding: 10px 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px;
  font-size: 12px; color: var(--muted); max-width: calc(100% - 24px);
}
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.legend .sw { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.ring { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--muted); box-sizing: border-box; }
.ring.dashed { border-style: dashed; }
.zoomctl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button {
  width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
  font: inherit; font-size: 16px; cursor: pointer;
}
.zoomctl button:focus-visible { outline: 2px solid var(--accent); }

/* graph marks */
.edge { fill: none; stroke: var(--edge); stroke-width: 1; opacity: 0.75; }
.edge.soft { stroke-dasharray: 3 3; }
.node .dotc { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.node.st-weak .dotc { stroke-dasharray: 2.5 2; stroke: var(--muted); }
.node.st-bad .dotc { stroke: var(--t-bad); stroke-width: 2.5; stroke-dasharray: 3 2; }
.node text, .plabel {
  font-family: var(--font-ui); font-size: 10.5px; fill: var(--ink); pointer-events: none;
  paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round;
}
.node .lbl { display: none; }
.node.labelled .lbl, .node.hl .lbl, .node.sel .lbl { display: block; }
.dimmed .edge { opacity: 0.08; }
.dimmed .node { opacity: 0.16; }
.dimmed .node.hl, .dimmed .node.sel { opacity: 1; }
.dimmed .edge.hl { opacity: 0.95; stroke: var(--accent); stroke-width: 1.6; }
.node.sel .dotc { stroke: var(--ink); stroke-width: 3; stroke-dasharray: none; }
.node.hl text, .node.sel text { font-weight: 600; font-size: 12px; }
.pedge { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
.pedge.assume { stroke: var(--k-open); stroke-dasharray: 6 5; }
.pstep { font-family: var(--font-mono); font-size: 10px; fill: var(--surface); pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.pstep-bg { fill: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .pedge { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 0.9s ease-out forwards; }
  .pedge.assume { stroke-dasharray: 6 5; stroke-dashoffset: 0; animation: none; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}

/* panel */
aside {
  border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-width: 0;
  padding-block: 16px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.hyps { display: flex; flex-direction: column; gap: 4px; }
.hyp {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; text-align: left;
  padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--ink); font: inherit; cursor: pointer;
}
.hyp:hover { background: var(--bg); }
.hyp[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.hyp:focus-visible { outline: 2px solid var(--accent); }
.hyp .q { font-family: var(--font-math); font-size: 14.5px; min-width: 0; }
.verdict { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.v-proved { color: var(--t-strong); background: color-mix(in srgb, var(--t-strong) 14%, transparent); }
.v-refuted { color: var(--t-bad); background: color-mix(in srgb, var(--t-bad) 14%, transparent); }
.v-unknown { color: var(--t-weak); background: color-mix(in srgb, var(--t-weak) 16%, transparent); }
.v-contradiction { color: var(--t-bad); background: color-mix(in srgb, var(--t-bad) 22%, transparent); }
.card { display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: var(--font-math); font-weight: 600; font-size: 21px; line-height: 1.3; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.kind { color: var(--surface); border-color: transparent; font-weight: 500; }
.trust-strong { color: var(--t-strong); border-color: color-mix(in srgb, var(--t-strong) 45%, transparent); }
.trust-mid { color: var(--t-mid); border-color: color-mix(in srgb, var(--t-mid) 45%, transparent); }
.trust-weak { color: var(--t-weak); border-color: color-mix(in srgb, var(--t-weak) 45%, transparent); }
.trust-memory { color: var(--t-memory); border-color: color-mix(in srgb, var(--t-memory) 45%, transparent); }
.trust-bad { color: var(--t-bad); border-color: color-mix(in srgb, var(--t-bad) 45%, transparent); }
.idtag { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.statement { font-family: var(--font-math); font-size: 16.5px; line-height: 1.55; margin: 0; max-width: 62ch; }
.cite { font-size: 13px; color: var(--muted); margin: 0; }
.cite i { color: var(--ink); }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.rules li { font-family: var(--font-mono); font-size: 12px; padding: 7px 9px; background: var(--bg); border-radius: 6px; overflow-wrap: anywhere; }
.links { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.links li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.how { font-size: 11px; color: var(--muted); min-width: 78px; flex: none; }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: none; font: inherit; font-family: var(--font-mono); font-size: 12.5px; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.lnk:hover { text-decoration: underline; }
.lnk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  padding: 7px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
}
.btn.ghost { background: none; color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 500; }
.note { font-size: 13px; color: var(--ink); margin: 8px 0 0; overflow-wrap: anywhere; }
.kour { padding: 10px 12px; border-radius: 8px; background: var(--bg); font-size: 13px; display: grid; gap: 4px; }
/* proof tree */
.tree, .tree ol { list-style: none; margin: 0; padding: 0; }
.tree ol { margin-left: 13px; padding-left: 13px; border-left: 1.5px solid var(--line); }
.tree li { padding: 5px 0 0; }
.step { display: grid; gap: 2px; }
.step .s { font-family: var(--font-math); font-size: 15px; line-height: 1.4; }
.step .by { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.step .chk { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.step.assumed { border: 1.5px dashed var(--k-open); border-radius: 6px; padding: 6px 8px; }
.step.assumed .s::before { content: "Assumed: "; color: var(--k-open); font-family: var(--font-ui); font-size: 12px; font-weight: 600; }
.num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--surface); font-size: 10.5px; font-family: var(--font-mono); flex: none; }
.option { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.option[aria-current="true"] { border-color: var(--accent); }
.muted { color: var(--muted); }
.explain { font-size: 13px; color: var(--muted); margin: 0; max-width: 62ch; }

/* Phones and narrow tablets: fixed split screen. Graph stays in the top half,
   the description scrolls on its own in the bottom half. */
@media (max-width: 860px) {
  header { gap: 8px; padding-block: 8px; }
  .brand h1 { font-size: 15.5px; }
  .brand .sub { display: none; }
  .search { flex: 1 1 100%; max-width: none; }
  .toggles { flex-wrap: nowrap; overflow-x: auto; flex: 1 1 100%; max-width: 100%; padding-bottom: 2px; scrollbar-width: none; }
  .search input { font-size: 16px; }  /* below 16px iOS Safari zooms the page on focus */
  html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
  .toggles::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 50fr) minmax(0, 50fr); }
  #stage { border-bottom: 1px solid var(--line); }
  aside { border-left: 0; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 14px; }
  .legend { font-size: 10.5px; padding: 6px 8px; gap: 3px; bottom: 8px; left: max(8px, env(safe-area-inset-left, 0px)); }
  .legend .row + .row { display: none; }
  .zoomctl { right: max(8px, env(safe-area-inset-right, 0px)); top: 8px; }
  .zoomctl button { width: 36px; height: 36px; }
  .card h2 { font-size: 19px; }
}
/* Touch: a larger invisible hit area around each node. */
.node .hit { fill: transparent; stroke: none; cursor: pointer; }
</style>

</head>
<body>
<header>
  <div class="brand"><h1>Burnside Theorem Atlas</h1><span class="sub" id="counts"></span></div>
  <div class="search">
    <label for="q" class="eyebrow" style="position:absolute;left:-9999px">Search theorems</label>
    <input id="q" type="search" placeholder="Search theorems, e.g. Zelmanov, 557, Engel" autocomplete="off">
    <ul class="results" id="results" hidden></ul>
  </div>
  <div class="toggles" id="toggles"></div>
</header>

<main>
  <div id="stage">
    <svg id="graph" role="img" aria-label="Graph of theorems and their dependencies"></svg>
    <div class="zoomctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Fit graph" title="Fit">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

 discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"from_memory"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"restricted_burnside_problem","kind":"open_problem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Is there, for given m and n, an upper bound on the orders of finite m-generated groups of exponent n (i.e. does R(m,n) exist)?","source":{"authors":["P. Hall","G. Higman"],"locator":"unknown","ref":"hall_higman1956","title":"On the p-length of p-soluble groups and reduction theorems for Burnside's problem","venue":"Proc. London Math. Soc. (3) 6","year":"1956"},"status":"from_memory"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"b25_problem","kind":"open_problem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Is B(2,5) finite? Open. Equivalent to B(2,5) = R(2,5), of order 5^34.","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"from_memory"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order(b(m,1))","value":"1"}],"id":"b_m_1","kind":"theorem","kourovka":null,"notes":["Proof: every element satisfies x^1 = x = 1, so B(m,1) = F_m / F_m is trivial."],"precheck":null,"rules":["|B(m,1)| = 1  IF  m>=1","every finitely generated group of exponent 1 is finite"],"says":"B(m,1) is trivial.","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order(b(m,2))","value":"2^m"}],"id":"b_m_2","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":["|B(m,2)| = n  IF  m>=1,n is 2^m","every finitely generated group of exponent 2 is finite"],"says":"B(m,2) is elementary abelian of order 2^m.","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"bounded_verified"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order(b(m,3))","value":"3^(m+binom(m,2)+binom(m,3))"},{"quantity":"order(b(2,3))","value":"3^3"},{"quantity":"order(b(3,3))","value":"3^7"}],"id":"b_m_3","kind":"theorem","kourovka":null,"notes":["Finiteness due to Burnside (1902); exact order Levi-van der Waerden (1933)."],"precheck":null,"rules":["|B(m,3)| = n  IF  m>=1,n is 3^(m+m*(m-1)//2+m*(m-1)*(m-2)//6)","every finitely generated group of exponent 3 is finite","B(m,3) is nilpotent of class at most 3  IF  integer(m),m>=1"],"says":"B(m,3) is finite of order 3^(m + C(m,2) + C(m,3)) and nilpotent of class at most 3 (class 3 for m >= 3).","source":{"authors":["F. Levi","B. L. van der Waerden"],"locator":"unknown","ref":"levi_vdw1933","title":"Über eine besondere Klasse von Gruppen","venue":"Abh. Math. Sem. Univ. Hamburg 9","year":"1933"},"status":"bounded_verified"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"sanov_n4","kind":"theorem","kourovka":null,"notes":["VERIFIED 2026-11-15. (1) Adian 2010 survey, p. 6: \"В работе [2] И. Н. Санов доказал конечность при n = 4 для любых m.\" (2) zbMATH review Zbl 0306.20045: \"Ce problème a trouvé une solution positive pour n=1,2,3 [Burnside, 1902], n=4 [I. N. Sanov, … (1940; Zbl 0061.02506; JFM 66.0085.02)]\". Original: Uchenye Zapiski Leningr. Gos. Univ., Ser. Mat. Nauk 10 (55), 166-170 (1940)."],"precheck":null,"rules":["every finitely generated group of exponent 4 is finite"],"says":"B(m,4) is finite for every m.","source":{"authors":["I. N. Sanov"],"locator":"unknown","ref":"sanov1940","title":"Solution of Burnside's problem for exponent four (Russian)","venue":"Uchenye Zapiski Leningr. Gos. Univ., Ser. Mat. Nauk 10 (55), 166-170; Zbl 0061 tes":["Dates in sources: 1958 (announcement), 1959 (Izv. paper); related 1956 Doklady note on Engel Lie rings."],"precheck":null,"rules":["R(m,n) exists (largest finite m-generated group of exponent n)  IF  m>=1,prime(n)"],"says":"R(m,p) exists for every prime p (restricted Burnside problem for prime exponent).","source":{"authors":["A. I. Kostrikin"],"locator":"unknown","ref":"kostrikin1959","title":"The Burnside problem","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 23","year":"1959"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"hall_higman_reduction","kind":"theorem","kourovka":null,"notes":["Reduction to prime-power exponent (1956) confirmed. The exact role of the Schreier conjecture / CFSG is from memory and one secondary source; confirm.","Second source (this task): https://arxiv.org/abs/2411.00669 Sec. 2.2. Quote: \"Using a result of Hall and Higman [19] (and the classification of finite simple groups), the restricted Burnside problem reduces to the case of B(r, pk )\"."],"precheck":null,"rules":[],"says":"Modulo the Schreier conjecture (now a consequence of CFSG), the restricted Burnside problem for exponent n reduces to prime-power exponents dividing n.","source":{"authors":["P. Hall","G. Higman"],"locator":"unknown","ref":"hall_higman1956","title":"On the p-length of p-soluble groups and reduction theorems for Burnside's problem","venue":"Proc. London Math. Soc. (3) 6","year":"1956"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"zelmanov_rbp","kind":"theorem","kourovka":null,"notes":["Odd prime powers 1990, 2-power exponents 1991 (Mat. Sb.). Fields Medal 1994."],"precheck":null,"rules":["R(m,n) exists (largest finite m-generated group of exponent n)  IF  m>=1,n>=1"],"says":"R(m,n) exists for all m, n (restricted Burnside problem solved positively).","source":{"authors":["E. I. Zelmanov"],"locator":"unknown","ref":"zelmanov1990","title":"Solution of the restricted Burnside problem for groups of odd exponent","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 54:1 (1990) 42-59, 221","year":"1990"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order(r(2,5))","value":"5^34"},{"quantity":"class(r(2,5))","value":"12"}],"id":"r25_order","kind":"computation","kourovka":null,"notes":["Order 5^34 restated in Newman-O'Brien preprint https://www.math.auckland.ac.nz/~obrien/research/burnside.pdf Sec. 7.1. Quote: \"A consistent power-conjugate presentation for R(2, 5), a group of order 5^34 , can be computed using the default implementation in 6 seconds.\" Class 12: groupprops wiki https://groupprops.subwiki.org/wiki/Restricted_Burnside_group:RB(2,5) lists nilpotency class 12 and prime-base log of order 34 (a wiki without citation). Consistent with the HNVL bound 6k = 12 for k = 2 (https://zbmath.org/?q=an:0716.17001). HWW 1974 record (https://zbmath.org/?q=an:0277.20025) has no review text: Bull. Aust. Math. Soc. 10, 459-470.","VERIFIED 2026-11-15 (class 12 now sourced). (1) Havas-Wall-Wamsley 1974, abstract (https://www.cambridge.org/core/journals/bulletin-of-the-australian-mathematical-society/article/two-generator-restricted-burnside-group-of-exponent-five/8902E4C05B79E936F72BE8A370C623EC): \"The two generator restricted Burnside group of exponent five is shown to have order 5^34 and class 12 by two independent methods.\" (2) Vaughan-Lee, arXiv:2008.06848, sec. 2: \"The group R(2, 5) has order 5^34 and nilpotency class 12.\" The groupprops wiki source is superseded."],"precheck":null,"rules":["|R(2,5)| = m  IF  m is 5^34","R(2,5) has nilpotency class 12"],"says":"|R(2,5)| = 5^34 and R(2,5) has nilpotency class 12.","source":{"authors":["G. Havas","G. E. Wall","J. W. Wamsley"],"locator":"unknown","ref":"hww1974","title":"The two generator restricted Burnside group of exponent five","venue":"Bull. Austral. Math. Soc. 10, 459-470; Zbl 0277.20025","year":"1974"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order(r(3,5))","value":"5^2282"},{"quantity":"class(r(3,5))","value":"17"}],"id":"r35_order","kind":"computation","kourovka":null,"notes":["Upper bound 5^2282: Newman-Vaughan-Lee. Havas-Newman-Vaughan-Lee 1990: associated Lie ring W(3,5) has dimension 2282, class 17; Vaughan-Lee 1990 deduced |R(3,5)| = 5^2282. Newman-O'Brien 1996 gave a pc presentation and checked exponent 5 (24062 normal words). Confirmed on Vaughan-Lee's publication page."],"precheck":null,"rules":["|R(3,5)| = m  IF  m is 5^2282"],"says":"|R(3,5)| = 5^2282.","source":{"authors":["M. R. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1990b","title":"Order of R(3,5) is 5^2282 (TITLE UNKNOWN)","venue":"unknown","year":"1990"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order(r(2,7))","value":"7^20416"},{"quantity":"class(r(2,7))","value":"28"}],"id":"r27_order","kind":"computation","kourovka":null,"notes":["Lie-ring estimates had predicted class 29 and order 7^20418; the computation gave class 28, 7^20416."],"precheck":null,"rules":["|R(2,7)| = m  IF  m is 7^20416","R(2,7) has nilpotency class 28"],"says":"|R(2,7)| = 7^20416 and R(2,7) has class 28.","source":{"authors":["E. A. O'Brien","M. Vaughan-Lee"],"locator":"unknown","ref":"obrien_vaughanlee2002","title":"The 2-generator restricted Burnside group of exponent 7","venue":"Internat. J. Algebra Comput. 12","year":"2002"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"b_finite_iff_restricted","kind":"lemma","kourovka":null,"notes":["Proof: every finite m-generated group of exponent dividing n is a quotient of B(m,n). If B(m,n) is finite, it is itself such a group and every other one is its quotient, so it is the largest: B(m,n) = R(m,n). Conversely, if B(m,n) = R(m,n), it is finite because R(m,n) is (elem_restricted_finite). R(m,n) exists by Zelmanov (zelmanov_rbp). Reclassified from claim to lemma on 2026-11-15."],"precheck":null,"rules":["|B(m,n)| = d  IF  B(m,n) is finite; R(m,n) exists (largest finite m-generated group of exponent n); |R(m,n)| = d","B(m,n) is nilpotent of class at most d  IF  B(m,n) is finite; R(m,n) is nilpotent of class at most d"],"says":"B(m,n) is finite iff B(m,n) = R(m,n) (since R(m,n) exists by Zelmanov, and a finite B(m,n) is its own largest finite quotient).","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1993","title":"The Restricted Burnside Problem (2nd ed.)","venue":"Oxford Univ. Press","year":"1993"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"golod_shafarevich","kind":"theorem","kourovka":null,"notes":["Construction via associative nil-algebras (of exponential growth)."],"precheck":null,"rules":["there is a finitely generated infinite periodic group"],"says":"There exist finitely generated infinite p-groups (for every prime p). Negative answer to the general Burnside problem.","source":{"authors":["E. S. Golod"],"locator":"unknown","ref":"golod1964","title":"On nil-algebras and finitely approximable p-groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 28","year":"1964"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"grigorchuk_group","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":["there is a finitely generated infinite periodic group"],"says":"The Grigorchuk group is an infinite 2-group generated by three elements of order 2 (a, b, c; the usual fourth generator d = bc), acting on the binary rooted tree; it has unbounded exponent and intermediate growth.","source":{"authors":["R. I. Grigorchuk"],"locator":"unknown","ref":"grigorchuk1980","title":"On Burnside's problem on periodic groups","venue":"Funct. Anal. Appl. 14","year":"1980"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"gupta_sidki_group","kind":"theorem","kourovka":null,"notes":["Both generators have order p. Math. Z. venue not yet confirmed."],"precheck":null,"rules":["there is a finitely generated infinite periodic group"],"says":"For each odd prime p there is a 2-generated infinite p-group acting on the p-ary rooted tree (Gupta-Sidki group).","source":{"authors":["N. Gupta","S. Sidki"],"locator":"unknown","ref":"gupta_sidki1983","title":"On the Burnside problem for periodic groups","venue":"Math. Z. 182","year":"1983"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"aleshin_group","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Finite automata generate finitely generated infinite periodic groups (Aleshin's construction).","source":{"authors":["S. V. Aleshin"],"locator":"unknown","ref":"aleshin1972","title":"Finite automata and the Burnside problem for periodic groups","venue":"Mat. Zametki 11","year":"1972"},"status":"from_memory"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"novikov_adian","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":["B(m,n) is infinite  IF  m>=2,odd(n),n>=4381"],"says":"B(m,n) is infinite for m >= 2 and odd n >= 4381.","source":{"authors":["P. S. Novikov","S. I. Adian"],"locator":"unknown","ref":"novikov_adian1968","title":"On infinite periodic groups I, II, III (O beskonechnykh periodicheskikh gruppakh)","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 32","year":"1968"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"na_not_fp_wp","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":["B(m,n) has solvable word problem  IF  m>=2,odd(n),n>=4381","B(m,n) is not finitely presented  IF  m>=2,odd(n),n>=4381"],"says":"For odd n >= 4381 and m > 1, B(m,n) cannot be defined by finitely many relations, and its word problem is solvable.","source":{"authors":["P. S. Novikov","S. I. Adian"],"locator":"unknown","ref":"na1968_defrel","title":"Defining relations and the word problem for free periodic groups of odd order","venue":"Math. USSR-Izv. 2:4 (1968) 935-942, doi:10.1070/IM1968v002n04ABEH000681","year":"1968"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"na_abelian_conj","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":["B(m,n) has solvable conjugacy problem  IF  m>=2,odd(n),n>=4381"],"says":"For odd n >= 4381, every abelian subgroup of B(m,n) is finite (in fact cyclic, per later work), and the conjugacy problem is solvable.","source":{"authors":["P. S. Novikov","S. I. Adian"],"locator":"unknown","ref":"na1968_abelian","title":"On abelian subgroups and the conjugacy problem in free periodic groups of odd order","venue":"Math. USSR-Izv. 2:5 (1968) 1131-1144, doi:10.1070/IM1968v002n05ABEH000722","year":"1968"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_665","kind":"theorem","kourovka":null,"notes":["VERIFIED 2026-11-15. (1) Adian 2010 survey, Uspekhi Mat. Nauk 65:5, p. 7, Theorem 2 (https://www.mathnet.ru/php/getFT.phtml?jrnid=rm&paperid=9376): \"Теорема 2. Для любого нечетного периода n ⩾ 665 и любого числа порождающих m > 1 свободная периодическая группа B(m, n) бесконечна.\", attributed there to the 1975 monograph. (2) zbMATH review of the 1975 monograph, Zbl 0306.20045 (https://zbmath.org/?q=an:0306.20045): \"une réponse negative au problème de Burnside pour tout entier n impair ≥ 665. Ce résultat fondamenal énoncé sous forme de théorème au Chapitre VI, p. 262\". English edition: Ergebnisse 95, 1979, Zbl 0417.20001."],"precheck":null,"rules":["B(m,n) is infinite  IF  m>=2,odd(n),n>=665"],"says":"B(m,n) is infinite for m >= 2 and odd n >= 665.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"checked"},{"caveats":["Adian 2015 only OUTLINES the proof for n >= 101 (STATUS.md); the best fully proved odd bound is n >= 557 (art_557)."],"domain":"adian","facts":[],"id":"adian_101","kind":"theorem","kourovka":null,"notes":["Wikipedia: the 101 claim was never fully published. The abstract says the paper OUTLINES a modification of the Novikov-Adian theory to reach n >= 101. Later literature (Atkarskaya-Rips-Tent; a 2026 arXiv paper) calls n >= 557 the best known bound, so 101 seems not to be regarded as fully proved."],"precheck":null,"rules":["B(m,n) is infinite  IF  m>=2,odd(n),n>=101"],"says":"B(m,n) is infinite for m >= 2 and odd n >= 101.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian2015","title":"New estimates of odd exponents of infinite Burnside groups","venue":"Trudy MIAN 289, 41-82; Engl. Proc. Steklov Inst. Math. 289, doi:10.1134/S0081543815040045","year":"2015"},"status":"checked"},{"caveats":["The KB statement has no m condition; m >= 2 is added because B(1,n) is cyclic."],"domain":"burnside_groups","facts":[],"id":"art_557","kind":"theorem","kourovka":null,"notes":["Rank condition differs between versions (m > 2 in v5 Thm 2.1 vs m >= 2 elsewhere); check the final version.","arXiv:2303.15997v5 abstract (fetched via arXiv API): \"We show that the free Burnside groups B(m,n) are infinite for m >= 2 and odd n >= 557\". So v5's abstract states m >= 2. The follow-ups arXiv:2611.16826 and arXiv:2611.17285 also use m >= 2, n >= 557."],"precheck":null,"rules":["B(m,n) is infinite  IF  m>=2,odd(n),n>=557"],"says":"B(m,n) is infinite for odd n >= 557 (iterated small cancellation theory). Called the best known lower bound for odd exponents.","source":{"authors":["A. Atkarskaya","E. Rips","K. Tent"],"locator":"thm(2.1)","ref":"atkarskaya_rips_tent","title":"The Burnside problem for odd exponents","venue":"arXiv:2303.15997","year":"2023"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"bip_two_ranks","kind":"theorem","kourovka":null,"notes":["Only finitely many periodic relations, so this does NOT imply B(m,n) is infinite. Relevant to rank-by-rank frontier analysis at small n."],"precheck":null,"rules":[],"says":"Approximations of B(m,n) using only the first two ranks of periodic relations are infinite for odd n > 120.","source":{"authors":["Beletskiy","I. Ivanov-Pogodaev"],"locator":"unknown","ref":"beletskiy_ivanovpogodaev2024","title":"Combinatorial estimations on Burnside type problems","venue":"Mathematics (MDPI) 12(5), 665, doi:10.3390/math12050665","year":"2024"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"olshanskii_geometric","kind":"theorem","kourovka":null,"notes":["Also: decidable word problem, finite subgroups cyclic. About 30 pages, using graded van Kampen diagrams; lemmas proved by simultaneous induction on the TYPE of a diagram (Vanderbilt notes: good candidate for a second digitization, see vanderbilt_notes)."],"precheck":null,"rules":["B(m,n) is infinite  IF  m>=2,odd(n),n>10^10"],"says":"Geometric (diagrammatic) proof that B(m,n) is infinite for m >= 2 and odd n > 10^10.","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"unknown","ref":"olshanskii1982","title":"On the Novikov-Adian theorem","venue":"Mat. Sb. 118 (1982); Engl. Math. USSR-Sb. 46 (1983)","year":"1982"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"ivanov_even","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":["B(m,n) is infinite  IF  m>=2,n>=2^48,(odd(n);n mod 512=:=0)"],"says":"B(m,n) is infinite for m >= 2 and n >= 2^48 with n odd or divisible by 2^9 (proof ~300 pages).","source":{"authors":["S. V. Ivanov"],"locator":"unknown","ref":"ivanov1994","title":"The free Burnside groups of sufficiently large exponents","venue":"Internat. J. Algebra Comput. 4","year":"1994"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"lysenok_even","kind":"theorem","kourovka":null,"notes":["Encyclopedia of Mathematics says 2^13; primary abstract says 8000. Trust 8000."],"precheck":null,"rules":["B(m,n) is infinite  IF  m>=2,n mod 16=:=0,n>=8000"],"says":"B(m,n) is infinite for m >= 2 and n = 16k >= 8000 (modified Novikov-Adian theory). Combined with Adian's odd case: B(m,n) infinite for all m >= 2, n >= 8000.","source":{"authors":["I. G. Lysenok"],"locator":"unknown","ref":"lysenok1996","title":"Infinite Burnside groups of even period","venue":"Izv. Math. 60","year":"1996"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"b_infinite_large_n","kind":"corollary","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"For m >= 2, B(m,n) is infinite for all sufficiently large n.","source":{"authors":["I. G. Lysenok"],"locator":"unknown","ref":"lysenok1996","title":"Infinite Burnside groups of even period","venue":"Izv. Math. 60","year":"1996"},"status":"from_memory"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"bachmuth_mochizuki_claim","kind":"claim","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Claimed: B(3,5) is infinite. NOT accepted by the community.","source":{"authors":["S. Bachmuth","H. Y. Mochizuki"],"locator":"unknown","ref":"bachmuth_mochizuki","title":"(TITLE UNKNOWN) claimed proof that B(3,5) is infinite","venue":"unknown","year":"1985"},"status":"from_memory"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"burnside_linear","kind":"theorem","kourovka":null,"notes":["Sources differ on whether finite generation is assumed in Burnside's original statement; MacTutor says it is."],"precheck":null,"rules":[],"says":"A (finitely generated) subgroup of GL(k, C) of bounded exponent is finite; order bounded roughly by exponent^(k^2).","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1905","title":"On criteria for the finiteness of the order of a group of linear substitutions","venue":"Proc. London Math. Soc. (2) 3","year":"1905"},"status":"checked"},{"caveats":["The rule applies Schur's theorem (f.g. periodic subgroups of GL(k,C) are finite) to B(m,n), which is f.g. and periodic."],"domain":"burnside_groups","facts":[],"id":"schur_linear","kind":"theorem","kourovka":null,"notes":["Drops the bounded-exponent hypothesis; used for the Jordan-Schur theorem."],"precheck":null,"rules":["B(m,n) has no faithful linear representation over C  IF  B(m,n) is infinite"],"says":"A finitely generated periodic subgroup of GL(k, C) is finite.","source":{"authors":["I. Schur"],"locator":"unknown","ref":"schur1911","title":"Über Gruppen periodischer linearer Substitutionen","venue":"Sitzungsber. Preuss. Akad. Wiss.","year":"1911"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"open_small_exponents","kind":"open_problem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Finiteness of B(2,n) is open for n = 5, 7, 8, 9, ... ; known finite only for n in {1,2,3,4,6}.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1993","title":"The Restricted Burnside Problem (2nd ed.)","venue":"Oxford Univ. Press","year":"1993"},"status":"from_memory"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_word_problem","kind":"theorem","kourovka":null,"notes":["Confirmed via secondary sources (Atabekyan et al.), word AND conjugacy problems."],"precheck":null,"rules":["B(m,n) has solvable word problem  IF  m>=2,odd(n),n>=665"],"says":"For m >= 2 and odd n >= 665, B(m,n) has solvable word problem (and conjugacy problem).","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_abelian_cyclic","kind":"theorem","kourovka":null,"notes":["Secondary sources: finite and abelian subgroups cyclic; centralizers of non-trivial elements cyclic (monograph Ch. 6); centre trivial. 'cyclic of order n' for centralizers is from memory, not yet confirmed."],"precheck":null,"rules":["every abelian subgroup of B(m,n) is cyclic  IF  m>=1,odd(n),n>=665"],"says":"For odd n >= 665, every abelian subgroup of B(m,n) is cyclic; the centralizer of every non-trivial element is cyclic of order n.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_not_fp","kind":"theorem","kourovka":null,"notes":["For n >= 4381 this is Novikov-Adian 1968 (na_not_fp_wp, checked). The n >= 665 version is expected in the monograph; not yet confirmed.","CONFIRMED for n >= 665: Adian 2010 survey (https://www.mathnet.ru/php/getFT.phtml?jrnid=rm&paperid=9376), Theorem 6: \"Свободные бернсайдовы группы B(m, n) при m > 1 и нечетных n ⩾ 665 не могут быть заданы конечным числом определяющих соотношений.\" The survey says the monograph [9] (Adian 1975) proves all results of the 1968 papers for odd n >= 665.","VERIFIED 2026-11-15 (one direct source). Adian 2010 survey, p. 25, Theorem 6 (quoted in the note above). Indirect support: Atkarskaya-Rips-Tent arXiv:2303.15997 (\"the infinite free Burnside groups are not finitely presented\", which gives n >= 665 together with adian_665); McCammond arXiv:math/9809177, Cor. 4.8 (\"For all n ≥ 1260 and all m ≥ 2, the Burnside group B(m, n) is not finitely presented\"). No second source stating n >= 665 directly was found."],"precheck":null,"rules":["B(m,n) is not finitely presented  IF  m>=2,odd(n),n>=665"],"says":"For m >= 2 and odd n >= 665, B(m,n) is not finitely presented.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"adian_identities","kind":"theorem","kourovka":null,"notes":["Free groups of these varieties have continuum cardinality in every finite rank > 1; their finite subgroups are cyclic (later work, Izv. 2017)."],"precheck":null,"rules":[],"says":"The system of two-variable identities [x^(pn), y^(pn)]^n = 1, p ranging over all primes (n odd, n >= 1003), is infinite and irreducible (no identity follows from the others). Hence non-finitely based group varieties exist (answer to B. H. Neumann's question, 1937). Also: a 2-generator group with a countable set of identities can have unsolvable word problem.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1970","title":"Infinite irreducible systems of group identities","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 34; Engl. Math. USSR-Izv. 4:4 (1970) 721-739","year":"1970"},"status":"checked"},{"caveats":[],"domain":"amenability","facts":[],"id":"adian_nonamenable","kind":"theorem","kourovka":null,"notes":["Proved via a random-walk criterion (Kesten-type: from memory, unconfirmed). A 2025 arXiv paper attributes to Adian that the symmetric random walk on B(m,n) is transient. Osin 2004: uniformly non-amenable for large odd n.","Adian 2010 survey, Theorem 12: (1) non-amenable and (2) symmetric random walk not recurrent, for m >= 1 (sic) and odd n >= 665, proved in the 1982 paper; recurrence answers Kesten 1959. Lemma 8 there: a Dehn presentation with convergence speed >= 228 and relative speed >= 1/3 was used to bound the spectral radius. See new items adian_transient_random_walk, adian_dehn_presentation. Preprint arXiv:2611.16826 claims n >= 557."],"precheck":null,"rules":["B(m,n) is non-amenable  IF  m>=2,odd(n),n>=665"],"says":"For m >= 2 and odd n >= 665, B(m,n) is non-amenable. Since it has no free subgroups, this refutes the von Neumann(-Day) conjecture.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1982","title":"Random walks on free periodic groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 46 (1982); Engl. Math. USSR-Izv. 21:3 (1983) 425-434","year":"1982"},"status":"checked"},{"caveats":[],"domain":"cgt","facts":[],"id":"adian_rabin","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Every Markov property of finitely presented groups is algorithmically undecidable (Adian 1955-57, Rabin 1958).","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1955","title":"Algorithmic unsolvability of problems of recognition of certain properties of groups","venue":"Dokl. Akad. Nauk SSSR 103","year":"1955"},"status":"from_memory"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_method_overview","kind":"claim","kourovka":null,"notes":["Placeholder. Chapter/lemma structure must be taken from the book, not from memory."],"precheck":null,"rules":[],"says":"Proof by simultaneous induction on rank alpha: periods of rank alpha, elementary words, and transformations of rank alpha are defined; relations A^n = 1 for periods A of rank alpha are introduced at stage alpha; numerous lemmas on overlaps of periodic words and on the reduction of words are proved simultaneously, all relying on n being large.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"from_memory"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_parameters","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I preamble, p. 9 (before §1). Also fixes logical notation (quantifiers, &, v, not, =>, <=>) and a symbol for equality by definition."],"precheck":null,"rules":[],"says":"Fixed throughout Chapters I-VI: an integer m > 1 (number of generators) and an odd number n >= 665 (the exponent). Fixed numerical parameters: p = 9, p1 = 17, q1 = 2*p1 + 3 = 37, q2 = q1 + p1 = 54, q = q2 + 2*p1 + 2 = 90.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.0'),page(9)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_1_0_words","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1, p. 9. Words are not freely reduced by default; == is letter-by-letter identity."],"precheck":null,"rules":[],"says":"Words are taken in the group alphabet (1): a_1, ..., a_m, a_1^-1, ..., a_m^-1. The empty word is denoted Lambda. X == Y denotes graphical coincidence [графическое совпадение] of words X and Y.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1'),page(9)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_1_1","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1, pp. 9-10. Length is written with the symbol ∂."],"precheck":null,"rules":[],"says":"Letters a_i and a_i^-1 are mutually inverse [взаимно обратные]. For A == b_1 b_2 ... b_r (letters of alphabet (1)) the inverse word A^-1 is b_r^-1 ... b_2^-1 b_1^-1, with (a_i^-1)^-1 = a_i. If A == DE then A^-1 == E^-1 D^-1. d(A) denotes the length of A (number of letters); d(Lambda) = 0.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1.1'),page(9)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_1_2","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1, p. 10."],"precheck":null,"rules":[],"says":"A word E occurs in [входит в] a word X if X == R E Q for some words R, Q; if R (resp. Q) is empty, E is a beginning [начало] (resp. end [конец]) of X. Of any two beginnings of a word one is a beginning of the other; likewise for ends.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1.2'),page(10)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_occurrence","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1.2, p. 10. Occurrences distinguish different positions of the same subword."],"precheck":null,"rules":[],"says":"Occurrence [вхождение]: if X == R E Q (X over an alphabet without the letter *), the word R*E*Q is called an occurrence of E in X. For V = R*E*Q, V^-1 is the occurrence Q^-1*E^-1*R^-1. E is the base [основа] of R*E*Q, written E = Осн(V). Only occurrences with non-empty base are considered; the occurrence *E* is identified with the word E. Letters U, V, W denote occurrences.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1.2'),page(10)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_1_3","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1, p. 10. These relations are defined only for occurrences in one and the same word."],"precheck":null,"rules":[],"says":"For two occurrences P*E*Q and R*D*S in the same word (PEQ == RDS): P*E*Q is contained [содержится] in R*D*S if d(R) <= d(P) and d(S) <= d(Q); if moreover P == R (resp. Q == S) it is a beginning (resp. end) of R*D*S. They intersect [пересекаются] if some occurrence with non-empty base is contained in both; the longest such is their common part [общая часть] or intersection [пересечение]. If one is contained in the other, the common part is the smaller one.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1.3'),page(10)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_1_3_order","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1.3, p. 11."],"precheck":null,"rules":[],"says":"P*E*Q lies to the left [расположено левее] of R*D*S, written P*E*Q < R*D*S, if d(P) < d(R) and d(S) < d(Q); it lies strictly to the left [строго левее], written P*E*Q << R*D*S, if PE is a beginning of R. Facts: if V < W then neither contains the other, and conversely if neither contains the other then V < W or W < V; if V << W they do not intersect, and conversely non-intersecting occurrences satisfy V << W or W << V.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1.3'),page(11)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_1_3_union","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1.3, p. 11."],"precheck":null,"rules":[],"says":"The union [объединение] of two occurrences in the same word is the shortest (by base length) occurrence containing both. If P*E*Q is contained in R*D*S the union is R*D*S; if P*E*Q < R*D*S then P*E*Q is a beginning and R*D*S an end of the union.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1.3'),page(11)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_1_4","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §1, p. 11. phi moves a sub-occurrence of one copy of E to the corresponding position in another copy."],"precheck":null,"rules":[],"says":"Transfer of occurrences: let P*E*Q and P1*E*Q1 be occurrences (same base E) in words X and Y, and V = R*C*S an occurrence in X contained in P*E*Q, so R == PA, S == BQ, E == ACB. Then phi(V; P*E*Q, P1*E*Q1) denotes the occurrence P1A*C*BQ1 in Y. For W, W1 with equal base, V -> phi(V; W, W1) is a bijection from occurrences contained in W onto those contained in W1; it is inverted by phi(.; W1, W), composes (phi(phi(V1;W1,W2);W2,W3) = phi(V1;W1,W3)), and preserves <, << , common parts and unions.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.1.4'),page(11)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_power","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 11."],"precheck":null,"rules":[],"says":"For integer t > 0, A^t is A repeated t times; for t < 0, A^t is (A^-1)^-t; A^0 is the empty word Lambda.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2'),page(11)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_periodic_word","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 12 (unnumbered, before 2.1). Note the length condition: strictly more than two full periods."],"precheck":null,"rules":[],"says":"A periodic word with period A [периодическое слово с периодом A] is a word A1 A^t A2 where A2 is a beginning of A, A1 is an end of A, and d(A1 A^t A2) > 2 d(A). Пер(A) is the set of all such words. If A1 (resp. A2) is empty, A is a left (resp. right) period [левый (правый) период] of the word. If A == B^r then Пер(A) is a subset of Пер(B).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2'),page(12)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_1","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 12."],"precheck":null,"rules":[],"says":"B is a cyclic shift [циклический сдвиг] of A if A == PQ and B == QP for some P, Q. Then Пер(A) = Пер(B). If X is in Пер(A), B occurs in X and d(B) = d(A), then B is a cyclic shift of A.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.1'),page(12)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_2","kind":"lemma","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 12. Proof by induction on d(AB)."],"precheck":null,"rules":[],"says":"If AB == BA then A == D^t and B == D^r for some word D and some t, r >= 0.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.2'),page(12)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_3","kind":"lemma","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 12. A Fine-Wilf type statement with the bound d(A)+d(B); proved by reduction to 2.2."],"precheck":null,"rules":[],"says":"If A^t A' == B^r B', where A' is a beginning of A, B' is a beginning of B and d(A^t A') >= d(AB), then A == D^k and B == D^s for some word D and some k, s.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.3'),page(12)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_4","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 12. The constant 8 is read from the page image."],"precheck":null,"rules":[],"says":"For X in Пер(A), an occurrence P*E*Q in X is internal with respect to the period A [внутреннее относительно периода A] if d(P) >= 8 d(A) and d(Q) >= 8 d(A). The set of these is Внутр(X, A).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.4'),page(12)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_5","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §2, pp. 12-13. F and G may be empty; r = 0 gives W == V."],"precheck":null,"rules":[],"says":"For X in Пер(A) and arbitrary words F, G, two occurrences V = FP*E*QG and W = FR*E*SG in the same word FXG (same base E) correspond in phase with respect to the period A [соответствующие по фазе относительно периода A] if d(R) - d(P) = r d(A) for some integer r. If r > 0 (r < 0), W is the result of shifting V right (left) by r periods A [результат сдвига]. The predicate is written Соот_A(V, W); it is symmetric and transitive.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.5'),page(12)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_6","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 13."],"precheck":null,"rules":[],"says":"Phase correspondence extended to different periodic words with the same period: occurrences P*E*Q in X and R*E*S in Y, with X, Y in Пер(A), correspond in phase if one of P, R is an end of the other and one of Q, S is a beginning of the other. For two occurrences in one X in Пер(A), Соот_A(U, V) implies correspondence in this sense (taking Y == X).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.6'),page(13)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_7","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 13. 'Simple' = primitive word in modern terminology. The existence claim is proved by induction on d(A)."],"precheck":null,"rules":[],"says":"A word A is simple [простое] if it is not of the form D^r with r > 1. Every non-empty A can be written A == B^t with B simple and t >= 1.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.7'),page(13)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_8","kind":"lemma","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 13. Proof reduces to B a single letter."],"precheck":null,"rules":[],"says":"If AB is a simple word then BA is a simple word (simplicity is invariant under cyclic shift).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.8'),page(13)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_2_9","kind":"lemma","kourovka":null,"notes":["Adian 1975, Ch. I §2, p. 13."],"precheck":null,"rules":[],"says":"Let A^t A1 == B^r B1 with d(A^t A1) >= d(AB), A1 a beginning of A and B1 a beginning of B. If A is simple then B == A^k for some k.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.2.9'),page(13)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_3_0_aperiodic_sequence","kind":"claim","kourovka":null,"notes":["Adian 1975, Ch. I §3, p. 13 (sequence (2)). The section title is 'Aperiodic words' [апериодические слова]; the book does not give a separate formal definition of 'aperiodic word' here beyond the cube-free property of (2)."],"precheck":null,"rules":[],"says":"Goal of §3: construct an infinite sequence t_1, t_2, ... over the two symbols 1, 2 such that for every i no non-empty word of the form E^3 (a cube) occurs in t_1 t_2 ... t_i. The construction follows Arshon [13].","source":{"authors":["S. I. Adian"],"locator":"[sec('I.3'),page(13)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_3_1","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §3, pp. 13-14. Which parity of j gets odd vs even permutation is not spelled out beyond 'depending on the parity of j'; from A_3 = 123 132 312 the first position (j = 1, odd) gets the odd permutation."],"precheck":null,"rules":[],"says":"Arshon's construction over {1,2,3}: odd permutations [нечетные] 123, 231, 312 (numbered by first digit) and even permutations [четные] 321, 132, 213 (numbered by last digit; each is the mirror image of the odd one with the same number). A_1 = 1; A_{i+1} is obtained from A_i = h_1 ... h_r by replacing each digit h_j by the even or odd permutation numbered h_j according to the parity of j. So A_2 = 123, A_3 = 123132312, ...; each A_i is a beginning of A_{i+1}.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.3.1'),page(13)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_3_2","kind":"lemma","kourovka":null,"notes":["Adian 1975, Ch. I §3, pp. 14-15. Induction on i with a case analysis on d(E) mod 3 using the component triples [составляющие тройки] of A_{i+1}: two adjacent triples never have the same parity or the same number."],"precheck":null,"rules":[],"says":"For i >= 1 no non-empty word of the form EE (a square) occurs in A_i.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.3.2'),page(14)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_3_3","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §3, pp. 15-16."],"precheck":null,"rules":[],"says":"Substitution nu: nu(1) = 12, nu(2) = 121, nu(3) = 1221; nu(X) replaces each digit i of X by nu(i), the components [компоненты] of nu(X). Every component begins with 12 and 12 occurs in nu(X) only as the beginning of a component, so nu is injective, and P12Q == nu(X) implies X == nu^-1(P) nu^-1(12Q) (relation (4)).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.3.3'),page(15)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_3_4","kind":"lemma","kourovka":null,"notes":["Adian 1975, Ch. I §3, p. 16. A cube in nu(A_i) is pulled back via (4) to a square in A_i, contradicting 3.2."],"precheck":null,"rules":[],"says":"No non-empty word of the form EEE (a cube) occurs in the words nu(A_i).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.3.4'),page(16)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_3_5","kind":"theorem","kourovka":null,"notes":["Adian 1975, Ch. I §3, p. 16. Existence of an infinite cube-free binary sequence."],"precheck":null,"rules":[],"says":"Since nu(A_i) is a beginning of nu(A_{i+1}) for every i >= 1, extending successively gives the required infinite sequence (2) over {1,2} in which no prefix t_1...t_i contains a non-empty cube E^3.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.3.5'),page(16)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_rank","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 16 (opening paragraph of §4). The whole of §4 is one simultaneous induction on rank alpha; properties stated in §4 without proof are proved in Ch. II-V."],"precheck":null,"rules":[],"says":"Rank [ранг]: a natural-number parameter alpha. By simultaneous induction on alpha [совместной индукцией] the book defines a family of notions for words in alphabet (1) and occurrences in them; the core list is 4a-4f, and further notions of ranks alpha and alpha-1 are defined alongside.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4'),page(16)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4a","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 17. Part of the simultaneous induction on rank alpha. Their definitions for rank alpha are given in 4.21, 4.26 and 4.35; 4a only states the chain of inclusions."],"precheck":null,"rules":[],"says":"For each rank alpha there are sets of words N_a, P_a, R_a, K_a, L_a, M_a, Mbar_a in alphabet (1) with Mbar_a subset M_a subset L_a subset K_a subset R_a subset P_a subset N_a.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.a'),page(17)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4b","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 17. Part of the simultaneous induction on rank alpha. d_alpha (written ∂_α) is the 'length in rank alpha'; at alpha = 0 it is ordinary length (4.1)."],"precheck":null,"rules":[],"says":"Kernel of rank alpha [ядро ранга alpha]: certain occurrences in a word X in N_a are called kernels of rank alpha of X; Я(alpha, X) is the set of them. Я(alpha, X) is totally ordered by < (for distinct kernels U, V: U < V or V < U); kernels may intersect. For an occurrence W in X, d_alpha(W) is the number of kernels of rank alpha of X contained in W.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.b'),page(17)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4c","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 17. Part of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"Regular occurrences of rank alpha [правильные вхождения ранга alpha] in X in N_a are those that begin and end with kernels of rank alpha; their set is Прав(alpha, X). Я(alpha, X) is a subset of Прав(alpha, X).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.c'),page(17)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4d","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 17. Part of the simultaneous induction on rank alpha. Written X ~^alpha Y (tilde with alpha above)."],"precheck":null,"rules":[],"says":"Equivalence in rank alpha [эквивалентность в ранге alpha]: a reflexive, symmetric, transitive relation on P_a. X ~alpha Y means X, Y are in R_a and X is equivalent to Y in rank alpha.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.d'),page(17)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4e","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 17. Part of the simultaneous induction on rank alpha. The rank-alpha analogue of the transfer phi of 1.4 between equivalent words."],"precheck":null,"rules":[],"says":"A function W = f_alpha(V; X, Y), defined when X ~alpha Y, maps Прав(alpha, X) bijectively onto Прав(alpha, Y) and maps kernels of rank alpha of X to kernels of rank alpha of Y. W = f_alpha(V; X, Y) implies V = f_alpha(W; Y, X); if X == Y then f_alpha(V; X, Y) = V.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.e'),page(17)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_mutual_normalization","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4 item 4f, p. 17. Part of the simultaneous induction on rank alpha. Relates regular occurrences in possibly different words. The rank-alpha definition (from ВзНорм_{alpha-1} and rank-alpha cascades/kernels) is given later in §4."],"precheck":null,"rules":[],"says":"4f. Mutual normalization in rank alpha [взаимно нормированы в ранге alpha]: a reflexive, symmetric, transitive relation ВзНорм_alpha(V, W) on the union over X in R_a of Прав(alpha, X). If it holds, V and W are said to be mutually normalized in rank alpha.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.f'),page(17)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_1","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 17-18. Induction base (rank 0) of the simultaneous induction."],"precheck":null,"rules":[],"says":"Base case alpha = 0. A word is irreducible [несократимый] if it contains no a_i a_i^-1 or a_i^-1 a_i; R_0 is the set of irreducible words, and Mbar_0 = M_0 = K_0 = L_0 = R_0 = P_0 = N_0. Kernels of rank 0 of X are the occurrences P*E*Q with E a single letter, so d_0(V) = d(Осн(V)); Прав(0, X) is all occurrences with non-empty base. X ~0 Y iff X == Y, and then f_0(V; X, Y) = V. Occurrences V, W in X, Y in R_0 are mutually normalized in rank 0 iff Осн(V) == Осн(W).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.1'),page(17)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_2","kind":"claim","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 18. Organizational paragraph of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"Induction step: assume alpha > 0 and all notions 4a-4f are defined for ranks < alpha; the rest of §4 defines them for rank alpha, together with auxiliary notions of ranks alpha and alpha-1. Properties are stated without proof (proofs in Ch. II-V); the reader is advised to first think through alpha = 1, for which examples are given.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.2'),page(18)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_3","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 18. Part of the simultaneous induction on rank alpha; uses R_{alpha-1} and kernels of rank alpha-1. Footnote defines cyclically irreducible [циклически несократимый]. Constant 27 read from the page image."],"precheck":null,"rules":[],"says":"Periodic word of rank alpha with period A [периодическое слово ранга alpha с периодом A]: a word X in R_{a-1} with X in Пер(A), d(X) >= 27 d(A), and some kernel V of rank alpha-1 of X with V in Внутр(X, A) and d(Осн(V)) < 2 d(A). Пер(alpha, A) is the set of such words; if it is non-empty, A is a period of rank alpha [период ранга alpha]. Every cyclically irreducible word (A with AA irreducible) is a period of rank 1.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.3'),page(18)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_4","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 18. Part of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"Let X in Пер(alpha, A). A kernel V of rank alpha-1 of X with V in Внутр(X, A) is a supporting kernel of rank alpha-1 [опорное ядро ранга alpha-1] of X. An occurrence in X beginning and ending with supporting kernels of rank alpha-1 is a normal generating occurrence of rank alpha [нормальное порождающее вхождение ранга alpha] in X. (II.1.10: if V is a supporting kernel, W in Внутр(X, A) and Соот_A(V, W), then W is a supporting kernel.)","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.4'),page(18)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_5","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 18-19. Part of the simultaneous induction on rank alpha; uses equivalence in rank alpha-1."],"precheck":null,"rules":[],"says":"Integral word of rank alpha with period A [целое слово ранга alpha с периодом A]: a word Y such that X ~(alpha-1) Y for some X in Пер(alpha, A). Цел(X, alpha, A) is the set of Y with X ~(alpha-1) Y. For alpha = 1, Цел(X, alpha, A) = {X}.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.5'),page(18)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_6","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 19. Part of the simultaneous induction on rank alpha; transports rank-alpha structure from X to Y along f_{alpha-1}. A normal generating occurrence in Y is one beginning and ending with supporting kernels (II.2.1)."],"precheck":null,"rules":[],"says":"For Y in Цел(X, alpha, A): if V is a supporting kernel of rank alpha-1 of X, f_{alpha-1}(V; X, Y) is a supporting kernel of rank alpha-1 of Y; if W is a normal generating occurrence of rank alpha in X, f_{alpha-1}(W; X, Y) is a normal generating occurrence of rank alpha in Y. Phase correspondence in rank alpha: Соот_{alpha,A}(V, W) holds iff there are V1, W1 in Прав(alpha-1, X) and in Внутр(X, A) with Соот_A(V1, W1), V = f_{alpha-1}(V1; X, Y), W = f_{alpha-1}(W1; X, Y) [соответствующие по фазе в ранге alpha]. Supporting kernels of Y are kernels of rank alpha-1 and are linearly ordered; for alpha = 1 every V in Внутр(X, A) is a normal generating occurrence of rank 1.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.6'),page(19)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_7","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 19-20. Part of the simultaneous induction on rank alpha. Example: (a1 a2)^(2q) a1 is a semi-integral q-power of rank 1 with period (a1 a2)^2 and a semi-integral (2q+1)-power with period a1 a2. Every generating occurrence of rank 1 is normal."],"precheck":null,"rules":[],"says":"Let Y in Цел(X, alpha, A). An occurrence in Y with non-empty base is a generating occurrence of rank alpha [порождающее вхождение ранга alpha] if it is contained in a normal generating occurrence of rank alpha; supporting kernels of Y inside it are its supporting kernels. With U the first supporting kernel from the left of W, the left sections of rank alpha [левые участки] of W are its supporting kernels V with Соот_{alpha,A}(U, V); right sections [правые участки] are defined from the first supporting kernel from the right and numbered right to left. The numbers of left and right sections coincide (II.2.4); this is the number of sections l_{alpha,A}(W) [число участков] (0 if W has no supporting kernels). The base of a generating occurrence of rank alpha is a semi-integral word of rank alpha [полуцелое слово]; if l_{alpha,A}(P*E*Q) >= r, E is a semi-integral r-power of rank alpha with period A.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.7'),page(19)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_8","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 20. Part of the simultaneous induction on rank alpha; density is the period length measured by d_{alpha-1}."],"precheck":null,"rules":[],"says":"Density in rank alpha [плотность слова X в ранге alpha относительно периода A]: let U be a supporting kernel of rank alpha-1 of X in Пер(alpha, A), V its shift right by one period A with V in Внутр(X, A), and W the union of U and V; then rho_{alpha,A}(X) = d_{alpha-1}(W) - 1. For a generating occurrence W in Y in Цел(X, alpha, A), rho_{alpha,A}(W) = rho_{alpha,A}(Y) = rho_{alpha,A}(X). For alpha = 1, rho = d(A). Ch. II: rho does not depend on U, and for supporting kernels U, V of Y with union W: Соот_{alpha,A}(U, V) iff d_{alpha-1}(W) - 1 = (l_{alpha,A}(W) - 1) * rho_{alpha,A}(Y) (II.2.9).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.8'),page(20)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_9","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 20-21. Part of the simultaneous induction on rank alpha; uses mutual normalization of rank alpha-1. Example: the simple word a1 a2^(3q) a1 a2^(-n+3q) is a period of rank 2 that is not minimal of rank 2 (see (14) in 4.27)."],"precheck":null,"rules":[],"says":"Minimal period of rank alpha [минимальный период ранга alpha]: A with Пер(alpha, A) non-empty such that for all normal generating occurrences W, W1 of rank alpha in any integral words Y in Цел(X, alpha, A), Y1 in Цел(X1, alpha, B): ВзНорм_{alpha-1}(W, W1) and l_{alpha,A}(W) >= 3 imply rho_{alpha,A}(X) <= rho_{alpha,B}(X1). (By IV.3.4, ВзНорм_{alpha-1}(W, W1) implies d_{alpha-1}(W) = d_{alpha-1}(W1).) Every minimal period of rank 1 is simple, and every cyclically irreducible simple word is a minimal period of rank 1 (via 2.9).","source":{"authors":["S. I. Adian"],"locator":"[sec('I
