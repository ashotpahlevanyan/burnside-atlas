given in LaTeX in the same review."],"precheck":null,"rules":[],"says":"Vaughan-Lee and Zelmanov: the nilpotency class of the largest finite m-generator group of prime exponent p is bounded by a tower m^m^...^m of height 3p, and for prime-power exponent q by a tower of height q^(q^q) (an effective version of Zelmanov's solution).","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1994","title":"The nilpotency class of finite groups of exponent p","venue":"Trans. Am. Math. Soc. 346, No. 2, 617-640","year":"1994"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"adian_razborov_bound","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0832.20037. Quote: \"For p arbitrary, the works of Kostrikin, Adyan and Razborov, Vaughan-Lee and Zelmanov provide only ``superexponential'' bounds.\" The phrase 'primitive recursive' for Adian-Razborov appeared only in a search-engine snippet of vlz1999, not in a page opened; the Adian-Razborov paper itself was not located (see LEADS)."],"precheck":null,"rules":[],"says":"Adian and Razborov obtained a primitive recursive (superexponential) upper bound for the order/class of R(m,p), p prime.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1994","title":"The nilpotency class of finite groups of exponent p","venue":"Trans. Am. Math. Soc. 346, No. 2, 617-640","year":"1994"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"class_rmp_polynomial_conjecture","kind":"conjecture","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0832.20037. Quote: \"is bounded by a polynomial in m (or even by a linear function of m)\". Known for p = 2, 3 (trivially), p = 5 (Higman; 6m by HNVL), and polynomially for p = 7 (51m^8)."],"precheck":null,"rules":[],"says":"For a fixed prime p, the nilpotency class of R(m,p) is bounded by a polynomial in m (or even by a linear function of m).","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1994","title":"The nilpotency class of finite groups of exponent p","venue":"Trans. Am. Math. Soc. 346, No. 2, 617-640","year":"1994"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"class_bound(r(m,7))","value":"51*m^8"}],"id":"vl_r_m7_class","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0832.20037 (review by E. Khukhro). Quote: \"hence the nilpotency class of the largest finite m-generator group of exponent 7 is at most 51m^8\" (LaTeX stripped)."],"precheck":null,"rules":["R(m,7) is nilpotent of class at most n  IF  integer(m),m>=1,n is 51*m^8"],"says":"The m-generator 6-Engel Lie algebra of characteristic 7 has nilpotency class at most 51m^8; hence the largest finite m-generator group of exponent 7, R(m,7), has class at most 51m^8. Method: if x generates a nilpotent ideal of class N in L/(I+X), then in any (p-1)-Engel Lie algebra of char p the ideal generated by [y, z,...,z] (p-3 z's) has class <= 8(N-p)+49; computer calculations verify the hypothesis for p = 7.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1994","title":"The nilpotency class of finite groups of exponent p","venue":"Trans. Am. Math. Soc. 346, No. 2, 617-640","year":"1994"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"higman_reduction_argument","kind":"lemma","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0832.20037. Quote: \"Many results on (p-1)-Engel Lie algebras of characteristic p (which are essential for studying nilpotent groups of exponent p) rely on G. Higman's reduction argument.\""],"precheck":null,"rules":[],"says":"Higman's reduction: let L be the free (p-1)-Engel Lie algebra of char p on x, a1, a2, ..., and I the ideal generated by all [ai, aj]. If the ideal of L/I generated by the image of x is nilpotent of class N, then the ideal of L generated by x is also nilpotent of class N.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1994","title":"The nilpotency class of finite groups of exponent p","venue":"Trans. Am. Math. Soc. 346, No. 2, 617-640","year":"1994"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"class_bound(r(m,5))","value":"25*m"}],"id":"higman_exp5_class","kind":"theorem","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:0832.20037. Quote: \"by G. Higman for p=5 with estimate 25m\". Source 2: https://zbmath.org/?q=an:0716.17001. Quote: \"This improves Higman's bound 25k.\" Paper bibliographic data from https://zbmath.org/?q=an:0075.24001."],"precheck":null,"rules":["R(m,5) is nilpotent of class at most n  IF  integer(m),m>=1,n is 25*m"],"says":"Higman (1956): the class of R(m,5) (equivalently of the m-generator 4-Engel Lie algebra of characteristic 5) is at most 25m.","source":{"authors":["G. Higman"],"locator":"unknown","ref":"higman1956_exp5","title":"On finite groups of exponent five","venue":"Proc. Camb. Philos. Soc. 52, 381-390","year":"1956"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"class_bound(r(k,5))","value":"6*k"},{"quantity":"class_bound(r(3,5))","value":"17"},{"quantity":"order_bound(r(3,5))","value":"5^2282"},{"quantity":"order(class_quotient(b(2,7),18))","value":"7^6366"}],"id":"hnvl_exp5_class_6m","kind":"computation","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:0716.17001. Quote: \"The class of the free k-generator 4-Engel-Lie-algebra of characteristic 5 is at most 6k\". Source 2: https://zbmath.org/?q=an:0832.20037. Quote: \"later improved up to the apparently best possible result 6m by Havas, Newman, Vaughan-Lee\"."],"precheck":null,"rules":["R(m,5) is nilpotent of class at most n  IF  integer(m),m>=1,n is 6*m"],"says":"Havas-Newman-Vaughan-Lee (computer): the free k-generator 4-Engel Lie algebra of characteristic 5 has class at most 6k, hence the largest residually nilpotent quotient of B(k,5) has class at most 6k. Also: B(3,5)/(intersection of gamma_i) has class at most 17 and order at most 5^2282; the maximal class-18 quotient of B(2,7) has order 7^6366.","source":{"authors":["G. Havas","M. F. Newman","M. R. Vaughan-Lee"],"locator":"unknown","ref":"hnvl1990","title":"A nilpotent quotient algorithm for graded Lie rings [W(3,5) dimension 2282, class 17] (TITLE UNCERTAIN)","venue":"J. Symbolic Comput. (UNCERTAIN)","year":"1990"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kostrikin_exp5","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0066.01203 (zbMATH record, no review text). Quote (title): \"Loesung des abgeschwaechten Burnsideschen Problems fuer den Exponenten 5\" [umlauts transliterated; 'abgeschwaecht' = restricted/weakened]. Izv. Akad. Nauk SSSR Ser. Mat. 19, No. 3, 233-244 (1955)."],"precheck":null,"rules":["R(m,5) exists (largest finite m-generated group of exponent n)  IF  integer(m),m>=1"],"says":"Kostrikin (1955) solved the restricted Burnside problem for exponent 5 (first case beyond those covered by the bounded problem).","source":{"authors":["A. I. Kostrikin"],"locator":"unknown","ref":"kostrikin1955","title":"Solution of the restricted Burnside problem for exponent 5 (zbMATH title: Loesung des abgeschwaechten Burnsideschen Problems fuer den Exponenten 5)","venue":"Izv. Akad. Nauk SSSR, Ser. Mat. 19, No. 3, 233-244","year":"1955"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"magnus_sanov_engel","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2411.00669 (d'Elbee, Sec. 2.2). Quote: \"Magnus [36] showed that L is n-Engel for some n < p, i.e. L satisfies the identity [x, y n ] = 0.\" Source 2: https://zbmath.org/?q=an:0716.17001. Quote: \"By the Magnus-Sanov theorem the algebra L(n,p) satisfies the (p-1)-Engel identity\"."],"precheck":null,"rules":[],"says":"Magnus-Sanov: if G has exponent p, the Lie algebra L(G) over F_p associated with the lower central series satisfies an n-Engel identity with n < p; the Lie algebra L(n,p) of B(n,p) satisfies the (p-1)-Engel identity.","source":{"authors":["W. Magnus"],"locator":"unknown","ref":"magnus1950","title":"A connection between the Baker-Hausdorff formula and a problem of Burnside","venue":"Ann. of Math. (2) 52, 111-126","year":"1950"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"wall_identity","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0716.17001 (zbMATH review of HNVL 1990). Quote: \"G. E. Wall, who discovered a new (Wall's) identity of degree 2p-1, which is known to be not a consequence of the (p-1)-Engel one for p=5, 7, 11.\""],"precheck":null,"rules":[],"says":"G. E. Wall found an identity of degree 2p-1 holding in L(n,p) (Lie algebra of B(n,p)) that is not a consequence of the (p-1)-Engel identity for p = 5, 7, 11 (p=5 by hand; p=7,11 with computer help by J. J. Cannon). All multilinear identities of L(n,p) are known (Vaughan-Lee); new ones can only occur in degrees k(p-1)+1 (Wall).","source":{"authors":["G. Havas","M. F. Newman","M. R. Vaughan-Lee"],"locator":"unknown","ref":"hnvl1990","title":"A nilpotent quotient algorithm for graded Lie rings [W(3,5) dimension 2282, class 17] (TITLE UNCERTAIN)","venue":"J. Symbolic Comput. (UNCERTAIN)","year":"1990"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"rbp_lie_ring_equivalence","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2411.00669 (Sec. 2.2). Quote: \"As it turns out, the restricted Burnside problem is equivalent to proving the following: the associated Lie ring of B(r, pk ) is nilpotent.\" Our reading: 'associated Lie ring' means of the relevant (residually nilpotent) quotient; the source states it informally."],"precheck":null,"rules":[],"says":"Finite p-groups are nilpotent, so bounding finite quotients of B(r,p^k) is equivalent to bounding their nilpotency class; the restricted Burnside problem for exponent p^k is equivalent to nilpotency of the associated Lie ring of B(r,p^k).","source":{"authors":["C. d'Elbee"],"locator":"unknown","ref":"delbee2024","title":"Wilson conjecture for omega-categorical Lie algebras, the case 3-Engel characteristic 5","venue":"arXiv:2411.00669","year":"2024"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"zelmanov_odd_lie_criterion","kind":"theorem","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:0704.20030. Quote: \"There is a corollary: An Engel Lie ring is locally nilpotent.\" Source 2: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf (slide 'Two results on Lie rings', Theorem 1 (Zel'manov, 1991): sum over Sym(s) identity plus xy^t = 0 for products y of generators implies nilpotent). Quote: \"Then L is nilpotent.\""],"precheck":null,"rules":[],"says":"Zelmanov (odd exponent): a finitely generated Lie algebra over Z_p satisfying a linearized Engel identity, and such that (ad rho)^s = 0 for every commutator rho in the generators, is nilpotent. Corollary: an Engel Lie ring is locally nilpotent.","source":{"authors":["E. I. Zelmanov"],"locator":"unknown","ref":"zelmanov1990","title":"Solution of the restricted Burnside problem for groups of odd exponent","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 54:1 (1990) 42-59, 221","year":"1990"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"zelmanov_2groups_lie","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0752.20017. Quote: \"In fact, the author proves here that a Lie algebra in characteristic 2 which satisfies an Engel identity is locally nilpotent.\""],"precheck":null,"rules":[],"says":"Zelmanov (2-groups): a Lie algebra of characteristic 2 satisfying an Engel identity is locally nilpotent; this gives the restricted Burnside problem for exponent 2^n. The proof uses sandwiches (Kostrikin-Zelmanov) and Jordan algebras / Jordan pairs in characteristic 2; the reduction was in Mat. Sb. 180 (1989).","source":{"authors":["E. I. Zelmanov"],"locator":"unknown","ref":"zelmanov1991","title":"Solution of the restricted Burnside problem for 2-groups","venue":"Mat. Sb. 182:4 (1991) 568-592","year":"1991"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"def_sandwich","kind":"definition","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0729.17006. Quote: \"One of the main notions in Kostrikin's theory of Engel Lie algebras is the notion of sandwich.\""],"precheck":null,"rules":[],"says":"An element a of a Lie algebra is a (cover of a) thin sandwich if (ad a)^2 = 0; this notion is central in Kostrikin's theory of Engel Lie algebras.","source":{"authors":["A. I. Kostrikin","E. I. Zel'manov"],"locator":"unknown","ref":"kostrikin_zelmanov1990","title":"A theorem on sandwich algebras","venue":"Tr. Mat. Inst. Steklova 183, 106-111 (Engl.: Proc. Steklov Inst. Math. 183, 121-126 (1991))","year":"1990"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"kostrikin_zelmanov_sandwich","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0729.17006. Quote: \"Now the same is proved for all p (and also for superalgebras).\" Note: the review's attributions ('the second author'/'the first author') appear swapped relative to the author order; transcribed as stated in content, not attribution."],"precheck":null,"rules":[],"says":"A Lie algebra (over any characteristic; also superalgebras) generated by finitely many covers of thin sandwiches is nilpotent. Kostrikin proved this for (p-1)-Engel algebras of char p; Zelmanov removed the Engel hypothesis for p != 2,3 via Jordan methods; Kostrikin-Zelmanov 1990 prove it for all p.","source":{"authors":["A. I. Kostrikin","E. I. Zel'manov"],"locator":"unknown","ref":"kostrikin_zelmanov1990","title":"A theorem on sandwich algebras","venue":"Tr. Mat. Inst. Steklova 183, 106-111 (Engl.: Proc. Steklov Inst. Math. 183, 121-126 (1991))","year":"1990"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"razmyslov_exp4_insoluble","kind":"theorem","kourovka":null,"notes":["Source: https://www.mathnet.ru/eng/im1848 (abstract). Quote: \"Is the variety of groups of exponent 4 solvable?\" ... \"In this paper a negative answer is given to the question of Higman and Hall.\" Bibliographic data also at https://zbmath.org/?q=an:0422.20028."],"precheck":null,"rules":[],"says":"The variety of groups of exponent 4 is not soluble (negative answer to the question of Hall and Higman).","source":{"authors":["Yu. P. Razmyslov"],"locator":"unknown","ref":"razmyslov1979","title":"On a problem of Hall and Higman","venue":"Math. USSR, Izv. 13, 133-146 (English translation; Russian original year unknown)","year":"1979"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"razmyslov_engel_lie","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2401.01785 (Vaughan-Lee, Intro). Quote: \"Razmyslov [8] has shown that there are non-soluble (and hence non-nilpotent) (p - 2)-Engel Lie algebras of characteristic p for all primes p >= 5.\" Source 2: https://arxiv.org/abs/2411.00669. Quote: \"Theorem (Razmyslov, 1971). For all p >= 5 and n = p - 2 there exists a non-solvable n-Engel Lie algebra over a field of characteristic p.\" Pages differ between sources (33-44 Russian, 21-29 English)."],"precheck":null,"rules":[],"says":"For every prime p >= 5 there is a non-soluble (hence non-nilpotent) (p-2)-Engel Lie algebra of characteristic p. For p = 5 first proved by Bachmuth and Mochizuki. Hence there are non-nilpotent 5-Engel Lie algebras in characteristic 5 and 7.","source":{"authors":["Yu. P. Razmyslov"],"locator":"unknown","ref":"razmyslov1971","title":"On Engel Lie algebras / On Lie algebras satisfying the Engel condition","venue":"Algebra i Logika 10 (1971) 33-44; Engl. transl. Algebra Logic 10, 21-29 (1972)","year":"1971"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"bmw_nonsolvable_exp5","kind":"theorem","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:0218.20035 (record). Quote (title): \"A nonsolvable group of exponent 5\". Source 2: https://arxiv.org/abs/2401.01785. Quote: \"For p = 5 this result was originally proved by Bachmuth and Mochizuki [1].\" (ref [1] is the BMW 1970 paper)."],"precheck":null,"rules":[],"says":"Bachmuth, Mochizuki and Walkup (1970) constructed a nonsolvable group of exponent 5; the corresponding Lie result is the p = 5 case of Razmyslov's non-soluble (p-2)-Engel Lie algebras.","source":{"authors":["S. Bachmuth","H. Y. Mochizuki","D. Walkup"],"locator":"unknown","ref":"bmw1970","title":"A nonsolvable group of exponent 5","venue":"Bull. Am. Math. Soc. 76, 638-640","year":"1970"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"class_bound(b(n,4))","value":"3*n-1"}],"id":"wright_exp4_class","kind":"theorem","kourovka":null,"notes":["Source: https://msp.org/pjm/1973/44-2/p29.xhtml (Quintana-Wright abstract). Quote: \"It is known that B(n) is nilpotent of class at most 3n - 1.\" Attribution to Wright 1961 (Pac. J. Math. 11, 387-394, see https://zbmath.org/?q=an:0126.04702) and sharpness at n=2 came only from a search snippet of Gupta-Newman 1974; see LEADS."],"precheck":null,"rules":["B(m,4) is nilpotent of class at most n  IF  integer(m),m>=1,n is 3*m-1"],"says":"B(n,4) (the freest n-generator group of exponent 4) is nilpotent of class at most 3n - 1 (Wright 1961); best possible for n = 2.","source":{"authors":["C. R. B. Wright"],"locator":"unknown","ref":"wright1961","title":"On the nilpotency class of a group of exponent four","venue":"Pac. J. Math. 11, 387-394","year":"1961"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"class_bound(e(n))","value":"2*n+3"}],"id":"quintana_wright_exp4_engel","kind":"theorem","kourovka":null,"notes":["Source: https://msp.org/pjm/1973/44-2/p29.xhtml. Quote: \"Then E(n) is nilpotent of class at most 2n + 3.\" The Engel relation is an image on the page; the search summary renders it (x,y,y,y) = 1."],"precheck":null,"rules":[],"says":"Let E(n) be B(n,4) modulo the 3-Engel identity. Then E(n) is nilpotent of class at most 2n + 3; so every n-generator group of exponent 4 satisfying the Engel condition (x,y,y,y) = 1 has class at most 2n + 3. The paper also exhibits a commutator of length 3n-1 in B(n,4) that must be nontrivial if the class is exactly 3n-1.","source":{"authors":["R. B. Quintana Jr.","C. R. B. Wright"],"locator":"unknown","ref":"quintana_wright1973","title":"On groups of exponent four satisfying an Engel condition","venue":"Pac. J. Math. 44, 701-705","year":"1973"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"exp_p_class(r(4,4))","value":"10"},{"quantity":"defining_fourth_powers(r(4,4))","value":"1016"}],"id":"r44_exponent2_class","kind":"computation","kourovka":null,"notes":["Source: https://www.math.auckland.ac.nz/~obrien/research/burnside.pdf (Newman-O'Brien preprint, Sec. 3). Quote: \"defines a group with a largest class 10 quotient of order 2^422\" ... \"and is R(4, 4).\" Caution: the paper says \"In this paper the class of a group refers to its exponent-p class\", so 10 is the exponent-2 class, an upper bound for the nilpotency class."],"precheck":null,"rules":[],"says":"R(4,4) (order 2^422) is the largest exponent-2 class 10 quotient of a 4-generator presentation with 1016 fourth-power relators; 1016 fourth powers suffice to define it.","source":{"authors":["M. F. Newman","E. A. O'Brien"],"locator":"sec(3)","ref":"newman_obrien1996","title":"Application of computers to questions like those of Burnside, II [R(5,4)]","venue":"Internat. J. Algebra Comput. 6","year":"1996"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"schur_exponent_bound(exponent(4))","value":"8"}],"id":"moravec_schur_exponent","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2111.11098. Quote: \"if G is a finite group of exponent n then the exponent of M(G) divides ne\". Source 2: https://zbmath.org/?q=an:1120.20034. Quote: \"Next, if exp(G)=4, then exp(M(G)) divides 8, and this is the best possible result.\""],"precheck":null,"rules":[],"says":"Moravec (2007): if G is a finite group of exponent n then exp M(G) is bounded by a function of n; his proof gives exp M(G) | n*e, where e is the order of b^-n a^-n (ab)^n in M(R(2,n)). If exp G = 4 then exp M(G) divides 8, and this is best possible.","source":{"authors":["P. Moravec"],"locator":"unknown","ref":"moravec2007","title":"Schur multipliers and power endomorphisms of groups","venue":"J. Algebra 308, No. 1, 12-25","year":"2007"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"schur_exponent_counterexamples","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2111.11098 (Intro). Quote: \"a counterexample in exponent 4 was found by Bayes, Kautsky and Wamsley [1] in 1974. The conjecture remained open for odd exponent until 2020, when I found counterexamples of exponent 5 and exponent 9\"."],"precheck":null,"rules":[],"says":"Schur's exponent conjecture (exp M(G) divides exp G) fails: exponent 4 counterexample by Bayes-Kautsky-Wamsley (1974, H(4,4), M of exponent 8); exponent 5 and 9 counterexamples by Vaughan-Lee (2020/21, from H(5,9), H(9,9)). It holds for exponents 2 and 3.","source":{"authors":["M. Vaughan-Lee"],"locator":"sec(1)","ref":"vaughanlee2021_schur2","title":"Schur's exponent conjecture II","venue":"arXiv:2111.11098","year":"2021"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"e_q(4)","value":"4"},{"quantity":"e_q(5)","value":"5"},{"quantity":"e_q(7)","value":"7"}],"id":"vl_schur_eq_values","kind":"computation","kourovka":null,"notes":["Source: https://arxiv.org/abs/2111.11098 (abstract). Quote: \"it is a straightforward computation with the p-quotient algorithm to show that e = n for n = 4, 5, 7.\""],"precheck":null,"rules":[],"says":"Let e_q be the order of b^-q a^-q (ab)^q in M(R(2,q)). Then e_q = q for q = 2, 3 (hand) and q = 4, 5, 7 (p-quotient algorithm); e_q >= q for q = 8, 9. Also e_{p^k, p^2-p-1} divides p for all prime powers p^k.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee2021_schur2","title":"Schur's exponent conjecture II","venue":"arXiv:2111.11098","year":"2021"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"r28_r29_open","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2111.11098 (abstract, Dec 2021). Quote: \"The groups R(2, 8) and R(2, 9) are way out of range of the p-quotient algorithm, even with a modern supercomputer.\" 'Orders unknown' is our inference from this statement."],"precheck":null,"rules":[],"says":"The orders of R(2,8) and R(2,9) are not known; these groups are far beyond the range of the p-quotient algorithm, even with a modern supercomputer.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee2021_schur2","title":"Schur's exponent conjecture II","venue":"arXiv:2111.11098","year":"2021"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"p_quotient_algorithm","kind":"theorem","kourovka":null,"notes":["Source: https://www.math.auckland.ac.nz/~obrien/research/burnside.pdf (Newman-O'Brien, Sec. 2). Quote: \"The first such algorithm was described by Macdonald (1974). Havas & Newman (1980) describe an algorithm which provides the foundation for the one in common use today.\""],"precheck":null,"rules":[],"says":"The p-quotient algorithm computes, class by class along the lower exponent-p central series P_i(G) = [P_{i-1}(G), G] P_{i-1}(G)^p, a consistent power-conjugate presentation of the largest class-c p-quotient of a finitely presented group (optionally with an exponent law): add tails, compute tails, enforce consistency, impose relations, factor out p^m-th powers. First algorithm: Macdonald (1974); the modern basis: Havas-Newman (1980). Consistent pc presentations solve the word problem by collection.","source":{"authors":["M. F. Newman","E. A. O'Brien"],"locator":"sec(2)","ref":"newman_obrien1996","title":"Application of computers to questions like those of Burnside, II [R(5,4)]","venue":"Internat. J. Algebra Comput. 6","year":"1996"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"higman_lemma_exponent","kind":"lemma","kourovka":null,"notes":["Source: https://www.math.auckland.ac.nz/~obrien/research/burnside.pdf (Sec. 3). Quote: \"It states that a group of class c described by a power-conjugate presentation has exponent p^m if every normal word of weight at most c has order dividing p^m.\" Original source cited there: Sims (1994, p. 563)."],"precheck":null,"rules":[],"says":"Higman Lemma (practical exponent check): a group of class c given by a power-conjugate presentation has exponent p^m if every normal word of weight at most c has order dividing p^m; it suffices to test words with leading coefficient 1. Vaughan-Lee's filters reduce the list further (one per conjugacy class, normal closure criteria). A p-group of class <= p-1 has exponent equal to the maximum order of its defining generators.","source":{"authors":["M. F. Newman","E. A. O'Brien"],"locator":"sec(3)","ref":"newman_obrien1996","title":"Application of computers to questions like those of Burnside, II [R(5,4)]","venue":"Internat. J. Algebra Comput. 6","year":"1996"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[{"quantity":"words_checked(r(3,5))","value":"24062"},{"quantity":"words_checked(r(5,4))","value":"3503197"}],"id":"automorphism_exponent_enforcement","kind":"computation","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:0867.20003. Quote: \"We show how automorphisms can be used to reduce significantly the resources needed to enforce laws in p-groups.\" Source 2: https://www.math.auckland.ac.nz/~obrien/research/burnside.pdf Sec. 7. Quote: \"We verified that the group has exponent four by evaluating 3 503 197 normal words\" (R(5,4))."],"precheck":null,"rules":[],"says":"Using automorphisms of Burnside groups sharply reduces the number of power words needed to enforce exponent laws; with this the ANU p-Quotient Program computed consistent pc presentations of R(5,4) (order 2^2728) and R(3,5) (order 5^2282, exponent verified by evaluating 24062 normal words).","source":{"authors":["M. F. Newman","E. A. O'Brien"],"locator":"unknown","ref":"newman_obrien1996","title":"Application of computers to questions like those of Burnside, II [R(5,4)]","venue":"Internat. J. Algebra Comput. 6","year":"1996"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"lie_nq_algorithm","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0716.17001. Quote: \"The present paper describes the nilpotent quotient algorithm for graded Lie algebras of characteristic p>0.\" Also cited as a key tool in https://zbmath.org/?q=an:0939.20044 (review of vlz1999)."],"precheck":null,"rules":[],"says":"Havas-Newman-Vaughan-Lee: a nilpotent quotient algorithm for graded Lie algebras of characteristic p > 0, a modification of the Canberra nilpotent-quotient program for groups, incorporating the multilinear identities of L(n,p).","source":{"authors":["G. Havas","M. F. Newman","M. R. Vaughan-Lee"],"locator":"unknown","ref":"hnvl1990","title":"A nilpotent quotient algorithm for graded Lie rings [W(3,5) dimension 2282, class 17] (TITLE UNCERTAIN)","venue":"J. Symbolic Comput. (UNCERTAIN)","year":"1990"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"def_engel_element","kind":"definition","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf (slide 2). Quote: \"We say that a is a left Engel element if for each x in G there exists an integer n = n(x) such that [x,n a] = 1.\""],"precheck":null,"rules":[],"says":"G is an Engel group if for each (x,y) there is n = n(x,y) with [y, n x] = 1. a is a left Engel element if for each x there is n(x) with [x, n a] = 1; right Engel if [a, n x] = 1. Locally nilpotent groups are Engel; elements of the locally nilpotent radical are left Engel; hypercentral elements are right Engel.","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"zorn_finite_engel","kind":"theorem","kourovka":null,"notes":["Source 1: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 1 (Zorn, 1936) Every finite Engel group is nilpotent\". Source 2: https://arxiv.org/abs/1512.06097. Quote: \"Zorn's theorem [4, Satz III.6.3], which says that a finite Engel group is nilpotent.\" Year: slides say 1936; zbMATH (https://zbmath.org/?q=an:0017.00304) lists Bull. AMS 43, 401-404 (1937)."],"precheck":null,"rules":[],"says":"Zorn: every finite Engel group is nilpotent.","source":{"authors":["M. Zorn"],"locator":"unknown","ref":"zorn1937","title":"On a theorem of Engel","venue":"Bull. Am. Math. Soc. 43, 401-404","year":"1937"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"baer_engel_element_fitting","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1512.06097 (Intro). Quote: \"Baer's theorem [4, Satz III.6.15] saying that any Engel element of a finite group belongs to its Fitting subgroup.\" (ref [4] = Huppert, Endliche Gruppen I)."],"precheck":null,"rules":[],"says":"Baer: any Engel element of a finite group belongs to its Fitting subgroup.","source":{"authors":["E. I. Khukhro","P. Shumyatsky"],"locator":"unknown","ref":"khukhro_shumyatsky2016","title":"Almost Engel finite and profinite groups","venue":"arXiv:1512.06097 (journal version: unknown)","year":"2016"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"baer_engel_max","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 3 (Baer, 1957)Every Engel group satisfying max is nilpotent\". Original Baer paper not located."],"precheck":null,"rules":[],"says":"Baer (1957): every Engel group satisfying the maximal condition on subgroups is nilpotent.","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"gruenberg_solvable_engel","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 2 (Gruenberg, 1953) Every finitely generated solvable Engel group is nilpotent\". Paper identified as 'Two theorems on Engel groups', Proc. Camb. Philos. Soc. 49 (1953) 377-380 via https://zbmath.org/?q=an:0050.01901 (no review text)."],"precheck":null,"rules":[],"says":"Gruenberg (1953): every finitely generated solvable Engel group is nilpotent.","source":{"authors":["K. W. Gruenberg"],"locator":"unknown","ref":"gruenberg1953","title":"Two theorems on Engel groups","venue":"Proc. Camb. Philos. Soc. 49, 377-380","year":"1953"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[{"quantity":"class_bound(solvable_engel(n,d))","value":"(n+1)^(d-1)"}],"id":"gruenberg_solvable_nengel_class","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"If G has no elements of prime order p < n then G is nilpotent of class at most (n + 1)^(d-1).\" (exponent typeset as superscript on slide)."],"precheck":null,"rules":[],"says":"Gruenberg (1961): a solvable n-Engel group of derived length d with no elements of prime order p < n is nilpotent of class at most (n+1)^(d-1).","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"suprunenko_linear_engel","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 4 (Suprenenko and Garscuk, 1962) Every linear Engel group is nilpotent\" (diacritics lost). Paper: https://zbmath.org/?q=an:0227.20014 'Linear groups with Engel condition', Dokl. Akad. Nauk BSSR 6 (1962)."],"precheck":null,"rules":[],"says":"Suprunenko and Garashchuk (1962): every linear Engel group is nilpotent.","source":{"authors":["D. A. Suprunenko","M. S. Garashchuk"],"locator":"unknown","ref":"suprunenko_garashchuk1962","title":"Linear groups with Engel condition","venue":"Dokl. Akad. Nauk BSSR 6, 277-280","year":"1962"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"wilson_rn_engel","kind":"theorem","kourovka":null,"notes":["Source 1: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 5 (Wilson, 1991)Every finitely generated residually nilpotent n-Engel group is nilpotent.\" Source 2: https://zbmath.org/?q=an:0746.20018. Quote: \"Here the finite rank condition can be replaced by an Engel condition\". The 'uses zelmanov_engel_lie' link is our reading; see LEADS."],"precheck":null,"rules":[],"says":"Wilson (1991): every finitely generated residually nilpotent n-Engel group is nilpotent. (For f.g. residually finite groups, an Engel condition on 2-generator subgroups passes to the whole group; proof via Shalev's work on p-adic analytic groups.)","source":{"authors":["J. S. Wilson"],"locator":"unknown","ref":"wilson1991","title":"Two-generator conditions for residually finite groups","venue":"Bull. Lond. Math. Soc. 23, No. 3, 239-248","year":"1991"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"wilson_zelmanov_profinite","kind":"theorem","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:0851.17007. Quote: \"Theorem. Every profinite Engel group is locally nilpotent.\" Source 2: https://arxiv.org/abs/1512.06097. Quote: \"Wilson and Zelmanov [9] proved the converse for profinite groups: any Engel profinite group is locally nilpotent.\""],"precheck":null,"rules":[],"says":"Wilson-Zelmanov (1992): every profinite Engel group is locally nilpotent. Hence a profinite group is locally nilpotent iff each of its 2-generator subgroups is nilpotent. Also: a group law on finitely many cosets of a finite-index subgroup implies L_p(G) satisfies an identity for every p.","source":{"authors":["J. S. Wilson","E. I. Zelmanov"],"locator":"unknown","ref":"wilson_zelmanov1992","title":"Identities for Lie algebras of pro-p groups","venue":"J. Pure Appl. Algebra 81, No. 1, 103-109","year":"1992"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"medvedev_compact_engel","kind":"theorem","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:1048.20011. Quote: \"The author of the paper extends this result to all compact groups.\" Source 2: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 6 (Medvedev, 2003)Every compact Engel group is locally nilpotent\"."],"precheck":null,"rules":[],"says":"Medvedev (2003): every compact (Hausdorff) Engel group is locally nilpotent; so a compact group is locally nilpotent iff its 2-generated subgroups are nilpotent.","source":{"authors":["Yu. Medvedev"],"locator":"unknown","ref":"medvedev2003","title":"On compact Engel groups","venue":"Isr. J. Math. 135, 147-156","year":"2003"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"burns_medvedev","kind":"theorem","kourovka":null,"notes":["Source 1: https://zbmath.org/?q=an:0898.20021. Quote: \"There exist integers c(n), e(n) depending on n only such that all n-Engel groups contained in the class C are actually contained in the variety\" (LaTeX stripped). Source 2: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 2 (Burns and Medvedev, 1998)There exist positive integers m = m(n) and r = r(n) such that for any locally nilpotent n-Engel group\""],"precheck":null,"rules":[],"says":"Burns-Medvedev (1998): there are integers c(n), e(n) such that every n-Engel group in the class C (containing all residually finite and all residually soluble groups, in particular every locally nilpotent n-Engel group) lies in N_{c(n)} B_{e(n)} intersect B_{e(n)} N_{c(n)}; e.g. gamma_{m+1}(G)^r = 1 for locally nilpotent n-Engel G with m = m(n), r = r(n).","source":{"authors":["R. G. Burns","Yu. Medvedev"],"locator":"unknown","ref":"burns_medvedev1998","title":"A note on Engel groups and local nilpotence","venue":"J. Aust. Math. Soc., Ser. A 64, No. 1, 92-100","year":"1998"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"kim_rhemtulla_orderable","kind":"theorem","kourovka":null,"notes":["Source 1: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 7 (Kim and Rhemtulla, 1991)Every orderable n-Engel group is nilpotent\". Source 2: https://zbmath.org/?q=an:0792.06015. Quote: \"lattice-ordered groups satisfying bounded Engel condition are nilpotent\" and \"results of Zel'manov for Engel groups\". Year: slides 1991 (conference), proceedings 1993."],"precheck":null,"rules":[],"says":"Kim-Rhemtulla: every orderable n-Engel group is nilpotent (lattice-ordered groups with a bounded Engel condition are nilpotent). Open: is every right orderable n-Engel group nilpotent? (true for n = 4, Longobardi-Maj 1997).","source":{"authors":["Y. K. Kim","A. H. Rhemtulla"],"locator":"unknown","ref":"kim_rhemtulla1993","title":"Orderable groups satisfying an Engel condition","venue":"Ordered algebraic structures (Gainesville 1991), Kluwer, 73-79","year":"1993"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"golod_engel_not_locally_nilpotent","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/1109.5439 (Abdollahi-Brandl-Tortora, Intro). Quote: \"Golod's examples show that there exist infinite non-nilpotent groups generated by an Engel set with three or more elements (see [5]).\" Source 2 (no Golod attribution): https://arxiv.org/abs/2411.00669. Quote: \"If the general local nilpotency problem is known to fail [47]\"."],"precheck":null,"rules":[],"says":"Golod's examples: there exist infinite non-nilpotent groups generated by an Engel set with three or more elements; in particular a finitely generated Engel group need not be nilpotent (the general local nilpotency problem for Engel groups fails).","source":{"authors":["E. S. Golod"],"locator":"unknown","ref":"golod1966_icm","title":"Some problems of Burnside type","venue":"Proc. ICM Moscow 1966, 284-289; Amer. Math. Soc. Transl. (2) 84 (1969) 83-88","year":"1968"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"engel_local_nilpotency_problem","kind":"open_problem","kourovka":null,"notes":["Source 1: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Problem 2. Is every finitely generated n-Engel group nilpo-tent?\" Source 2: https://arxiv.org/abs/2411.00669. Quote: \"the local nilpotency problem is still open to this day\" and \"has been answered positively for n = 2 [32], n = 3 [21] and n = 4 [43, 20].\""],"precheck":null,"rules":[],"says":"Local nilpotency problem: is every finitely generated n-Engel group nilpotent? Known for n = 2 (Levi), n = 3 (Heineken), n = 4 (Traustason; Havas-Vaughan-Lee); open in general. Also: a f.g. non-nilpotent n-Engel group has a f.g. simple non-abelian section.","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[],"id":"plotkin_ln_subvariety","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0406100 (Plotkin, Theorem 1; proof uses a relatively free locally nilpotent n-Engel group of each rank). Quote: \"Theorem 1. In any variety En all its locally nilpotent groups form a subvariety.\" The uses-link to Zelmanov is our inference; the arXiv preprint's proof relies on a k-generator bounded-class nilpotent quotient."],"precheck":null,"rules":[],"says":"In any variety E_n of n-Engel groups, the locally nilpotent groups form a subvariety.","source":{"authors":["B. Plotkin"],"locator":"thm(1)","ref":"plotkin2004","title":"Notes on Engel groups and Engel elements in groups. Some generalizations","venue":"arXiv:math/0406100","year":"2004"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"zelmanov_char0_engel","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2401.01785. Quote: \"Zel'manov [12] also showed that n-Engel Lie algebras over a field of characteristic zero are (globally) nilpotent (for all n).\" Source 2: https://arxiv.org/abs/2411.00669. Quote: \"Theorem (Zelmanov, 1988). Every n-Engel Lie algebra over a field of characteristic 0 is nilpotent.\" Slides (traustason.pdf): \"Theorem 2 (Zel'manov, 1987) Any torsion free n-Engel Lie ring is nilpotent.\" Refs: VL cites Dokl. 292 (1987); d'Elbee cites Sibirsk. Mat. Zh. 29(5) (1988)."],"precheck":null,"rules":[],"says":"Zelmanov (1987/88): every n-Engel Lie algebra over a field of characteristic 0 is (globally) nilpotent; any torsion-free n-Engel Lie ring is nilpotent. Consequently for each n there are N, c such that n-Engel Lie algebras of characteristic p > N are nilpotent of class <= c.","source":{"authors":["E. I. Zelmanov"],"locator":"unknown","ref":"zelmanov1988_sib","title":"On Engel Lie algebras","venue":"Sibirsk. Mat. Zh. 29(5), 112-117","year":"1988"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"zelmanov_engel_groups_primes","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2411.00669 (Sec. 2.4). Quote: \"Theorem (Zelmanov, 1990). For each n there is a finite set of primes pi such that any locally nilpotent n-Engel group without elements of pi-torsion is nilpotent.\""],"precheck":null,"rules":[],"says":"Zelmanov (1990): for each n there is a finite set of primes pi such that every locally nilpotent n-Engel group without pi-torsion is nilpotent.","source":{"authors":["E. I. Zelmanov"],"locator":"unknown","ref":"zelmanov1990_sb","title":"On some problems of group theory and Lie algebras","venue":"Mathematics of the USSR-Sbornik 66, 159-168","year":"1990"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[{"quantity":"class_bound(engel_lie(3,char_not(2,5)))","value":"4"}],"id":"engel3_lie_class4","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2401.01785. Quote: \"Heineken [5] proved that 3-Engel Lie algebras over a field of characteristic zero, or over a field of prime characteristic p != 2, 5, are nilpotent of class at most 4.\" Source 2: https://arxiv.org/abs/2411.00669 table (3-Engel row: 2:inf, 3:4, 5:inf, 7:4, >7:4) and \"A classical result of Higgins [22] states that 3-Engel Lie algebras of characteristic p != 2, 5 are nilpotent.\" Attribution differs (Heineken vs Higgins)."],"precheck":null,"rules":[],"says":"3-Engel Lie algebras over a field of characteristic 0 or p != 2, 5 are nilpotent of class at most 4; in characteristics 2 and 5 they need not be nilpotent.","source":{"authors":["P. J. Higgins"],"locator":"unknown","ref":"higgins1954","title":"Lie rings satisfying the Engel condition","venue":"Proc. Cambridge Philos. Soc. 50, 8-15","year":"1954"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[{"quantity":"class_bound(engel_lie(4,char_gt(5)))","value":"7"}],"id":"traustason_4engel_lie","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2401.01785. Quote: \"Traustason [9] proved that 4-Engel Lie algebras over a field of characteristic zero, or over a field of prime characteristic p > 5, are nilpotent of class at most 7.\" Source 2: https://arxiv.org/abs/2411.00669 table (4-Engel row: 2,3,5: inf; 7, >7: 7; \"All bounds are sharp.\")."],"precheck":null,"rules":[],"says":"Traustason: 4-Engel Lie algebras over a field of characteristic 0 or p > 5 are nilpotent of class at most 7 (sharp); not nilpotent in general in characteristics 2, 3, 5.","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason1993","title":"Engel Lie algebras","venue":"Quart. J. Math. Oxford (2) 44, 355-384","year":"1993"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[{"quantity":"class_bound(engel_lie(5,char_gt(7)))","value":"11"}],"id":"vl_5engel_lie","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2401.01785. Quote: \"Theorem 1 If L is a 5-Engel Lie algebra over a field of characteristic zero, or over a field of prime characteristic p > 7, then L is nilpotent of class at most 11.\" Source 2: https://arxiv.org/abs/2411.00669 table (5-Engel, >7: 11). arXiv preprint; refereed status unknown."],"precheck":null,"rules":[],"says":"Vaughan-Lee (2024, computer-assisted): every 5-Engel Lie algebra over a field of characteristic 0 or p > 7 is nilpotent of class at most 11 (reduction via symmetric-group representation theory to four-generator Lie superalgebras).","source":{"authors":["M. Vaughan-Lee"],"locator":"thm(1)","ref":"vaughanlee2024_5engel","title":"5-Engel Lie algebras","venue":"arXiv:2401.01785","year":"2024"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[{"quantity":"class_bound(engel_group(5,p_gt(7)))","value":"10"}],"id":"vl_5engel_groups","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/2401.01785. Quote: \"Theorem 2 If G is a locally nilpotent 5-Engel p-group for some prime p > 7 then G is nilpotent of class at most 10.\" Source 2: https://arxiv.org/abs/2411.00669 group table (5-Engel, >7: 10)."],"precheck":null,"rules":[],"says":"Vaughan-Lee (2024): if G is a locally nilpotent 5-Engel p-group with p > 7 (abstract: finite 5-Engel p-group), then G is nilpotent of class at most 10.","source":{"authors":["M. Vaughan-Lee"],"locator":"thm(2)","ref":"vaughanlee2024_5engel","title":"5-Engel Lie algebras","venue":"arXiv:2401.01785","year":"2024"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"engel_lie_small_char_examples","kind":"example","kourovka":null,"notes":["Source: https://arxiv.org/abs/2401.01785 (Sec. 1). Quote: \"It is easy to construct non-nilpotent 3-Engel Lie algebras of characteristic 2.\" and \"The same construction over the field Z3 gives a non-nilpotent Lie algebra satisfying the 4-Engel identity.\""],"precheck":null,"rules":[],"says":"Let L be the free metabelian Lie algebra over Z_2 on x1, x2, ..., and I the ideal generated by the basic products with a repeated index; L/I satisfies [x,y,z,z] = 0 (so is 3-Engel) but is not nilpotent. The same construction over Z_3 gives a non-nilpotent 4-Engel Lie algebra.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee2024_5engel","title":"5-Engel Lie algebras","venue":"arXiv:2401.01785","year":"2024"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[{"quantity":"class_bound(ideal_x(engel_lie(5,char(5))))","value":"7"},{"quantity":"class_bound(ideal_x(engel_lie(5,char(7))))","value":"6"},{"quantity":"class_bound(ideal_x(engel_lie(5,char(19))))","value":"6"},{"quantity":"class_bound(ideal_x(engel_lie(5,char_gt_7_not_19)))","value":"5"}],"id":"vl_5engel_ideal_class","kind":"computation","kourovka":null,"notes":["Source: https://arxiv.org/abs/2410.11524 (Intro). Quote: \"in characteristic 5 the ideal generated by an element in a 5-Engel Lie algebra is nilpotent of class at most 7; in characteristic 7 and 19 it is nilpotent of class at most 6\". arXiv preprint."],"precheck":null,"rules":[],"says":"In a 5-Engel Lie algebra the ideal Id(x) generated by one element is nilpotent of class at most 7 in characteristic 5, at most 6 in characteristics 7 and 19, and at most 5 for p > 7, p != 19 (best possible); in characteristic 3 (and in Traustason's char-2 3-Engel example) Id(x) need not be nilpotent.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee2024_5engel2","title":"5-Engel Lie algebras II","venue":"arXiv:2410.11524","year":"2024"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[{"quantity":"class_bound(engel_group(4,free_of([2,3,5])))","value":"7"}],"id":"traustason_4engel_class7","kind":"theorem","kourovka":null,"notes":["Source 1: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 2 (T, 1995) Let G be a 4-Engel group that is {2, 3, 5}-free. Then G is nilpotent of class at most 7.\" Source 2: https://arxiv.org/abs/2401.01785. Quote: \"Traustason [9] proves that locally nilpotent 4-Engel p-groups are nilpotent of class at most 7 provided p > 5.\" The uses-link to hvl_4engel (local nilpotence) is our inference for the general {2,3,5}-free statement."],"precheck":null,"rules":[],"says":"Traustason (1995): a 4-Engel group with no elements of order 2, 3 or 5 is nilpotent of class at most 7; equivalently stated by Vaughan-Lee: locally nilpotent 4-Engel p-groups are nilpotent of class at most 7 for p > 5.","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"checked"},{"caveats":[],"domain":"commutators","facts":[],"id":"engel4_structure","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf (slides '4-Engel groups' and 'The local nilpotence problem for 4-Engel groups'). Quote: \"Theorem 5 (Vaughan-Lee, 2007) G is a 4-Engel group if and only if hxiG is 3-Engel for all x in G.\" (hxiG = <x>^G after text extraction)."],"precheck":null,"rules":[],"says":"4-Engel groups: every 4-Engel group is a Fitting group of Fitting degree at most 4 (at most 3 if {2,5}-free) (Traustason 2003); every 4-Engel 3-group is solvable (Abdollahi-Traustason 2002); G is 4-Engel iff the normal closure <x>^G is 3-Engel for every x (Vaughan-Lee 2007); 4-Engel 2-groups and 3-groups are locally finite (Traustason), 4-Engel 5-groups locally finite (Vaughan-Lee 1997).","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"engel3_structure","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf (slide '3-Engel groups'). Quote: \"Theorem 4 (Gupta, 1972) Every 3-Engel 2-group is solvable.\""],"precheck":null,"rules":[],"says":"3-Engel groups: <x>^G is nilpotent of class at most 2 for every x (L. Kappe, W. Kappe 1972); every 3-Engel 2-group is solvable (Gupta 1972).","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"abdollahi_traustason_engel_pgroups","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 4 (Abdollahi and T, 2002) There exists a positive integer s = s(n) such that every powerful n-Engel p-group is nilpotent of class at most s.\""],"precheck":null,"rules":[],"says":"Abdollahi-Traustason (2002): there is s = s(n) such that every powerful n-Engel p-group is nilpotent of class at most s. If G is a locally finite n-Engel p-group and p^(r-1) < n <= p^r, then G^(p^r) is nilpotent of n-bounded class for odd p, and (G^(2^r))^2 is for p = 2. Crosby-Traustason (2010): locally nilpotent n-Engel groups satisfy a law [x^r, x1, ..., xm] = 1 with m = m(n), r = r(n).","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"strong_generalized_burnside_variety","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf (slide 'Generalisations of Engel groups. A.'). Quote: \"(2) The groups Cp wr C and C wr Cp do not belong to V for any prime p.\""],"precheck":null,"rules":[],"says":"A variety V is a strong generalised Burnside variety if, equivalently: nilpotent r-generator groups in V have r-bounded order/class; f.g. residually nilpotent groups in V are nilpotent; the locally nilpotent groups in V form a subvariety. Traustason (2005): V is such iff C_p wr C and C wr C_p are not in V for any prime p. Endimioni (2002): iff there are c, e with all locally nilpotent groups of V in N_c B_e and B_e N_c.","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"zelmanov_finite_basis_exp_p","kind":"theorem","kourovka":null,"notes":["Source: https://mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf. Quote: \"Theorem 3 (Zel'manov, 1993) The variety B p is finitely based for every prime p\". On the next line the slides define the barred symbol: \"The variety B n of all locally nilpotent groups of exponent n\"; text extraction dropped the bar, so the reading 'locally nilpotent groups of exponent p' is our interpretation. Zelmanov's paper not located (see LEADS).","DISPUTED 2026-11-14: Kourovka Notebook No. 21 prints problem 18.22 (Bergman, attributed to H. Neumann: is the Kostrikin variety of locally finite groups of prime exponent p finitely based?) as OPEN, with no comment. A problem posed in 2014 and still open in 2026 conflicts with a 1993 solution. The slide's claim may be misattributed or refer to a different variety. Resolve from Zelmanov's own papers."],"precheck":null,"rules":[],"says":"Zelmanov (1993): for every prime p the variety of locally nilpotent (equivalently locally finite) groups of exponent p is finitely based. Endimioni: the varieties of locally nilpotent groups of exponent n are all finitely based iff the varieties of locally nilpotent n-Engel groups are all finitely based.","source":{"authors":["G. Traustason"],"locator":"unknown","ref":"traustason_slides2009","title":"Engel Groups (a survey) [talk slides]","venue":"Groups St Andrews 2009 in Bath, slides at mathshistory.st-andrews.ac.uk/Groups/2009/slides/traustason.pdf","year":"2009"},"status":"disputed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_markers","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/ (PDF). Quote: \"Theorem 2.1 (theorem on Markers). Take integers n ≥ 1 and m ≥ 1, let M be the free Burnside monoid satisfying xn = xn+m\". Originally from I. Simon's 1970 manuscript on x^2 = x^3 with two generators."],"precheck":null,"rules":[],"says":"Theorem on Markers (I. Simon 1970). In the free Burnside monoid M satisfying x^n = x^(n+m) (n, m >= 1), if w R' w' (R-related images) and u, u' are their R-entrances (shortest prefixes in the same R-class), then u ~ u', u and u' end in the same letter a, and u a^-1 ~ u' a^-1.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"thm(2.1)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_r_frame_tree","kind":"corollary","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Corollary 2.2. The frame of the R-classes of M is a tree.\""],"precheck":null,"rules":[],"says":"The frame of the R-classes of the free Burnside monoid satisfying x^n = x^(n+m) (vertices = R-classes, labelled edges R -> R' when xg is in R' for x in R and generator g) is a tree.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"cor(2.2)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_free_groupoid_local_groups","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Then, the local groups Bv , for v ∈ V (G), are all isomorphic to a free group satisfying T .\" Attributed in the survey to do Lago's thesis [13] and the paper 'Local groups in free groupoids satisfying certain monoid identities' [9] (IJAC 2002 per MaRDI)."],"precheck":null,"rules":[],"says":"Let G be a strongly connected graph and T a set of monoid identities such that every monoid satisfying T is a group. In the free groupoid B on G satisfying T, all local groups B_v are isomorphic to a free group of the variety defined by T; if non-trivial, it is free on an effectively characterized generating set whose cardinality is the cyclomatic number |E| - |V| + 1 of G.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"thm(4.1)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_fingerprint_characterization","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Theorem 5.1 (Characterization Theorem). Let w and w0 be two words such that w H0 w0 . Then: w ∼ w0 if and only if σ(w) ∼= σ(w0 ).\""],"precheck":null,"rules":[],"says":"Characterization Theorem: for words w, w' that are H-related in the free Burnside monoid x^n = x^(n+m), w ~ w' iff their fingerprints (paths in the fundamental graph of the D-class) are equal in the free Burnside groupoid satisfying x^m = 1 on that graph.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"thm(5.1)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_maxgroup_rank_cyclomatic","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"if m ≥ 2, this Burnside group is free over a generating set whose cardinality is the cyclomatic number of the fundamental graph of the D-class that contains the group.\""],"precheck":null,"rules":[],"says":"Sharpening of the maximal-group theorem: for m >= 2, a maximal group of the free Burnside semigroup x^n = x^(n+m) is the free Burnside group of exponent m on a generating set whose cardinality equals the cyclomatic number of the fundamental graph of its D-class; a generating set can be exhibited.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"thm(5.2)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_irregular_h_trivial","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"implies that the irregular H-classes of a free Burnside monoid satisfying xn = xn+m generated by the alphabet A are all trivial.\""],"precheck":null,"rules":[],"says":"In the free Burnside semigroup x^n = x^(n+m), the fundamental graph of an irregular D-class has a single vertex and no edge; hence all irregular H-classes are trivial.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"prop(5.3)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_sigma_stable_n3","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Due to a sequence of results of several authors [7,8,10–12,17,18,28] we know that Σ is stable for n ≥ 3 and m ≥ 1\". The cited sequence: de Luca-Varricchio, do Lago (1991 thesis, LATIN'92, IJAC 1996), Guba (two IJAC papers), McCammond (IJAC 1991)."],"precheck":null,"rules":[],"says":"For n >= 3 and m >= 1, every production of the relation Sigma (a refined generating relation of the Burnside congruence, built from de Luca-Varricchio and do Lago) is stable. Sigma is not stable for n = 1, nor for n = 2 and m >= 2.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"thm(6.1)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_expansiveness","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Then each congruence class of ∼ has a unique word which does not have any factor which is a long of a production of Σ. Further, such a word is the unique shortest word in its class.\""],"precheck":null,"rules":[],"says":"Expansiveness Theorem: if Sigma is stable (in particular for n >= 3), each congruence class of the free Burnside monoid x^n = x^(n+m) contains a unique word with no factor that is the long side of a production of Sigma, and it is the unique shortest word of the class; Sigma is a Church-Rosser rewriting system and the word problem is effectively solvable.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"thm(8.1)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[{"quantity":"maxgroup_order(fbs(k,n,m))","value":"m"}],"id":"sg_cyclic_groups_n3","kind":"corollary","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Corollary 8.3. Assume that Σ is stable. The maximal groups in the free Burnside semigroup satisfying xn = xn+m are cyclic of order m.\" Also: \"While the maximal groups of M \\ {e 1} are cyclic of order m for n ≥ 3\". fact/3 value m is symbolic (any k, m; n >= 3)."],"precheck":null,"rules":[],"says":"If Sigma is stable (so for n >= 3), the fundamental graph of every regular D-class of the free Burnside semigroup x^n = x^(n+m) is a cycle, and the maximal groups are cyclic of order m.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"cor(8.3)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_brzozowski_n3","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Theorem 8.4. If Σ is stable, then M is finite J -above and every congruence class is recognizable.\" The survey says the Section 8 results are from do Lago IJAC 1996 [12]."],"precheck":null,"rules":[],"says":"If Sigma is stable (in particular for n >= 3), the free Burnside monoid x^n = x^(n+m) is finite J-above, all R- and L-classes are finite, and every congruence class is a recognizable (regular) language, settling Brzozowski's conjecture in these cases.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"thm(8.4)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[{"quantity":"dclasses(fbs(k,1,m))","value":"2^k-1"}],"id":"sg_index1_dclasses_content","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"due to classical work of Green and Rees [16], all Green-induced relations are characterized and M has exactly 2|A| D-classes\" and \"While there are exactly 2|A| − 1 D-classes which in turn are easily characterized in the case n = 1, there are infinitely many D-classes ... for n ≥ 2.\" (2|A| is 2^|A| with flattened exponent)."],"precheck":null,"rules":[],"says":"For x = x^(1+m) (n = 1), two words are D-related in the free Burnside monoid iff they have the same content (set of letters); hence the monoid has exactly 2^|A| D-classes and the semigroup exactly 2^|A| - 1 (Green-Rees). For n >= 2 and |A| >= 2 there are infinitely many D-classes.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"sec(7)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[{"quantity":"cyclomatic(top_dclass(fbs(3,1,1)))","value":"7"},{"quantity":"cyclomatic(top_dclass(fbs(3,1,2)))","value":"373"},{"quantity":"cyclomatic(top_dclass(fbs(2,1,m)))","value":"2*m-1"},{"quantity":"order(fbs(1,1,2))","value":"2"},{"quantity":"order(fbs(2,1,2))","value":"132"},{"quantity":"order(fbs(2,1,3))","value":"30502389939954"}],"id":"sg_index1_order_formula","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"In Corollary 7.2 [13] we compute the exact cardinality of M, M|A|,m, for every m for which Bk,m is known for every k. This result extends those of McLean [29].\" and \"For m = 1 and m = 2 we have cyclomatic numbers 7 and 373, respectively.\" and (D-class of ab) \"the cyclomatic number of the fundamental graph of this D-class is 2m − 1.\"","NUMERIC VALUES: the source states the recurrence and the cyclomatic numbers 7, 373, 2m-1, but NOT the orders. Orders were obtained in this research pass by evaluating the source's recurrence (Python), with |B(g,1)| = 1, |B(g,2)| = 2^g, |B(g,3)| = 3^(g + C(g,2) + C(g,3)) (KB facts b_m_2, b_m_3). Sanity check: with m = 1 the recurrence gives 6, 159, 332380 for k = 2, 3, 4, matching OEIS A030449 (free band orders) and fact(bands_finite, ...); it also reproduces G_{3,1} = 7 and G_{3,2} = 373 from the source. For x^3 = x (fbs(2,1,2)): D_1 = 2, G_2 = 3, D_2 = 4^2 * 2^3 = 128, monoid order 1 + 2*2 + 128 = 133, so the SEMIGROUP has 132 elements: this CONFIRMS the user's computed value 132 (as a consequence of a published formula, not as a number printed in a source). For x^4 = x on 2 generators: 30502389939954 (semigroup). For k = 3, m = 2 the order has 118 decimal digits. No source opened in this pass prints these orders."],"precheck":null,"rules":["|the free semigroup on m generators with x^1 = x^(1+n)| = d  IF  every finitely generated group of exponent n is finite; fbs1_order(m,n,d)"],"says":"Order of the free Burnside monoid x = x^(1+m) on k letters (do Lago, extending McLean): with B_{g,m} = |B(g,m)|, G_{1,m} = 1, G_{k,m} = k D_{k-1,m} - k(k-1) D_{k-2,m} + 1 (k >= 2); D_{0,m} = 1, D_{k,m} = (k D_{k-1,m})^2 B_{G_{k,m},m} (k >= 1); M_{k,m} = sum_{i=0..k} C(k,i) D_{i,m}. G_{k,m} is the cyclomatic number of the fundamental graph of the top D-class, D_{k,m} its size. The free Burnside semigroup has M_{k,m} - 1 elements.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"cor(7.2)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_kadourek_polak_wp","kind":"corollary","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Corollary 7.3. Let m ≥ 1 be an integer. Suppose the word problem to be decidable in any finitely generated free Burnside group satisfying xm = 1. Then the word problem is decidable in any finitely generated free Burnside monoid satisfying x = xm+1 .\" Survey attributes this to Kadourek and Polak, Simon Stevin 64 (1990)."],"precheck":null,"rules":[],"says":"(Kadourek-Polak) If the word problem is decidable in every finitely generated free Burnside group of exponent m, then the word problem is decidable in every finitely generated free Burnside monoid satisfying x = x^(m+1). In particular this holds for m in {1,2,3,4,6}, and for odd m >= 665 using Adian's solution of the word problem.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"cor(7.3)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_index1_infinite_groups","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"the number of vertices of the fundamental graph of this D-class is 6m and the number of edges is 12m2 B2m−1,m\" and \"This implies that the H-classes of the D-class of abcf are infinite free Burnside groups satisfying xm = 1.\""],"precheck":null,"rules":[],"says":"For x = x^(1+m) on three letters a, b, c, the top D-class (content {a,b,c}) has fundamental graph with 6m vertices and 12 m^2 |B(2m-1,m)| edges; when B(2,m) is infinite (e.g. m >= 8000) its H-classes are free Burnside groups of exponent m of infinite rank, and the D-class has infinitely many R- and L-classes.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"sec(7)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[{"quantity":"min_rank(maxgroup(dclass(pow(babab,2)),fbs(2,2,m)))","value":"2*m-1"}],"id":"sg_index2_noncyclic_groups","kind":"corollary","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"Corollary 9.2. The maximal groups in the D-class of (babab)^ 2 are free Burnside groups satisfying xm = 1 with at least 2m − 1 generators.\" and \"it shows that Brzozowski's conjecture [3] does not hold for n = 2 and m ≥ 8000.\" Attributed to do Lago thesis 1998 and LATIN'98."],"precheck":null,"rules":[],"says":"For x^2 = x^(2+m) with m >= 2 on two letters a, b, the maximal groups in the D-class of (babab)^2 are free Burnside groups of exponent m with at least 2m - 1 generators; for m large enough they are infinite and the congruence classes in this D-class are not recognizable. So Brzozowski's conjecture fails for n = 2 and m >= 8000, and Sigma is not stable for n = 2, m >= 2.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"cor(9.2)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_index2_period1_stability_open","kind":"open_problem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"For instance, whether or not Σ is stable for n = 2 and m = 1 is an open problem. If it holds, all the nice properties of Section 8 follow.\" (status as of 2001/2002)."],"precheck":null,"rules":[],"says":"Whether the relation Sigma is stable for x^2 = x^3 (n = 2, m = 1) is open; if it were, all the Section 8 consequences (unique shortest representatives, finite J-above, recognizable classes, cyclic maximal groups) would follow. The case n = 2, m = 1 is described as the least understood.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"sec(9)","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_index2_two_gen_infinite","kind":"theorem","kourovka":null,"notes":["Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"using Thue–Morse words [36] and the work of Brzozowski et al. [4], we know that the free Burnside monoids are infinite if |A| ≥ 2 and n ≥ 2, and that they have infinitely many D-classes.\" and (on x^2 = x^3 with two generators) \"it had just been discovered that this monoid was infinite, by work of Brzozowski et al. [4].\" Read via the survey only, not BCG 1971 itself."],"precheck":null,"rules":["the free semigroup on m generators with x^n = x^(n+d) is infinite  IF  m>=2,n>=2,d>=1"],"says":"The free Burnside monoid satisfying x^n = x^(n+m) is infinite (with infinitely many D-classes) whenever |A| >= 2 and n >= 2; in particular the 2-generator monoid satisfying x^2 = x^3 is infinite (Brzozowski-Culik-Gabrielian).","source":{"authors":["J. A. Brzozowski","K. Culik II","A. Gabrielian"],"locator":"unknown","ref":"bcg1971","title":"Classification of noncounting events","venue":"J. Comput. System Sci. 5","year":"1971"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_x2x3_overlapfree_unique","kind":"theorem","kourovka":null,"notes":["Source: https://www.mathnet.ru/eng/semr60. Quote: \"We prove that each such equivalence class contains at most one overlap-free word.\""],"precheck":null,"rules":[],"says":"In the free Burnside semigroup with two generators satisfying x^2 = x^3, each equivalence class of words contains at most one overlap-free word.","source":{"authors":["A. N. Plyushchenko"],"locator":"unknown","ref":"plyushchenko2009","title":"Overlap-free words and free Burnside semigroup with two generators satisfying x^2=x^3","venue":"Sib. Elektron. Mat. Izv. 6, 166-181","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_x2x3_canonical_reps","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/1102.4315 (arXiv API abstract). Quote: \"we construct a linear-time algorithm that partially solves the word problem for the semigroup under consideration.\" Kind=claim: arXiv v1 says only 'submitted to Internat. J. of Algebra and Comput.'; a search snippet reported IJAC 21(6) 2011, 973-1006, but that record was not opened."],"precheck":null,"rules":[],"says":"For the 2-generator free Burnside semigroup satisfying x^2 = x^3, overlap-free words and almost overlap-free words can serve as canonical representatives of their classes; such a word in a given class, if any, can be found efficiently, giving a linear-time algorithm that partially solves the word problem.","source":{"authors":["A. N. Plyushchenko","A. M. Shur"],"locator":"unknown","ref":"plyushchenko_shur2011","title":"Almost overlap-free words and the word problem for the free Burnside semigroup satisfying x^2=x^3","venue":"arXiv:1102.4315 (submitted to Internat. J. Algebra Comput.)","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_x2x3_reduction_two_gen","kind":"theorem","kourovka":null,"notes":["Source: https://mathnet.ru/eng/ivm8399. Quote: \"We study the word problem for free Burnside semigroups satisfying the identity\" (remaining statement paraphrased by the fetch tool from the abstract; notation B(2,1,k) there = index 2, period 1, k generators, i.e. fbs(k,2,1) here)."],"precheck":null,"rules":[],"says":"For every k > 2 the word problem for the k-generated free Burnside semigroup B(2,1,k) satisfying x^2 = x^3 reduces to that of the 2-generated B(2,1,2); if every element of B(2,1,2) is a regular language then so is every element of B(2,1,k). Hence B(2,1,k) satisfies Brzozowski's conjecture iff B(2,1,2) does.","source":{"authors":["A. N. Plyushchenko"],"locator":"unknown","ref":"plyushchenko2011","title":"On the word problem for the free Burnside semigroups satisfying x^2=x^3","venue":"Izv. Vyssh. Uchebn. Zaved. Mat. 2011(11), 89-93; Russian Math. 55(11), 76-79","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_x2x3_brzozowski_partial","kind":"theorem","kourovka":null,"notes":["Source: https://www.springerprofessional.de/on-brzozowski-s-conjecture-for-the-free-burnside-semigroup-satis/3686380. Quote: \"The case of the identity x 2 = x 3 is the only one, for which Brzozowski's conjecture is neither proved nor disproved.\""],"precheck":null,"rules":[],"says":"x^2 = x^3 is the only identity x^r = x^(r+m) for which Brzozowski's conjecture is neither proved nor disproved. For the 2-generator free Burnside semigroup satisfying x^2 = x^3, the conjecture holds for all elements containing an overlap-free or almost overlap-free word, and all but finitely many of these elements are 'big' languages in terms of growth rate.","source":{"authors":["A. N. Plyushchenko","A. M. Shur"],"locator":"unknown","ref":"plyushchenko_shur2011_dlt","title":"On Brzozowski's Conjecture for the Free Burnside Semigroup Satisfying x^2 = x^3","venue":"Developments in Language Theory (DLT 2011), Springer LNCS, pages unknown","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_gerhard_x3x_wp","kind":"theorem","kourovka":null,"notes":["Source: https://www.cambridge.org/core/journals/mathematical-proceedings-of-the-cambridge-philosophical-society/article/word-problem-for-semigroups-satisfying-x3-x/00CD495BAAB0CF9C0E62282C39F27815 (opening extract only). Quote: \"The free finitely generated semigroups satisfying x3 = x are thus established to be finite\" and \"providing such an algorithm is the purpose of the present paper\". The extract gives no element count."],"precheck":null,"rules":[],"says":"Gerhard (1978) gives an algorithm for the word problem in free (finitely generated) semigroups satisfying x^3 = x; these semigroups are finite by Green-Rees plus the fact that groups of exponent 2 are elementary abelian (at most 2^n elements on n generators).","source":{"authors":["J. A. Gerhard"],"locator":"unknown","ref":"gerhard1978","title":"The word problem for semigroups satisfying x^3 = x","venue":"Math. Proc. Cambridge Philos. Soc. 84(1), 11-19","year":"1978"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_restivo_reutenauer","kind":"theorem","kourovka":null,"notes":["Source 1: https://portal.mardi4nfdi.de/wiki/Publication:797705 (zbMATH review). Quote: \"A finitely generated semigroup S is proved to be finite if and only if S is torsion and possesses the following permutation property\". Source 2: https://portal.mardi4nfdi.de/wiki/Item:Q1917528 (review of Pirillo-Varricchio 1996). Quote: \"the result of Restivo and Reutenauer that a finitely generated semigroup S is finite if and only if S is periodic and permutable.\" Also the review of Restivo 1989 (Q1114022): \"every periodic s
