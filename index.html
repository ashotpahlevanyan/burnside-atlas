<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('kb').textContent);
const KIND_VAR = { definition: '--k-definition', theorem: '--k-theorem', lemma: '--k-lemma', corollary: '--k-corollary',
  computation: '--k-computation', open_problem: '--k-open', claim: '--k-claim', conjecture: '--k-conjecture', example: '--k-example' };
const KIND_NAME = { definition: 'Definition', theorem: 'Theorem', lemma: 'Lemma', corollary: 'Corollary', computation: 'Computation',
  open_problem: 'Open problem', claim: 'Claim', conjecture: 'Conjecture', example: 'Example' };
const DOMAIN_NAME = { burnside_groups: 'Burnside groups', adian: 'Novikov–Adian', burnside_semigroups: 'Semigroups', words: 'Words',
  cgt: 'Combinatorial group theory', commutators: 'Commutators & Engel', varieties: 'Varieties', amenability: 'Amenability' };
const ANCHOR = { burnside_groups: [0, 0], adian: [-420, -300], commutators: [460, -260], burnside_semigroups: [-520, 260],
  words: [-760, -10], cgt: [80, 470], varieties: [520, 300], amenability: [-60, -520] };
const STATUS_TRUST = { machine_verified: 'strong', checked: 'strong', elementary: 'mid', bounded_verified: 'mid',
  transcribed: 'weak', from_memory: 'memory', disputed: 'bad' };
const STATUS_NAME = { machine_verified: 'machine verified', checked: 'checked (2 sources)', elementary: 'elementary (proof in KB)',
  bounded_verified: 'bounded verification', transcribed: 'transcribed (1 source)', from_memory: 'from memory (unverified)', disputed: 'disputed' };
const HOW_NAME = { proof: 'proved using', special_case: 'special case of', generalizes: 'generalizes', equivalent: 'equivalent to',
  analogy: 'analogous to', motivates: 'motivated by', same_rank: 'same rank', lower_rank: 'lower rank' };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// --- data ---------------------------------------------------------------
const nodes = DATA.nodes.map(n => ({ ...n }));
const byId = new Map(nodes.map(n => [n.id, n]));
const edges = DATA.edges.filter(e => byId.has(e.from) && byId.has(e.to) && e.from !== e.to)
  .map(e => ({ ...e, source: e.to, target: e.from })); // draw prerequisite -> result
const uses = new Map(), usedBy = new Map();
for (const e of edges) {
  (uses.get(e.from) || uses.set(e.from, []).get(e.from)).push(e);
  (usedBy.get(e.to) || usedBy.set(e.to, []).get(e.to)).push(e);
}
for (const n of nodes) n.deg = (uses.get(n.id) || []).length + (usedBy.get(n.id) || []).length;
const proofs = DATA.proofs;
function treeItems(t, acc = new Set()) { if (!t) return acc; if (t.type === 'by') acc.add(t.item); (t.children || []).forEach(c => treeItems(c, acc)); return acc; }
function proofItems(p) {
  const s = new Set();
  if (p.tree) treeItems(p.tree, s);
  p.options.forEach(o => { treeItems(o.tree, s); if (o.open_problem && byId.has(o.open_problem)) s.add(o.open_problem); });
  return s;
}
proofs.forEach(p => p.items = proofItems(p));

document.getElementById('counts').textContent =
  `${DATA.counts.nodes} items · ${edges.length} links · KB export ${DATA.generated}`;

// --- layout (computed once, then static) ----------------------------------
for (const n of nodes) { const a = ANCHOR[n.domain] || [0, 0]; n.x = a[0] + (Math.random() - 0.5) * 120; n.y = a[1] + (Math.random() - 0.5) * 120; }
const radius = n => 4 + Math.min(10, Math.sqrt(n.deg) * 2.2);
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(46).strength(0.35))
  .force('charge', d3.forceManyBody().strength(n => n.deg ? -70 : -18).distanceMax(320))
  .force('x', d3.forceX(n => (ANCHOR[n.domain] || [0, 0])[0]).strength(n => n.deg ? 0.06 : 0.14))
  .force('y', d3.forceY(n => (ANCHOR[n.domain] || [0, 0])[1]).strength(n => n.deg ? 0.06 : 0.14))
  .force('collide', d3.forceCollide(n => radius(n) + 3))
  .stop();
for (let i = 0; i < 420; i++) sim.tick();

// --- svg -------------------------------------------------------------------
const svg = d3.select('#graph');
const root = svg.append('g');
const defs = svg.append('defs');
function marker(id, cls) {
  defs.append('marker').attr('id', id).attr('viewBox', '0 -5 10 10').attr('refX', 9).attr('refY', 0)
    .attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L9,0L0,4Z').attr('class', cls);
}
marker('arr', 'arr'); marker('parr', 'parr'); marker('aarr', 'aarr');
const styleMarkers = () => {
  defs.selectAll('.arr').attr('fill', css('--edge'));
  defs.selectAll('.parr').attr('fill', css('--accent'));
  defs.selectAll('.aarr').attr('fill', css('--k-open'));
};
styleMarkers();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', styleMarkers);
new MutationObserver(styleMarkers).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const gEdges = root.append('g'), gNodes = root.append('g'), gProof = root.append('g');
function curve(a, b, ra, rb, bend = 0.12) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
  const sx = a.x + dx / d * ra, sy = a.y + dy / d * ra, tx = b.x - dx / d * (rb + 2), ty = b.y - dy / d * (rb + 2);
  const mx = (sx + tx) / 2 - dy * bend, my = (sy + ty) / 2 + dx * bend;
  return `M${sx},${sy}Q${mx},${my} ${tx},${ty}`;
}
const edgeSel = gEdges.selectAll('path').data(edges).join('path')
  .attr('class', e => 'edge' + (['motivates', 'analogy'].includes(e.how) ? ' soft' : ''))
  .attr('marker-end', 'url(#arr)')
  .attr('d', e => curve(e.source, e.target, radius(e.source), radius(e.target)));
const nodeSel = gNodes.selectAll('g').data(nodes).join('g')
  .attr('class', n => 'node st-' + (STATUS_TRUST[n.status] === 'bad' ? 'bad' : ['weak', 'memory'].includes(STATUS_TRUST[n.status]) ? 'weak' : 'ok') + (n.deg >= 6 ? ' labelled' : ''))
  .attr('transform', n => `translate(${n.x},${n.y})`)
  .on('click', (ev, n) => { ev.stopPropagation(); selectItem(n.id); });
nodeSel.append('circle').attr('class', 'hit').attr('r', n => radius(n) + (matchMedia('(pointer: coarse)').matches ? 10 : 4));
nodeSel.append('circle').attr('class', 'dotc').attr('r', radius).attr('fill', n => `var(${KIND_VAR[n.kind] || '--k-definition'})`);
nodeSel.append('title').text(n => `${n.id}\n${n.says}`);
nodeSel.append('text').attr('class', 'lbl').attr('x', n => radius(n) + 4).attr('y', 3.5).text(n => labelOf(n));

function bookLoc(n) {
  const l = (n.source && n.source.locator) || '';
  const sec = l.match(/sec\('?([^')]+)'?\)/), pg = l.match(/page\((\d+)\)/);
  return sec ? { sec: sec[1], page: pg ? pg[1] : null } : null;
}
function labelOf(n) {
  if (n.kourovka) return `Kourovka ${n.kourovka.num}`;
  if (n.source && n.source.ref === 'adian1975') { const b = bookLoc(n); if (b) return `Adian ${b.sec}`; }
  return n.id.replace(/_/g, ' ');
}

// --- zoom ----------------------------------------------------------------------------
const zoom = d3.zoom().scaleExtent([0.15, 5]).on('zoom', ev => root.attr('transform', ev.transform));
svg.call(zoom).on('dblclick.zoom', null);
svg.on('click', () => { /* background click keeps the current view */ });
function fitTo(list, pad = 70, dur = 650) {
  const box = document.getElementById('graph').getBoundingClientRect();
  if (!list.length || !box.width) return;
  const xs = list.map(n => n.x), ys = list.map(n => n.y);
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const k = Math.min(2.2, 0.92 * Math.min(box.width / (x1 - x0), box.height / (y1 - y0)));
  const t = d3.zoomIdentity.translate(box.width / 2, box.height / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  (reduce ? svg : svg.transition().duration(dur)).call(zoom.transform, t);
}
document.getElementById('zin').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.35);
document.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.35);
document.getElementById('zfit').onclick = () => fitTo(nodes.filter(visible));

// --- visibility filters -----------------------------------------------------------------
const domainOn = new Set(Object.keys(DOMAIN_NAME));
let showIsolated = false, forced = new Set();
function visible(n) { return domainOn.has(n.domain) && (n.deg > 0 || showIsolated || forced.has(n.id)); }
function applyVisibility() {
  nodeSel.attr('display', n => visible(n) ? null : 'none');
  edgeSel.attr('display', e => visible(e.source) && visible(e.target) ? null : 'none');
}
const toggles = document.getElementById('toggles');
for (const [d, name] of Object.entries(DOMAIN_NAME)) {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = name; b.setAttribute('aria-pressed', 'true');
  b.onclick = () => { domainOn.has(d) ? domainOn.delete(d) : domainOn.add(d); b.setAttribute('aria-pressed', domainOn.has(d)); applyVisibility(); };
  toggles.appendChild(b);
}
const iso = document.createElement('button'); iso.className = 'chip'; iso.setAttribute('aria-pressed', 'false');
const nIso = nodes.filter(n => !n.deg).length;
iso.textContent = `Unlinked items (${nIso})`;
iso.title = 'Items with no links yet, mostly Kourovka problems';
iso.onclick = () => { showIsolated = !showIsolated; iso.setAttribute('aria-pressed', showIsolated); applyVisibility(); };
toggles.appendChild(iso);

// --- legend ------------------------------------------------------------------------------
const legend = document.getElementById('legend');
const kinds = [...new Set(nodes.map(n => n.kind))].filter(k => KIND_NAME[k]);
legend.innerHTML = `<div class="row">${kinds.map(k => `<span class="sw"><span class="dot" style="background:var(${KIND_VAR[k]})"></span>${KIND_NAME[k]}</span>`).join('')}</div>
  <div class="row"><span class="sw"><span class="ring"></span>source-checked</span><span class="sw"><span class="ring dashed"></span>unverified</span>
  <span class="sw">arrow: prerequisite → result</span></div>`;

// --- highlighting -------------------------------------------------------------------------
function clearHighlight() {
  root.classed('dimmed', false);
  nodeSel.classed('hl', false).classed('sel', false);
  edgeSel.classed('hl', false);
  gProof.selectAll('*').remove();
  forced = new Set();
}
function ancestors(id) {
  const seen = new Set([id]), stack = [id], es = new Set();
  while (stack.length) {
    const x = stack.pop();
    for (const e of uses.get(x) || []) { es.add(e); if (!seen.has(e.to)) { seen.add(e.to); stack.push(e.to); } }
  }
  return { nodes: seen, edges: es };
}
function highlightItem(id, mode) {
  clearHighlight();
  const sel = new Set([id]); let es = new Set();
  if (mode === 'path') { const a = ancestors(id); a.nodes.forEach(x => sel.add(x)); es = a.edges; }
  else {
    (uses.get(id) || []).forEach(e => { sel.add(e.to); es.add(e); });
    (usedBy.get(id) || []).forEach(e => { sel.add(e.from); es.add(e); });
  }
  forced = new Set(sel); applyVisibility();
  root.classed('dimmed', true);
  nodeSel.classed('hl', n => sel.has(n.id)).classed('sel', n => n.id === id);
  edgeSel.classed('hl', e => es.has(e));
  fitTo([...sel].map(x => byId.get(x)));
}
function drawProof(p, optIndex) {
  clearHighlight();
  const trees = p.tree ? [p.tree] : (optIndex == null ? p.options.map(o => o.tree) : [p.options[optIndex].tree]);
  const steps = [], sel = new Set();
  let k = 0;
  const walk = (t, parentItem) => {
    if (t.type === 'by') {
      sel.add(t.item);
      if (parentItem && parentItem !== t.item) steps.push({ from: t.item, to: parentItem, kind: 'step' });
      t._step = ++k;
      (t.children || []).forEach(c => walk(c, t.item));
    } else if (t.type === 'assumed') {
      const opt = p.options.find(o => JSON.stringify(o.tree).includes(JSON.stringify(t)));
      if (opt && opt.open_problem && byId.has(opt.open_problem) && parentItem) {
        sel.add(opt.open_problem); steps.push({ from: opt.open_problem, to: parentItem, kind: 'assume' });
      }
    }
  };
  trees.forEach(t => walk(t, null));
  forced = new Set(sel); applyVisibility();
  root.classed('dimmed', true);
  nodeSel.classed('hl', n => sel.has(n.id));
  const uniq = new Map(); steps.forEach(s => uniq.set(s.from + '>' + s.to + s.kind, s));
  gProof.selectAll('path').data([...uniq.values()]).join('path')
    .attr('class', s => 'pedge' + (s.kind === 'assume' ? ' assume' : ''))
    .attr('marker-end', s => s.kind === 'assume' ? 'url(#aarr)' : 'url(#parr)')
    .attr('d', s => { const a = byId.get(s.from), b = byId.get(s.to); return curve(a, b, radius(a) + 3, radius(b) + 3, 0.18); });
  // conclusion first: number items in proof order
  const order = []; const visit = t => { if (t.type === 'by' && !order.includes(t.item)) order.push(t.item); (t.children || []).forEach(visit); };
  trees.forEach(visit);
  const g = gProof.selectAll('g.num').data(order).join('g').attr('class', 'num')
    .attr('transform', id => { const n = byId.get(id); return `translate(${n.x - radius(n) - 9},${n.y - radius(n) - 6})`; });
  g.append('circle').attr('r', 8).attr('class', 'pstep-bg');
  g.append('text').attr('class', 'pstep').text((_, i) => i + 1);
  fitTo([...sel].map(x => byId.get(x)), 90);
}

// --- panel ------------------------------------------------------------------------------------
const panel = document.getElementById('panel');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const trustClass = st => 'trust-' + (STATUS_TRUST[st] || 'memory');

// Links to the paper behind an item: arXiv ids and DOIs in its reference, then
// source pages named in its notes. Falls back to a Google Scholar search.
function paperLinks(n) {
  const out = [], seen = new Set();
  const add = (url, label) => { url = url.replace(/[.,;:)\]]+$/, ''); if (!seen.has(url)) { seen.add(url); out.push({ url, label }); } };
  const src = n.source || {};
  const refText = `${src.title || ''} ${src.venue || ''}`;
  for (const m of refText.matchAll(/arXiv:\s*((?:\d{4}\.\d{4,5})|(?:[a-z-]+\/\d{7}))(v\d+)?/gi)) add(`https://arxiv.org/abs/${m[1]}`, `arXiv ${m[1]}`);
  for (const m of refText.matchAll(/doi:\s*(10\.\d{4,9}\/[^\s,;]+)/gi)) add(`https://doi.org/${m[1]}`, `DOI ${m[1]}`);
  for (const m of refText.matchAll(/https?:\/\/[^\s"')\]]+/g)) add(m[0], linkLabel(m[0]));
  for (const t of n.notes || []) for (const m of t.matchAll(/https?:\/\/[^\s"')\]]+/g)) add(m[0], linkLabel(m[0]));
  return out;
}
function linkLabel(url) {
  try {
    const u = new URL(url), h = u.hostname.replace(/^www\./, '');
    const ax = url.match(/arxiv\.org\/(?:abs|pdf)\/([^\s?#]+?)(?:\.pdf)?$/);
    if (ax) return `arXiv ${ax[1]}`;
    if (h === 'doi.org') return `DOI ${u.pathname.slice(1)}`;
    return `${h}${u.pathname.length > 1 ? u.pathname.slice(0, 32) + (u.pathname.length > 32 ? '…' : '') : ''}`;
  } catch { return url; }
}
function scholarLink(n) {
  const src = n.source || {};
  if (!src.title) return null;
  const q = `${src.title} ${(src.authors || []).slice(0, 2).join(' ')}`.replace(/\(.*?\)/g, '');
  return `https://scholar.google.com/scholar?q=${encodeURIComponent(q)}`;
}
function proofSection(n) {
  if (n.status === 'elementary') return `<section><p class="eyebrow">Read the proof</p><p class="explain">Short standard argument, written out in the notes below.</p></section>`;
  const links = paperLinks(n), sch = scholarLink(n);
  if (!links.length && !sch) return '';
  return `<section><p class="eyebrow">Read the proof</p><ul class="links">${links.map(l =>
      `<li><span class="how">${l.label.startsWith('arXiv') ? 'arXiv' : l.label.startsWith('DOI') ? 'publisher' : 'source page'}</span><a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join('')}
    ${sch ? `<li><span class="how">search</span><a class="lnk" href="${esc(sch)}" target="_blank" rel="noopener">Google Scholar: ${esc((n.source.title || '').slice(0, 48))}${(n.source.title || '').length > 48 ? '…' : ''}</a></li>` : ''}</ul>
    ${links.length ? '' : `<p class="explain">No direct link recorded yet; the search finds the paper by title.</p>`}</section>`;
}
const verdictPill = v => `<span class="verdict v-${v}">${v}</span>`;
let currentProof = 0;

function hypList() {
  return `<section><p class="eyebrow">Hypotheses checked by the prover</p><div class="hyps">${proofs.map((p, i) =>
    `<button class="hyp" data-proof="${i}" aria-pressed="${i === currentProof}">${verdictPill(p.verdict)}<span class="q">${esc(p.query)}</span></button>`).join('')}</div></section>`;
}
function stepHTML(t, order) {
  if (t.type === 'assumed') return `<li><div class="step assumed"><span class="s">${esc(t.statement)}</span></div></li>`;
  const n = byId.get(t.item);
  const idx = order.indexOf(t.item) + 1;
  const kids = (t.children || []).map(c => stepHTML(c, order)).join('');
  return `<li><div class="step"><span class="s">${esc(t.statement)}</span>
    <span class="by"><span class="num">${idx}</span>by <button class="lnk" data-item="${esc(t.item)}">${esc(t.item)}</button>
    ${n ? `<span class="pill ${trustClass(n.status)}">${esc(STATUS_NAME[n.status] || n.status)}</span>` : ''}
    ${n && paperLinks(n)[0] ? `<a class="lnk" href="${esc(paperLinks(n)[0].url)}" target="_blank" rel="noopener" title="${esc(paperLinks(n)[0].label)}">paper ↗</a>` : ''}</span>
    ${(t.checks || []).map(c => `<span class="chk">check ${esc(c)}</span>`).join('')}</div>${kids ? `<ol>${kids}</ol>` : ''}</li>`;
}
function orderOf(trees) { const o = []; const v = t => { if (t.type === 'by' && !o.includes(t.item)) o.push(t.item); (t.children || []).forEach(v); }; trees.forEach(v); return o; }

function renderProof(i, optIndex = null) {
  currentProof = i;
  const p = proofs[i];
  let body = '';
  if (p.verdict === 'proved' || p.verdict === 'refuted') {
    const lead = p.verdict === 'refuted'
      ? `The hypothesis is false: the prover proves its opposite.` : `Proved from the theorems in the knowledge base.`;
    body = `<p class="explain">${lead} Trust is set by the weakest step: <span class="pill ${trustClass(p.trust)}">${esc(STATUS_NAME[p.trust] || p.trust)}</span></p>
      <ol class="tree">${stepHTML(p.tree, orderOf([p.tree]))}</ol>`;
  } else if (p.verdict === 'unknown') {
    body = p.options.length
      ? `<p class="explain">Not provable or refutable from what is encoded. The proof path stops at an open problem. It would go through under either assumption:</p>
         ${p.options.map((o, j) => `<div class="option" aria-current="${optIndex === j}">
            <div class="meta"><span class="verdict v-unknown">option ${j + 1}</span>${o.open_problem ? `<button class="lnk" data-item="${esc(o.open_problem)}">${esc(o.open_problem)}</button>` : ''}
            <button class="btn ghost" data-opt="${j}">Show on graph</button></div>
            <ol class="tree">${stepHTML(o.tree, orderOf([o.tree]))}</ol></div>`).join('')}`
      : `<p class="explain">Not provable or refutable from what is encoded, and no single consistent assumption makes it provable. Finiteness of B(2,8) is open.</p>`;
  }
  panel.innerHTML = `${hypList()}<section class="card"><p class="eyebrow">Proof</p><h2>${esc(p.query)}</h2>
    <div class="meta">${verdictPill(p.verdict)}</div>${body}</section>`;
  drawProof(p, optIndex);
  bindPanel();
}

function renderItem(id) {
  const n = byId.get(id);
  if (!n) return;
  const src = n.source || {};
  const cite = src.title
    ? `${esc((src.authors || []).join(', '))}, <i>${esc(src.title)}</i>, ${esc(src.venue)} (${esc(src.year)})${src.locator && src.locator !== 'unknown' ? `, ${esc(bookLoc(n) ? `§${bookLoc(n).sec}${bookLoc(n).page ? `, p. ${bookLoc(n).page}` : ''}` : src.locator)}` : ''}`
    : esc(src.ref || '');
  const out = (uses.get(id) || []), inn = (usedBy.get(id) || []);
  const inProofs = proofs.map((p, i) => [p, i]).filter(([p]) => p.items.has(id));
  const k = n.kourovka;
  panel.innerHTML = `
    <section class="card">
      <div class="meta"><span class="pill kind" style="background:var(${KIND_VAR[n.kind] || '--k-definition'})">${esc(KIND_NAME[n.kind] || n.kind)}</span>
        <span class="pill">${esc(DOMAIN_NAME[n.domain] || n.domain)}</span>
        <span class="pill ${trustClass(n.status)}">${esc(STATUS_NAME[n.status] || n.status)}</span></div>
      <h2>${esc(labelOf(n))}</h2>
      <span class="idtag">${esc(n.id)}</span>
      <p class="statement">${esc(n.says)}</p>
      ${cite ? `<p class="cite">${cite}</p>` : ''}
      ${k ? `<div class="kour"><strong>Kourovka Notebook ${esc(k.num)}</strong><span>Printed as: ${esc(k.mark === 'ai_unverified' ? 'unverified AI solution' : k.mark)}</span>
           ${n.precheck ? `<span class="muted">Pre-check: ${esc(n.precheck.class.replace('_', ' '))}. ${esc(n.precheck.summary)}</span>` : ''}</div>` : ''}
      <div class="btnrow">
        <button class="btn" id="bpath" ${out.length ? '' : 'disabled'}>Show proof path</button>
        <button class="btn ghost" id="bnb">Direct links</button>
      </div>
      ${out.length ? '' : `<p class="explain">No prerequisites recorded for this item yet.</p>`}
    </section>
    ${proofSection(n)}
    ${n.rules.length ? `<section><p class="eyebrow">Encoded for the prover</p><ul class="rules">${n.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      ${n.caveats.map(c => `<p class="explain">Caveat: ${esc(c)}</p>`).join('')}</section>` : ''}
    ${inProofs.length ? `<section><p class="eyebrow">Used in these checked hypotheses</p><div class="hyps">${inProofs.map(([p, i]) =>
      `<button class="hyp" data-proof="${i}">${verdictPill(p.verdict)}<span class="q">${esc(p.query)}</span></button>`).join('')}</div></section>` : ''}
    ${out.length ? `<section><p class="eyebrow">Rests on</p><ul class="links">${out.map(e => `<li><span class="how">${esc(HOW_NAME[e.how] || e.how)}</span><button class="lnk" data-item="${esc(e.to)}">${esc(e.to)}</button></li>`).join('')}</ul></section>` : ''}
    ${inn.length ? `<section><p class="eyebrow">Used by</p><ul class="links">${inn.map(e => `<li><span class="how">${esc(e.how)}</span><button class="lnk" data-item="${esc(e.from)}">${esc(e.from)}</button></li>`).join('')}</ul></section>` : ''}
    ${n.facts.length ? `<section><p class="eyebrow">Facts</p><ul class="rules">${n.facts.map(f => `<li>${esc(f.quantity)} = ${esc(f.value)}</li>`).join('')}</ul></section>` : ''}
    ${n.notes.length ? `<details><summary>Sources and notes (${n.notes.length})</summary>${n.notes.map(t => `<p class="note">${esc(t)}</p>`).join('')}</details>` : ''}
    <section><button class="lnk" id="back">← Back to checked hypotheses</button></section>`;
  bindPanel();
  document.getElementById('bpath').onclick = () => highlightItem(id, 'path');
  document.getElementById('bnb').onclick = () => highlightItem(id, 'near');
  document.getElementById('back').onclick = () => renderProof(currentProof);
}
function selectItem(id) { renderItem(id); highlightItem(id, (uses.get(id) || []).length ? 'path' : 'near'); panel.scrollTop = 0; }
function bindPanel() {
  panel.querySelectorAll('[data-proof]').forEach(b => b.onclick = () => { renderProof(+b.dataset.proof); panel.scrollTop = 0; });
  panel.querySelectorAll('[data-item]').forEach(b => b.onclick = () => selectItem(b.dataset.item));
  panel.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => renderProof(currentProof, +b.dataset.opt));
}

// --- search ---------------------------------------------------------------------------------
const q = document.getElementById('q'), results = document.getElementById('results');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  if (s.length < 2) { results.hidden = true; return; }
  const hits = nodes.filter(n => n.id.toLowerCase().includes(s) || n.says.toLowerCase().includes(s) ||
    (n.source && (n.source.authors || []).join(' ').toLowerCase().includes(s)) || (n.kourovka && n.kourovka.num === s)).slice(0, 12);
  results.innerHTML = hits.length ? hits.map(n => `<li><button data-id="${esc(n.id)}"><span class="rid">${esc(labelOf(n))}</span><span class="rtx">${esc(n.says)}</span></button></li>`).join('')
    : `<li class="muted" style="padding:6px 8px">No match</li>`;
  results.hidden = false;
  results.querySelectorAll('button').forEach(b => b.onclick = () => { results.hidden = true; q.value = ''; selectItem(b.dataset.id); });
});
q.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { const b = results.querySelector('button'); if (b) b.click(); }
  if (ev.key === 'Escape') results.hidden = true;
});
document.addEventListener('click', ev => { if (!ev.target.closest('.search')) results.hidden = true; });

// --- start: a proof on screen -------------------------------------------------------------------
applyVisibility();
const start = proofs.findIndex(p => p.query.includes('not residually finite'));
requestAnimationFrame(() => renderProof(start >= 0 ? start : 0));
})();
</script>
