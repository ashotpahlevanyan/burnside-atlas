ef":"sims1994","title":"Computation with Finitely Presented Groups","venue":"Cambridge Univ. Press","year":"1994"},"status":"from_memory"},{"caveats":[],"domain":"cgt","facts":[],"id":"knuth_bendix","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Knuth-Bendix completion produces a confluent rewriting system when it terminates, giving normal forms and solving the word problem.","source":{"authors":["C. C. Sims"],"locator":"unknown","ref":"sims1994","title":"Computation with Finitely Presented Groups","venue":"Cambridge Univ. Press","year":"1994"},"status":"from_memory"},{"caveats":[],"domain":"varieties","facts":[],"id":"birkhoff_hsp","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"A class of algebras is defined by identities iff it is closed under homomorphic images, subalgebras and direct products.","source":{"authors":["G. Birkhoff"],"locator":"unknown","ref":"birkhoff1935","title":"On the structure of abstract algebras","venue":"Proc. Cambridge Philos. Soc. 31","year":"1935"},"status":"from_memory"},{"caveats":[],"domain":"varieties","facts":[],"id":"neumann_finite_basis","kind":"open_problem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"B. H. Neumann: is every variety of groups finitely based? Answered negatively in 1970 (Adian; Ol'shanskii; Vaughan-Lee).","source":{"authors":["H. Neumann"],"locator":"unknown","ref":"neumann1967","title":"Varieties of Groups","venue":"Springer","year":"1967"},"status":"from_memory"},{"caveats":[],"domain":"varieties","facts":[],"id":"uncountably_many_varieties","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"There are uncountably many varieties of groups (Ol'shanskii 1970; Vaughan-Lee 1970; Adian 1970).","source":{"authors":["M. R. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1970","title":"Uncountably many varieties of groups","venue":"Bull. London Math. Soc. 2","year":"1970"},"status":"from_memory"},{"caveats":[],"domain":"varieties","facts":[],"id":"burnside_variety","kind":"definition","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"The Burnside variety B_n is the variety of groups defined by x^n = 1; B(m,n) is its relatively free group of rank m.","source":{"authors":["H. Neumann"],"locator":"unknown","ref":"neumann1967","title":"Varieties of Groups","venue":"Springer","year":"1967"},"status":"from_memory"},{"caveats":[],"domain":"amenability","facts":[],"id":"von_neumann_conjecture","kind":"conjecture","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"(von Neumann-Day) A group is non-amenable iff it contains a non-abelian free subgroup. FALSE.","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"unknown","ref":"olshanskii1980","title":"On the question of the existence of an invariant mean on a group","venue":"Uspekhi Mat. Nauk 35","year":"1980"},"status":"from_memory"},{"caveats":[],"domain":"amenability","facts":[],"id":"tarski_monster","kind":"theorem","kourovka":null,"notes":["Construction via graded diagrams; continuum many non-isomorphic Tarski monsters for each prime p > 10^75; they are simple. Date given as 1979/1980/1982 in different sources.","Bound check: zbMATH review 0771.20015 (Adian-Lysenok) gives Ol'shanskii's original as primes n > 10^75, matching this item; Adian's 2010 survey says '1982 ... для простых n > 10^78' (likely the 1982 paper or a misprint). Atabekyan-Ivanov: odd n > 10^80. Adian-Lysenok 1991: odd n >= 1003 (new item adian_lysenok_tarski_1003)."],"precheck":null,"rules":[],"says":"For every sufficiently large prime p (p > 10^75) there is an infinite group all of whose proper non-trivial subgroups have order p (Tarski monster); these are non-amenable without free subgroups.","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"unknown","ref":"olshanskii1980","title":"On the question of the existence of an invariant mean on a group","venue":"Uspekhi Mat. Nauk 35","year":"1980"},"status":"checked"},{"caveats":[],"domain":"amenability","facts":[],"id":"grigorchuk_growth","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"The Grigorchuk group has intermediate growth (between polynomial and exponential), answering Milnor's question.","source":{"authors":["R. I. Grigorchuk"],"locator":"unknown","ref":"grigorchuk1984","title":"Degrees of growth of finitely generated groups and the theory of invariant means","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 48","year":"1984"},"status":"from_memory"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"elem_quotient_divisor","kind":"lemma","kourovka":null,"notes":["Proof: B(m,d) is m-generated and every element satisfies x^d = 1, hence x^n = 1. By the universal property of B(m,n) (def_free_burnside_group), B(m,d) is a quotient of B(m,n). A quotient of a finite group is finite."],"precheck":null,"rules":["B(m,n) is finite  IF  B(m,d) is finite; integer(d),integer(n),n<d,d mod n=:=0","B(m,n) is infinite  IF  B(m,d) is infinite; integer(n),divisor(d,n)"],"says":"If d divides n, then B(m,d) is a quotient of B(m,n). Hence finiteness of B(m,n) implies finiteness of B(m,d), and infiniteness of B(m,d) implies infiniteness of B(m,n).","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"elem_quotient_rank","kind":"lemma","kourovka":null,"notes":["Proof: map the first m free generators of B(m',n) to the generators of B(m,n) and the others to 1. By the universal property this extends to a surjective homomorphism."],"precheck":null,"rules":["B(m,n) is infinite  IF  B(2,n) is infinite; integer(m),m>2"],"says":"If m <= m', then B(m,n) is a quotient of B(m',n). Hence infiniteness of B(m,n) implies infiniteness of B(m',n).","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"elem_cyclic","kind":"lemma","kourovka":null,"notes":["Proof: the free group of rank 1 is Z, and its quotient by the subgroup generated by all n-th powers is Z/nZ."],"precheck":null,"rules":["|B(1,m)| = m  IF  integer(m),m>=1"],"says":"B(1,n) is cyclic of order n.","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"elem_order_finite","kind":"lemma","kourovka":null,"notes":["Definition."],"precheck":null,"rules":["finite(m)  IF  order(m,n)"],"says":"A group with a known finite order is finite.","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"elementary"},{"caveats":[],"domain":"varieties","facts":[],"id":"elem_lf_variety","kind":"lemma","kourovka":null,"notes":["Proof: an m-generated group of exponent dividing n is a quotient of B(m,n), so it is finite whenever B(m,n) is; conversely B(m,n) itself is an m-generated group in the variety."],"precheck":null,"rules":["B(m,n) is finite  IF  every finitely generated group of exponent n is finite; integer(m),m>=1","some finitely generated group of exponent m is infinite  IF  B(2,m) is infinite"],"says":"The Burnside variety of exponent n is locally finite iff B(m,n) is finite for every m. In particular, if some B(m,n) is infinite, the variety is not locally finite.","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"elem_restricted_finite","kind":"lemma","kourovka":null,"notes":["Definition: R(m,n) is the largest finite m-generated group of exponent n."],"precheck":null,"rules":["R(m,n) is finite  IF  R(m,n) exists (largest finite m-generated group of exponent n)"],"says":"If R(m,n) exists, it is finite.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1993","title":"The Restricted Burnside Problem (2nd ed.)","venue":"Oxford Univ. Press","year":"1993"},"status":"elementary"},{"caveats":[],"domain":"commutators","facts":[],"id":"elem_nilpotent_lnp","kind":"lemma","kourovka":null,"notes":["Proof: every group in the variety, hence every finitely generated subgroup of it, is nilpotent of class at most the bound."],"precheck":null,"rules":["locally_nilpotent(m)  IF  class_le(m,n)"],"says":"A variety of groups that are nilpotent of bounded class consists of locally nilpotent groups.","source":{"authors":["D. J. S. Robinson"],"locator":"ch(12)","ref":"robinson1996","title":"A Course in the Theory of Groups, 2nd ed.","venue":"Springer, Graduate Texts in Mathematics 80, ISBN 978-0-387-94461-6","year":"1996"},"status":"elementary"},{"caveats":[],"domain":"varieties","facts":[],"id":"elem_law_subvariety","kind":"lemma","kourovka":null,"notes":["Proof: a group satisfying L1 satisfies L2, so it belongs to var(L2); local nilpotency is a property of the group, so it holds."],"precheck":null,"rules":["the variety of groups of exponent m consists of locally nilpotent groups  IF  implies_law(exp(m),n); locally_nilpotent(var(n))"],"says":"If every group satisfying law L1 also satisfies law L2, the variety defined by L1 lies inside the variety defined by L2, so it inherits every property of the larger variety that passes to subgroups and quotients (e.g. local nilpotency).","source":{"authors":["H. Neumann"],"locator":"unknown","ref":"neumann1967","title":"Varieties of Groups","venue":"Springer","year":"1967"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"elem_lnp_periodic_lf","kind":"lemma","kourovka":null,"notes":["Proof: a finitely generated nilpotent group has a central series whose factors are finitely generated abelian groups; with finite exponent each factor is finite, so the group is finite (Robinson, ch. 5)."],"precheck":null,"rules":["every finitely generated group of exponent m is finite  IF  the variety of groups of exponent m consists of locally nilpotent groups"],"says":"A finitely generated nilpotent group of finite exponent is finite. Hence if all groups of exponent n are locally nilpotent, they are locally finite and every B(m,n) is finite.","source":{"authors":["D. J. S. Robinson"],"locator":"ch(5)","ref":"robinson1996","title":"A Course in the Theory of Groups, 2nd ed.","venue":"Springer, Graduate Texts in Mathematics 80, ISBN 978-0-387-94461-6","year":"1996"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"elem_burnside_periodic","kind":"lemma","kourovka":null,"notes":["Proof: B(m,n) is generated by m elements and every element satisfies x^n = 1."],"precheck":null,"rules":["there is a finitely generated infinite periodic group  IF  B(2,665) is infinite"],"says":"B(m,n) is finitely generated and periodic. So an infinite B(m,n) is a finitely generated infinite periodic group, a negative answer to the general Burnside problem.","source":{"authors":["W. Burnside"],"locator":"unknown","ref":"burnside1902","title":"On an unsettled question in the theory of discontinuous groups","venue":"Quart. J. Pure Appl. Math. 33","year":"1902"},"status":"elementary"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"elem_lf_semigroup_variety","kind":"lemma","kourovka":null,"notes":["Proof: the free object is a finitely generated member of the variety."],"precheck":null,"rules":["the free semigroup on m generators with x^1 = x^(1+n) is finite  IF  every finitely generated semigroup with x^(n+1) = x is finite; integer(m),m>=1"],"says":"If every finitely generated semigroup satisfying x^(n+1) = x is finite, then each free Burnside semigroup B(k; 1, n) is finite (it is one of them).","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"elementary"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order(y(3,7))","value":"254016"},{"quantity":"order(y(4,5))","value":"979200"},{"quantity":"order(y(3,6))","value":"30720"},{"quantity":"order(y(3,5))","value":"4080"}],"id":"sidki_y_orders","kind":"computation","kourovka":null,"notes":["All values agree with the known cases printed in Kourovka 18.90 (Y(m,2) = C_2^m, Y(m,3) = A_{m+2}, |Y(m,4)| = 2^(m(m+3)/2), |Y(2,n)| = n*2^(n-1), Y(3,5) = SL(2,16)). Y(3,7) = 254016 = |SL(2,8)|^2 = |Omega+(4,8)| and Y(4,5) = 979200 = |Omega(5,4)| agree with the identifications from the unpublished Felsch-Neubuser-O'Brien computations (McInroy-Shpectorov, J. Algebra 434 (2015), Table 1). Times: Y(3,7) 51 s, Y(4,5) 375 s (SWI-Prolog, HLT). Y(3,6) = 30720 = 2^11 * 15 (Conder 2018 proves Y(m,6) finite for all m)."],"precheck":null,"rules":[],"says":"Orders of Sidki's groups Y(m,n) = <a_1..a_m | a_k^n, (a_k^i a_l^i)^2 (k<l, 1<=i<=n/2)> computed by coset enumeration over the trivial subgroup: Y(2,2..7) = 4, 12, 32, 80, 192, 448; Y(3,2..7) = 8, 60, 512, 4080, 30720, 254016; Y(4,2) = 16, Y(4,3) = 360, Y(5,3) = 2520, Y(4,5) = 979200.","source":{"authors":["E. I. Khukhro","V. D. Mazurov (eds.)"],"locator":"prob('18.90')","ref":"kourovka21","title":"Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21","venue":"arXiv:1401.0300v50 (2 Nov 2026)","year":"2026"},"status":"machine_verified"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"olshanskii_periodic_hyperbolic","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/21162 (zbMATH summary). Quote: \"for any noncyclic hyperbolic torsion-free group G there exists an integer n(G) such that the factor group G/G^n is infinite for any odd n >= n(G)\". Second source: https://arxiv.org/abs/1211.4271 (Coulon, intro, Theorem 1): \"Let G be a non-elementary, torsion-free hyperbolic group. There exists a critical exponent n(G) such that for all odd integers n >= n(G), the quotient G/G^n is infinite.\""],"precheck":null,"rules":[],"says":"For every non-cyclic torsion-free hyperbolic group G there is n(G) such that G/G^n is infinite for every odd n >= n(G). Moreover the intersection of all G^i (i >= 1) is trivial. (G^n = subgroup generated by all n-th powers.)","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"unknown","ref":"olshanskii1991_hyperbolic","title":"Periodic quotient groups of hyperbolic groups","venue":"Mat. Sb. 182(4), 543-567; Engl. Math. USSR Sb. 72(2), 519-541 (1992)","year":"1991"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"gromov_periodic_question","kind":"conjecture","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1810.08372 (Coulon, intro). Quote: \"The next theorem is originally due to Ol'shanskii and Ivanov [41, 35] answering a question of Gromov [24].\" Ref [24] = Gromov, Hyperbolic groups, Essays in group theory, 75-263, 1987. Exact wording of Gromov's question not seen."],"precheck":null,"rules":[],"says":"(Gromov's question) For a non-elementary hyperbolic group G, is there an exponent n such that the n-periodic quotient G/G^n is infinite? Answered positively by Ol'shanskii (torsion-free, odd n) and Ivanov-Ol'shanskii (general).","source":{"authors":["M. Gromov"],"locator":"unknown","ref":"gromov1987","title":"Hyperbolic groups","venue":"Essays in Group Theory, Springer, 75-263","year":"1987"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"ivanov_olshanskii_hyperbolic","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1810.08372 (Coulon, Theorem 1.2). Quote: \"Let G be a non-elementary hyperbolic group. There exist p, n0 in N, such that for every integer n >= n0 that is a multiple of p, the quotient G/G^n is infinite.\" Second source: https://arxiv.org/abs/0804.3328 (Minasyan-Olshanskii-Sonkin abstract): \"developed by Ivanov and Olshanskii in order to show that there exists an integer n such that G/G^n is an infinite group of exponent n\". The 'uses ivanov_even' link follows the AMS abstract as quoted in a search snippet only (proofs depend on the Burnside problem for even exponents); AMS page itself returned 403."],"precheck":null,"rules":[],"says":"Let G be a non-elementary hyperbolic group. There exist p, n0 such that for every n >= n0 that is a multiple of p, the quotient G/G^n is infinite. Moreover the intersection of all G^n (n >= 1) is trivial.","source":{"authors":["S. V. Ivanov","A. Yu. Ol'shanskii"],"locator":"unknown","ref":"ivanov_olshanskii1996","title":"Hyperbolic groups and their quotients of bounded exponents","venue":"Trans. Amer. Math. Soc. 348(6), 2091-2138","year":"1996"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"delzant_gromov_burnside","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/5488495 (zbMATH review). Quote: \"the authors provide a geometric proof of the celebrated Novikov-Adyan theorem establishing that the free Burnside groups of sufficiently large odd exponent are infinite\". Second source: https://arxiv.org/abs/1302.6933 (Coulon notes, IJAC 2014): \"the geometrical approach of small cancellation theory used by T. Delzant and M. Gromov to provide a new proof of the infiniteness of free Burnside groups and periodic quotients of torsion-free hyperbolic groups\". Coulon 1810.08372 adds: \"their work only applies to odd exponents\"."],"precheck":null,"rules":[],"says":"Mesoscopic curvature / very small cancellation theory: groups with a sufficiently strict (graded) small cancellation condition act on CAT_sigma(-1,epsilon) spaces; this yields a geometric proof that free Burnside groups (and periodic quotients of torsion-free hyperbolic groups) of sufficiently large odd exponent are infinite.","source":{"authors":["T. Delzant","M. Gromov"],"locator":"unknown","ref":"delzant_gromov2008","title":"Courbure mesoscopique et theorie de la toute petite simplification","venue":"J. Topol. 1(4), 804-836","year":"2008"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_even_new_proof","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/1810.08372 (abstract and Theorem 1.1 of v5). Quote: \"We give a new proof that free Burnside groups of sufficiently large even exponents are infinite.\" Kind=claim only because arXiv lists no journal ref; the statement itself is the Ivanov/Lysenok theorem. Coulon notes his proof is shorter than Lysenok's and Ivanov's (200 and 300 pages)."],"precheck":null,"rules":[],"says":"New geometric (Delzant-Gromov style) proof: for r >= 2 there is n0 such that B(r,n) is infinite for every integer n >= n0 (odd or even). The method also gives partially periodic quotients of groups acting on hyperbolic spaces with a weak form of acylindricity.","source":{"authors":["R. Coulon"],"locator":"thm(1.1)","ref":"coulon2018_even","title":"Infinite periodic groups of even exponents","venue":"arXiv:1810.08372 (v5, 2026; no journal ref listed)","year":"2018"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_mcg_periodic_quotients","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1810.08372 (Theorem 1.3). Quote: \"Let f be a pseudo-Anosov element of MCG(S). Either f^n = 1 in Q or f coincides in Q with a periodic or a reducible element.\" Unrefereed (arXiv preprint)."],"precheck":null,"rules":[],"says":"For a compact surface S of genus g with k boundary components, 3g+k-3 > 1, there are p, n0 such that for every n >= n0 multiple of p the mapping class group MCG(S) has a quotient Q in which subgroups without pseudo-Anosov elements embed, every pseudo-Anosov f satisfies f^n = 1 or becomes periodic/reducible, and Q has infinitely many conjugacy classes not coming from periodic or reducible elements.","source":{"authors":["R. Coulon"],"locator":"thm(1.3)","ref":"coulon2018_even","title":"Infinite periodic groups of even exponents","venue":"arXiv:1810.08372 (v5, 2026; no journal ref listed)","year":"2018"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"mos_continuum_periodic_quotients","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/0804.3328 (abstract). Quote: \"The fourth approach starts with a large group G and produces a continuum of pairwise non-isomorphic periodic residually finite quotients.\""],"precheck":null,"rules":[],"says":"Every non-elementary hyperbolic group has (three different constructions of) continuum many periodic quotients; every large group has continuum many pairwise non-isomorphic periodic residually finite quotients. Answers a question of Wiegold from the Kourovka Notebook.","source":{"authors":["A. Minasyan","A. Yu. Olshanskii","D. Sonkin"],"locator":"unknown","ref":"mos2009","title":"Periodic quotients of hyperbolic and large groups","venue":"Groups Geom. Dyn. 3(3), 423-452; arXiv:0804.3328","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_growth_periodic_quotients","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1211.4271 (abstract, Theorems 2-3). Quote: \"We prove that the exponential growth rate of the periodic quotient G/G^n tends to the one of G as n odd approaches infinity.\" Also states as Adian's 'main fact': a reduced word with no subword w^16 is non-trivial in B_k(n) for odd n >= 665."],"precheck":null,"rules":[],"says":"For a non-elementary torsion-free hyperbolic group G with growth rate lambda (w.r.t. A), the growth rate of G/G^n w.r.t. the image of A is > lambda(1 - kappa/n) for large odd n; hence it tends to lambda. For B(k,n), k >= 2, with free basis: growth rate > (2k-1)(1 - kappa/(2k-1)^(n/2)) for large odd n.","source":{"authors":["R. Coulon"],"locator":"thm(2)","ref":"coulon2013_growth","title":"Growth of periodic quotients of hyperbolic groups","venue":"Algebr. Geom. Topol. 13, 3111-3133; arXiv:1211.4271","year":"2013"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_finite_subgroups_cyclic","kind":"theorem","kourovka":null,"notes":["Source: https://www.mathnet.ru/php/getFT.phtml?jrnid=rm&paperid=9376 (Adian 2010, Theorem 8). Quote: \"Конечными подгруппами группы B(m, n) при m ⩾ 1 и нечетных n ⩾ 665 являются только ее циклические подгруппы.\" First proved for n >= 4381 in Adian [35]; proof via the torsion-free central extension A(m,n). Second source: https://arxiv.org/pdf/1810.08372: \"if n is odd, every finite subgroup of Br(n) is cyclic\"; zbMATH 1076274 review: \"for odd n >= 665 all finite or abelian subgroups of B(m,n) are cyclic\"."],"precheck":null,"rules":["every finite subgroup of B(m,n) is cyclic  IF  m>=1,odd(n),n>=665"],"says":"For m >= 1 and odd n >= 665, the only finite subgroups of B(m,n) are cyclic (of order dividing n).","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_trivial_center","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey (mathnet rm9376), Theorem 7. Quote: \"Центр группы B(m, n) тривиален.\" Follows from Lemma 7: every non-trivial x is a power of some z of order n and everything commuting with x is a power of z. For even n >= 2^48 with 2^9 | n, Ivanov 1994 also proves trivial centre (zbMATH 624664 review: \"their centres are trivial\")."],"precheck":null,"rules":[],"says":"For m > 1 and odd n >= 665 the centre of B(m,n) is trivial.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[{"quantity":"sphere_size_lower_bound(b(2,n),s)","value":"4*2.9^(s-1)"}],"id":"adian_exponential_growth","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 11. Quote: \"При m ⩾ 1 и нечетных n ⩾ 665 свободная бернсайдова группа B(m, n) имеет экспоненциальный рост.\" and \"имеется не менее 4 · (2, 9)^(s−1) различных элементов\" (Russian decimal comma: 2.9). The survey writes m >= 1, but m = 1 gives a finite cyclic group; we record m >= 2. Second source: https://arxiv.org/abs/1211.4271 (Coulon): \"S.I. Adian proved that free Burnside groups of sufficiently large odd exponents are not only infinite but also exponentially growing.\""],"precheck":null,"rules":[],"says":"For m >= 2 and odd n >= 665, B(m,n) has exponential growth; in B(2,n) there are at least 4 * 2.9^(s-1) distinct elements represented by words of length s (compare 4 * 3^(s-1) in the free group).","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"checked"},{"caveats":[],"domain":"amenability","facts":[],"id":"adian_transient_random_walk","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 12(2). Quote: \"Симметричное случайное блуждание на B(m, n) не является возвратным.\" and \"отрицательным ответом на вопрос, который был поставлен еще в 1959 г. ... Г. Кестеном\". The 'proof' link to adian_nonamenable is our reading (both parts of one theorem); the survey does not spell out the implication."],"precheck":null,"rules":[],"says":"For odd n >= 665 the symmetric random walk on B(m,n) is not recurrent (answering a question of Kesten, 1959); proved together with non-amenability in 1982.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1982","title":"Random walks on free periodic groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 46 (1982); Engl. Math. USSR-Izv. 21:3 (1983) 425-434","year":"1982"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[{"quantity":"dehn_speed_lower_bound(b(m,n))","value":"228"},{"quantity":"dehn_relative_speed_lower_bound(b(m,n))","value":"1/3"}],"id":"adian_dehn_presentation","kind":"lemma","kourovka":null,"notes":["Source: Adian 2010 survey, Lemma 8. Quote: \"скорость сходимости соответствующего алгоритма Дэна не меньше 228, а относительная скорость сходимости не меньше 1/3.\" The survey says the lemma was proved in [39] (1982 non-amenability paper). Exact range of n for this lemma is not restated next to it; context is odd n >= 665."],"precheck":null,"rules":[],"says":"B(m,n) (odd n >= 665) has a system of defining relations satisfying Dehn's condition, with convergence speed of Dehn's algorithm at least 228 and relative convergence speed at least 1/3. Used to estimate the spectral radius of the random walk.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1982","title":"Random walks on free periodic groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 46 (1982); Engl. Math. USSR-Izv. 21:3 (1983) 425-434","year":"1982"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_fp_burnside_hyperbolic","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorems 13-14 and Corollary 1. Quote: \"Если группа G имеет конечное задание (14) при нечетном n ⩾ 665 и не содержит инволюций, то для G можно указать конечное задание, удовлетворяющее условию Дэна.\" and Cor. 1: \"B(m, n) может быть представлена как предел бесконечной последовательности гиперболических групп\". Theorem 13 is attributed to a 1980 paper of Adian (ref [44], not identified)."],"precheck":null,"rules":[],"says":"Let G = <a1..am | A_i^n = 1, i=1..k> with finitely many relators of the form A^n, odd n >= 665. If G has no involutions then G has solvable word and conjugacy problems (Adian 1980) and G admits a finite presentation satisfying Dehn's condition, i.e. G is hyperbolic. Corollary: B(m,n) is a limit of a sequence of hyperbolic groups G0 = F_m ->> G1 ->> G2 ...","source":{"authors":["S. I. Adian"],"locator":"thm(13)","ref":"adian2010_survey","title":"The Burnside problem and related topics","venue":"Uspekhi Mat. Nauk 65:5, 5-60; Engl. Russian Math. Surveys 65:5, 805-855","year":"2010"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"shirvanyan_independent_relations","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 4. Quote: \"ни одно из определяющих соотношений (13) не следует из остальных. Эта теорема была доказана В. Л. Ширваняном в 1976 г.\" Bibliographic data from zbMATH (au:Shirvanyan listing)."],"precheck":null,"rules":[],"says":"For odd n >= 665, B(m,n) has a presentation by an independent system of defining relations of the form A^n = 1 (none follows from the others); hence B(m,n) has continuum many presentations by countable independent systems of relations.","source":{"authors":["V. L. Shirvanyan"],"locator":"unknown","ref":"shirvanyan1976_independent","title":"Independent systems of defining relations for a free periodic group of odd exponent","venue":"Mat. Sb. 100(142), 132-136; Engl. Math. USSR Sb. 29, 119-122 (1978)","year":"1976"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"shirvanyan_binf_in_b2","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, after Theorem 9. Quote: \"В. Л. Ширванян доказал, что группа B(∞, n) также вкладывается в группу B(2, n).\" Second source: https://api.zbmath.org/v1/document/1993635 (review of Ivanov 2003): \"the existence of an embedding B(infinity,n) -> B(2,n) for odd n >= 665 ... which was first proved by V. L. Shirvanyan\"."],"precheck":null,"rules":[],"says":"For odd n >= 665, the free Burnside group B(infinity,n) of countably infinite rank embeds in B(2,n). Earlier (Adian) B(2,n) contains B(3,n), hence copies of every B(m,n).","source":{"authors":["V. L. Shirvanyan"],"locator":"unknown","ref":"shirvanyan1976_embedding","title":"Embedding the group B(infinity,n) in the group B(2,n)","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 40, 190-208; Engl. Math. USSR Izv. 10, 181-199 (1977)","year":"1976"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[{"quantity":"rank_bound_prime_exponent_normal_chains","value":"65"}],"id":"adian_subgroup_chains","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 9 and following text. Quote: \"содержит бесконечные убывающие и бесконечные возрастающие цепочки вложенных подгрупп.\" The normal-subgroup version for prime n needs m > 65 per the survey: \"при любых простых n ⩾ 665 и m > 65\"."],"precheck":null,"rules":[],"says":"For odd n >= 665, B(m,n) has infinite strictly descending and infinite strictly ascending chains of subgroups. There are also infinite ascending and descending chains of normal subgroups: easy for composite n = rs (r >= 665 odd, s > 1), and proved by Adian for prime n >= 665 and m > 65.","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_unsolvable_wp_exponent","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 10. Quote: \"Можно построить примеры конечно порожденных групп с рекурсивным множеством определяющих соотношений, имеющих неразрешимую проблему равенства и удовлетворяющих тождеству x^n = 1.\" Proved via the metaperiodic-word modification of [14]; the exact n range is not restated."],"precheck":null,"rules":[],"says":"There exist finitely generated groups with a recursive set of defining relations, satisfying the identity x^n = 1, with unsolvable word problem.","source":{"authors":["S. I. Adian"],"locator":"thm(10)","ref":"adian2010_survey","title":"The Burnside problem and related topics","venue":"Uspekhi Mat. Nauk 65:5, 5-60; Engl. Russian Math. Surveys 65:5, 805-855","year":"2010"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_periodic_product_simplicity","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1504.02984 (Adian-Atabekyan, Theorem 1). Quote: \"An n-periodic product of odd period n >= 665 of a given family of groups without involutions {Gi} is a simple group if and only if for each factor Gi the equality Gi^n = Gi holds.\" Second source: Adian 2010 survey, Theorem 19. The src ref adian1975 is a placeholder: the original is Adian 1978, 'On the simplicity of periodic products of groups', Sov. Math. Dokl. 19, 910-913 (seen on zbMATH listing). The survey also gives a variant allowing involutions (Criterion 1) after a correction to the construction (Remark 4)."],"precheck":null,"rules":[],"says":"Simplicity criterion (Adian 1978): an n-periodic product of odd period n >= 665 of a family of groups {G_i} without involutions is simple iff G_i^n = G_i for every factor (equivalently each G_i becomes trivial after adding the identity x^n = 1).","source":{"authors":["S. I. Adian"],"locator":"unknown","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_simple_groups_in_variety","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 20. Quote: \"В любом многообразии всех периодических групп данного нечетного периода nk, где числа n и k взаимно просты, n ⩾ 665 и k > 1, можно указать бесконечное множество неизоморфных конечно порожденных неабелевых простых групп.\" Second source: https://arxiv.org/pdf/1504.02984 intro: \"a new series of finitely generated infinite simple groups in varieties of periodic groups of odd composite periods nk for n >= 665 and k > 1\". The second source does not state coprimality."],"precheck":null,"rules":[],"says":"For n >= 665 odd and k > 1 (with n, k coprime per the survey), the variety of groups of exponent nk contains infinitely many pairwise non-isomorphic finitely generated non-abelian simple groups (answer to H. Neumann's Problem 23).","source":{"authors":["S. I. Adian"],"locator":"thm(20)","ref":"adian2010_survey","title":"The Burnside problem and related topics","venue":"Uspekhi Mat. Nauk 65:5, 5-60; Engl. Russian Math. Surveys 65:5, 805-855","year":"2010"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_simple_spectrum","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 21. Quote: \"Для всякого множества M нечетных простых чисел, содержащего хотя бы одно число p > 665, можно построить счетную периодическую простую группу H, для которой M является спектром.\""],"precheck":null,"rules":[],"says":"For every set M of odd primes containing some p > 665 there is a countable periodic simple group whose spectrum (set of orders of non-trivial elements) is M; if M is finite the group is finitely generated of bounded exponent. Hence there are continuum many countable simple periodic groups.","source":{"authors":["S. I. Adian"],"locator":"thm(21)","ref":"adian2010_survey","title":"The Burnside problem and related topics","venue":"Uspekhi Mat. Nauk 65:5, 5-60; Engl. Russian Math. Surveys 65:5, 805-855","year":"2010"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[{"quantity":"min_odd_exponent","value":"1003"}],"id":"adian_lysenok_tarski_1003","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/0771.20015 (zbMATH review). Quote: \"For each odd integer n >= 1003 an infinite 2-generator group is constructed with the property that every proper subgroup is contained in a cyclic subgroup of order n.\" The review also cites Ol'shanskii (primes n > 10^75) and Atabekyan-Ivanov (odd n > 10^80). Second source: Adian 2010 survey, Theorem 22."],"precheck":null,"rules":[],"says":"For every odd n >= 1003 there is an infinite 2-generator group in which every proper subgroup is contained in a cyclic subgroup of order n (for prime n: a Tarski monster). Proved within the Novikov-Adian theory.","source":{"authors":["S. I. Adian","I. G. Lysenok"],"locator":"unknown","ref":"adian_lysenok1991","title":"On groups all of whose proper subgroups are finite cyclic","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 55(5), 933-990; Engl. Math. USSR Izv. 39(2), 905-957 (1992)","year":"1991"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"olshanskii_embed_simple_periodic","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/22897 (zbMATH summary). Quote: \"We prove a theorem on the isomorphic imbedding of an arbitrary countable periodic group H into a simple 2-generated periodic group G.\" Note: no bounded exponent is claimed here."],"precheck":null,"rules":[],"says":"Every countable periodic group H embeds into a simple 2-generated periodic group G; moreover for any k >= 2, l >= 3, G has a generating pair of elements of orders k and l.","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"unknown","ref":"olshanskii1991_embedding","title":"Imbedding of countable periodic groups into simple 2-generated periodic groups","venue":"Ukr. Mat. Zh. 43(7/8), 980-986; Engl. Ukr. Math. J. 43, 914-919","year":"1991"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"obraztsov_embedding_exponent","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/math/0210191 (Ivanov, intro). Quote: \"It follows from an embedding theorem of Obraztsov (see Theorem 35.1 in [O89]) that any countable group of odd exponent n >> 1 embeds in a 2-generator group of exponent n\". [O89] = Ol'shanskii's book, Geometry of defining relations in groups. Obraztsov's original paper not identified."],"precheck":null,"rules":[],"says":"(Obraztsov) For odd n >> 1, every countable group of exponent n embeds in a 2-generator group of exponent n. Consequently B(2,n) is SQ-universal in the class of groups of exponent n.","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"thm(35.1)","ref":"olshanskii1989","title":"Geometry of Defining Relations in Groups","venue":"Nauka 1989; Kluwer 1991","year":"1989"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"ivanov_q_subgroups_sq","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0210191 (abstract). Quote: \"This implies that every noncyclic subgroup of B(m,n) is SQ-universal in the class of groups of exponent n.\" Second source: https://api.zbmath.org/v1/document/1993635 (review), which gives the bound \"(e.g. n > 10^78)\" and says it strengthens Atabekyan 1987 (every non-cyclic subgroup contains a copy of B(2,n) for odd n > 10^78)."],"precheck":null,"rules":[],"says":"For odd n >> 1 (e.g. n > 10^78) and m > 1, every non-cyclic subgroup of B(m,n) contains a Q-subgroup H isomorphic to B(infinity,n) (for every normal K of H, the normal closure of K in B(m,n) meets H in K). Hence every non-cyclic subgroup of B(m,n) is SQ-universal in the class of groups of exponent n.","source":{"authors":["S. V. Ivanov"],"locator":"unknown","ref":"ivanov2003_subgroups","title":"On subgroups of free Burnside groups of large odd exponent","venue":"Illinois J. Math. 47(1-2), 299-304; arXiv:math/0210191","year":"2003"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"atabekyan_binf_in_subgroups_1003","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/5637859 (zbMATH summary). Quote: \"for any odd number n >= 1003, every non-cyclic subgroup of the 2-generator free Burnside group of exponent n contains a subgroup isomorphic to the free Burnside group of exponent n and infinite rank\". The 'proof' link to Shirvanyan is our inference, not stated."],"precheck":null,"rules":[],"says":"For odd n >= 1003, every non-cyclic subgroup of B(2,n) contains a subgroup isomorphic to the free Burnside group B(infinity,n) of infinite rank. Families of relatively free n-periodic subgroups are constructed in B(m,n) for odd n >= 665.","source":{"authors":["V. S. Atabekyan"],"locator":"unknown","ref":"atabekyan2009_subgroups","title":"On subgroups of free Burnside groups of odd exponent n >= 1003","venue":"Izv. Math. 73(5), 861-892","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"olshanskii_self_normalization","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/1974638 (zbMATH review). Quote: \"Assume that N is itself isomorphic to a free Burnside group B(-,n0). Then N coincides with its normalizer in the group G.\" The review also records Ivanov 1989: same conclusion for composite odd n > 2*10^77, and Ol'shanskii's conjecture of the analogue for n0 = 2^l."],"precheck":null,"rules":[],"says":"For sufficiently large odd n0, every non-trivial subgroup N of a free Burnside group B(A,n0) that is itself isomorphic to a free Burnside group of exponent n0 coincides with its normalizer. In particular B(m,n0) has no proper normal subgroups that are free Burnside groups (Adian's Kourovka problem 7.1, for large n).","source":{"authors":["A. Yu. Ol'shanskii"],"locator":"thm(1.1)","ref":"olshanskii2003_selfnorm","title":"Self-normalization of free subgroups in the free Burnside groups","venue":"Groups, rings, Lie and Hopf algebras, Math. Appl. 555, Kluwer, 179-187","year":"2003"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"atabekyan_normal_not_free_prime","kind":"claim","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/6257764 (zbMATH summary). Quote: \"In the current paper we announce a positive answer for all prime numbers n>997\". Kind=claim because it is an announcement. Atabekyan 2010 'The normalizers of free subgroups in free Burnside groups of odd period n >= 1003' (J. Math. Sci. 166) is likely the full proof; its summary was not available."],"precheck":null,"rules":[],"says":"Announced: for every prime n > 997, no proper normal subgroup of B(m,n) is a free periodic group (Adian's Kourovka problem), strengthening Ol'shanskii's result for odd n > 10^77.","source":{"authors":["V. S. Atabekyan"],"locator":"unknown","ref":"atabekyan2008_normal","title":"Normal subgroups in free Burnside groups of odd period","venue":"Armen. J. Math. 1(2), 25-29","year":"2008"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"osin_uniform_nonamenable","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0404073 (abstract). Quote: \"their left regular representations are isolated from the trivial representation uniformly on finite generating sets\". Second source: https://arxiv.org/abs/1211.4271 (Coulon intro): \"D. Osin showed that they are uniformly non-amenable, and therefore they have uniform exponential growth\". Journal data from zbMATH 5162050."],"precheck":null,"rules":[],"says":"Free Burnside groups B(m,n) of sufficiently large odd exponent are uniformly non-amenable: their left regular representations are isolated from the trivial representation uniformly over finite generating sets. Consequently they have uniform exponential growth; this solves a strong form of the von Neumann-Day problem.","source":{"authors":["D. V. Osin"],"locator":"unknown","ref":"osin2007","title":"Uniform non-amenability of free Burnside groups","venue":"Arch. Math. 88(5), 403-412; arXiv:math/0404073","year":"2007"},"status":"checked"},{"caveats":[],"domain":"amenability","facts":[{"quantity":"free_pair_ball_radius(b(m,n))","value":"(400*n)^3"}],"id":"atabekyan_uniform_nonamenable_1003","kind":"theorem","kourovka":null,"notes":["Source: https://www.mathnet.ru/eng/mzm4890 (abstract, raw HTML). Quote: \"every noncyclic subgroup of the free Burnside group B(m,n) of odd period n >= 1003 is a uniformly nonamenable group\" and \"every S-ball of radius (400n)^3 contains two elements which form a basis of a free periodic subgroup of rank 2 in B(m,n)\"."],"precheck":null,"rules":[],"says":"For odd n >= 1003, every non-cyclic subgroup of B(m,n) is uniformly non-amenable; in particular infinite B(m,n) has uniform exponential growth (de la Harpe's question). If S generates a non-cyclic subgroup, the S-ball of radius (400n)^3 contains two elements freely generating a free periodic subgroup of rank 2.","source":{"authors":["V. S. Atabekyan"],"locator":"unknown","ref":"atabekyan2009_uniform","title":"Uniform nonamenability of subgroups of free Burnside groups of odd period","venue":"Mat. Zametki 85:4, 516-523; Engl. Math. Notes 85:4, 496-502","year":"2009"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"adian_atabekyan_periodic_product_subgroups","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/6651592 (zbMATH summary). Quote: \"if a non-cyclic subgroup H of the n-periodic product of a given family of groups is not conjugate to any subgroup of the product's components, then H contains a subgroup isomorphic to the free Burnside group B(2,n)\". Exponent range not visible in the summary (presumably odd n >= 665)."],"precheck":null,"rules":[],"says":"n-periodic products are characterized by specific properties; a non-cyclic subgroup H of an n-periodic product that is not conjugate into a factor contains a copy of B(2,n) (hence of every B(m,n)), and if H is finitely generated it is uniformly non-amenable. All finite subgroups of n-periodic products are described.","source":{"authors":["S. I. Adian","V. S. Atabekyan"],"locator":"unknown","ref":"adian_atabekyan2015_char","title":"Characteristic properties and uniform non-amenability of n-periodic products of groups","venue":"Izv. Math. 79(6), 1097-1110","year":"2015"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"monod_ozawa_nonunitarisable","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/0902.4585 (Theorem 2). Quote: \"Let m, n, p be integers with m, n >= 2, p >= 665 and n, p odd. Then the free Burnside group B(m, np) of exponent np with m generators is non-unitarisable.\" Second source: Adian 2010 survey: \"для доказательства неунитаризуемости групп B(m, np) при m > 1 и нечетных n и p, где n ⩾ 665\" (roles of n, p swapped)."],"precheck":null,"rules":[],"says":"Let m, n >= 2 and p >= 665 with n, p odd. Then the free Burnside group B(m, np) is non-unitarisable (partial answer to Pisier's question).","source":{"authors":["N. Monod","N. Ozawa"],"locator":"thm(2)","ref":"monod_ozawa2010","title":"The Dixmier problem, lamplighters and Burnside groups","venue":"J. Funct. Anal. 258(1), 255-259; arXiv:0902.4585","year":"2010"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"osajda_no_property_t","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1605.06915 (Theorem 1). Quote: \"If the free Burnside group B(m, n) is infinite then, for every integer k > 1, the free Burnside group B(m, kn) acts without fixed points on a CAT(0) cubical complex and hence does not have Kazhdan's property (T).\" Second source: https://arxiv.org/pdf/1810.06927 (Leder-Varghese): \"many free Burnside groups have property FC, but don't have property (T), see [10, Theorem 1]\". The complexes are necessarily infinite-dimensional (see torsion_fixed_point_cube_complex)."],"precheck":null,"rules":[],"says":"If B(m,n) is infinite then for every k > 1 the free Burnside group B(m,kn) acts without fixed points on a CAT(0) cubical complex, hence does not have Kazhdan's property (T). Answers negatively whether all Burnside groups have (T).","source":{"authors":["D. Osajda"],"locator":"thm(1)","ref":"osajda2018","title":"Group cubization (with an appendix by M. Pichot)","venue":"Duke Math. J. 167(6), 1049-1055; arXiv:1605.06915","year":"2018"},"status":"checked"},{"caveats":[],"domain":"cgt","facts":[],"id":"torsion_fixed_point_cube_complex","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1810.06927 (Theorem A and remark). Quote: \"Free Burnside groups are finitely generated torsion groups and thus these groups have always property FC, but many of these groups act without a fixed point on infinite dimensional CAT(0) cube complexes\". Theorem A is attributed to the proof of Theorem 5.1 in Sageev, Proc. LMS 71 (1995)."],"precheck":null,"rules":[],"says":"(Sageev) A finitely generated group acting locally elliptically on a finite-dimensional CAT(0) cube complex has a global fixed point. Hence every finitely generated torsion group, in particular every free Burnside group, fixes a point in every action on a finite-dimensional CAT(0) cube complex (property FC). This fails for infinite-dimensional complexes.","source":{"authors":["N. Leder","O. Varghese"],"locator":"thm(a)","ref":"leder_varghese2020","title":"A note on locally elliptic actions on cube complexes","venue":"Innov. Incidence Geom. 18, 1-6; arXiv:1810.06927","year":"2020"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"serre_tree_fixed_point","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1810.06927. Quote: \"It is well known that a finitely generated group which is acting locally elliptically on a simplicial tree has a global fixed point, see [12, §6.5 Corollary 2]\" ([12] = Serre, Trees). The consequence for torsion groups (each element of finite order is elliptic) and the no-splitting remark are our gloss; the source states the analogous FC' => FC step for torsion groups."],"precheck":null,"rules":[],"says":"A finitely generated group acting locally elliptically on a simplicial tree has a global fixed point (Serre, Trees, sec. 6.5, Cor. 2). In particular a finitely generated torsion group fixes a vertex or edge midpoint in every action on a tree (property FA), so it does not split as an amalgam or HNN extension.","source":{"authors":["N. Leder","O. Varghese"],"locator":"unknown","ref":"leder_varghese2020","title":"A note on locally elliptic actions on cube complexes","venue":"Innov. Incidence Geom. 18, 1-6; arXiv:1810.06927","year":"2020"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"ivanov_even_structure","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/624664 (zbMATH review of Ivanov 1994). Quote: \"for instance the word and conjugacy problems are shown to be solvable, the structure of the finite subgroups is elucidated, and their centres are trivial.\" The dihedral description is from https://api.zbmath.org/v1/document/1076274: \"any finite subgroup of B(m,n) is isomorphic to a subgroup of D(2n1) x D(2n2)^l\"."],"precheck":null,"rules":[],"says":"For m > 1, n > 2^48 with n odd or divisible by 2^9: B(m,n) has solvable word and conjugacy problems and trivial centre; if n = n1*n2 with n1 odd, n2 = 2^k >= 2^9, every finite subgroup of B(m,n) is isomorphic to a subgroup of D(2n1) x D(2n2)^l (D(2a) dihedral of order 2a).","source":{"authors":["S. V. Ivanov"],"locator":"unknown","ref":"ivanov1994","title":"The free Burnside groups of sufficiently large exponents","venue":"Internat. J. Algebra Comput. 4","year":"1994"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"ivanov_olshanskii_finite_subgroups_even","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/1076274 (review). Quote: \"In the present article the authors prove, in particular, that all such groups do indeed appear as subgroups of B(m,n)\". Second source: https://arxiv.org/pdf/1810.08372 (Coulon intro): \"By contrast if n is even, Br(n) contains arbitrarily long direct products of dihedral groups.\""],"precheck":null,"rules":["B(m,n) has a non-cyclic finite subgroup  IF  m>=2,n>=2^48,even_split(n)"],"says":"For m >= 2 and n = n1*n2 >= 2^48 (n1 odd, n2 = 2^k >= 2^9), every subgroup of D(2n1) x D(2n2)^l actually occurs as a subgroup of B(m,n). So for such even n, B(m,n) contains arbitrarily long direct products of dihedral groups (in contrast with odd n, where finite subgroups are cyclic).","source":{"authors":["S. V. Ivanov","A. Yu. Ol'shanskii"],"locator":"unknown","ref":"ivanov_olshanskii1997","title":"On finite and locally finite subgroups of free Burnside groups of large even exponents","venue":"J. Algebra 195(1), 241-284","year":"1997"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"ivanov_olshanskii_locally_finite_even","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/1076274 (review). Quote: \"any infinite locally finite subgroup S of B(m,n) is contained in a unique maximal infinite locally finite subgroup, while any finite 2-subgroup of B(m,n) is contained in continuously many pairwise non-isomorphic maximal locally finite subgroups.\" The review notes infinite 2-groups always have infinite abelian subgroups (Held-Kegel), so abelian subgroups cannot all be cyclic for even n."],"precheck":null,"rules":[],"says":"For m, n as in ivanov_olshanskii_finite_subgroups_even: every infinite locally finite subgroup S of B(m,n) lies in a unique maximal infinite locally finite subgroup; every finite 2-subgroup lies in continuum many pairwise non-isomorphic maximal locally finite subgroups. The centralizer of a finite 2-subgroup contains a copy of B(infinity,n); the centralizer of a finite non-2-subgroup, or of a non-locally-finite subgroup, is finite; the centralizer of S is infinite iff S is a locally finite 2-group.","source":{"authors":["S. V. Ivanov","A. Yu. Ol'shanskii"],"locator":"unknown","ref":"ivanov_olshanskii1997","title":"On finite and locally finite subgroups of free Burnside groups of large even exponents","venue":"J. Algebra 195(1), 241-284","year":"1997"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"lysenok_finite_subgroups_even","kind":"theorem","kourovka":null,"notes":["Source: Adian 2010 survey, Theorem 23. Quote: \"Пусть m > 1 и n = 2^4 k ⩾ 8 000. Тогда любая конечная подгруппа группы B(m,n) изоморфно вкладывается в конечное прямое произведение Dn × Dn̄ × · · · × Dn̄\"."],"precheck":null,"rules":[],"says":"For m > 1 and n = 16k >= 8000, every finite subgroup of B(m,n) embeds in a finite direct product D_n x D_nbar x ... x D_nbar, where D_r is dihedral of order 2r and nbar is the largest power of 2 dividing n.","source":{"authors":["I. G. Lysenok"],"locator":"unknown","ref":"lysenok1996","title":"Infinite Burnside groups of even period","venue":"Izv. Math. 60","year":"1996"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"hopfian_burnside_open","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1504.02984. Quote: \"The following is still an open question: Do the free periodic groups B(m, n) for odd exponents n >= 665 satisfy the Hopfian property?\" Second source: https://arxiv.org/pdf/2112.07409 (Coulon-Sela): \"To the best of our knowledge it is still an open question whether free Burnside groups of sufficiently large exponents are Hopfian.\" Coulon-Sela also note Ivanov-Storozhev: a variety whose free groups need not be Hopfian."],"precheck":null,"rules":[],"says":"Is B(m,n) Hopfian (every surjective endomorphism injective) for odd n >= 665, or for all sufficiently large n? Open (as of Adian-Atabekyan 2014/15 and Coulon-Sela 2021). B(m,n) is not residually finite, so Mal'cev's theorem does not apply.","source":{"authors":["S. I. Adian","V. S. Atabekyan"],"locator":"unknown","ref":"adian_atabekyan2014_hopf","title":"The Hopfian property of n-periodic products of groups","venue":"Math. Notes 95(4), 443-449; arXiv:1504.02984","year":"2014"},"status":"checked"},{"caveats":["The KB item states it for odd n >= 665; the rule uses the argument given in its statement, which applies to any infinite B(m,n)."],"domain":"burnside_groups","facts":[],"id":"b_not_residually_finite","kind":"corollary","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1504.02984 (proof of Corollary 3). Quote: \"From the well-known results of Adian [3] and of Zel'manov [11], it follows that the groups B(m, n) are not residually finite for any odd n >= 665.\" The parenthetical argument in says/2 is our gloss."],"precheck":null,"rules":["B(m,n) is not residually finite  IF  B(m,n) is infinite; R(m,n) exists (largest finite m-generated group of exponent n)"],"says":"For m > 1 and odd n >= 665, B(m,n) is not residually finite (it is infinite, while by Zelmanov all its finite quotients factor through the finite group R(m,n)).","source":{"authors":["S. I. Adian","V. S. Atabekyan"],"locator":"unknown","ref":"adian_atabekyan2014_hopf","title":"The Hopfian property of n-periodic products of groups","venue":"Math. Notes 95(4), 443-449; arXiv:1504.02984","year":"2014"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian_atabekyan_hopfian_products","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1504.02984. Quote: \"It is also proved that for odd n >= 665 every nontrivial normal subgroup in a given n-periodic product G contains the subgroup G^n.\" and Theorem 4: \"If at least one of the factors of the given n-periodic product of groups G for odd n >= 665 does not satisfy the identity relation x^n = 1, then G is Hopfian.\""],"precheck":null,"rules":[],"says":"For odd n >= 665 every non-trivial normal subgroup of an n-periodic product G of non-trivial groups contains G^n; hence if some factor does not satisfy x^n = 1, G is Hopfian. E.g. the n-periodic product of finitely many cyclic groups of order r, n a proper divisor of r, is Hopfian, non-simple and not residually finite.","source":{"authors":["S. I. Adian","V. S. Atabekyan"],"locator":"thm(4)","ref":"adian_atabekyan2014_hopf","title":"The Hopfian property of n-periodic products of groups","venue":"Math. Notes 95(4), 443-449; arXiv:1504.02984","year":"2014"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_sela_periodic_quotients","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/pdf/2112.07409 (Theorems 1.8, 1.10, 1.12, 1.13, Example 1.7). Quote: \"Then there exists N in N, such that for every odd integer n >= N, the periodic quotient Gamma/Gamma^n is Hopfian.\" Kind=claim: arXiv lists no journal ref."],"precheck":null,"rules":[],"says":"For torsion-free hyperbolic Gamma (with suitable hypotheses: no essential root splitting, freely indecomposable, or no quotient with an abelian splitting) and all large odd n: Gamma/Gamma^n is Hopfian (Thm 1.12), co-Hopfian (Thm 1.13), Aut(Gamma) -> Aut(Gamma/Gamma^n) is onto so Aut and Out of Gamma/Gamma^n are finitely generated (Thm 1.10), and Gamma1/Gamma1^n = Gamma2/Gamma2^n iff Gamma1 = Gamma2 (Thm 1.8). The hypotheses are necessary: <a,b,c | c^p = [a,b]> has n-periodic quotient B(2,n) for n coprime to p.","source":{"authors":["R. Coulon","Z. Sela"],"locator":"unknown","ref":"coulon_sela2021","title":"Equations in Burnside groups","venue":"arXiv:2112.07409 (no journal ref listed)","year":"2021"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"cherepanov_normal_automorphisms","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/5123191 (review). Quote: \"The author proves that every normal automorphism of a free Burnside group B(m,n) on m >= 2 generators of sufficiently large odd exponent n is inner.\" Analogues: Lubotzky (free groups), Jarden, Romanovskii."],"precheck":null,"rules":[],"says":"For m >= 2 and sufficiently large odd n, every normal automorphism of B(m,n) (one fixing every normal subgroup) is inner. For every outer automorphism phi there is a normal N with phi(N) != N and B(m,n)/N non-abelian simple. B(m,n) can be a normal subgroup of a group of exponent n only as a direct factor.","source":{"authors":["E. A. Cherepanov"],"locator":"unknown","ref":"cherepanov2006_normal","title":"Normal automorphisms of free Burnside groups of large odd exponents","venue":"Internat. J. Algebra Comput. 16(5), 839-847","year":"2006"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"atabekyan_normal_automorphisms_1003","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/5907275 (review). Quote: \"For any odd number n >= 1003, every M-normal automorphism of the free Burnside group B(m,n) of (finite or infinite) rank m > 1 is inner\". For n = 3: Atabekyan-Aslanyan-Grigoryan 2017 (Armen. J. Math. 9) show normal automorphisms of B(m,3), m >= 3, are inner (zbMATH 6848489)."],"precheck":null,"rules":[],"says":"For odd n >= 1003, every M-normal automorphism (stabilizing the family of maximal normal subgroups) of B(m,n), m > 1 of finite or infinite rank, is inner; in particular every normal automorphism is inner. If theta is not inner, <Inn(B(m,n)), theta> contains an automorphism of order > n.","source":{"authors":["V. S. Atabekyan"],"locator":"thm(1)","ref":"atabekyan2011_normal_aut","title":"Normal automorphisms of free Burnside groups","venue":"Izv. Math. 75(2), 223-237","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"atabekyan_aut_complete","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1401.0177 (abstract). Quote: \"It follows that the group of automorphisms Aut(B(m,n)) of the free Burnside group B(m,n) is complete for odd n >= 1003\". Second source: https://api.zbmath.org/v1/document/6219292 (review): \"if n is odd and n >= 1003, then Aut(B(m,n)) is complete\". The 'proof' link to normal automorphisms is our inference."],"precheck":null,"rules":[],"says":"For odd n >= 1003 and m > 1, Aut(B(m,n)) is complete (trivial centre, all automorphisms inner), so the automorphism tower of B(m,n) stops at Aut(B(m,n)) as for free groups. Inn(B(m,n)) is the unique normal subgroup of Aut(B(m,n)) among its subgroups isomorphic to some B(s,n). Every automorphism of End(B(m,n)) is conjugation by an element of Aut(B(m,n)).","source":{"authors":["V. S. Atabekyan"],"locator":"unknown","ref":"atabekyan2013_complete","title":"The groups of automorphisms are complete for free Burnside groups of odd exponents n >= 1003","venue":"Internat. J. Algebra Comput. 23(6), 1485-1496; arXiv:1401.0177","year":"2013"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"atabekyan_aut_end","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/6452378 (summary). Quote: \"We prove, that the groups Aut(B(m,n)) and Aut(End(B(m,n))) are canonically isomorphic.\""],"precheck":null,"rules":[],"says":"For odd n >= 1003, Aut(B(m,n)) and Aut(End(B(m,n))) are canonically isomorphic; hence Aut(End(B(m,n))) = Aut(End(B(k,n))) implies m = k.","source":{"authors":["V. S. Atabekyan"],"locator":"unknown","ref":"atabekyan2015_end","title":"The automorphisms of endomorphism semigroups of free Burnside groups","venue":"Internat. J. Algebra Comput. 25(4), 669-674","year":"2015"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"atabekyan_splitting_automorphisms","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1403.6798 (abstract). Quote: \"We prove that if the order of a splitting automorphism of free Burnside group B(m,n) of odd period n >= 1003 is a prime power, then the automorphism is inner.\" Bound discrepancy: zbMATH 6197060 review of the 2013 Sb. Math. paper says \"odd period n >= 1009\" for prime order, while zbMATH 6387515 (Proc. YSU 2011) says n >= 1003. 'proof' link to normal automorphisms: per review, \"The proof relies on the author's results [Izv. Math. 75 (2011)]\". Cherepanov 2006 has similar results for very large prime n."],"precheck":null,"rules":[],"says":"A splitting automorphism f of period n (f^n = 1 and x x^f ... x^(f^(n-1)) = 1 for all x) of B(m,n), odd n large, is inner if its order is a prime (Sb. Math. 2013) or a prime power p^k (Math. Notes 2014, n >= 1003). Answers Kourovka Question 11.36(b) for these orders.","source":{"authors":["V. S. Atabekyan"],"locator":"unknown","ref":"atabekyan2013_splitting","title":"Splitting automorphisms of free Burnside groups","venue":"Sb. Math. 204(2), 182-189","year":"2013"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"atabekyan_mazurov_fixed_point_free","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/2609.33941 (abstract). Quote: \"for any odd m >= 3, there exists q_m > 0 such that for every prime period q > q_m, the automorphism of B(m,q) of order m that cyclically permutes its free generators is fixed-point-free.\" Unrefereed preprint (Sept 2026). The abstract says 'for m >= 3' in one sentence and 'odd m >= 3' in the precise statement."],"precheck":null,"rules":[],"says":"Mazurov's Kourovka question answered negatively for m >= 3: for every odd m >= 3 there is q_m such that for every prime q > q_m the automorphism of B(m,q) of order m cyclically permuting the free generators has no non-trivial fixed point.","source":{"authors":["V. S. Atabekyan"],"locator":"unknown","ref":"atabekyan2026_mazurov","title":"Mazurov's question on fixed points of automorphisms of free Burnside groups","venue":"arXiv:2609.33941 (preprint)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"cherepanov_free_semigroup_aut","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/2171117 (summary; zbMATH metadata for this record is hidden, journal data taken from Coulon's reference list [Che05] in https://arxiv.org/pdf/1008.4495). Quote: \"We prove the existence of a free semigroup of rank 2 in Aut B(m,n).\" Infinite-order statement: Coulon 1008.4495, Proposition 1.1 (see [Che05, Th. 1])."],"precheck":null,"rules":[],"says":"For m >= 2 and sufficiently large n, Aut(B(m,n)) contains a free semigroup of rank 2. The Fibonacci-type automorphism a -> ab, b -> a of F_2 induces an automorphism of infinite order of B(2,n) for all large odd n.","source":{"authors":["E. A. Cherepanov"],"locator":"thm(1)","ref":"cherepanov2005_semigroup","title":"Free semigroup in the group of automorphisms of the free Burnside group","venue":"Comm. Algebra 33(2), 539-547","year":"2005"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_out_burnside","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1008.4495 (Theorems 1.3, 1.6, 1.8, 1.12). Quote: \"Let r >= 3. There exists an integer n0 such that for all odd integers n larger than n0, the group Out(Br(n)) contains a subgroup which is isomorphic to F2.\""],"precheck":null,"rules":[],"says":"For large odd n: every hyperbolic automorphism of F_r (F_r x| Z hyperbolic) induces an infinite-order outer automorphism of B(r,n); for r >= 3, Out(B(r,n)) contains a free group F_2; for r >= 2, Out(B(2r,n)) and Out(B(2r+1,n)) contain Z^r. Polynomially growing outer automorphisms of F_r induce finite-order outer automorphisms of B(r,n) for every n.","source":{"authors":["R. Coulon"],"locator":"unknown","ref":"coulon2013_out","title":"Outer automorphisms of free Burnside groups","venue":"Comment. Math. Helv. 88, 789-811; arXiv:1008.4495","year":"2013"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_hilion_growth_order","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1309.3981 (abstract). Quote: \"We prove that an outer automorphism of the free group is exponentially growing if and only if it induces an outer automorphism of infinite order of free Burnside groups with sufficiently large odd exponent.\""],"precheck":null,"rules":[],"says":"An outer automorphism of a free group F_r is exponentially growing iff it induces an outer automorphism of infinite order of B(r,n) for sufficiently large odd n.","source":{"authors":["R. Coulon","A. Hilion"],"locator":"unknown","ref":"coulon_hilion2017","title":"Growth and order of automorphisms of free groups and free Burnside groups","venue":"Geom. Topol. 21, 1969-2014; arXiv:1309.3981","year":"2017"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_trivial_element_criterion","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1211.4267 (abstract). Quote: \"we give a sufficient and necessary condition to determine wether or not an element of the free group induces a non-trivial element of the free Burnside group of sufficiently large odd exponent\"."],"precheck":null,"rules":[],"says":"There is a necessary and sufficient criterion, statable without knowledge of Burnside groups, deciding whether an element of the free group is trivial in B(r,n) for sufficiently large odd n; an analogue holds for periodic quotients of torsion-free hyperbolic groups.","source":{"authors":["R. Coulon"],"locator":"unknown","ref":"coulon2018_trivial","title":"A criterion for detecting trivial elements of Burnside groups","venue":"Bull. Soc. Math. France 146(4), 745-806; arXiv:1211.4267","year":"2018"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_gruber_sc_over_burnside","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1705.09651 (abstract). Quote: \"the well-known classical C'(1/6)-small cancellation theory, as well as its graphical generalization and its version for free products, produce examples of infinite n-periodic groups.\""],"precheck":null,"rules":[],"says":"There is n0 such that for every odd n >= n0, classical C'(1/6) small cancellation (and its graphical and free-product versions) produces infinite n-periodic groups. Applications: undecidability of Markov properties among n-periodic groups, n-periodic groups whose Cayley graphs contain embedded expanders, an n-periodic Rips construction, uncountably many f.g. n-periodic groups, SQ-universality of free Burnside groups in the class of n-periodic groups.","source":{"authors":["R. Coulon","D. Gruber"],"locator":"unknown","ref":"coulon_gruber2019","title":"Small cancellation theory over Burnside groups","venue":"Adv. Math. 353, 722-775; arXiv:1705.09651","year":"2019"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"coulon_steenbock_product_growth","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2102.10885 (abstract). Quote: \"Given a periodic quotient of a torsion-free hyperbolic group, we provide a fine lower estimate of the growth function of any sub-semi-group.\""],"precheck":null,"rules":[],"says":"For a periodic quotient of a torsion-free hyperbolic group, there is a fine lower estimate for the growth function of any sub-semigroup (product set growth), generalizing Razborov and Safin for free groups.","source":{"authors":["R. Coulon","M. Steenbock"],"locator":"unknown","ref":"coulon_steenbock2022","title":"Product set growth in Burnside groups","venue":"J. Ec. polytech. Math. 9, 463-504; arXiv:2102.10885","year":"2022"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"gruber_mackay_random_burnside","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1810.01805 (abstract). Quote: \"we obtain, for every fixed large enough n, for every p in (1,infinity) an infinite n-periodic group with fixed points for all isometric actions on L^p-spaces.\""],"precheck":null,"rules":[],"says":"n-periodic quotients of random triangular groups at density d in (1/3, d_crit), d_crit in (1/3,1/2) explicit, are infinite for n large enough. Hence for every large n and every p in (1, infinity) there is an infinite n-periodic group with fixed points for all isometric actions on L^p spaces.","source":{"authors":["D. Gruber","J. M. Mackay"],"locator":"unknown","ref":"gruber_mackay2021","title":"Random triangular Burnside groups","venue":"Israel J. Math. 244, 75-94; arXiv:1810.01805","year":"2021"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"kharlampovich_myasnikov_random_burnside","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/1705.08060 (abstract). Quote: \"We prove that the quotient by their normal closure is infinite with probability at least 1-e^{-c l}.\" Unrefereed (no journal ref on arXiv)."],"precheck":null,"rules":[],"says":"For m >= 2, k >= 1 and every sufficiently large odd M, the quotient of B(m,M) by the normal closure of k random elements of the sphere of radius l is infinite with probability at least 1 - e^(-cl); the quotient map has no non-trivial kernel element of length <= kappa*l.","source":{"authors":["O. Kharlampovich","A. Miasnikov"],"locator":"unknown","ref":"kharlampovich_myasnikov_random","title":"Random Burnside groups","venue":"arXiv:1705.08060 (no journal ref listed)","year":"2017"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"ivanov_embed_fp","kind":"theorem","kourovka":null,"notes":["Source: https://api.zbmath.org/v1/document/2193831 (review). Quote: \"The author constructs an embedding of a free Burnside group B(m,n) of odd exponent n > 2^48 into a finitely presented group with certain special properties.\" Earlier fp examples: Ol'shanskii-Sapir, Publ. IHES 96 (2002)."],"precheck":null,"rules":[],"says":"For odd n > 2^48, B(m,n) embeds into a finitely presented group with special properties; applications: a simpler construction of finitely presented non-amenable groups without non-cyclic free subgroups, and weakly finitely presented groups of large odd exponent that are not locally finite.","source":{"authors":["S. V. Ivanov"],"locator":"unknown","ref":"ivanov2005_embedding","title":"Embedding free Burnside groups in finitely presented groups","venue":"Geom. Dedicata 111, 87-105","year":"2005"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"olshanskii_higman_burnside","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/1909.10113 (abstract). Quote: \"A finitely generated group G from B_n has a presentation G=<A | R> with a finite set of generators A and a recursively enumerable set R of defining relations if and only if it is a subgroup of a group H finitely presented in the variety B_n.\" Kind=claim: no journal ref on arXiv."],"precheck":null,"rules":[],"says":"Higman embedding in Burnside varieties: for all sufficiently large odd n, a finitely generated group G of exponent n has a recursively enumerable presentation iff G is a subgroup of a group finitely presented in the variety B_n. Hence there is a universal 2-generated group finitely presented in B_n containing copies of all groups finitely presented in B_n.","source":{"authors":["A. Yu. Olshanskii"],"locator":"unknown","ref":"olshanskii2019_higman","title":"Subgroups of groups finitely presented in Burnside varieties","venue":"arXiv:1909.10113 (no journal ref listed)","year":"2019"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"lysenok_2000_sample","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/2301.05000 (abstract). Quote: \"we provide a reasonably accessible proof that B(m,n) is infinite with a moderate bound n > 2000 on the odd exponent n.\" Unrefereed; the bound is weaker than Adian's 665 / 101 but the proof is shorter."],"precheck":null,"rules":[],"says":"A new iterated small cancellation presentation of B(m,n), m >= 2, odd n, giving a reasonably accessible proof that B(m,n) is infinite for odd n > 2000.","source":{"authors":["I. G. Lysenok"],"locator":"unknown","ref":"lysenok2023_sample","title":"A sample iterated small cancellation theory for groups of Burnside type","venue":"arXiv:2301.05000 (no journal ref listed)","year":"2023"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"cst_nonamenable_557","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/2611.16826 (abstract). Quote: \"We prove that the free Burnside group B(m,n) is nonamenable for every m >= 2 and every odd exponent n >= 557.\" Preprint posted 12 Nov 2026; unrefereed."],"precheck":null,"rules":[],"says":"B(m,n) is non-amenable for every m >= 2 and every odd n >= 557, improving Adian's n >= 665 and matching the Atkarskaya-Rips-Tent infiniteness bound; proof via their canonical forms plus a counting argument giving an explicit isoperimetric inequality.","source":{"authors":["A. Cascioli","S. Shepherd","K. Tent"],"locator":"unknown","ref":"cascioli_shepherd_tent2026","title":"A new proof of nonamenability for free Burnside groups of odd exponent","venue":"arXiv:2611.16826 (preprint)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"cascioli_cstar_selfless","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/2611.17285 (abstract). Quote: \"We prove that B(m,n) is completely C^*-selfless for every m >= 2 and every odd exponent n >= 557.\" Preprint, Nov 2026; unrefereed."],"precheck":null,"rules":[],"says":"B(m,n) is completely C*-selfless for m >= 2 and odd n >= 557; so its reduced group C*-algebra has stable rank one and strict comparison, showing C*-selfless groups can satisfy a non-trivial group law.","source":{"authors":["A. Cascioli"],"locator":"unknown","ref":"cascioli2026","title":"C*-selflessness for free Burnside groups","venue":"arXiv:2611.17285 (preprint)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"donoso_silva_cost_one","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/2608.20472 (abstract). Quote: \"we obtain that the free Burnside group B(m,n) has cost 1 for every odd exponent n >= 665.\" Preprint (Aug 2026); unrefereed. The uses/3 link is our classification."],"precheck":null,"rules":[],"says":"For non-elementary torsion-free hyperbolic H and large odd n, H/H^n has cost 1; in particular B(m,n) has cost 1 for m >= 2 and odd n >= 665, so B(m,n) is anti-treeable and its first L2-Betti number vanishes (extending Feldkamp-Kionke 2023 for large prime exponents).","source":{"authors":["M. Donoso-Echenique","E. Silva"],"locator":"unknown","ref":"donoso_silva2026","title":"Free Burnside groups of large odd exponent have cost 1","venue":"arXiv:2608.20472 (preprint)","year":"2026"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order_bound(r(m,p^k))","value":"tower(m,q^q^q)"}],"id":"vlz_bound_prime_power","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0818.20046 (zbMATH review). Quote: \"The authors give a better upper bound for the orders of m generator groups of prime and prime power exponent.\" The tower formula is in the review in LaTeX: |G| <= T(m, q^{q^q}) with T(m,1)=m, T(m,n+1)=m^{T(m,n)}."],"precheck":null,"rules":[],"says":"If G is a finite m-generator group (m > 1) of exponent q = p^k, p prime, then |G| <= T(m, q^(q^q)), where T(m,1) = m and T(m,n+1) = m^T(m,n) (a tower of m's). This bound lies in the Grzegorczyk class Gr^4; earlier bounds were in Gr^5.","source":{"authors":["M. Vaughan-Lee","E. I. Zelmanov"],"locator":"unknown","ref":"vlz1993","title":"Upper bounds in the restricted Burnside problem","venue":"J. Algebra 162, No. 1, 107-145","year":"1993"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"order_bound(r(m,p),ge(p,29))","value":"tower(m,2^p)"},{"quantity":"order_bound(r(m,p),lt(p,29))","value":"tower(m,3^p)"}],"id":"vlz_bound_prime","kind":"theorem","kourovka":null,"notes":["Source: https://zbmath.org/?q=an:0818.20046. Quote (math rendered as
