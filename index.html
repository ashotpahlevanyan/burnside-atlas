emigroup with the permutation property must be locally finite.\""],"precheck":null,"rules":[],"says":"A finitely generated semigroup S is finite iff S is periodic (torsion) and has the permutation property: there is n >= 2 such that for all s_1..s_n in S some non-identity permutation sigma gives s_1 s_2 ... s_n = s_sigma(1) ... s_sigma(n).","source":{"authors":["A. Restivo","C. Reutenauer"],"locator":"unknown","ref":"restivo_reutenauer1984","title":"On the Burnside problem for semigroups","venue":"J. Algebra 89, 102-104","year":"1984"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_weak_permutation_fibonacci","kind":"example","kourovka":null,"notes":["Source: https://portal.mardi4nfdi.de/wiki/Item:Q1114022 (zbMATH review by J. Okninski). Quote: \"An example of a semigroup S with the weak permutation property which is finitely generated, periodic but infinite is given.\""],"precheck":null,"rules":[],"says":"There is a finitely generated, periodic, infinite semigroup with the weak permutation property: the Rees quotient of the free semigroup on {a, b} by the ideal of all words that are not factors of the infinite Fibonacci word. So Restivo-Reutenauer fails with the weak permutation property (for groups the two properties are equivalent, Blyth).","source":{"authors":["A. Restivo"],"locator":"unknown","ref":"restivo1989","title":"Permutation properties and the Fibonacci semigroup","venue":"Semigroup Forum","year":"1989"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_omega_iteration","kind":"theorem","kourovka":null,"notes":["Source: https://portal.mardi4nfdi.de/wiki/Item:Q1917528. Quote: \"a finitely generated semigroup S is finite if and only if S has the ω-iteration property\" (review uses \\(\\omega\\)). The same paper reproves Restivo-Reutenauer via Konig and Shirshov."],"precheck":null,"rules":[],"says":"A finitely generated semigroup S is finite iff it has the omega-iteration property: for every infinite sequence s_1, s_2, ... in S there are n >= 1 and i, j <= n with s_n ... s_1 = s_n ... s_(i+1) (s_i ... s_j)^2 s_(j-1) ... s_1. Generalizes a theorem of de Luca and Varricchio; proof via bi-ideal sequences and Ramsey's theorem.","source":{"authors":["G. Pirillo","S. Varricchio"],"locator":"unknown","ref":"pirillo_varricchio1996","title":"Some combinatorial properties of infinite words and applications to semigroup theory","venue":"Discrete Mathematics","year":"1996"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_uniformly_repetitive_periodic","kind":"theorem","kourovka":null,"notes":["Source: https://portal.mardi4nfdi.de/wiki/The_van_der_Waerden_theorem_and_the_Burnside_problem_for_semigroups (zbMATH review). Quote: \"we prove the main result of this paper: any uniformly repetitive semigroup is periodic.\""],"precheck":null,"rules":[],"says":"Every finite semigroup is uniformly repetitive (a generalization of van der Waerden's theorem), and every uniformly repetitive semigroup is periodic.","source":{"authors":["G. Pirillo"],"locator":"unknown","ref":"pirillo1989_vdw","title":"The van der Waerden theorem and the Burnside problem for semigroups","venue":"Archiv der Mathematik","year":"1989"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_uniformly_repetitive_finite","kind":"theorem","kourovka":null,"notes":["Source: https://portal.mardi4nfdi.de/wiki/On_uniformly_repetitive_semigroups (zbMATH review). Quote: \"(It is known that \\(\\mathbb{N}^ +\\), (the non-negative integers under addition) is not uniformly 4-repetitive.)\" Note: the review does not state the unconditional k = 4 corollary explicitly; see LEADS."],"precheck":null,"rules":[],"says":"If (N, +) is not uniformly k-repetitive, then every finitely generated uniformly k-repetitive semigroup is finite. (N, +) is known not to be uniformly 4-repetitive.","source":{"authors":["G. Pirillo","S. Varricchio"],"locator":"unknown","ref":"pirillo_varricchio1995","title":"On uniformly repetitive semigroups","venue":"Semigroup Forum","year":"1995"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_brown_extension","kind":"theorem","kourovka":null,"notes":["Source 1: https://portal.mardi4nfdi.de/wiki/An_interesting_combinatorial_method_in_the_theory_of_locally_finite_semigroups (zbMATH review). Quote: \"such that \\(\\varphi^{-1}(e)\\) is a locally finite subsemigroup of \\(S\\) for each idempotent element \\(e\\) of \\(T\\), then \\(S\\) is locally finite.\" Source 2: https://encyclopediaofmath.org/wiki/Locally_finite_semi-group (read via web.archive.org). Quote: \"an ideal extension of a locally finite semi-group by a locally finite semi-group is itself a locally finite semi-group.\""],"precheck":null,"rules":[],"says":"Brown's theorem: if phi is a homomorphism of a semigroup S onto a locally finite semigroup T such that phi^-1(e) is a locally finite subsemigroup for each idempotent e of T, then S is locally finite (and likewise with 'locally nilpotent'). In particular an ideal extension of a locally finite semigroup by a locally finite semigroup is locally finite.","source":{"authors":["T. C. Brown"],"locator":"unknown","ref":"brown1971","title":"An interesting combinatorial method in the theory of locally finite semigroups","venue":"Pacific J. Math. 36(2), 285-289","year":"1971"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_brown_union_counterexample","kind":"example","kourovka":null,"notes":["Source: https://encyclopediaofmath.org/wiki/Locally_finite_semi-group (via web.archive.org). Quote: \"A semi-group that has a decomposition into locally finite semi-groups need not be a locally finite semi-group [3]\" and \"A band of locally finite semi-groups (see Band of semi-groups ) is itself a locally finite semi-group [1]\". A search snippet of Brown 1967 (msp.org) said the example is a quotient of the free semigroup on four generators; not opened, see LEADS."],"precheck":null,"rules":[],"says":"A semigroup that decomposes into (disjoint) locally finite subsemigroups need not be locally finite (Brown). By contrast a band (semilattice-indexed etc.) of locally finite semigroups is locally finite (Shevrin), and a semigroup decomposing into locally finite groups is locally finite.","source":{"authors":["T. C. Brown"],"locator":"unknown","ref":"brown1967","title":"A semigroup union of disjoint locally finite subsemigroups which is not locally finite","venue":"Pacific J. Math. 22(1), 11-14","year":"1967"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_eom_nil_not_locally_finite","kind":"theorem","kourovka":null,"notes":["Source 1: https://encyclopediaofmath.org/wiki/Locally_finite_semi-group (via web.archive.org). Quote: \"These are, for example, a free semi-group with two generators in the variety given by $x^3=0$, and a free semi-group with three generators in the variety given by $x^2=0$.\" Source 2: https://arxiv.org/abs/2412.15436. Quote: \"in this variety, there exist both infinite and arbitrarily large finite semigroups with 3 generators [MH44].\" (x^2 = 0 case only). Nil semi-group page: \"For every $n>1$, there exists a semi-group with the identity $x^n=0$ that is not locally nilpotent\"."],"precheck":null,"rules":[],"says":"Periodic does not imply locally finite even far from groups: the free semigroup on two generators in the variety x^3 = 0 and the free semigroup on three generators in the variety x^2 = 0 are periodic but not locally finite. For every n > 1 there is a semigroup with x^n = 0 that is not locally nilpotent.","source":{"authors":["L. N. Shevrin (originator)"],"locator":"unknown","ref":"eom_locally_finite_sg","title":"Locally finite semi-group","venue":"Encyclopedia of Mathematics","year":"unknown"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_finite_nil_nilpotent","kind":"theorem","kourovka":null,"notes":["Source: https://encyclopediaofmath.org/wiki/Nil_semi-group (via web.archive.org). Quote: \"A finite nil semi-group is nilpotent, and the classes of locally nilpotent semi-groups and locally finite nil semi-groups coincide\" and \"If all nilpotent sub-semi-groups of a nil semi-group $S$ are finite, then so is $S$.\""],"precheck":null,"rules":[],"says":"A finite nil semigroup is nilpotent; the classes of locally nilpotent semigroups and locally finite nil semigroups coincide. If all nilpotent subsemigroups of a nil semigroup S are finite, then S is finite.","source":{"authors":["unknown"],"locator":"unknown","ref":"eom_nil_sg","title":"Nil semi-group","venue":"Encyclopedia of Mathematics","year":"unknown"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_shevrin_infinite_periodic","kind":"theorem","kourovka":null,"notes":["Source: https://encyclopediaofmath.org/wiki/Periodic_semi-group (via web.archive.org). Quote: \"If $E_S$ is finite, $S$ contains an infinite unipotent sub-semi-group, while if $E_S$ is infinite, $S$ contains an infinite sub-semi-group that is a nilpotent semi-group or a semi-group of idempotents\" and \"The Green relations $\\mathcal D$ and $\\mathcal J$ coincide in any periodic semi-group\"."],"precheck":null,"rules":[],"says":"Let S be an infinite periodic semigroup with idempotent set E. If E is finite, S contains an infinite unipotent subsemigroup; if E is infinite, S contains an infinite subsemigroup that is nilpotent or a band. Also, in any periodic semigroup D = J, and a 0-simple periodic semigroup is completely 0-simple.","source":{"authors":["L. N. Shevrin"],"locator":"unknown","ref":"shevrin1974","title":"On the theory of periodic semigroups","venue":"Izv. Vyssh. Uchebn. Zaved. Mat. 18(5)","year":"1974"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_hotzel_finiteness","kind":"theorem","kourovka":null,"notes":["Source: https://encyclopediaofmath.org/wiki/Semi-group_with_a_finiteness_condition (via web.archive.org). Quote: \"A finitely-generated semi-group with the condition $M_L$ or $M_R$ and all subgroups of which are finite, is itself finite [6] .\" ([6] = E. Hotzel, J. Algebra 60 (1979))."],"precheck":null,"rules":[],"says":"(Hotzel) A finitely generated semigroup satisfying the minimum condition on principal left ideals (M_L) or on principal right ideals (M_R), all of whose subgroups are finite, is finite. A semigroup with the minimum condition on right congruences is periodic, and is finite if all its subgroups are finite.","source":{"authors":["E. Hotzel"],"locator":"unknown","ref":"hotzel1979","title":"On finiteness conditions in semigroups","venue":"J. Algebra 60(2), 352-370","year":"1979"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_dlv_coudrain_schutzenberger","kind":"theorem","kourovka":null,"notes":["Source: https://portal.mardi4nfdi.de/wiki/A_finiteness_condition_for_semigroups_generalizing_a_theorem_of_Coudrain_and_Sch%C3%BCtzenberger (zbMATH review). Quote: \"a) \\(T\\) satisfies the minimum condition for bi-ideals \\((\\min_B)\\) and b) every subgroup of \\(T\\) generated by some finite subset of \\(T'\\) is finite then \\(T'\\) is locally finite.\""],"precheck":null,"rules":[],"says":"(de Luca-Varricchio) Let T' be a subsemigroup of a semigroup T. If T satisfies the minimum condition on bi-ideals and every subgroup of T generated by a finite subset of T' is finite, then T' is locally finite. With T' = T this generalizes a theorem of Coudrain and Schutzenberger (1966); it yields a new proof of McNaughton-Zalcstein.","source":{"authors":["A. de Luca","S. Varricchio"],"locator":"unknown","ref":"deluca_varricchio1995","title":"A finiteness condition for semigroups generalizing a theorem of Coudrain and Schutzenberger","venue":"Advances in Mathematics","year":"1995"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_mcnaughton_zalcstein","kind":"theorem","kourovka":null,"notes":["Source 1: https://arxiv.org/abs/0811.2541 (Steinberg). Quote: \"Theorem 6 (McNaughton and Zalcstein). Let S be a finitely generated periodic semigroup of n × n matrices over a field K. Then S is finite.\" Source 2: https://arxiv.org/abs/1909.04756. Quote: \"they showed, for any field F, that any finitely generated torsion subsemigroup of Fn×n is finite, using the result for groups by Schur and Kaplansky as a building block.\" Source 3 (EoM, Locally finite semi-group): \"If $S$ is a periodic semi-group of matrices over a skew-field and all subgroups of $S$ are locally finite, then $S$ is locally finite [8]\". Other proofs: Straubing 1983, Freedman-Gupta-Guralnick 1997, Okninski 1998, de Luca-Varricchio 1999 book, Steinberg 2012."],"precheck":null,"rules":[],"says":"McNaughton-Zalcstein (1975): every finitely generated periodic semigroup of n x n matrices over a field is finite (Burnside problem for linear semigroups, the semigroup analogue of Schur's theorem).","source":{"authors":["R. McNaughton","Y. Zalcstein"],"locator":"unknown","ref":"mcnaughton_zalcstein1975","title":"The Burnside problem for semigroups","venue":"J. Algebra 34, 292-299","year":"1975"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_steinberg_kernel_finiteness","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/0811.2541. Quote: \"Theorem 1. Let ϕ : M → N be a homomorphism of monoids such that N is locally finite and trϕ (n1 , n2 ) is locally finite for all n1 , n2 ∈ N . Then M is locally finite.\""],"precheck":null,"rules":[],"says":"Let phi: M -> N be a monoid homomorphism with N locally finite and every trace tr_phi(n1, n2) locally finite. Then M is locally finite. (Proof via the Rhodes-Tilson kernel category; gives another proof of McNaughton-Zalcstein.)","source":{"authors":["B. Steinberg"],"locator":"thm(1)","ref":"steinberg2012","title":"Yet another solution to the Burnside problem for matrix semigroups","venue":"Can. Math. Bull. 55, 188-192 (arXiv:0811.2541)","year":"2012"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_mandel_simon_bound","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1909.04756 (Bumpus et al., Introduction). Quote: \"Mandel and Simon [25] showed in 1977 that there exists a function f : N3 → N such that if S is a finite subsemigroup of Fn×n , generated by m of its elements, and the subgroups of S have order at most g, then S has size (cardinality) at most f (n, m, g).\" Title/venue of Mandel-Simon not visible; ref fields unknown."],"precheck":null,"rules":[],"says":"(Mandel-Simon 1977) There is a function f: N^3 -> N such that every finite subsemigroup of F^(n x n) generated by m elements whose subgroups have order at most g has at most f(n, m, g) elements; f is roughly a tower of exponentials of height n. This makes finiteness of finitely generated rational matrix semigroups decidable (also Jacob, independently). Dependence on m is unavoidable.","source":{"authors":["A. Mandel","I. Simon"],"locator":"unknown","ref":"mandel_simon1977","title":"unknown","venue":"unknown","year":"1977"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_rational_matrix_length_bound","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/1909.04756 (abstract and Thm 1). Quote: \"We show that any matrix in the semigroup is a product of matrices in M whose length is at most 2n(2n+3) g(n)n+1 ∈ 2O(n log n)\" (exponents flattened by pdftotext; the exact exponent layout of the bound should be re-read from the PDF before formalizing). Kind=claim: arXiv v2 (2020), journal not visible."],"precheck":null,"rules":[],"says":"If a finite set M of rational n x n matrices generates a finite semigroup, every element is a product of at most L(n) generators, with L(n) an explicit bound depending only on n and g(n) that the authors state lies in 2^O(n log n), where g(n) <= (2n)! is the maximal order of a finite subgroup of GL(n,Q). Weber-Seidl: for nonnegative integer matrices length <= ceil(e^2 n!) - 2, and any bound must be >= 2^(n-2).","source":{"authors":["G. Bumpus","C. Haase","S. Kiefer","P.-I. Stoienescu","J. Tanner"],"locator":"thm(1)","ref":"bumpus_etal2019","title":"On the Size of Finite Rational Matrix Semigroups","venue":"arXiv:1909.04756 (journal unknown)","year":"2019"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_shneperman_inverse_linear","kind":"theorem","kourovka":null,"notes":["Source: https://encyclopediaofmath.org/wiki/Locally_finite_semi-group (via web.archive.org). Quote: \"If $S$ is a periodic inverse semi-group of matrices over a field and, moreover, the periods of all its elements (see Monogenic semi-group ) are uniformly bounded and are not divided by the characteristic of the field, then $S$ is finite [2] .\" Note: as quoted, 'finite' without 'finitely generated'; check original wording (LEADS)."],"precheck":null,"rules":[],"says":"A periodic inverse semigroup of matrices over a field, whose element periods are uniformly bounded and not divisible by the characteristic, is finite.","source":{"authors":["L. B. Shneperman"],"locator":"unknown","ref":"shneperman1976","title":"Periodic inverse linear semigroups","venue":"Vesci Akad. Nauk BSSR Ser. Fiz. Mat. Nauk. 4, 22-28","year":"1976"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_sapir_burnside_varieties","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2412.15436 (Remembering Mark Sapir, section by M. Volkov). Quote: \"then all periodic semigroups in V are locally finite if and only if an identity Zn+1 = W , for some word W distinct from Zn+1 , holds in V .\" and \"Thus, in such varieties, the general and bounded Burnside problems coincide.\" Original proof used compactness from symbolic dynamics."],"precheck":null,"rules":[],"says":"Sapir (1987): for a semigroup variety V of finite axiomatic rank, all periodic semigroups in V are locally finite iff all semigroups of finite exponent in V are locally finite (general and bounded Burnside problems coincide). If V is defined by identities in at most n variables and V contains a non-periodic semigroup or all groups in V are locally finite, then all periodic semigroups in V are locally finite iff V satisfies an identity Z_(n+1) = W with W a word distinct from the Zimin word Z_(n+1). For periodic V the problem reduces to the groups in V.","source":{"authors":["M. V. Sapir"],"locator":"unknown","ref":"sapir1987","title":"Problems of Burnside type and the finite basis property in varieties of semigroups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 51(2), 319-340; Math. USSR-Izv. 30 (1988) 295-314","year":"1987"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_sapir_restricted_varieties","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2412.15436. Quote: \"Sapir gave an algorithm that, given any finite set Σ of semigroup identities, verifies whether or not the variety defined by Σ has the 'restricted Burnside' property\". MaRDI page for Sapir 1991 lists zbMATH keywords 'algorithm', 'finitely based semigroup variety', 'restricted Burnside problem' (no review text)."],"precheck":null,"rules":[],"says":"Sapir (1991): there is an algorithm that, given a finite set of semigroup identities, decides whether the variety they define has the restricted Burnside property (a uniform bound on the size of its finite m-generated members for every m). The 1991 proof of the 1987 results is fully constructive.","source":{"authors":["M. V. Sapir"],"locator":"unknown","ref":"sapir1991","title":"The restricted Burnside problem for varieties of semigroups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 55(3), 670-679","year":"1991"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[{"quantity":"zimin_isoterm_bound(s)","value":"card(s)^3"}],"id":"sg_sapir_infb","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1911.05817 (Araujo-Araujo-Cameron-Lee-Raminhos survey, Thm 4.4 citing Sapir's book Thm 3.6.34). Quote: \"(iii) A finite semigroup S is inherently non-finitely based if and only if the Zimin words z1 , z2 , . . . , zm , where m = |S|3 , are isoterms for S.\" The uses(..., sg_sapir_burnside_varieties, proof) link reflects that the survey says the result 'follows from the work of Sapir [63, 64]' where [64] is the Burnside-type paper."],"precheck":null,"rules":[],"says":"Sapir: a finite semigroup S is inherently non-finitely based (every locally finite variety containing S is non-finitely based) iff the Zimin words z_1, ..., z_m with m = |S|^3 are isoterms for S; equivalently iff eSe is INFB for some idempotent e. Hence INFB is decidable for finite semigroups. A_2^1 and B_2^1 (Brandt monoid) are INFB.","source":{"authors":["M. V. Sapir"],"locator":"unknown","ref":"sapir1987_infb","title":"Inherently non-finitely based finite semigroups","venue":"Mat. Sb. 133(2), 154-166; Math. USSR-Sb. 61 (1988) 155-166","year":"1987"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[{"quantity":"min_order(nonfinitely_based_semigroup)","value":"6"}],"id":"sg_six_element_nfb","kind":"theorem","kourovka":null,"notes":["Source: https://encyclopediaofmath.org/wiki/Variety_of_semi-groups (via web.archive.org). Quote: \"Any semi-group with less than six elements has a finite basis of identities, but there exists a $ 6 $- element semi-group that has no finite basis of identities.\" Consistent with arXiv:1911.05817 section 4.2 'Non-finitely based varieties generated by a semigroup of order 6' (title only)."],"precheck":null,"rules":[],"says":"Every semigroup with fewer than six elements has a finite basis of identities, but there is a 6-element semigroup with no finite basis of identities.","source":{"authors":["unknown"],"locator":"unknown","ref":"eom_variety_sg","title":"Variety of semi-groups","venue":"Encyclopedia of Mathematics","year":"unknown"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"sg_small_variety_locally_finite","kind":"theorem","kourovka":null,"notes":["Source: https://encyclopediaofmath.org/wiki/Variety_of_semi-groups (via web.archive.org). Quote: \"A small variety of semi-groups is locally finite (i.e. consists of locally finite semi-groups) if and only if the variety of all groups in $ \\mathfrak M $ is locally finite\"."],"precheck":null,"rules":[],"says":"Every semigroup variety is either periodic or overcommutative. A small semigroup variety (finite subvariety lattice) is locally finite iff its subvariety of groups is locally finite. For a periodic variety V the following are equivalent (Sapir-Sukhanov): V consists of bands of Archimedean semigroups; every torsion class is a subsemigroup in every member; V does not contain the Brandt semigroup B_2.","source":{"authors":["unknown"],"locator":"unknown","ref":"eom_variety_sg","title":"Variety of semi-groups","venue":"Encyclopedia of Mathematics","year":"unknown"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_burnside_varieties_not_jfinite","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1606.03866. Quote: \"we conclude that all varieties Bm,n with m ≥ 2 are not locally J -finite.\" and \"Lemma 4.16. The nilvarieties [ x n = 0] with n ≥ 2 are not locally J -finite.\" Kind=claim: arXiv v1 preprint, journal not visible."],"precheck":null,"rules":[],"says":"Every Burnside variety [x^m = x^(m+n)] with m >= 2 is not locally J-finite (a finitely generated member has infinitely many J-classes), since it contains [x^2 = x^3]. Nilvarieties [x^n = 0], n >= 2, are not locally J-finite. A variety [u = 0] is either locally finite or not locally J-finite. [x = x^3], [x = x^4], [x = x^5], [x = x^7] are locally H-finite; for [x = x^6] and [x = x^n], n >= 8, local H-finiteness is unknown.","source":{"authors":["P. V. Silva","F. Soares"],"locator":"sec(4)","ref":"silva_soares2016","title":"Local finiteness for Green relations in (I-)semigroup varieties","venue":"arXiv:1606.03866 (journal unknown)","year":"2016"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_inverse_x2x3_infinite","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/pdf/1606.03866 (Example 4.13, Theorem 4.14(ii)). Quote: \"Example 4.13. C2 , the subvariety of I defined by the identity x2 = x3 , is a variety of epigroups, but is not locally J -finite.\" and \"Thus each αn , for n ≥ 1, belongs to a distinct J -classe of T and so T is not J -finite.\" Kind=claim: arXiv preprint."],"precheck":null,"rules":[],"says":"The inverse semigroup T = Inv<a, b, c | u^2 = 0 for all non-empty u> satisfies x^2 = x^3 and is not J-finite (the prefixes of the Morse-Hedlund square-free word on three letters lie in distinct J-classes); hence the variety of inverse semigroups satisfying x^2 = x^3 is not locally finite, and all inverse semigroup varieties containing it are not locally K-finite for any Green relation K.","source":{"authors":["P. V. Silva","F. Soares"],"locator":"ex(4.13)","ref":"silva_soares2016","title":"Local finiteness for Green relations in (I-)semigroup varieties","venue":"arXiv:1606.03866 (journal unknown)","year":"2016"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"sg_indicator_burnside","kind":"claim","kourovka":null,"notes":["Source: https://arxiv.org/abs/1009.2337 (abstract). Quote: \"S. I. Kublanovsky has proven that a variety V is a Rees-Sushkevich variety if and only it does not contain any of special finite semigroups. These semigroups are called indicator Burnside semigroups.\" Kind=claim: arXiv preprint, journal not visible."],"precheck":null,"rules":[],"says":"(Kublanovsky) A semigroup variety is a Rees-Sushkevich variety (contained in a periodic variety generated by 0-simple semigroups) iff it contains none of certain finite 'indicator Burnside semigroups'. Bakulin: indicator Burnside semigroups have polynomially decidable equational theory and each generates a finitely based variety.","source":{"authors":["S. Bakulin"],"locator":"unknown","ref":"bakulin2010","title":"On identities of indicator Burnside semigroups","venue":"arXiv:1009.2337 (journal unknown)","year":"2010"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"sg_mccammond_omega_terms","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1406.0888 (abstract; journal ref LMS J. Comput. Math. 18 (2015) 130-147). Quote: \"The original proof of correctness of McCammond's algorithm, based on normal forms for such terms, uses McCammond's solution of the word problem for certain Burnside semigroups.\""],"precheck":null,"rules":[],"says":"McCammond solved the word problem for omega-terms over finite aperiodic semigroups via normal forms; the original correctness proof used his solution of the word problem for certain Burnside semigroups. Almeida-Costa-Zeitoun give a simpler correctness proof via regular languages attached to the normal forms.","source":{"authors":["J. Almeida","J. C. Costa","M. Zeitoun"],"locator":"unknown","ref":"almeida_costa_zeitoun2015","title":"McCammond's normal forms for free aperiodic semigroups revisited","venue":"LMS J. Comput. Math. 18, 130-147","year":"2015"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"kurosh_problem","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1008.4461 (PDF intro). Quote: \"An analogous problem for algebras is the Kurosh Problem: if A is a finitely generated algebra over a field K, and every element of A is algebraic over K, does it follow that A is finite dimensional over K?\" Second source https://arxiv.org/abs/1108.4267: \"Is every finitely generated algebraic algebra finite dimensional? (the Kurosh problem)\" and \"The seminal work of Golod and Shafarevich [3,4] in 1964 showed that the answer to these famous problems is negative.\""],"precheck":null,"rules":[],"says":"Kurosh problem: if A is a finitely generated algebra over a field K and every element of A is algebraic over K, is A finite dimensional over K? (Algebra analogue of the general Burnside problem.) Answered negatively by Golod-Shafarevich 1964.","source":{"authors":["T. H. Lenagan","A. Smoktunowicz","A. Young"],"locator":"introduction","ref":"lsy2012","title":"Nil algebras with restricted growth","venue":"Proc. Edinb. Math. Soc. (2) 55, no. 2, 461-475 (arXiv:1008.4461)","year":"2012"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[],"id":"levitzki_problem","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1008.4461. Quote: \"A special case of the Kurosh Problem, sometimes known as Levitski's Problem, concerns nil algebras\". Second source https://en.wikipedia.org/wiki/Kurosh_problem: \"A special case is whether or not every nil algebra is locally nilpotent\"."],"precheck":null,"rules":[],"says":"Levitzki problem (special case of Kurosh): if A is a finitely generated algebra over a field and every element of A is nilpotent, is A finite dimensional? Equivalently: is every nil algebra locally nilpotent? Answered negatively (Golod).","source":{"authors":["T. H. Lenagan","A. Smoktunowicz","A. Young"],"locator":"introduction","ref":"lsy2012","title":"Nil algebras with restricted growth","venue":"Proc. Edinb. Math. Soc. (2) 55, no. 2, 461-475 (arXiv:1008.4461)","year":"2012"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[],"id":"golod_nil_algebra","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 (Ershov survey, Thm 2.4, 2.5). Quote: \"Theorem 2.4 (Golod, [Go1, Go2]). Let K be a field and d >= 2 an integer. Then there exists a d-generated associative nil algebra over K which is infinite-dimensional.\" Second source https://arxiv.org/abs/math/0505141: \"Golod and Shafarevich gave a construction which yields, over arbitrary fields, infinite dimensional, finitely generated nil algebras that are not nilpotent algebras.\" These algebras have exponential growth (same source)."],"precheck":null,"rules":[],"says":"For every field K and every d >= 2 there is a d-generated associative nil algebra over K that is infinite dimensional (Golod; countable fields in the 1964 paper, the general case via Golod's later work). For K = F_p the subgroup of 1 + A generated by 1 + u_i is an infinite d-generated p-group.","source":{"authors":["E. S. Golod"],"locator":"unknown","ref":"golod1964","title":"On nil-algebras and finitely approximable p-groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 28","year":"1964"},"status":"checked"},{"caveats":[],"domain":"cgt","facts":[{"quantity":"relator_bound(finite_p_group,original)","value":"(d-1)^2/4"},{"quantity":"relator_bound(finite_p_group,vinberg_roquette)","value":"d^2/4"}],"id":"golod_shafarevich_inequality","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 sec. 1.1-1.2. Quote: \"for any finite p-group G the minimal numbers of generators d(G) and relators r(G) ... are related by the inequality r(G) > (d(G) - 1)^2/4 (this was improved to r(G) > d(G)^2/4 in the subsequent works of Vinberg [Vi] and Roquette [Ro])\". Improvements: vinberg1965, roquette1967."],"precheck":null,"rules":[],"says":"Golod-Shafarevich: for a finite p-group G (as a pro-p group), r(G) > (d(G)-1)^2/4, improved by Vinberg and Roquette to r(G) > d(G)^2/4. Hence a pro-p group with r(G) < d(G)^2/4 is infinite; this solved the class field tower problem negatively.","source":{"authors":["E. S. Golod","I. R. Shafarevich"],"locator":"unknown","ref":"golod_shafarevich1964","title":"On the class field tower","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 28","year":"1964"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"gs_groups_infinite","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490. Quote: \"Theorem 3.1 (Golod-Shafarevich). Golod-Shafarevich groups are infinite.\" and \"it is easy to see that there exist Golod-Shafarevich abstract groups which are torsion.\""],"precheck":null,"rules":[],"says":"Golod-Shafarevich groups (abstract or pro-p, w.r.t. a prime p) are infinite. Since relators are counted with weights, even infinitely many relators can be 'small', so there exist p-torsion Golod-Shafarevich groups.","source":{"authors":["E. S. Golod","I. R. Shafarevich"],"locator":"unknown","ref":"golod_shafarevich1964","title":"On the class field tower","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 28","year":"1964"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"golod_d_minus_1_finite","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 Thm 3.3. Quote: \"Theorem 3.3 (Golod). For every prime p and integer d >= 2 there exists an infinite d-generated p-torsion group in which every (d - 1)-generated subgroup if finite.\" The survey says this was deduced in Golod's 1968 ICM paper (Go2, 'Some problems of Burnside type'); src points to golod1964 only as the family origin."],"precheck":null,"rules":[],"says":"For every prime p and d >= 2 there is an infinite d-generated p-torsion group in which every (d-1)-generated subgroup is finite.","source":{"authors":["E. S. Golod"],"locator":"unknown","ref":"golod1964","title":"On nil-algebras and finitely approximable p-groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 28","year":"1964"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"wilson_gs_torsion_quotient","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 sec. 1.4. Quote: \"In [Wi1], Wilson proved that every Golod-Shafarevich groups has an infinite torsion quotient, using a simple modification of Golod's argument\"."],"precheck":null,"rules":[],"says":"Every Golod-Shafarevich group has an infinite torsion quotient (Wilson, by a modification of Golod's argument).","source":{"authors":["J. S. Wilson"],"locator":"unknown","ref":"wilson1991_fp","title":"Finite presentations of pro-p groups and discrete groups","venue":"Invent. Math. 105, no. 1, 177-183","year":"1991"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"zelmanov_gs_free_subgroup","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 Thm 7.1. Quote: \"Theorem 7.1 (Zelmanov). Every generalized Golod-Shafarevich pro-p group contains a nonabelian free pro-p subgroup.\""],"precheck":null,"rules":[],"says":"Every (generalized) Golod-Shafarevich pro-p group contains a non-abelian free pro-p subgroup.","source":{"authors":["E. Zelmanov"],"locator":"unknown","ref":"zelmanov2000_gs","title":"On groups satisfying the Golod-Shafarevich condition","venue":"New horizons in pro-p groups, Progr. Math. 184, Birkhauser, 223-232","year":"2000"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"ershov_rf_torsion_nonamenable","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 Thm 12.3 and sec. 1.5. Quote: \"Theorem 12.3. [Er1] There exist residually finite torsion non-amenable groups.\" and \"the existence of Golod-Shafarevich groups with property (T) yielded the first examples of torsion non-amenable residually finite groups [Er1].\" Er1 = ershov2008; examples arise from Kac-Moody groups over finite fields."],"precheck":null,"rules":[],"says":"There exist Golod-Shafarevich groups with Kazhdan's property (T); consequently there exist residually finite torsion non-amenable groups (first examples).","source":{"authors":["M. Ershov"],"locator":"unknown","ref":"ershov2008","title":"Golod-Shafarevich groups with property (T) and Kac-Moody groups","venue":"Duke Math. J. 145, no. 2, 309-339","year":"2008"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"gs_groups_nonamenable","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 sec. 1.4. Quote: \"in [EJ2], it was shown that every Golod-Shafarevich abstract group has an infinite quotient with Kazhdan's property (T), which implies that Golod-Shafarevich abstract groups cannot be amenable.\""],"precheck":null,"rules":[],"says":"Every Golod-Shafarevich abstract group has an infinite quotient with Kazhdan's property (T); hence Golod-Shafarevich abstract groups are never amenable.","source":{"authors":["M. Ershov"],"locator":"unknown","ref":"ershov2011","title":"Kazhdan quotients of Golod-Shafarevich groups (appendices by A. Jaikin-Zapirain)","venue":"Proc. Lond. Math. Soc. 102, no. 4, 599-636","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"rf_tarski_like_groups","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 Thm 13.2. Quote: \"For every prime p there exists an infinite finitely generated residually finite p-torsion group in which every finitely generated subgroup is either finite or of finite index.\""],"precheck":null,"rules":[],"says":"For every prime p there exists an infinite finitely generated residually finite p-torsion group in which every finitely generated subgroup is either finite or of finite index; every generalized Golod-Shafarevich group (w.r.t. p) has such a quotient (Ershov-Jaikin-Zapirain).","source":{"authors":["M. Ershov","A. Jaikin-Zapirain"],"locator":"unknown","ref":"ershov_jaikin_wdef","title":"Groups of positive weighted deficiency","venue":"J. Reine Angew. Math. (to appear per survey); arXiv:1007.1489","year":"unknown"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"rf_tarski_problem","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 sec. 13. Quote: \"This problem remains completely open, except for p = 2 when non-existence of such groups was known since 1970s\". Status as of 2012."],"precheck":null,"rules":[],"says":"Does there exist, for a prime p, an infinite finitely generated residually finite p-torsion group in which every subgroup is either finite or of finite index? Open except p = 2 (no such groups).","source":{"authors":["M. Ershov"],"locator":"sec(13)","ref":"ershov2012_survey","title":"Golod-Shafarevich groups: a survey","venue":"Internat. J. Algebra Comput. (to appear per preprint); arXiv:1206.0490","year":"2012"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"power_p_deficiency_torsion","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1206.0490 sec. 9. Quote: \"These groups provide very simple counterexamples to the general Burnside problem\" and \"in this way one obtains a short elementary self-contained proof of the existence of infinite finitely generated torsion groups.\" Also osin2011."],"precheck":null,"rules":[],"says":"Groups of positive power p-deficiency (Schlage-Puchta; Osin in a slightly different form) are infinite, indeed have infinite pro-p completion; since there are torsion groups of positive power p-deficiency, this gives a short elementary proof that infinite finitely generated torsion groups exist (and they have positive rank gradient).","source":{"authors":["J.-C. Schlage-Puchta"],"locator":"unknown","ref":"schlage_puchta2012","title":"A p-group with positive rank gradient","venue":"J. Group Theory 15, no. 2, 261-270","year":"2012"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[{"quantity":"gk_dim_upper_bound(countable_field)","value":"20"}],"id":"lenagan_smoktunowicz_nil","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0505141. Quote: \"We construct a nil algebra over a countable field which has finite but non-zero Gelfand-Kirillov dimension.\" and \"a finitely generated, non-nilpotent, nil algebra with Gelfand-Kirillov dimension not exceeding 20.\" Confirmed in https://arxiv.org/abs/1008.4461 intro."],"precheck":null,"rules":[],"says":"Over any countable field there is a finitely generated, non-nilpotent (infinite dimensional) nil algebra of Gelfand-Kirillov dimension at most 20, answering a question of L. Small (Golod-Shafarevich algebras have exponential growth).","source":{"authors":["T. H. Lenagan","A. Smoktunowicz"],"locator":"abstract","ref":"lenagan_smoktunowicz2007","title":"An infinite dimensional affine nil algebra with finite Gelfand-Kirillov dimension","venue":"J. Amer. Math. Soc. 20, no. 4, 989-1001 (arXiv:math/0505141)","year":"2007"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[{"quantity":"gk_dim_upper_bound(countable_field)","value":"3"},{"quantity":"generators","value":"2"}],"id":"lsy_nil_gk3","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1008.4461. Quote: \"over an arbitrary countable field, there exists a finitely generated algebra that is nil, infinite dimensional, and has Gelfand-Kirillov dimension at most three.\" and \"(In fact, our algebra requires only two generators.)\""],"precheck":null,"rules":[],"says":"Over an arbitrary countable field there is a finitely generated (in fact 2-generated) nil algebra that is infinite dimensional and has Gelfand-Kirillov dimension at most 3.","source":{"authors":["T. H. Lenagan","A. Smoktunowicz","A. Young"],"locator":"abstract","ref":"lsy2012","title":"Nil algebras with restricted growth","venue":"Proc. Edinb. Math. Soc. (2) 55, no. 2, 461-475 (arXiv:1008.4461)","year":"2012"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"nil_gk1_nilpotent","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1008.4461 concluding remarks. Quote: \"In contrast, nil does imply nilpotent for algebras of Gelfand-Kirillov dimension at most one, by [7]. Combining this with Bergman's Gap Theorem ... a nil but not nilpotent example must have Gelfand-Kirillov dimension at least two.\""],"precheck":null,"rules":[],"says":"Nil implies nilpotent for (finitely generated) algebras of Gelfand-Kirillov dimension at most 1; with Bergman's gap theorem, a nil but not nilpotent finitely generated algebra has GK dimension at least 2.","source":{"authors":["L. W. Small","J. T. Stafford","R. B. Warfield, Jr"],"locator":"unknown","ref":"small_stafford_warfield1985","title":"Affine algebras of Gelfand-Kirillov dimension one are PI","venue":"Math. Proc. Cambridge Philos. Soc. 97, no. 3, 407-414","year":"1985"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"nil_growth_questions","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1008.4461 concluding remarks. Quote: \"In particular, we ask: is every finitely presented nil algebra nilpotent?\" and \"It would be interesting to see if it is possible to construct a finitely generated infinite dimensional nil algebra with finite Gelfand-Kirillov dimension over an uncountable field.\" Status may have changed after 2010."],"precheck":null,"rules":[],"says":"Open (as of LSY): (a) is every finitely presented nil algebra nilpotent? (b) is there a finitely generated infinite dimensional nil algebra of finite GK dimension over an uncountable field? (c) what is the minimal growth (GK dimension 2?) of a finitely generated nil, non-nilpotent algebra?","source":{"authors":["T. H. Lenagan","A. Smoktunowicz","A. Young"],"locator":"concluding_remarks","ref":"lsy2012","title":"Nil algebras with restricted growth","venue":"Proc. Edinb. Math. Soc. (2) 55, no. 2, 461-475 (arXiv:1008.4461)","year":"2012"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"bounded_kurosh_pi","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1403.5673 sec. 2.0.1. Quote: \"A finitely generated associative algebra R over a field F in which every element satisfies an algebraic equation of bounded degree is finite dimensional. As the reader will realize this is an analogue of the bounded Burnside problem for groups which instead has a negative answer.\" Second: https://en.wikipedia.org/wiki/Kurosh_problem: \"For PI-algebras the Kurosh problem has a positive solution.\""],"precheck":null,"rules":[],"says":"Bounded Kurosh problem (Jacobson, Kaplansky, Levitzki, late 1940s): a finitely generated associative algebra in which every element satisfies an algebraic equation of bounded degree is finite dimensional. More generally the Kurosh problem has a positive solution for PI-algebras. This contrasts with the bounded Burnside problem for groups.","source":{"authors":["I. Kaplansky"],"locator":"unknown","ref":"kaplansky1948","title":"Rings with a polynomial identity","venue":"Bull. Amer. Math. Soc. 54, 575-580","year":"1948"},"status":"checked"},{"caveats":[],"domain":"varieties","facts":[],"id":"shirshov_height_kurosh","kind":"corollary","kourovka":null,"notes":["Source: https://arxiv.org/abs/1712.00508. Quote: \"The above theorem implies positive solution of Kurosh problem and of other Burnside-type problems for PI-rings.\" and \"Corollary 2.1 If A is a PI-algebra of degree m and all words in its generators of degree <= m are algebraic then A is locally finite.\""],"precheck":null,"rules":[],"says":"From Shirshov's height theorem: if A is a PI-algebra of degree m and all words in its generators of degree <= m are algebraic, then A is locally finite (positive solution of the Kurosh problem and other Burnside-type problems for PI-rings).","source":{"authors":["A. A. Chilikov","A. Ya. Belov"],"locator":"cor(2.1)","ref":"chilikov_belov2019","title":"Normal basises of algebras and Exponential Diophantine equations in rings of positive characteristic","venue":"arXiv:1712.00508 (venue unknown)","year":"2019"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"nagata_higman","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2602.18805 Thm 4.8. Quote: \"Let the associative algebra R is nil of bounded index n, i.e. R satisfies the identity x^n = 0. If the field K is of characteristic 0 or p > n, then R is nilpotent of class N for some N depending on n.\" Refs: Dubnov-Ivanov 1943, nagata1953, higman1956_nagata."],"precheck":null,"rules":[],"says":"Dubnov-Ivanov-Nagata-Higman: an associative algebra satisfying x^n = 0 (nil of bounded index n) over a field of characteristic 0 or p > n is nilpotent of class N(n). (Algebra analogue of the bounded Burnside problem.)","source":{"authors":["M. Nagata"],"locator":"unknown","ref":"nagata1953","title":"On the nilpotency of nil algebras","venue":"J. Math. Soc. Japan 4, 296-301","year":"1953"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"golod_lie_nil","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2004.05157 sec. 1.1. Quote: \"This gives a negative answer to the question of Jacobson whether a finitely generated restricted Lie algebra L is finite dimensional provided that each element x in L is algebraic\". Petrogradsky cites Golod for the Lie case ([16], exact paper not checked)."],"precheck":null,"rules":[],"says":"From the Golod-Shafarevich construction: there are infinite dimensional 3-generated Lie algebras L with (ad x)^n(x,y)(y) = 0 for all x, y (any field), and infinite dimensional finitely generated restricted Lie algebras with nil p-mapping; this answers negatively Jacobson's question on algebraic restricted Lie algebras.","source":{"authors":["E. S. Golod"],"locator":"unknown","ref":"golod1964","title":"On nil-algebras and finitely approximable p-groups","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 28","year":"1964"},"status":"transcribed"},{"caveats":[],"domain":"varieties","facts":[],"id":"nil_lie_finite_gk","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/2004.05157 abstract. Quote: \"The author constructed their analogue in case of restricted Lie algebras of characteristic 2 [39], Shestakov and Zelmanov extended this construction to an arbitrary positive characteristic [52].\" The 'finite GK dimension' wording is from the JEMS abstract seen only in search snippets: see LEADS."],"precheck":null,"rules":[],"says":"Analogues of the Grigorchuk and Gupta-Sidki groups for restricted Lie algebras: Petrogradsky (characteristic 2) and Shestakov-Zelmanov (any positive characteristic) constructed finitely generated, infinite dimensional nil restricted Lie algebras of slow (finite GK) growth.","source":{"authors":["I. P. Shestakov","E. Zelmanov"],"locator":"unknown","ref":"shestakov_zelmanov2008","title":"Some examples of nil Lie algebras","venue":"J. Eur. Math. Soc. 10, no. 2, 391-398","year":"2008"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"gromov_periodic_finite","kind":"corollary","kourovka":null,"notes":["Source: https://arxiv.org/abs/1008.4461 intro. Quote: \"As a consequence, if a finitely-generated group has polynomial growth and each element has finite order then the group is finite.\""],"precheck":null,"rules":[],"says":"Gromov: a finitely generated group of polynomial growth is virtually nilpotent; hence a finitely generated periodic group of polynomial growth is finite.","source":{"authors":["M. Gromov"],"locator":"unknown","ref":"gromov1981","title":"Groups of polynomial growth and expanding maps","venue":"Inst. Hautes Etudes Sci. Publ. Math. 53, 53-73","year":"1981"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[{"quantity":"growth_upper_exponent(grigorchuk_group,grigorchuk1984)","value":"log(31)/log(32)"}],"id":"grigorchuk_group_rf_not_fp","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1111.0512 Thm 9.3. Quote: \"G is a residually finite torsion 2-group, which is not finitely presentable.\" Bounds exp(c n^(1/2)) <= v(n) <= exp(C n^beta), beta = log_32 31, also in https://arxiv.org/abs/1802.09077 intro."],"precheck":null,"rules":[],"says":"The first Grigorchuk group G is a residually finite torsion 2-group which is not finitely presentable; its growth satisfies exp(n^(1/2)) <= gamma_G(n) <= exp(n^beta) with beta = log_32 31 < 1 (Grigorchuk 1980/1984).","source":{"authors":["R. I. Grigorchuk"],"locator":"unknown","ref":"grigorchuk1984","title":"Degrees of growth of finitely generated groups and the theory of invariant means","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 48","year":"1984"},"status":"checked"},{"caveats":[],"domain":"cgt","facts":[],"id":"lysenok_presentation","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1111.0512 eq. (9.1). Quote: \"One more definition of the group G can be given by the following presentation found by I. Lysenok [Lys85]\" followed by G = <a, b, c, d | a^2, b^2, c^2, d^2, bcd, sigma^k((ad)^4), sigma^k((adacac)^4), k >= 0>."],"precheck":null,"rules":[],"says":"Lysenok: the first Grigorchuk group has the recursive (L-)presentation <a,b,c,d | a^2, b^2, c^2, d^2, bcd, sigma^k((ad)^4), sigma^k((adacac)^4), k >= 0> where sigma is the substitution a -> aca, b -> d, c -> b, d -> c.","source":{"authors":["I. G. Lysionok"],"locator":"unknown","ref":"lysenok1985","title":"A system of defining relations for the Grigorchuk group","venue":"Mat. Zametki 38, 503-511","year":"1985"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[{"quantity":"growth_exponent(grigorchuk_group)","value":"approx(0.7674)"},{"quantity":"lambda0_polynomial","value":"x^3-x^2-2*x-4"}],"id":"erschler_zheng_growth","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1802.09077 abstract. Quote: \"for the first Grigorchuk group G we show that its growth v(n) satisfies lim log log v(n)/ log n = alpha_0, where alpha_0 = log 2/log lambda_0 ~ 0.7674, lambda_0 is the positive root of the polynomial X^3 - X^2 - 2X - 4.\" Second source https://arxiv.org/abs/2004.05157 sec. 1.2 states the same value and calls it the lowest known intermediate growth; NOTE it attributes the 'lower bound' to Bartholdi [5], whereas Erschler-Zheng attribute the UPPER bound to Bartholdi [5] and Muchnik-Pak [43]. Erschler-Zheng's attribution is used here."],"precheck":null,"rules":[],"says":"The growth of the first Grigorchuk group satisfies lim log log v(n) / log n = alpha_0 = log 2 / log lambda_0 ~ 0.7674, where lambda_0 is the positive root of X^3 - X^2 - 2X - 4. The upper bound exp(C n^alpha_0) is due to Bartholdi (1998) and Muchnik-Pak (2001); Erschler-Zheng proved the matching lower bound exp(n^(alpha_0 - eps)) via random walks with non-trivial Poisson boundary.","source":{"authors":["A. Erschler","T. Zheng"],"locator":"thm(a)","ref":"erschler_zheng2020","title":"Growth of periodic Grigorchuk groups","venue":"Invent. Math. 219, no. 3, 1069-1155 (arXiv:1802.09077)","year":"2020"},"status":"checked"},{"caveats":[],"domain":"cgt","facts":[{"quantity":"growth_lower_exponent(grigorchuk1984)","value":"0.5"},{"quantity":"growth_lower_exponent(leonov1997)","value":"0.504"},{"quantity":"growth_lower_exponent(bartholdi2001)","value":"0.5157"},{"quantity":"growth_lower_exponent(brieussel_thesis)","value":"0.5207"}],"id":"grigorchuk_growth_lower_bounds","kind":"computation","kourovka":null,"notes":["Source: https://arxiv.org/abs/1802.09077 intro. Quote: \"Leonov [38] introduced an algorithm which led to a better anti-contraction coefficient and showed that v(n) >= exp(c n^0.504). Bartholdi [6] obtained that v(n) >= exp(c n^0.5157).\""],"precheck":null,"rules":[],"says":"Successive lower bounds for the growth of the first Grigorchuk group before Erschler-Zheng: exp(c n^(1/2)) (Grigorchuk), exp(c n^0.504) (Leonov 1997), exp(c n^0.5157) (Bartholdi 2001), exp(c n^0.5207) (Brieussel, thesis).","source":{"authors":["A. Erschler","T. Zheng"],"locator":"introduction","ref":"erschler_zheng2020","title":"Growth of periodic Grigorchuk groups","venue":"Invent. Math. 219, no. 3, 1069-1155 (arXiv:1802.09077)","year":"2020"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"grigorchuk_omega_groups","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1802.09077 intro. Quote: \"if omega is eventually constant then G_omega is virtually abelian ... otherwise G_omega is of intermediate growth. The group G_omega is periodic (also called torsion) if and only if omega contains all three letters 0, 1, 2 infinitely often.\" Oscillating-growth part from https://arxiv.org/abs/2004.05157 sec. 1.3 (single source)."],"precheck":null,"rules":[],"says":"Grigorchuk groups G_omega, omega in {0,1,2}^infinity: if omega is eventually constant then G_omega is virtually abelian; otherwise G_omega has intermediate growth. G_omega is periodic iff omega contains each of 0, 1, 2 infinitely often. For any alpha_0 <= alpha <= beta <= 1 some G_omega has oscillating growth with liminf/limsup of ln ln gamma / ln n equal to alpha and beta (Erschler-Zheng).","source":{"authors":["R. I. Grigorchuk"],"locator":"unknown","ref":"grigorchuk1984","title":"Degrees of growth of finitely generated groups and the theory of invariant means","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 48","year":"1984"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"aleshin_sushchansky_growth","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1111.0512 sec. 9. Quote: \"the 2-group of Aleshin [Ale72] (generated by two automata with 3 and 7 states) and the p-groups of V. Sushchanskii (generated by automata with a number of states growing as a quadratic function of p [Sus79]) were shown to have intermediate growth by the author in [Gri84b, page 280] and [Gri85a, page 197]\"."],"precheck":null,"rules":[],"says":"The Aleshin 2-group (generated by two automata with 3 and 7 states) and the Sushchansky p-groups (generated by automata with number of states quadratic in p), originally built as infinite finitely generated torsion groups, have intermediate growth (Grigorchuk 1984, 1985).","source":{"authors":["R. I. Grigorchuk"],"locator":"page(280)","ref":"grigorchuk1984","title":"Degrees of growth of finitely generated groups and the theory of invariant means","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 48","year":"1984"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"sushchansky_groups","kind":"example","kourovka":null,"notes":["Source: https://arxiv.org/abs/1111.0512 (sec. 9 and bibliography). Quote: \"the papers of Aleshin and Sushchanskii deal exclusively with the question of construction of finitely generated infinite torsion groups (contributing to the General Burnside Problem)\". Bibliography: \"V. I. Sushchansky, Periodic permutation p-groups and the unrestricted Burnside problem, DAN SSSR. 247 (1979), no. 3, 557-562\"."],"precheck":null,"rules":[],"says":"Sushchansky (1979) constructed finitely generated infinite periodic p-groups of permutations (automaton groups) contributing to the general (unrestricted) Burnside problem.","source":{"authors":["V. I. Sushchansky"],"locator":"unknown","ref":"sushchansky1979","title":"Periodic permutation p-groups and the unrestricted Burnside problem","venue":"DAN SSSR 247, no. 3, 557-562","year":"1979"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"gap_conjecture","kind":"conjecture","kourovka":null,"notes":["Source: https://arxiv.org/abs/1111.0512 sec. 10. Quote: \"Conjecture 2. (Gap Conjecture) If the growth function gamma_G(n) of a finitely generated group G is strictly bounded from above by e^sqrt(n) ... then the growth of G is polynomial.\""],"precheck":null,"rules":[],"says":"Grigorchuk's Gap Conjecture: if the growth function of a finitely generated group is strictly bounded above by exp(sqrt(n)), then the group has polynomial growth.","source":{"authors":["R. I. Grigorchuk"],"locator":"conj(2)","ref":"grigorchuk2011_milnor","title":"Milnor's problem on the growth of groups and its consequences","venue":"arXiv:1111.0512 (survey; venue unknown)","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"gap_residually_p","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1111.0512 sec. 10. Quote: \"Theorem 10.1. ([Gri89a]) Let G be a finitely generated residually finite-p group. If gamma_G(n) < e^sqrt(n) then G has polynomial growth.\" and \"Theorem 10.3. The Gap Conjecture holds for residually supersolvable groups.\" The 'in particular' clause is our reading, not a quote."],"precheck":null,"rules":[],"says":"Gap Conjecture holds for residually finite-p groups (Grigorchuk 1989) and, more generally, for residually nilpotent finitely generated groups (Thm 10.2) and residually supersolvable groups (Thm 10.3). In particular a periodic residually finite-p group of intermediate growth (e.g. the Grigorchuk group) has growth at least exp(sqrt n) up to equivalence.","source":{"authors":["R. I. Grigorchuk"],"locator":"thm(10.1)","ref":"grigorchuk2011_milnor","title":"Milnor's problem on the growth of groups and its consequences","venue":"arXiv:1111.0512 (survey; venue unknown)","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"cgt","facts":[],"id":"gupta_sidki_growth_open","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1111.0512 sec. 11. Quote: \"(it is not known yet if Gupta-Sidki p-groups have intermediate growth or not)\". Petrogradsky (arXiv:2004.05157) says 'The construction of Gupta-Sidki also yields groups of subexponential growth [14]' -- apparent tension with the survey; see LEADS before relying on either."],"precheck":null,"rules":[],"says":"Do the Gupta-Sidki p-groups have intermediate growth? (Open per Grigorchuk's 2011 survey; the Lie algebra associated with the Gupta-Sidki 3-group has linear growth, giving growth at least exp(n^(2/3)).)","source":{"authors":["R. I. Grigorchuk"],"locator":"sec(11)","ref":"grigorchuk2011_milnor","title":"Milnor's problem on the growth of groups and its consequences","venue":"arXiv:1111.0512 (survey; venue unknown)","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"amenability","facts":[],"id":"grigorchuk_fp_amenable_non_eg","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0208237 sec. 1.1. Quote: \"the first example of a finitely presented group which is a cyclic extension of an infinite torsion group was constructed by Grigorchuk [15]. But the torsion subgroup in Grigorchuk's group does not have a bounded exponent and his group is amenable (it was the first example of a finitely presented amenable but not elementary amenable group).\" Second: https://arxiv.org/abs/1111.0512: \"there are examples of finitely presented amenable but non-elementary amenable groups\" [Gri98]. Use of Lysenok's presentation: survey line 'presentation (9.1), as was observed in [Gri98]' (paraphrased link)."],"precheck":null,"rules":[],"says":"Grigorchuk (1998): there is a finitely presented amenable group that is not elementary amenable; it is a cyclic extension of an infinite torsion group (built from the Grigorchuk group via Lysenok's presentation) -- the first finitely presented cyclic extension of an infinite torsion group, though the torsion subgroup has unbounded exponent.","source":{"authors":["R. I. Grigorchuk"],"locator":"unknown","ref":"grigorchuk1998","title":"An example of a finitely presented amenable group that does not belong to the class EG","venue":"Mat. Sb. 189, no. 1, 79-100","year":"1998"},"status":"checked"},{"caveats":[],"domain":"amenability","facts":[{"quantity":"exponent_example_bound","value":"gt(n,10^10)"}],"id":"olshanskii_sapir_fp_nonamenable","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0208237. Quote (abstract): \"We construct a finitely presented non-amenable group without free non-cyclic subgroups thus providing a finitely presented counterexample to von Neumann's problem. Our group is an extension of a group of finite exponent n >> 1 by a cyclic group, so it satisfies the identity [x, y]^n = 1.\" Thm 1.1 part 3: \"G contains a subgroup isomorphic to a free Burnside group of exponent n with 2 generators.\" Footnote: n can be computed (e.g. n > 10^10). Second source: https://arxiv.org/abs/1111.0512 ([OS02])."],"precheck":null,"rules":[],"says":"For every sufficiently large odd n there is a finitely presented group G which is an ascending HNN extension of a finitely generated infinite group of exponent n, an extension of a non-locally-finite group of exponent n by an infinite cyclic group, contains B(2,n), and is non-amenable without non-cyclic free subgroups (finitely presented counterexample to von Neumann's problem); G satisfies [x,y]^n = 1.","source":{"authors":["A. Yu. Ol'shanskii","M. V. Sapir"],"locator":"thm(1.1)","ref":"olshanskii_sapir2003","title":"Non-amenable finitely presented torsion-by-cyclic groups","venue":"Publ. Math. IHES 96, 43-169 (arXiv:math/0208237)","year":"2003"},"status":"checked"},{"caveats":[],"domain":"adian","facts":[],"id":"os_cep_embedding","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0208237 Thm 1.2 and footnotes 3-4. Quote: \"there exists a natural number s = s(n) such that the free Burnside group B(infinity, n) of infinite countable rank is CEP-embedded into the free Burnside group B(s, n)\"; \"D.Sonkin recently showed that one can set s = 2\"; \"every countable group of exponent n is embedable into a finitely generated group of exponent n. This was first proved by Obraztsov\"."],"precheck":null,"rules":[],"says":"For sufficiently large odd n there is s = s(n) such that B(infinity,n) embeds into B(s,n) with the congruence extension property (Sonkin later showed s = 2 works). Consequently every countable group of exponent n embeds into a finitely generated group of exponent n (first proved by Obraztsov).","source":{"authors":["A. Yu. Ol'shanskii","M. V. Sapir"],"locator":"thm(1.2)","ref":"olshanskii_sapir2003","title":"Non-amenable finitely presented torsion-by-cyclic groups","venue":"Publ. Math. IHES 96, 43-169 (arXiv:math/0208237)","year":"2003"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"fp_infinite_torsion_open","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/math/0208237 sec. 1.1. Quote: \"Probably the most famous problem in that series is the problem about finding a finitely presented infinite torsion group.\" Second: https://arxiv.org/abs/1607.04603: \"so far it is not known whether there exists a finitely presented infinite periodic group.\" (2019).","PRE-CHECK 2026-11-14: Kourovka 21 prints problem 6.3 as open, but a 2026 comment says infinite finitely presented periodic groups exist, citing an UNVERIFIED OpenAI preprint (same as 8.52). Not confirmed by mathematicians; see kourovka_6_3 and kourovka_8_52."],"precheck":null,"rules":[],"says":"Does there exist a finitely presented infinite torsion (periodic) group? Open. Finitely generated examples (B(m,n), Grigorchuk group) are recursively presented and so embed in finitely presented groups by Higman, but limits of hyperbolic groups cannot give finitely presented examples.","source":{"authors":["A. Yu. Ol'shanskii","M. V. Sapir"],"locator":"sec(1.1)","ref":"olshanskii_sapir2003","title":"Non-amenable finitely presented torsion-by-cyclic groups","venue":"Publ. Math. IHES 96, 43-169 (arXiv:math/0208237)","year":"2003"},"status":"checked"},{"caveats":[],"domain":"cgt","facts":[],"id":"tits_alternative","kind":"theorem","kourovka":null,"notes":["Source: https://en.wikipedia.org/wiki/Tits_alternative. Quote: \"A linear group is not amenable if and only if it contains a non-abelian free group (thus the von Neumann conjecture, while not true in general, holds for linear groups).\" Second: https://arxiv.org/abs/math/0208237: \"Tits [38] proved that every non-amenable matrix group over a field of characteristic 0 contains a non-abelian free subgroup.\" (OS states the char 0 case only.)"],"precheck":null,"rules":[],"says":"Tits alternative: a finitely generated linear group over a field is either virtually solvable or contains a non-abelian free subgroup. Consequently the von Neumann conjecture holds for linear groups: a linear group is non-amenable iff it contains a non-abelian free group.","source":{"authors":["J. Tits"],"locator":"unknown","ref":"tits1972","title":"Free subgroups in linear groups","venue":"J. Algebra 20, 250-270","year":"1972"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[{"quantity":"index_bound(schur,n)","value":"(sqrt(8*n)+1)^(2*n^2)-(sqrt(8*n)-1)^(2*n^2)"},{"quantity":"index_bound(collins_finite,n_ge_71)","value":"factorial(n+1)"}],"id":"jordan_schur","kind":"theorem","kourovka":null,"notes":["Source: https://en.wikipedia.org/wiki/Jordan-Schur_theorem (raw wikitext). Quote: \"Schur proved a more general result that applies when G is not assumed to be finite, but just periodic.\" and \"one can take f(n) = (n + 1)! when n is at least 71\". Wikipedia cites Curtis-Reiner (1962) pp. 258-262 and collins2007."],"precheck":null,"rules":[],"says":"Jordan: there is f(n) such that every finite subgroup G of GL(n,C) has an abelian normal subgroup of index at most f(n). Schur extended this to periodic (not necessarily finite) G, with f(n) = ((8n)^(1/2)+1)^(2n^2) - ((8n)^(1/2)-1)^(2n^2). Collins (using CFSG): in the finite case f(n) = (n+1)! for n >= 71.","source":{"authors":["I. Schur"],"locator":"unknown","ref":"schur1911","title":"Über Gruppen periodischer linearer Substitutionen","venue":"Sitzungsber. Preuss. Akad. Wiss.","year":"1911"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"rbp_equivalent_forms","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1706.07963 sec. 1. Quote: \"It has been known for some time that the following assertions are equivalent.\" ... \"1.3. The class of locally finite groups of exponent n is a variety. 1.4. Any residually finite group of exponent n is locally finite.\""],"precheck":null,"rules":[],"says":"The following are equivalent (for fixed n): (1.1) the restricted Burnside problem for m-generator groups of exponent n has a bound B(m,n); (1.2) locally nilpotent groups of exponent n form a variety; (1.3) locally finite groups of exponent n form a variety; (1.4) every residually finite group of exponent n is locally finite. By Zelmanov all hold.","source":{"authors":["P. Shumyatsky"],"locator":"sec(1)","ref":"shumyatsky2000","title":"Applications of Lie ring methods to group theory","venue":"unknown (published 2000 per arXiv:1706.07963)","year":"2000"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"zelmanov_pi_adnilpotent","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1706.07963 Thm 1.5/2.1. Quote: \"Let L be a Lie algebra generated by a1, ..., am. Suppose that L satisfies a polynomial identity and each commutator in a1, ..., am is ad-nilpotent. Then L is nilpotent.\" Shumyatsky attributes the RBP deduction to Zelmanov's 'Nil Rings and Periodic Groups' (Seoul 1992); src uses zelmanov1990 as the RBP paper."],"precheck":null,"rules":[],"says":"Zelmanov: a Lie algebra generated by a_1..a_m that satisfies a polynomial identity and in which every commutator in the generators is ad-nilpotent is nilpotent (of class bounded in terms of the identity, the ad-nilpotency index, m and the field). The restricted Burnside problem follows from this.","source":{"authors":["E. I. Zelmanov"],"locator":"unknown","ref":"zelmanov1990","title":"Solution of the restricted Burnside problem for groups of odd exponent","venue":"Izv. Akad. Nauk SSSR Ser. Mat. 54:1 (1990) 42-59, 221","year":"1990"},"status":"transcribed"},{"caveats":[],"domain":"commutators","facts":[],"id":"wilson_rf_engel","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1706.07963 sec. 3. Quote: \"It is a long-standing problem whether any n-Engel group is locally nilpotent. In [49] J. Wilson proved that this is true if G is residually finite. His proof relies on a result of A. Shalev [32] which uses the positive solution of the Restricted Burnside Problem\"."],"precheck":null,"rules":[],"says":"Wilson: every residually finite n-Engel group is locally nilpotent (proof uses Shalev's work, which relies on the positive solution of the restricted Burnside problem). Shumyatsky: if G is residually finite and every commutator [x_1,...,x_k] is n-Engel then gamma_k(G) is locally nilpotent.","source":{"authors":["J. S. Wilson"],"locator":"unknown","ref":"wilson1991_2gen","title":"Two-generator conditions for residually finite groups","venue":"Bull. London Math. Soc. 23, 239-248","year":"1991"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"rf_commutator_exponent","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1706.07963 Thm 3.1. Quote: \"Let k be an integer, q = p^s a prime-power, G a residually finite group such that [x1, x2, ..., xk]^q = 1 for all x1, x2, ..., xk in G. Then gamma_k(G) is locally finite.\" and \"The theorem is no longer true if the assumption that G is residually finite is dropped.\""],"precheck":null,"rules":[],"says":"If G is residually finite and [x_1,...,x_k]^q = 1 for all x_i, q a prime power, then gamma_k(G) is locally finite (k = 1 is the RBP for prime-power exponent). Fails without residual finiteness: Ol'shanskii's methods give groups with [x,y]^q = 1 and non-periodic derived subgroup.","source":{"authors":["P. Shumyatsky"],"locator":"thm(3.1)","ref":"shumyatsky2000","title":"Applications of Lie ring methods to group theory","venue":"unknown (published 2000 per arXiv:1706.07963)","year":"2000"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"zelmanov_compact_periodic","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1112.5879 sec. 1-2. Quote: \"using Wilson's reduction theorem [21], Zelmanov has been able to prove local finiteness of periodic compact groups [23].\" and \"Zelmanov's theorem that every periodic compact group is locally finite\". Ref [23]: E. Zelmanov, On periodic compact groups, Israel J. Math. 77 (1992), 83-95 (a database gives 1994; see search note)."],"precheck":null,"rules":[],"says":"Zelmanov: every periodic compact (Hausdorff) group is locally finite; in particular every periodic profinite group is locally finite. Proof uses Wilson's reduction theorem (1983).","source":{"authors":["E. Zelmanov"],"locator":"unknown","ref":"zelmanov1992_compact","title":"On periodic compact groups","venue":"Israel J. Math. 77, 83-95","year":"1992"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"herfort_primes","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1112.5879 intro. Quote: \"Earlier Herfort showed that there exist only finitely many primes dividing the orders of elements of a periodic profinite group [8].\""],"precheck":null,"rules":[],"says":"Herfort: only finitely many primes divide the orders of elements of a periodic profinite group.","source":{"authors":["W. Herfort"],"locator":"unknown","ref":"herfort1979","title":"Compact torsion groups and finite exponent","venue":"Arch. Math. 33, 404-410","year":"1979"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"profinite_exponent_problem","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1112.5879. Quote: \"It is a long-standing problem whether any periodic profinite group has finite exponent.\" and \"It is well-known that a soluble periodic profinite group has finite exponent.\" Status as of 2011."],"precheck":null,"rules":[],"says":"Does every periodic profinite group have finite exponent? (Long-standing open problem; soluble periodic profinite groups do have finite exponent.)","source":{"authors":["C. Acciarri","P. Shumyatsky"],"locator":"introduction","ref":"acciarri_shumyatsky2011","title":"On profinite groups in which commutators are covered by finitely many subgroups","venue":"arXiv:1112.5879 (venue unknown)","year":"2011"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"burnside_homeo_question","kind":"open_problem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1607.04603 Question 1.2. Quote: \"Let M be a connected compact manifold and G be a finitely generated subgroup G < Homeo(M) such that all the elements of G have finite order. Then, is G necessarily finite?\" and \"For the time being, we know Question 1.2 has a positive answer just in a few cases and no negative one is known.\""],"precheck":null,"rules":[],"says":"Burnside problem for homeomorphism groups (attributed to Ghys and Farb): if M is a connected compact manifold and G < Homeo(M) is finitely generated with all elements of finite order, must G be finite? No negative answer is known; compactness is essential.","source":{"authors":["S. Hurtado","A. Kocsard","F. Rodriguez-Hertz"],"locator":"question(1.2)","ref":"hkr2019","title":"The Burnside problem for Diff_omega(S^2)","venue":"arXiv:1607.04603 (venue unknown)","year":"2019"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"holder_circle_periodic","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1404.1224 intro. Quote: \"As a corollary of Holder theorem ... it holds that a finitely generated periodic group of circle homeomorphisms is finite.\" Second: https://arxiv.org/abs/1607.04603: \"any periodic group G < Homeo+(S^1) acts freely on S^1 ... G is conjugate to a subgroup of SO(2)\"."],"precheck":null,"rules":[],"says":"A finitely generated periodic group of circle homeomorphisms is finite (corollary of Holder's theorem: a periodic subgroup of Homeo+(S^1) acts freely, is conjugate into SO(2), hence abelian). Finite generation is needed: rational rotations form an infinite periodic group.","source":{"authors":["S. Hurtado","A. Kocsard","F. Rodriguez-Hertz"],"locator":"introduction","ref":"hkr2019","title":"The Burnside problem for Diff_omega(S^2)","venue":"arXiv:1607.04603 (venue unknown)","year":"2019"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"guelman_liousse_surfaces","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1404.1224. Quote: \"Theorem 2. Any finitely generated periodic group acting by homeomorphisms on a compact orientable surface S of genus g >= 2, is a finite group.\" and abstract: \"a finitely generated periodic group of spherical diffeomorphisms with even bounded orders is finite.\" HKR (arXiv:1607.04603) confirms GL for hyperbolic surfaces. uses(schur_linear) is our inference from the conjugation-into-O(3) argument, not a quote."],"precheck":null,"rules":[],"says":"Guelman-Liousse: any finitely generated periodic group of homeomorphisms of a compact orientable surface of genus g >= 2 is finite; also any finitely generated periodic subgroup of Homeo(closed annulus) is finite. A finitely generated periodic group of C^1 diffeomorphisms of S^2 with a finite orbit is finite (conjugate into O(3)), and one with even bounded orders is finite.","source":{"authors":["N. Guelman","I. Liousse"],"locator":"thm(2)","ref":"guelman_liousse2017","title":"Burnside problem for groups of homeomorphisms of compact surfaces","venue":"Bull. Braz. Math. Soc. (N.S.) 48, no. 3, 389-397 (arXiv:1404.1224)","year":"2017"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"guelman_liousse_torus","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1108.3778 abstract. Quote: \"We prove that a finitely generated periodic group of homeomorphisms on the 2-torus that preserves a probability measure mu is finite.\" and \"every finitely generated 2-group of toral homeomorphisms is finite.\" Confirmed by HKR [GL14]."],"precheck":null,"rules":[],"says":"Guelman-Liousse: a finitely generated periodic group of homeomorphisms of the 2-torus preserving a probability measure is finite (and abelian, acting freely, if isotopic to the identity); every finitely generated 2-group of toral homeomorphisms is finite.","source":{"authors":["N. Guelman","I. Liousse"],"locator":"abstract","ref":"guelman_liousse2014","title":"Burnside problem for measure preserving groups and for 2-groups of toral homeomorphisms","venue":"Geom. Dedicata 168, no. 1, 387-396 (arXiv:1108.3778)","year":"2014"},"status":"checked"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"hkr_area_sphere","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1607.04603. Quote (abstract): \"We show that every finitely generated periodic group of bounded exponent G < Diff_omega(S^2) is finite\". Thm 1.4: \"Let M be a compact hyperbolic manifold of dimension q >= 3. Then, any periodic subgroup of Homeo(M) is finite.\" The proof ends by conjugating into SO(3) and applying Schur's theorem."],"precheck":null,"rules":[],"says":"Hurtado-Kocsard-Rodriguez-Hertz: every finitely generated periodic group of bounded exponent of C^infinity area-preserving diffeomorphisms of S^2 is finite. Also: any periodic subgroup of Homeo(M) for M a compact hyperbolic manifold of dimension >= 3 is finite, and finitely generated periodic subgroups of measure-preserving homeomorphisms of T^q are finite.","source":{"authors":["S. Hurtado","A. Kocsard","F. Rodriguez-Hertz"],"locator":"thm(1.3)","ref":"hkr2019","title":"The Burnside problem for Diff_omega(S^2)","venue":"arXiv:1607.04603 (venue unknown)","year":"2019"},"status":"transcribed"},{"caveats":[],"domain":"burnside_groups","facts":[],"id":"rebelo_silva_symplectic","kind":"theorem","kourovka":null,"notes":["Source: https://arxiv.org/abs/1404.1224 intro. Quote: \"Rebelo and Silva (see [16]) proved that any finitely generated periodic subgroup of C^2 symplectomorphisms of a compact 4-dimensional symplectic manifold is finite, provided that the fundamental class in H^4(M, Z) is a product of classes in H^1(M, Z).\" HKR also cites [RS07] for
