.4.9'),page(20)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_elementary_period","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4.10, p. 21. Part of the simultaneous induction on rank alpha; uses ВзНорм_{alpha-1}. The rank-1 criterion is said to follow easily from 2.9."],"precheck":null,"rules":[],"says":"4.10. Elementary period of rank alpha [элементарный период ранга alpha]: a minimal period A of rank alpha such that for every minimal period B of rank alpha and all generating occurrences V, W in integral words Y in Цел(X, alpha, A), Y1 in Цел(X1, alpha, B): ВзНорм_{alpha-1}(V, W) and l_{alpha,B}(W) >= 9 imply rho_{alpha,A}(X) = rho_{alpha,B}(X1). In rank 1 a minimal period A is elementary iff A^4 contains no word E in Пер(B) with d(E) > 8 d(B). Examples: (a1 a2)^8 a3 is an elementary period of rank 1; (a1 a2)^8 a1 is not elementary in rank 1 and is the simplest example of an elementary period of rank 2.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.10'),page(21)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_10_elementary_word","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4.10, p. 21. Part of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"If A is an elementary period of rank alpha, the base E of any generating (resp. normal generating) occurrence P*E*Q of rank alpha in Y in Цел(X, alpha, A) is an elementary (resp. normal elementary) word of rank alpha [элементарное (нормальное элементарное) слово]; E is generated [порождается] by P*E*Q. If l_{alpha,A}(P*E*Q) >= r, E is an elementary r-power of rank alpha [элементарная r-степень]. Every elementary word of rank 1 is normal elementary.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.10'),page(21)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_11","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 21-22. Part of the simultaneous induction on rank alpha. Ch. II (II.5.1): for an elementary 9-power E these notions (pseudo-kernels, Соот_alpha, rho_alpha, l_alpha(E)) do not depend on the choice of elementary period A and generating occurrence W; the period subscript A is then dropped."],"precheck":null,"rules":[],"says":"Pseudo-kernels [псевдоядра]: let W1 = R*E*S be an occurrence in an arbitrary word Z of an elementary word E generated by W = P*E*Q in Y in Цел(X, alpha, A), A elementary of rank alpha. For a supporting kernel V of rank alpha-1 of W, phi(V; W, W1) is a pseudo-kernel of rank alpha-1 of W1 (with R, S empty: of the word E). Соот_{alpha,A}(U, V) for pseudo-kernels U, V of W1 means Соот_{alpha,A}(phi(U; W1, W), phi(V; W1, W)). Left/right sections of W1 are pseudo-kernels whose images are left/right sections of W; l_{alpha,A}(W1) = l_{alpha,A}(E) = l_{alpha,A}(W). An occurrence W2 in Z contains r sections of W1 if their intersection W' is non-empty and l_{alpha,A}(phi(W'; W1, W)) = r. Density rho_alpha(W1) = rho_{alpha,A}(W).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.11'),page(21)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_12","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 22-23. Part of the simultaneous induction on rank alpha; uses ВзНорм_{alpha-1}. Example (p. 23): a2^-10 a1 * (a1^2 a2)^9 * a1^2 a2 a1 a2 is continuable right, not left; maximal continuation a2^-10 a1 * (a1^2 a2)^10 a1 * a2. Ch. II (II.5.13): for a normal elementary 9-power, the maximal continuation and maximal continuation right/left are unique."],"precheck":null,"rules":[],"says":"Continuation [продолжение]: let W = R*E*S be an occurrence in Z of a normal elementary word E of rank alpha generated by P*E*Q in Y in Цел(X, alpha, A), A elementary. W1 = R1*uEv*S1 with R == R1 u, S == v S1 is a continuation of W relative to P*E*Q if some normal generating occurrence F*uEv*G in some Y1 in Цел(X1, alpha, B), B elementary, satisfies ВзНорм_{alpha-1}(Fu*E*vG, P*E*Q) and l_{alpha,B}(Fu*E*vG) = l_{alpha,A}(P*E*Q). With u (resp. v) empty, W1 is a continuation to the right (left); if u (v) is non-empty, W is continuable to the left (right). W is maximal if not continuable either way relative to any generating occurrence; maximal continuation, and maximal continuation to the right/left (not further continuable that way), are defined accordingly.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.12'),page(22)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_13","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 23. Part of the simultaneous induction on rank alpha. Every occurrence of an elementary word of rank 1 is normalized. Ch. II (II.7.3): each W in Норм(alpha, Z, 9) has a unique maximal normalized continuation and maximal normalized continuation right/left."],"precheck":null,"rules":[],"says":"An occurrence R*E*S of a normal elementary word E of rank alpha in Z in R_{a-1} is normalized [нормированное] if ВзНорм_{alpha-1}(P*E*Q, R*E*S) for some generating occurrence P*E*Q. Норм(alpha, Z, r) (r > 0) is the set of normalized occurrences of elementary r-powers of rank alpha in Z. Each normal generating occurrence of an elementary word of rank alpha is normalized, and Норм(alpha, Z, 9) is a subset of Прав(alpha-1, Z) (by 4f for rank alpha-1). Requiring W, W1 in 4.12 to be normalized gives normalized continuation (left/right), normalized continuability, maximal normalized occurrence and maximal normalized continuation; МаксНорм(alpha, Z, r) is the set of maximal normalized occurrences of elementary r-powers of rank alpha in Z.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.13'),page(23)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_14","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 23-24. Part of the simultaneous induction on rank alpha. Rank-1 examples with period a1^2 a2 are given on p. 24."],"precheck":null,"rules":[],"says":"Two occurrences U, V of elementary words of rank alpha in the same word Z are coordinated [согласованные], Согл(U, V), if their union is a continuation of each of them relative to some generating occurrences of their bases. The relation is reflexive and symmetric; Ch. II proves that for elementary 9-powers it is independent of the generating occurrences chosen and transitive.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.14'),page(23)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_15","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 24. Part of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"For A an elementary period of rank alpha, Эл(alpha, A) is the set of elementary 3-powers of rank alpha generated by occurrences in words Y in Цел(X, alpha, A); Эл(1, A) is a subset of Пер(A). Elementary words E, D are kindred [родственные], Род(E, D), if they belong to the same Эл(alpha, A); any occurrences of them are then also called kindred. The relation is reflexive and symmetric (transitivity: II.5.20). Elementary words of rank 1 E in Эл(1, A), D in Эл(1, B) are kindred iff B is a cyclic shift of A.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.15'),page(24)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_16","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 25. Part of the simultaneous induction on rank alpha; uses equivalence ~(alpha-1) and the sets K_{alpha-1}, Mbar_{alpha-1}. This is where the defining relation A^n = 1 enters: an elementary power A^t A1 is replaced by (essentially) the complementary power of A^-1. Formulas (5)-(7) checked on a 300 dpi render. Examples: a simple q-turn of rank 1 of a1^-2 * (a2^3 a1^-1)^q * a2 a1^-7 a2^5 gives a1^-1 (a2^-3 a1)^(n-q-1) a2^-2 a1^-7 a2^5, while a1^-2 * (a2^3 a1^-1)^(n-5) * a2 a1^-7 a2^5 admits no simple 9-turn. The footnote refers to 4.18."],"precheck":null,"rules":[],"says":"Simple r-turn of rank alpha [простой r-поворот ранга alpha]: let r >= 9, t > 0, h > 0, X, Y in K_{a-1}, with RT*A^t A1*T1Q in МаксНорм(alpha, X, r), RH*D^h D1*H1Q in МаксНорм(alpha, Y, r), P*A^t A1*S in МаксНорм(alpha, Z, 9) for some Z in Mbar_{a-1}, where A == A1A2 is an elementary period of rank alpha and D == D1D2 is a cyclic shift of A^-1, and (5) A^(n+20) ~(alpha-1) A^(t+10) A1 T1 H1^-1 D1^-1 D^-h H^-1 T A^10, (6) D^(n+20) ~(alpha-1) D^(h+10) D1 H1 T1^-1 A1^-1 A^-t T^-1 H D^10, with both sides of (5), (6) in K_{a-1}. Then the transition (7) RTA^tA1T1Q -> RHD^hD1H1Q is a simple r-turn of rank alpha, also called a simple r-turn of any W in Норм(alpha, X, 9) coordinated with RT*A^tA1*T1Q. In rank 1, T, T1, H, H1 are empty, A^n == A^t A1 D1^-1 D^-h and D == A^-1, so a simple r-turn of rank 1 has the form R A^t A1 Q -> R D^h D1 Q.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.16'),page(25)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_17","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 25-26. Part of the simultaneous induction on rank alpha; stability is defined via ВзНорм_{alpha-1}: an occurrence lying entirely left or right of the turned part keeps its rank-(alpha-1) normalization."],"precheck":null,"rules":[],"says":"Stability in a simple turn [устойчивое в простом повороте]: a regular occurrence F*E*G of rank alpha-1 in RTA^tA1T1Q is stable in the simple turn (7) if either R == F E R1 and ВзНорм_{alpha-1}(F*E*R1TA^tA1T1Q, F*E*R1HD^hD1H1Q), or Q == Q1 E G and ВзНорм_{alpha-1}(RTA^tA1T1Q1*E*G, RHD^hD1H1Q1*E*G). The second occurrence in that pair is the image [образ] of F*E*G in the turn, written f_{X->Y}(F*E*G). The image of W in Норм(alpha, X, 9) in its own turn (7) is any U in Норм(alpha, Y, 9) coordinated with RH*D^hD1*H1Q. In a simple r-turn of rank 1, the stable occurrences are exactly those contained in *R*A^tA1Q or in RA^tA1*Q*.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.17'),page(25)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_18","kind":"claim","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 26. Explanatory remark, not used as a definition in the book. Footnote: existence of such a turn relies on a left- (right-) bounded local closure of rank alpha (VII.2.6)."],"precheck":null,"rules":[],"says":"Remark: the conditions in 4.16 are redundant (e.g. (6) follows from (5)), but the redundancy is convenient for proving the symmetry of r-turns (III.1.2). For n >= 1003 a simpler definition would do: R A^t A1 Q -> R (A^-1)^(n-t-1) A2^-1 Q is a simple r-turn of W if W in Норм(alpha, R A^t A1 Q, 9), R A^t A1 Q and R A^(-n+t+1) A2^-1 Q are in K_{a-1}, t < n-1, A == A1A2 is an elementary period of rank alpha, W is coordinated with R*A^tA1*Q, A^n occurs in some Z in M_{a-1}, and R*A^tA1*Q and R*(A^-1)^(n-1-t) A2^-1*Q are coordinated with some normalized occurrences of elementary r-powers of rank alpha.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.18'),page(26)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_19","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 26-27. Part of the simultaneous induction on rank alpha: a general turn is a simple turn up to equivalence ~(alpha-1) at both ends, transported by f_{alpha-1}."],"precheck":null,"rules":[],"says":"r-turn [r-поворот ранга alpha]: for X in R_{a-1} and W in Норм(alpha, X, 9), a transition X -> Y is an r-turn of W if there are X1, Y1 in K_{a-1} with X ~(alpha-1) X1, Y ~(alpha-1) Y1, and X1 -> Y1 a simple r-turn of W1 = f_{alpha-1}(W; X, X1). Any 9-turn of W is called a turn [поворот] of W. A regular occurrence V of rank alpha-1 in X is stable in X -> Y if f_{alpha-1}(V; X, X1) is stable in X1 -> Y1; if V2 is the image of V1 (or of W1) in X1 -> Y1, then f_{alpha-1}(V2; Y1, Y) is the image of V (of W) in X -> Y. Every r-turn of rank 1 is simple.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.19'),page(26)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_20","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 27. Part of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"Since f_{alpha-1} is single-valued, the image of an occurrence V in Прав(alpha-1, X) stable in a turn X -> Y of rank alpha is uniquely determined; it is written f_{X->Y}(V). The image of W in Норм(alpha, X, 9) in its own turn is not unique, but all its images are pairwise coordinated (III.1.3). A maximal image [максимальный образ] of W in its turn X -> Y is an image lying in МаксНорм(alpha, Y, 9). Rank-1 case: if R*A^tA1*Q is in МаксНорм(1, X, 9) and RA^tA1Q -> Z is a 9-turn of rank 1 with A == A1A2, then Z == R A^(-n+t+1) A2^-1 Q and R*A^(-n+t+1)A2^-1*Q is the maximal image.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.20'),page(27)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_21","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 27. Part of the simultaneous induction on rank alpha; this realizes the top set N_alpha of 4a. q1 = 37. Example: (a1^8 a2)^q a1^(-n+q1) a2^q is not in N_1."],"precheck":null,"rules":[],"says":"N_a is the set of X in R_{a-1} such that a q1-turn can be performed of every V in Норм(alpha, X, q1), and also a q1-turn of every W in Норм(alpha, Y, q1), where Y is the result of an arbitrary q1-turn X -> Y of some V in Норм(alpha, X, q1).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.21'),page(27)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_21_adjacent","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 27-28. Part of the simultaneous induction on rank alpha. Example (p. 28): in (a1^8 a2)^q a1^(-n+2q1) a2^q, which is in N_1, the occurrences of a1^(-n+2q1) and of the final a2^q do not adjoin, whereas the occurrences of a1^(-n+2q1) and of the initial (a1^8 a2)^q do adjoin."],"precheck":null,"rules":[],"says":"Adjacency: for X in N_a and U, V in Норм(alpha, X, q1) with not Согл(U, V), U and V do not adjoin each other [не примыкают друг к другу] if the maximal normalized continuation of each is stable in the turn of the other, and the same holds for the maximal normalized continuations of their images U1, V1 under a turn X -> Y of either of them, and for the maximal normalized continuations of the images of U1 and V1 under a q1-turn of either of the latter. Otherwise U and V adjoin each other [примыкают друг к другу].","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.21'),page(27)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_cascade","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4.22, pp. 28-29. Part of the simultaneous induction on rank alpha. Here q = 90 and q_{t_i} is q1 = 37 or q2 = 54 according as t_i = 1 or 2: the cube-free sequence of §3 is used to choose the thresholds. Rank-1 example (9) a3^q * (a1a2)^(2q-1) a1 * a2 (a1^2 a2^6)^(q1+2) a1^(q2+5) (a1 a2^-1)^q a2^-2q has a right cascade of three occurrences and no left cascade. Formula (8) checked on a 300 dpi render."],"precheck":null,"rules":[],"says":"4.22. Cascade [каскад]: let X in N_a, V0 = P*A0*Q in Норм(alpha, X, q). Occurrences (8) V_i = P A0 u1 A1 u2 ... u_i * A_i * u_{i+1} ... A_{r-1} u_r A_r Q1 (i = 1..r, r >= 1) form a right cascade of rank alpha [правый каскад ранга alpha] of V0 if (a) for 0 < i <= r, V_i in Норм(alpha, X, q_{t_i}) where t_i is the i-th term of the cube-free sequence (2) of §3; for 0 < i < r the maximal normalized right continuation of V_i contains fewer than q_{t_i} + 17 sections; V_r is not normalized-continuable to the right and l_alpha(V_r) >= q_{t_r} + 17; (b) for 0 <= i < r, V_i and V_{i+1} adjoin each other; (c) each V_i (0 < i <= r) is stable in the turns of V_{i-1} and V_{i+1}, but no normalized continuation of V_i other than itself has this property. V1 is the first element of the cascade, V0 its head [головка]. Left cascades are defined symmetrically.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.22'),page(28)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_23","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 29. Part of the simultaneous induction on rank alpha. Rank-1 examples (10), (11): (a1a2)^(2q) a1 * a1^(q+2) * a2^-q is active, via the q-turn (a1a2)^(2q) a1^(q+3) a2^-q -> (a1a2)^(2q) a1^(-n+q+3) a2^-q."],"precheck":null,"rules":[],"says":"An occurrence V in Норм(alpha, X, q), X in N_a, is completely stable on the right (left) in rank alpha [вполне устойчивое справа (слева)] if V has no right (left) cascade of rank alpha, or V is stable in the turn of the first element of its right (left) cascade; completely stable [вполне устойчивое] means both. A q-turn X -> Y of V in Норм(alpha, X, 9), X, Y in N_a, is a real turn of rank alpha [реальный поворот ранга alpha] if there are completely stable occurrences V1 in X and W1 in Y of rank alpha with V1 coordinated with V and W1 an image of V in X -> Y. V is an active occurrence of rank alpha [активное вхождение] if V in Норм(alpha, X, 9) has some real turn of rank alpha; Акт(alpha, X) is the set of active occurrences in X. (III.3.25: if X -> Y is a real turn of rank alpha then so is Y -> X.)","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.23'),page(29)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_24","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 29-30. Part of the simultaneous induction on rank alpha; this realizes 4b for rank alpha. Example (12): (a1^10 a2^(2q) a1^10 a2^(-n+2q))^n has 2n inactive kernels of rank 1 with base a1^10 and n active kernels each with bases a2^(2q) and a2^(-n+2q)."],"precheck":null,"rules":[],"says":"Kernel of rank alpha of X [ядро ранга alpha слова X] for X in N_a: a normalized occurrence V of some elementary 9-power of rank alpha in X that is stable in the turn of every active occurrence of rank alpha in X not coordinated with V, such that no normalized continuation of V other than V itself has this property. The kernel is active [активное ядро] if V in Акт(alpha, X). Я(alpha, X) is the set of kernels of rank alpha of X.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.24'),page(29)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_25","kind":"claim","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 30. Stated without proof; proofs in Ch. IV as cited. Part of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"Properties of real turns and kernels of rank alpha (proved later): (a) distinct kernels U, V of X in N_a are not coordinated and neither contains the other, so U < V or V < U (IV.1.2); (b) the maximal normalized continuation of an active kernel does not intersect other kernels of rank alpha (IV.1.3); (c) if X in N_a and W in Норм(alpha, X, 43), W is coordinated with some kernel of rank alpha of X (IV.1.4); (d) if V in Я(alpha, X) and X ~(alpha-1) Y then f_{alpha-1}(V; X, Y) in Я(alpha, Y) (IV.1.8); (e) for a real turn X -> Y of rank alpha each kernel V of X has exactly one kernel of Y that is an image of V; this bijection Я(alpha, X) -> Я(alpha, Y), denoted f_alpha(V; X, Y), preserves < and << (IV.1.10, IV.1.11).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.25'),page(30)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_26","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, pp. 30-31. Part of the simultaneous induction on rank alpha; realizes 4a for rank alpha from R_{alpha-1}, K_{alpha-1}, L_{alpha-1}, M_{alpha-1}. Bounds n-88, n-176, n-218, (n+1)/2+21, (n+1)/2 checked on a 300 dpi render."],"precheck":null,"rules":[],"says":"Sets of rank alpha: X in P_a iff X in R_{a-1} and Норм(alpha, X, n-88) is empty; X in R_a iff X in P_a and every W in Я(alpha, X) has l_alpha(W) <= n-176; X in K_a iff X in P_a intersect K_{a-1} and every kernel W has l_alpha(W) <= n-218; X in L_a iff X in P_a intersect L_{a-1} and every kernel W has l_alpha(W) <= (n+1)/2 + 21; X in M_a iff X in P_a intersect M_{a-1} and every kernel W has l_alpha(W) <= (n+1)/2. Since n >= 665: M_a subset L_a subset K_a subset R_a subset P_a subset R_{a-1}. The word (12) is in R_1 but not in M_1.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.26'),page(30)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_27","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 31. Part of the simultaneous induction on rank alpha; realizes 4d for rank alpha from ~(alpha-1) and real turns of rank alpha."],"precheck":null,"rules":[],"says":"Equivalence in rank alpha [эквивалентные в ранге alpha]: X, Y in P_a are equivalent in rank alpha if X ~(alpha-1) Y or there is a sequence of real turns of rank alpha X -> X1 -> X2 -> ... -> X_lambda -> Y (13). X ~alpha Y means X, Y in R_a and X equivalent to Y in rank alpha; it is reflexive, symmetric and transitive (IV.2.7). Example (14): performing n real turns of rank-1 kernels (those with left numbers divisible by 4) in (12) gives (a1^10 a2^(2q) a1^10 a2^(-n+2q))^n ~1 (a1^10 a2^(2q) a1^10 a2^(2q))^n, and (a1^10 a2^(2q))^(2n) is in M_1.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.27'),page(31)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_28","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 31. Part of the simultaneous induction on rank alpha; first step of realizing 4e for rank alpha (on kernels)."],"precheck":null,"rules":[],"says":"For X ~alpha Y, f_alpha(V; X, Y) maps Я(alpha, X) onto Я(alpha, Y): if X ~(alpha-1) Y it is f_{alpha-1}(V; X, Y); if X, Y are joined by a sequence (13) of real turns of rank alpha it is the composite of the maps of 4.25(e) for those turns (IV.2.8). It preserves the linear order of kernels and is symmetric: W = f_alpha(V; X, Y) implies V = f_alpha(W; Y, X) (IV.2.9).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.28'),page(31)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_29","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 31. Part of the simultaneous induction on rank alpha; realizes 4c for rank alpha."],"precheck":null,"rules":[],"says":"An occurrence W in X in N_a is a regular occurrence of rank alpha [правильное вхождение ранга alpha] if some beginning and some end of W belong to Я(alpha, X). Прав(alpha, X) is the set of these.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.29'),page(31)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_30","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 31. Part of the simultaneous induction on rank alpha; completes 4e for rank alpha."],"precheck":null,"rules":[],"says":"Extension of f_alpha to regular occurrences: for X ~alpha Y and W in Прав(alpha, X), take kernels U, V in Я(alpha, X) with U a beginning and V an end of W; the union of f_alpha(U; X, Y) and f_alpha(V; X, Y) lies in Прав(alpha, Y) and is denoted f_alpha(W; X, Y). This gives a bijection Прав(alpha, X) -> Прав(alpha, Y).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.30'),page(31)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_31","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 32. Part of the simultaneous induction on rank alpha; realizes 4f for rank alpha. Two regular occurrences are mutually normalized if, under all rank-alpha equivalences, they can be matched to occurrences with identical bases and identical active/inactive kernel structure."],"precheck":null,"rules":[],"says":"Mutual normalization in rank alpha, rank-alpha definition: for X, Y in R_a, V in Прав(alpha, X) and W in Прав(alpha, Y) are mutually normalized in rank alpha, ВзНорм_alpha(V, W), if (a) for every Z with X ~alpha Z there is Z1 with Y ~alpha Z1 such that (15) Осн(f_alpha(V; X, Z)) == Осн(f_alpha(W; Y, Z1)), and moreover each occurrence U contained in f_alpha(V; X, Z) is an active (inactive) kernel of rank alpha iff phi(U; f_alpha(V; X, Z), f_alpha(W; Y, Z1)) is an active (inactive) kernel of rank alpha; and (b) conversely, for every Z1 with Y ~alpha Z1 there is Z with X ~alpha Z satisfying (15) with the same condition on kernels.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.31'),page(32)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_32","kind":"claim","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 32. Stated without proof. (c) links mutual normalization in consecutive ranks."],"precheck":null,"rules":[],"says":"Properties of ВзНорм_alpha (proved in Ch. IV §3): (a) it is reflexive, symmetric and transitive; (b) W = f_alpha(V; X, Y) implies ВзНорм_alpha(V, W); (c) ВзНорм_alpha(P*E*Q, R*E*S) implies ВзНорм_{alpha-1}(P*E*Q, R*E*S).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.32'),page(32)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_33","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 32. Part of the simultaneous induction on rank alpha; supplies d_alpha of 4b for rank alpha."],"precheck":null,"rules":[],"says":"For an occurrence W in X in N_a, every kernel of rank alpha of X contained in W is also called a kernel of rank alpha of W; d_alpha(W) is the number of kernels of rank alpha of W.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.33'),page(32)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_34","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 32. Words reduced in rank alpha-1 that contain no normalized elementary 9-power of rank alpha."],"precheck":null,"rules":[],"says":"Absolutely reduced words [абсолютно приведенные слова]: the set A is the union over alpha = 1, 2, ... of A_alpha, where X in A_alpha iff X in R_{a-1} and Норм(alpha, X, 9) is empty.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.34'),page(32)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_35","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 32. Part of the simultaneous induction on rank alpha; realizes the smallest set Mbar_alpha of 4a."],"precheck":null,"rules":[],"says":"Mbar_0 = R_0 (by 4.1). For alpha >= 1: X in Mbar_a iff X in M_a and X in Mbar_{a-1} and for all U, V in Я(alpha, X), ВзНорм_alpha(U, V) implies Род(U, V) (mutually normalized kernels of rank alpha are kindred).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.35'),page(32)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_35_representative","kind":"claim","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 33 (after 4.35). Stated without proof; proofs in IV.3.12 and II.4.5."],"precheck":null,"rules":[],"says":"For every X in R_a there is Y in Mbar_a with X ~alpha Y (proved in IV.3.12). Characteristic property of Mbar_{a-1}: if an occurrence P*E*Q in X in R_{a-1} is mutually normalized in rank alpha-1 with some occurrence R*E*S in some Y in Mbar_{a-1}, then the base of every V in Норм(alpha, X, 9) contained in P*E*Q is a periodic 9-power with an elementary period of rank alpha (II.4.5).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.35'),page(33)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_periodized","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 33 (unnumbered, after 4.35). Part of the simultaneous induction on rank alpha."],"precheck":null,"rules":[],"says":"An occurrence P*E*Q is periodized in rank alpha-1 [периодизированное в ранге alpha-1] if ВзНорм_{alpha-1}(P*E*Q, R*E*S) for some R, S with RES in Mbar_{a-1}. Every occurrence in a word X in R_0 is periodized in rank 0.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.35'),page(33)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_36","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 33. Part of the simultaneous induction on rank alpha: the rank-alpha multiplication of reduced words (cancel a common T modulo ~alpha)."],"precheck":null,"rules":[],"says":"Closure of rank alpha [смыкание ранга alpha]: for alpha >= 0 and X, Y in R_a, the binary operation [X, Y]_alpha = PQ holds iff there is T with X ~alpha PT, Y ~alpha T^-1 Q and PQ in R_a. Ch. V proves that for any X, Y in R_a the result is defined and unique up to equivalence in rank alpha, and that the operation is associative; for alpha = 0 these properties are obvious.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.36'),page(33)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_4_37","kind":"claim","kourovka":null,"notes":["Adian 1975, Ch. I §4, p. 33. Forward reference to the main construction of Ch. VI; this is how Chapter I's notions feed the infinitude of B(m, n)."],"precheck":null,"rules":[],"says":"From the set A of absolutely reduced words, the relations ~alpha and the operations [X, Y]_alpha, Ch. VI defines the group Gamma(m, n) (VI.1.3, VI.1.4) and proves that it is infinite, generated by m generators, and satisfies the identity X^n = 1 (VI.1.5).","source":{"authors":["S. I. Adian"],"locator":"[sec('I.4.37'),page(33)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_5_1","kind":"definition","kourovka":null,"notes":["Adian 1975, Ch. I §5, pp. 33-34."],"precheck":null,"rules":[],"says":"Words X, Y are symmetric to each other [симметричные друг другу] if one is the other read right to left; X' denotes the mirror word: for X == d1 d2 ... dr, X' == dr ... d2 d1. Then d(X') = d(X), (X')' == X; beginnings of Q go to ends of Q' and vice versa; an occurrence V in X gives an occurrence V' in X' with base E' when E is the base of V; irreducibility is preserved; V < W (V << W) implies W' < V' (W' << V'); the i-th occurrence of E from the left becomes the i-th occurrence of E' from the right. For a statement F(X1..Xr, V1..Vt) about words and occurrences (16), its symmetric statement F'(X1'..Xr', V1'..Vt') (17) replaces each word and occurrence by its mirror image and swaps the terms beginning/end and left/right.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.5.1'),page(33)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_5_2","kind":"theorem","kourovka":null,"notes":["Adian 1975, Ch. I §5, pp. 34-35. A metatheorem, justified by induction on rank alpha in the order of the definitions of §4 (a sketch, not a formal proof)."],"precheck":null,"rules":[],"says":"Principle of symmetry [принцип симметричности]: any statement (16) about the notions of the book is true iff its symmetric statement (17) is true. It suffices to check this for the elementary predicates (all sets of words and occurrences and all relations defined in §4 or Ch. II-V), e.g. X in R_a <=> X' in R_a, same for M_a, K_a, L_a; W in Я(alpha, X) <=> W' in Я(alpha, X'); W in Прав(alpha, X) <=> W' in Прав(alpha, X'); X ~alpha Y <=> X' ~alpha Y'; W = f_alpha(V; X, Y) <=> W' = f_alpha(V'; X', Y'); ВзНорм_alpha(V, W) <=> ВзНорм_alpha(V', W'). These are obvious at alpha = 0 and proved for rank alpha by simultaneous induction, each definition reducing the question to earlier notions or lower rank. Hence of two symmetric statements only one needs proof.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.5.2'),page(34)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_5_3","kind":"theorem","kourovka":null,"notes":["Adian 1975, Ch. I §5, pp. 35-36. The inverse variant was used in reference [5] under the name 'principle of duality' [принцип двойственности]."],"precheck":null,"rules":[],"says":"The principle of symmetry holds because in every statement (16) all words and occurrences other than the X_i, V_j are bound by quantifiers. Since a_i and a_i^-1 enter all definitions on an equal footing (definitions are invariant under swapping a_i with a_i^-1 letterwise, which takes X^-1 to X'), a variant also holds: (16) is true iff F'(X1^-1, ..., Xr^-1, V1^-1, ..., Vt^-1) is true (words and occurrences replaced by inverses, beginning/end and left/right swapped). Consequences: X in R_a <=> X^-1 in R_a; X ~alpha Y <=> X^-1 ~alpha Y^-1; V in Я(alpha, X) <=> V^-1 in Я(alpha, X^-1); W = f_alpha(V; X, Y) <=> W^-1 = f_alpha(V^-1; X^-1, Y^-1); ВзНорм_alpha(V, W) <=> ВзНорм_alpha(V^-1, W^-1); Y in Цел(X, alpha, A) <=> Y^-1 in Цел(X^-1, alpha, A^-1); V < W <=> W^-1 < V^-1.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.5.3'),page(35)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"adian","facts":[],"id":"adian75_5_4","kind":"theorem","kourovka":null,"notes":["Adian 1975, Ch. I §5, pp. 36-37. Effective boundedness of quantifiers: for 4.27 by V.2.6 (hence also 4.31, 4.36); for 4.9 one may take l_{alpha,A}(W) = 3 (II.3.1) and then use V.2.10, V.2.8, V.2.6; for 4.10 via II.3.7; for 4.12-4.14 via V.2.9, V.2.6. Example algorithm: minimality of a period A of rank alpha is decided by passing to Y in Mbar_{alpha-1} with X ~(alpha-1) Y (IV.3.12), writing the image base E1 = D^t D1 (II.4.1), and checking that D is simple (II.4.3, II.3.2). Complexity is irrelevant to the principle."],"precheck":null,"rules":[],"says":"Principle of effectiveness [принцип эффективности]: all sets, functions and relations on words and occurrences considered in the book are algorithmically effective (decidable on any given tuple), and for every existence statement proved later there is an algorithm producing the object from the parameters it depends on. Proved by simultaneous induction on rank alpha in the order the notions appear; each step follows from the effectiveness of earlier notions and the relative effectiveness of the current definition, since all quantifiers in the definitions of §4 can be taken to be effectively bounded.","source":{"authors":["S. I. Adian"],"locator":"[sec('I.5.4'),page(36)]","ref":"adian1975","title":"The Burnside Problem and Identities in Groups (Russian)","venue":"Nauka, Moscow","year":"1975"},"status":"transcribed"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"def_free_burnside_semigroup","kind":"definition","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"The free Burnside semigroup B(k; r, m) is the free semigroup on k generators modulo the identity x^r = x^(r+m).","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"green_rees","kind":"theorem","kourovka":null,"notes":["Confirmed form: the statement is for ALL finite numbers of generators simultaneously: (S_n finite for all n) iff (B(n, r-1) finite for all n). Checked from secondary sources only (Gerhard 1978 references, Kyoto survey), not the 1952 text."],"precheck":null,"rules":["every finitely generated semigroup with x^(m+1) = x is finite  IF  every finitely generated group of exponent m is finite","every finitely generated group of exponent m is finite  IF  every finitely generated semigroup with x^(m+1) = x is finite","some finitely generated semigroup with x^(m+1) = x is infinite  IF  some finitely generated group of exponent m is infinite"],"says":"For fixed n: every finitely generated semigroup satisfying x^(n+1) = x is finite iff every B(m,n) is finite. (The free one is a union of groups whose maximal subgroups are free Burnside groups of exponent n.)","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"green_rees_n5","kind":"corollary","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Finiteness of all B(m,5) is equivalent to finiteness of all finitely generated semigroups satisfying x^6 = x.","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[{"quantity":"order(fbs(1,1,1))","value":"1"},{"quantity":"order(fbs(2,1,1))","value":"6"},{"quantity":"order(fbs(3,1,1))","value":"159"},{"quantity":"order(fbs(4,1,1))","value":"332380"},{"quantity":"order(fbs(5,1,1))","value":"2751884514765"}],"id":"bands_finite","kind":"theorem","kourovka":null,"notes":["Free band orders: closed formula sum_{i=1}^k C(k,i) prod_{j=1}^i (i-j+1)^(2^j). Attribution Green-Rees 1952 for finiteness. Formula reproduces all listed orders; the k=5 value independently matches a GAP Forum computation (gap-system.org ForumArchive2/2012/003728).","Literature confirmation (semigroups pass): OEIS A030449 \"Number of elements in the free band (idempotent semigroup) on n generators\" lists 1, 6, 159, 332380, 2751884514765, ... Source: https://oeis.org/A030449 (refs Howie 1995 p.123). Also reproduced by do Lago's recurrence with m = 1 (sg_index1_order_formula)."],"precheck":null,"rules":["every finitely generated semigroup with x^2 = x is finite"],"says":"Free bands (x^2 = x) on finitely many generators are finite.","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"machine_verified"},{"caveats":[],"domain":"burnside_semigroups","facts":[{"quantity":"order(fbs(2,1,2))","value":"132"}],"id":"x3_eq_x_finite","kind":"corollary","kourovka":null,"notes":["ORDER (semigroups pass): |fbs(2,1,2)| = 132 (monoid 133), obtained by evaluating do Lago's recurrence (do Lago-Simon 2001, Cor. 7.2) with |B(g,2)| = 2^g; see sg_index1_order_formula. No source opened prints 132 directly; OEIS searches for this sequence found nothing. Gerhard 1978 (word problem for x^3 = x) opening extract gives no count. AGREES with the user's computed value 132."],"precheck":null,"rules":[],"says":"Finitely generated semigroups with x^3 = x are finite (via Green-Rees and finiteness of B(m,2)).","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"x4_eq_x_finite","kind":"corollary","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Finitely generated semigroups with x^4 = x are finite (via Green-Rees and B(m,3)).","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"x5_eq_x_finite","kind":"corollary","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Finitely generated semigroups with x^5 = x are finite (via Green-Rees and Sanov).","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"x7_eq_x_finite","kind":"corollary","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Finitely generated semigroups with x^7 = x are finite (via Green-Rees and M. Hall).","source":{"authors":["J. A. Green","D. Rees"],"locator":"unknown","ref":"green_rees1952","title":"On semi-groups in which x^r = x","venue":"Proc. Cambridge Philos. Soc. 48, 35-40","year":"1952"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"morse_hedlund_x2_0","kind":"theorem","kourovka":null,"notes":["Argument: in <A | x^2 = 0> the non-zero elements are exactly the square-free words (no relation applies to them), so the semigroup is infinite iff infinitely many square-free words exist: finite for |A| = 2, infinite for |A| = 3 (Thue). Attribution to Morse-Hedlund 1944 not yet confirmed."],"precheck":null,"rules":[],"says":"The semigroup on 3 generators with x^2 = 0 is infinite (equivalently: infinite square-free words over 3 letters exist).","source":{"authors":["M. Morse","G. A. Hedlund"],"locator":"unknown","ref":"morse_hedlund1944","title":"Unending chess, symbolic dynamics and a problem in semigroups","venue":"Duke Math. J. 11","year":"1944"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"index_ge2_infinite","kind":"theorem","kourovka":null,"notes":["CORRECTED in pass 6: original entry wrongly claimed r >= 2 for all k >= 2. Source: do Lago-Simon survey.","SHARPENED (semigroups pass): the Thue argument alone covers r >= 2, k >= 3 and r >= 3, k = 2, but the case r = 2, k = 2 IS known to be infinite: Brzozowski-Culik-Gabrielian 1971 (bcg1971). Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"we know that the free Burnside monoids are infinite if |A| ≥ 2 and n ≥ 2, and that they have infinitely many D-classes.\" See sg_index2_two_gen_infinite."],"precheck":null,"rules":["the free semigroup on m generators with x^n = x^(n+d) is infinite  IF  n>=2,d>=1,m>=3","the free semigroup on 2 generators with x^m = x^(m+n) is infinite  IF  m>=3,n>=1"],"says":"Via Thue-Morse / Thue words, the free Burnside semigroup x^r = x^(r+m) is infinite for r >= 2, m >= 1 on k >= 3 generators, and for r >= 3, m >= 1 on k = 2 generators. The case r = 2, k = 2 is NOT covered by this argument.","source":{"authors":["J. A. Brzozowski","K. Culik II","A. Gabrielian"],"locator":"unknown","ref":"bcg1971","title":"Classification of noncounting events","venue":"J. Comput. System Sci. 5","year":"1971"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"dolago_maximal_groups","kind":"theorem","kourovka":null,"notes":["Group/semigroup bridge: B(k,5) structure appears inside semigroups with x^r = x^(r+5). Infinite maximal groups exist for r=2 with 2m-1 generators for large m (do Lago).","REFINEMENT (semigroups pass): for m >= 2 the rank equals the cyclomatic number of the fundamental graph of the D-class (sg_maxgroup_rank_cyclomatic); for n >= 3 the groups are cyclic of order m (sg_cyclic_groups_n3); for n = 1 and three letters the top D-class has H-classes free Burnside of infinite rank when B(2,m) is infinite (sg_index1_infinite_groups); for n = 2 the D-class of (babab)^2 has rank >= 2m-1 (sg_index2_noncyclic_groups). Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/."],"precheck":null,"rules":[],"says":"Every maximal subgroup of the free Burnside semigroup x^r = x^(r+m) is a free Burnside group of exponent m.","source":{"authors":["A. P. do Lago","I. Simon"],"locator":"unknown","ref":"dolago_simon2001","title":"Free Burnside semigroups","venue":"RAIRO Theor. Inform. Appl. 35:6 (2001) 579-595","year":"2001"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"word_problem_burnside_semigroups","kind":"theorem","kourovka":null,"notes":["The r=2,m=2 counterexample claim comes from lecture notes only; find primary source.","REFINEMENT (semigroups pass): do Lago-Simon state that Brzozowski's conjecture fails for n = 2 and m >= 8000 (Cor. 9.2, via infinite maximal free Burnside groups with >= 2m-1 generators), and that Sigma is unstable for n = 2, m >= 2. For n = 2, m = 2 they only show a contrast with the unique-shortest-representative property, not a failure of regularity. Source: https://www.numdam.org/item/ITA_2001__35_6_579_0/. Quote: \"it shows that Brzozowski's conjecture [3] does not hold for n = 2 and m ≥ 8000.\" Also: Sigma-stability (hence solvable word problem, regular classes) is stated for all n >= 3, m >= 1 (Theorem 6.1).","BIBLIO (semigroups pass): do Lago-Simon cite McCammond as 'The solution to the word problem for the relatively free semigroups satisfying ta = ta+b with a ≥ 6. Int. J. Algebra Comput. 1 (1991) 1-32' and two Guba papers in 'Int. J. Algebra Comput. 2 (1993)' (m >= 3, pp. 335-348; m >= 4 or m = 3, n = 1, pp. 125-140). KB refs mccammond1991/guba1993 differ in title/volume; check against journal pages."],"precheck":null,"rules":[],"says":"For x^r = x^(r+m): word problem solvable and congruence classes regular (Brzozowski's conjecture) for r >= 6 (McCammond 1991, also finite J-above, cyclic maximal subgroups), r >= 4 (do Lago 1996, via de Luca-Varricchio), r >= 3 (Guba 1993). For r = 2, m = 2 the conjecture is reportedly false; x^2 = x^3 (r = 2, m = 1) is open, partial results by Plyushchenko-Shur.","source":{"authors":["J. McCammond"],"locator":"unknown","ref":"mccammond1991","title":"On the solution of the word problem for the relations x^(n+m) = x^m","venue":"Internat. J. Algebra Comput. 1","year":"1991"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"open_brzozowski","kind":"open_problem","kourovka":null,"notes":["Additional source (semigroups pass): https://www.springerprofessional.de/on-brzozowski-s-conjecture-for-the-free-burnside-semigroup-satis/3686380. Quote: \"The case of the identity x 2 = x 3 is the only one, for which Brzozowski's conjecture is neither proved nor disproved.\" (Plyushchenko-Shur, DLT 2011). Reduction of k generators to 2 generators: Plyushchenko 2011 (sg_x2x3_reduction_two_gen)."],"precheck":null,"rules":[],"says":"Brzozowski's conjecture: in the free Burnside semigroup x^r = x^(r+m), every congruence class is a regular language. Open only for x^2 = x^3 (r = 2, m = 1).","source":{"authors":["J. A. Brzozowski","K. Culik II","A. Gabrielian"],"locator":"unknown","ref":"bcg1971","title":"Classification of noncounting events","venue":"J. Comput. System Sci. 5","year":"1971"},"status":"checked"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"green_relations","kind":"definition","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Green's relations L, R, J, H, D on a semigroup: equality of principal left / right / two-sided ideals, H = L and R, D = L o R.","source":{"authors":["J. M. Howie"],"locator":"unknown","ref":"howie1995","title":"Fundamentals of Semigroup Theory","venue":"Oxford Univ. Press","year":"1995"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"rees_matrix","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"A completely (0-)simple semigroup is isomorphic to a Rees matrix semigroup M^0[G; I, L; P] over a group G.","source":{"authors":["J. M. Howie"],"locator":"unknown","ref":"howie1995","title":"Fundamentals of Semigroup Theory","venue":"Oxford Univ. Press","year":"1995"},"status":"from_memory"},{"caveats":[],"domain":"burnside_semigroups","facts":[],"id":"periodic_semigroup_union_groups","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"A semigroup satisfying x^(n+1) = x is completely regular, i.e. a union of groups, each of exponent dividing n.","source":{"authors":["J. M. Howie"],"locator":"unknown","ref":"howie1995","title":"Fundamentals of Semigroup Theory","venue":"Oxford Univ. Press","year":"1995"},"status":"from_memory"},{"caveats":[],"domain":"words","facts":[],"id":"def_period","kind":"definition","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"p >= 1 is a period of w = a_1..a_n if a_i = a_{i+p} for all 1 <= i <= n-p.","source":{"authors":["M. Lothaire"],"locator":"unknown","ref":"lothaire1983","title":"Combinatorics on Words","venue":"Addison-Wesley","year":"1983"},"status":"from_memory"},{"caveats":[],"domain":"words","facts":[],"id":"def_primitive","kind":"definition","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"A non-empty word is primitive if it is not of the form u^k with k >= 2.","source":{"authors":["M. Lothaire"],"locator":"unknown","ref":"lothaire1983","title":"Combinatorics on Words","venue":"Addison-Wesley","year":"1983"},"status":"from_memory"},{"caveats":[],"domain":"words","facts":[],"id":"def_square_free","kind":"definition","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"w is square-free if it contains no factor uu with u non-empty; overlap-free if no factor auaua (a a letter); cube-free if no factor uuu.","source":{"authors":["A. Thue"],"locator":"unknown","ref":"thue1906","title":"Über unendliche Zeichenreihen","venue":"Norske Vid. Selsk. Skr. I Mat.-Nat. Kl. 7","year":"1906"},"status":"from_memory"},{"caveats":[],"domain":"words","facts":[],"id":"fine_wilf","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"If w has periods p and q and |w| >= p + q - gcd(p,q), then w has period gcd(p,q). The bound is sharp.","source":{"authors":["N. J. Fine","H. S. Wilf"],"locator":"thm(1)","ref":"fine_wilf1965","title":"Uniqueness theorems for periodic functions","venue":"Proc. Amer. Math. Soc. 16","year":"1965"},"status":"bounded_verified"},{"caveats":[],"domain":"words","facts":[],"id":"primitive_root_unique","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Every non-empty word w is uniquely of the form u^k with u primitive (the primitive root).","source":{"authors":["M. Lothaire"],"locator":"unknown","ref":"lothaire1983","title":"Combinatorics on Words","venue":"Addison-Wesley","year":"1983"},"status":"bounded_verified"},{"caveats":[],"domain":"words","facts":[],"id":"commuting_words","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"For non-empty words u, v: uv = vu iff u and v are powers of a common word.","source":{"authors":["M. Lothaire"],"locator":"unknown","ref":"lothaire1983","title":"Combinatorics on Words","venue":"Addison-Wesley","year":"1983"},"status":"from_memory"},{"caveats":[],"domain":"words","facts":[],"id":"conjugate_words","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"uz = zv with u non-empty iff u = xy, v = yx, z = (xy)^k x for some words x, y and k >= 0.","source":{"authors":["M. Lothaire"],"locator":"unknown","ref":"lothaire1983","title":"Combinatorics on Words","venue":"Addison-Wesley","year":"1983"},"status":"from_memory"},{"caveats":[],"domain":"words","facts":[],"id":"lyndon_schutzenberger","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"If a^M = b^N c^P in a free group (or free monoid) with M, N, P >= 2, then a, b, c are powers of a common element.","source":{"authors":["R. C. Lyndon","M. P. Schützenberger"],"locator":"unknown","ref":"lyndon_schutzenberger1962","title":"The equation a^M = b^N c^P in a free group","venue":"Michigan Math. J. 9","year":"1962"},"status":"from_memory"},{"caveats":[],"domain":"words","facts":[],"id":"lyndon_factorization","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"Every word factors uniquely as a non-increasing product of Lyndon words (Chen-Fox-Lyndon).","source":{"authors":["K. T. Chen","R. H. Fox","R. C. Lyndon"],"locator":"unk ee"],"locator":"unknown","ref":"havas_vaughanlee2005","title":"4-Engel groups are locally nilpotent","venue":"Internat. J. Algebra Comput. 15","year":"2005"},"status":"from_memory"},{"caveats":[],"domain":"commutators","facts":[],"id":"exp5_4engel_question","kind":"open_problem","kourovka":null,"notes":["Still unresolved by our search (2026-11-12). Vaughan-Lee 1997 proves exponent 5 + Engel-4 implies locally finite (see vl_exp5_engel4), so a positive answer would settle B(2,5) finite. Look in Newman-Vaughan-Lee 1999 for whether R(2,5) itself is 4-Engel."],"precheck":null,"rules":[],"says":"Does x^5 = 1 imply the 4-Engel identity [x, 4 y] = 1? If yes, then by Havas-Vaughan-Lee every f.g. group of exponent 5 is finite, so B(2,5) is finite.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1993","title":"The Restricted Burnside Problem (2nd ed.)","venue":"Oxford Univ. Press","year":"1993"},"status":"from_memory"},{"caveats":[],"domain":"commutators","facts":[],"id":"exp5_lie_4engel","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":[],"says":"The associated Lie ring of a group of exponent 5 satisfies the 4-Engel identity (more generally, exponent p gives (p-1)-Engel associated Lie ring, Magnus/Sanov).","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1993","title":"The Restricted Burnside Problem (2nd ed.)","venue":"Oxford Univ. Press","year":"1993"},"status":"from_memory"},{"caveats":[],"domain":"commutators","facts":[],"id":"vl_exp5_engel4","kind":"theorem","kourovka":null,"notes":[],"precheck":null,"rules":["every finitely generated group of exponent 5 is finite  IF  x^5 = 1 implies the 4-Engel law"],"says":"A group of exponent 5 satisfying the Engel-4 identity [x,y,y,y,y] = 1 is locally finite.","source":{"authors":["M. Vaughan-Lee"],"locator":"unknown","ref":"vaughanlee1997","title":"Engel-4 groups of exponent 5","venue":"Proc. London Math. Soc. (3) 74","year":"1997"},"status":"checked"},{"cav
